name: Analyze Android 9 boot.img (APatch aware)

on:
  workflow_dispatch:
    inputs:
      boot_image_url:
        description: 'boot.img URL'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 xz-utils cpio zip python3 zstd

      - name: Download boot.img
        run: curl -L -o boot.img "${{ github.event.inputs.boot_image_url }}"

      - name: Parse header and extract kernel/ramdisk
        run: |
          python3 << 'EOF'
          import struct, hashlib

          with open('boot.img', 'rb') as f:
              data = f.read()
          if data[:8] != b'ANDROID!':
              raise SystemExit('Invalid Android boot image')
          def u32(off):
              return struct.unpack('<I', data[off:off+4])[0]
          kernel_size = u32(8)
          kernel_addr = u32(12)
          ramdisk_size = u32(16)
          ramdisk_addr = u32(20)
          second_size = u32(24)
          second_addr = u32(28)
          tags_addr = u32(32)
          page_size = u32(36)
          header_version = u32(40)
          os_version = u32(44)
          name = data[48:64].split(b'\x00')[0].decode('utf-8', errors='ignore')
          cmdline = data[64:576].split(b'\x00')[0].decode('utf-8', errors='ignore')
          extra_cmdline = data[608:1120].split(b'\x00')[0].decode('utf-8', errors='ignore')

          recovery_dtbo_size = 0
          recovery_dtbo_offset = 0
          v1_header_size = 0
          if header_version >= 1:
              recovery_dtbo_size = u32(1120)
              recovery_dtbo_offset = u32(1124)
              v1_header_size = u32(1128)

          def round_up(n, p):
              return (n + p - 1) // p * p

          kernel_off = page_size
          kernel_end = kernel_off + kernel_size
          ramdisk_off = page_size + round_up(kernel_size, page_size)
          ramdisk_end = ramdisk_off + ramdisk_size

          with open('kernel.bin', 'wb') as f:
              f.write(data[kernel_off:kernel_end])

          if ramdisk_size > 0:
              if ramdisk_end > len(data):
                  raise SystemExit('ramdisk beyond file')
              with open('ramdisk.bin', 'wb') as f:
                  f.write(data[ramdisk_off:ramdisk_end])
          else:
              open('ramdisk.bin', 'w').close()

          base = None
          if (kernel_addr & 0xfff) == 0x8000:
              base = kernel_addr - 0x8000
          offsets = {}
          if base is not None:
              offsets['kernel'] = kernel_addr - base
              offsets['ramdisk'] = ramdisk_addr - base
              offsets['second'] = second_addr - base
              offsets['tags'] = tags_addr - base

          signed_avb = False
          if len(data) >= 64:
              footer = data[-64:]
              if footer[:4] == b'AVBf':
                  signed_avb = True
          sha256 = hashlib.sha256(data).hexdigest()

          with open('info.txt', 'w') as f:
              f.write(f"Magic: ANDROID!\n")
              f.write(f"Header version: {header_version}\n")
              f.write(f"Kernel size: {kernel_size} (0x{kernel_size:X})\n")
              f.write(f"Kernel addr: 0x{kernel_addr:08X}\n")
              f.write(f"Ramdisk size: {ramdisk_size} (0x{ramdisk_size:X})\n")
              f.write(f"Ramdisk addr: 0x{ramdisk_addr:08X}\n")
              f.write(f"Second size: {second_size} (0x{second_size:X})\n")
              f.write(f"Second addr: 0x{second_addr:08X}\n")
              f.write(f"Tags addr: 0x{tags_addr:08X}\n")
              f.write(f"Page size: {page_size}\n")
              f.write(f"OS version: {os_version} (0x{os_version:08X})\n")
              f.write(f"Product name: {name}\n")
              f.write(f"Kernel cmdline: {cmdline}\n")
              f.write(f"Extra cmdline: {extra_cmdline}\n")
              if base is not None:
                  f.write(f"Inferred kernel base: 0x{base:08X}\n")
                  f.write(f"Kernel offset (from base): 0x{offsets['kernel']:08X}\n")
                  f.write(f"Ramdisk offset: 0x{offsets['ramdisk']:08X}\n")
                  f.write(f"Second offset: 0x{offsets['second']:08X}\n")
                  f.write(f"Tags offset: 0x{offsets['tags']:08X}\n")
              else:
                  f.write("Base could not be inferred.\n")
              if header_version >= 1:
                  f.write(f"Recovery DTBO size: {recovery_dtbo_size}\n")
                  f.write(f"Recovery DTBO offset: 0x{recovery_dtbo_offset:X}\n")
                  f.write(f"Total header size (v0+v1): {v1_header_size}\n")
              f.write(f"SHA256: {sha256}\n")
              f.write(f"AVB Signed: {'Yes' if signed_avb else 'No'}\n")
          EOF

      - name: Extract all possible ramdisks (APatch overlay search)
        run: |
          mkdir -p ramdisk_extracted
          best_count=0
          best_dir=""

          if [ -s ramdisk.bin ]; then
            echo "=== Trying ramdisk.bin ==="
            mkdir -p test_rd1
            ( gunzip -c ramdisk.bin 2>/dev/null || cat ramdisk.bin ) | cpio -idm --no-absolute-filenames -D test_rd1 2>/dev/null || true
            cnt=$(find test_rd1 -type f 2>/dev/null | wc -l)
            if [ "$cnt" -gt "$best_count" ]; then
              best_count=$cnt
              best_dir="test_rd1"
            fi
          fi

          echo "=== Decompressing kernel ==="
          kernel_decomp="kernel_decompressed.bin"
          decompressed=0
          magic2=$(head -c 2 kernel.bin | xxd -p)
          magic4=$(head -c 4 kernel.bin | xxd -p)
          magic6=$(head -c 6 kernel.bin | xxd -p)
          if [ "$magic2" = "1f8b" ]; then
            gunzip -c kernel.bin > "$kernel_decomp" 2>/dev/null || true
            [ -s "$kernel_decomp" ] && decompressed=1
          elif [ "$magic4" = "04224d18" ] || [ "$magic4" = "02214c18" ]; then
            lz4 -d kernel.bin "$kernel_decomp" 2>/dev/null || true
            [ -s "$kernel_decomp" ] && decompressed=1
          elif [ "$magic6" = "fd377a585a00" ]; then
            xz -d -c kernel.bin > "$kernel_decomp" 2>/dev/null || true
            [ -s "$kernel_decomp" ] && decompressed=1
          elif [ "$magic2" = "5d00" ]; then
            zstd -d -c kernel.bin > "$kernel_decomp" 2>/dev/null || true
            [ -s "$kernel_decomp" ] && decompressed=1
          else
            lzma -d -c kernel.bin > "$kernel_decomp" 2>/dev/null || true
            [ -s "$kernel_decomp" ] && decompressed=1
          fi

          if [ $decompressed -eq 1 ]; then
            echo "Decompressed kernel size: $(stat -c %s "$kernel_decomp")"

            offsets=$(grep -abo $'\x30\x37\x30\x37\x30\x31' "$kernel_decomp" | cut -d: -f1)
            offsets="$offsets"$'\n'"$(grep -abo $'\x30\x37\x30\x37\x30\x32' "$kernel_decomp" | cut -d: -f1)"
            for off in $offsets; do
              echo "Found cpio at offset $off in decompressed kernel"
              mkdir -p "test_rd2_$off"
              dd if="$kernel_decomp" bs=1 skip="$off" 2>/dev/null | cpio -idm --no-absolute-filenames -D "test_rd2_$off" 2>/dev/null || true
              cnt=$(find "test_rd2_$off" -type f 2>/dev/null | wc -l)
              if [ "$cnt" -gt "$best_count" ]; then
                best_count=$cnt
                best_dir="test_rd2_$off"
              fi
            done

            gz_offsets=$(grep -abo $'\x1f\x8b' "$kernel_decomp" | cut -d: -f1)
            for gz_off in $gz_offsets; do
              echo "Found gzip magic at offset $gz_off in decompressed kernel"
              dd if="$kernel_decomp" bs=1 skip="$gz_off" 2>/dev/null > temp_gz_chunk.gz
              gunzip -c temp_gz_chunk.gz > temp_gz_decomp 2>/dev/null || continue
              [ -s temp_gz_decomp ] || continue
              mkdir -p "test_gz_$gz_off"
              ( cpio -idm --no-absolute-filenames -D "test_gz_$gz_off" < temp_gz_decomp 2>/dev/null ) || \
              ( cat temp_gz_decomp | cpio -idm --no-absolute-filenames -D "test_gz_$gz_off" 2>/dev/null ) || true
              cnt=$(find "test_gz_$gz_off" -type f 2>/dev/null | wc -l)
              if [ "$cnt" -gt "$best_count" ]; then
                best_count=$cnt
                best_dir="test_gz_$gz_off"
              fi
            done
          fi

          echo "=== Searching raw kernel.bin ==="
          raw_offsets=$(grep -abo $'\x30\x37\x30\x37\x30\x31' kernel.bin | cut -d: -f1)
          raw_offsets="$raw_offsets"$'\n'"$(grep -abo $'\x30\x37\x30\x37\x30\x32' kernel.bin | cut -d: -f1)"
          for off in $raw_offsets; do
            mkdir -p "test_raw_$off"
            dd if=kernel.bin bs=1 skip="$off" 2>/dev/null | cpio -idm --no-absolute-filenames -D "test_raw_$off" 2>/dev/null || true
            cnt=$(find "test_raw_$off" -type f 2>/dev/null | wc -l)
            if [ "$cnt" -gt "$best_count" ]; then
              best_count=$cnt
              best_dir="test_raw_$off"
            fi
          done

          raw_gz_offsets=$(grep -abo $'\x1f\x8b' kernel.bin | cut -d: -f1)
          for gz_off in $raw_gz_offsets; do
            dd if=kernel.bin bs=1 skip="$gz_off" 2>/dev/null > temp_raw_gz.gz
            gunzip -c temp_raw_gz.gz > temp_raw_gz_decomp 2>/dev/null || continue
            [ -s temp_raw_gz_decomp ] || continue
            mkdir -p "test_raw_gz_$gz_off"
            cpio -idm --no-absolute-filenames -D "test_raw_gz_$gz_off" < temp_raw_gz_decomp 2>/dev/null || true
            cnt=$(find "test_raw_gz_$gz_off" -type f 2>/dev/null | wc -l)
            if [ "$cnt" -gt "$best_count" ]; then
              best_count=$cnt
              best_dir="test_raw_gz_$gz_off"
            fi
          done

          rm -rf ramdisk
          if [ -n "$best_dir" ]; then
            mv "$best_dir" ramdisk
            echo "Best ramdisk found: $best_dir with $best_count files"
          else
            mkdir ramdisk
            echo "No ramdisk found"
          fi

          # Fix permissions so everything is readable (ignore errors)
          chmod -R u+rwX ramdisk/ 2>/dev/null || true

          echo "=== Final Ramdisk contents ==="
          ls -laR ramdisk 2>/dev/null || true
          echo "============================="

      - name: Gather APatch information
        run: |
          echo "" >> info.txt
          echo "=== APatch analysis ===" >> info.txt
          if [ -f ramdisk/apd ] || [ -f ramdisk/kernel ]; then
              echo "APatch binaries found:" >> info.txt
              [ -f ramdisk/apd ] && echo "- apd daemon" >> info.txt
              [ -f ramdisk/kernel ] && echo "- kernel binary" >> info.txt
              strings ramdisk/kernel 2>/dev/null | grep -iE 'apatch|version' | head -n 10 >> info.txt || true
          fi
          if [ -f ramdisk/version ]; then
              echo "APatch version file:" >> info.txt
              cat ramdisk/version 2>/dev/null >> info.txt || true
          fi
          if [ -d ramdisk/overlay.d ]; then
              echo "Overlay directory:" >> info.txt
              find ramdisk/overlay.d -ls 2>/dev/null >> info.txt || true
          fi
          if [ -f ramdisk/init ]; then
              echo "Custom init script present" >> info.txt
          fi

      - name: Package results
        run: zip -r boot_analysis.zip ramdisk/ info.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-analysis
          path: boot_analysis.zip
