name: Extract vmlinux and kallsyms (accurate addresses)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extract-vmlinux
        run: |
          curl -fsSL -o extract-vmlinux \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux"
          chmod +x extract-vmlinux

      - name: Download zImage kernel.img
        run: |
          curl -fsSL -o kernel.img \
            "https://github.com/coara-chocomaru/monooki/releases/download/%E3%81%A7%E3%83%BC%E3%81%9F2/zImage"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu gzip xz-utils bzip2 lzma lzop lz4 zstd

      - name: Decompress zImage to vmlinux (raw binary)
        run: |
          ./extract-vmlinux kernel.img 2>/dev/null > vmlinux.raw
          cp vmlinux.raw vmlinux

      - name: Extract ARM64 image header information
        run: |
          echo "Parsing ARM64 image header..."
          TEXT_OFFSET=$(dd if=vmlinux.raw bs=1 skip=8 count=4 2>/dev/null | hexdump -e '1/4 "%08x\n"')
          IMAGE_SIZE=$(dd if=vmlinux.raw bs=1 skip=16 count=8 2>/dev/null | hexdump -e '1/8 "%016x\n"')
          FLAGS=$(dd if=vmlinux.raw bs=1 skip=24 count=4 2>/dev/null | hexdump -e '1/4 "%08x\n"')
          echo "text_offset = 0x$TEXT_OFFSET"
          echo "image_size  = 0x$IMAGE_SIZE"
          echo "flags       = 0x$FLAGS"

          KERNEL_BASE="0xffffff8008000000"
          TEXT_OFFSET_DEC=$((0x$TEXT_OFFSET))
          BASE_ADDR=$((KERNEL_BASE + TEXT_OFFSET_DEC))
          echo "Computed base address = 0x$(printf '%x' $BASE_ADDR)"

          echo "BASE_ADDR=$BASE_ADDR" >> $GITHUB_ENV
          echo "TEXT_OFFSET=0x$TEXT_OFFSET" >> $GITHUB_ENV

      - name: Extract kallsyms with correct virtual addresses
        run: |
          printf "%-18s %s\n" "Virtual Address" "Symbol" > kallsyms.txt
          strings -t x vmlinux.raw | grep -E '^[0-9a-f]+ [a-zA-Z_][a-zA-Z0-9_]*$' | while read offset sym; do
            addr=$((BASE_ADDR + 0x$offset))
            printf "0x%016x T %s\n" $addr "$sym" >> kallsyms.txt
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kallsyms
          path: kallsyms.txt
          retention-days: 30
