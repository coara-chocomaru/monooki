name: Resign vbmeta (exact structure, only boot hash changed)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '全イメージ (boot, dtbo, vendor_boot, odm, vendor, vbmeta_system, vbmeta) を含むZIPのURL'
        required: true
        type: string
      output_zip:
        description: '出力ZIPファイル名'
        required: false
        default: 'resigned_images.zip'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Python 2.7 and install avbtool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git unzip zip openssl libssl-dev zlib1g-dev
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations
          make -j$(nproc) || true
          sudo make altinstall
          cd ..
          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python2
          git clone --depth 1 --branch android-11.0.0_r39 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      - name: Download and extract ZIP
        run: |
          mkdir -p work
          wget -q -O work/images.zip "${{ github.event.inputs.zip_url }}"
          cd work
          unzip -q images.zip
          ls -la *.img

      - name: Extract parameters (header, props, chain, boot partition size)
        id: extract
        run: |
          python3 << 'EOF'
          import re, json, subprocess

          def run_avbtool(cmd):
              return subprocess.check_output(['python2', '/usr/local/bin/avbtool'] + cmd, text=True)

          # 元の vbmeta 情報
          vbmeta_info = run_avbtool(['info_image', '--image', 'work/vbmeta.img'])
          header = {
              'algorithm': re.search(r'Algorithm:\s+(\S+)', vbmeta_info).group(1),
              'rollback': re.search(r'Rollback Index:\s+(\d+)', vbmeta_info).group(1),
              'flags': re.search(r'Flags:\s+(\d+)', vbmeta_info).group(1),
          }
          props = re.findall(r'Prop:\s+(\S+)\s+->\s+\'(.*)\'', vbmeta_info)
          chain_match = re.search(
              r'Chain Partition descriptor:.*?Partition Name:\s+(\S+).*?Rollback Index Location:\s+(\d+)',
              vbmeta_info, re.DOTALL
          )
          chain = (chain_match.group(1), chain_match.group(2)) if chain_match else None

          # 元の boot パーティションサイズ（フッター込み）を取得
          boot_info = run_avbtool(['info_image', '--image', 'work/boot.img'])
          boot_partition_size = re.search(r'Image size:\s+(\d+)\s+bytes', boot_info).group(1)

          # 新しい boot.img にハッシュフッターを追加（--prop なし、--algorithm NONE）
          subprocess.check_call([
              'python2', '/usr/local/bin/avbtool', 'erase_footer', '--image', 'work/boot.img'
          ], stderr=subprocess.DEVNULL)
          subprocess.check_call([
              'python2', '/usr/local/bin/avbtool', 'add_hash_footer',
              '--image', 'work/boot.img',
              '--partition_name', 'boot',
              '--partition_size', boot_partition_size,
              '--hash_algorithm', 'sha256',
              '--algorithm', 'NONE'
          ])

          # 新しい boot のハッシュ情報（後で検証用に保存）
          new_boot_info = run_avbtool(['info_image', '--image', 'work/boot.img'])
          new_boot_hash = re.search(
              r'Hash descriptor:.*?Image Size:\s+(\d+)\s+bytes.*?Salt:\s+(\S+).*?Digest:\s+(\S+)',
              new_boot_info, re.DOTALL
          )
          boot_hash = {
              'size': new_boot_hash.group(1),
              'salt': new_boot_hash.group(2),
              'digest': new_boot_hash.group(3),
          }

          # チェーン公開鍵を testkey_rsa2048.pem から抽出
          subprocess.check_call([
              'python2', '/usr/local/bin/avbtool', 'extract_public_key',
              '--key', 'keys/testkey_rsa2048.pem',
              '--output', 'work/chain.avbpubkey'
          ])

          with open('work/params.json', 'w') as f:
              json.dump({
                  'header': header,
                  'props': props,
                  'chain': chain,
                  'boot_hash': boot_hash,
              }, f)
          EOF

      - name: Build new vbmeta using --include_descriptors_from_image
        run: |
          python3 << 'EOF'
          import json, subprocess

          with open('work/params.json', 'r') as f:
              p = json.load(f)

          cmd = [
              'python2', '/usr/local/bin/avbtool', 'make_vbmeta_image',
              '--output', 'work/vbmeta_new.img',
              '--key', 'keys/vbmeta.pem',
              '--algorithm', p['header']['algorithm'],
              '--rollback_index', p['header']['rollback'],
              '--flags', p['header']['flags']
          ]

          # 1. チェーン（元の順序：最初）
          if p['chain']:
              cmd.extend([
                  '--chain_partition',
                  f"{p['chain'][0]}:{p['chain'][1]}:work/chain.avbpubkey"
              ])

          # 2. プロパティ（元の順序：チェーンの次）
          for key, value in p['props']:
              cmd.extend(['--prop', f'{key}:{value}'])

          # 3. boot 以降の記述子はイメージから直接取り込む（この順序で連結）
          for img in ['boot.img', 'dtbo.img', 'vendor_boot.img', 'odm.img', 'vendor.img']:
              cmd.extend(['--include_descriptors_from_image', f'work/{img}'])

          subprocess.check_call(cmd)
          print("vbmeta_new.img generated with exact structure.")
          EOF

      - name: Verify structure and boot hash
        run: |
          echo "=============================================="
          echo "=== Original vbmeta (full) ==="
          echo "=============================================="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img

          echo ""
          echo "=============================================="
          echo "=== New vbmeta (should have same structure, only boot hash changed) ==="
          echo "=============================================="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_new.img

          echo ""
          echo "=============================================="
          echo "=== Boot hash comparison ==="
          echo "=============================================="
          echo "Original boot digest (from old vbmeta):"
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img | grep -A 6 "Hash descriptor:" | grep -A 1 "Partition Name:.*boot" | grep Digest | head -1

          echo ""
          echo "New boot digest (from new vbmeta):"
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_new.img | grep -A 6 "Hash descriptor:" | grep -A 1 "Partition Name:.*boot" | grep Digest | head -1

          echo ""
          echo "=============================================="
          echo "=== Chain partition check (must be cdbb77177...) ==="
          echo "=============================================="
          echo "Original chain pubkey (sha1):"
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img | grep -A 3 "Chain Partition descriptor:" | grep "Public key (sha1)"
          echo "New chain pubkey (sha1):"
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_new.img | grep -A 3 "Chain Partition descriptor:" | grep "Public key (sha1)"

      - name: Create output ZIP
        run: |
          mkdir -p out
          cp work/boot.img out/boot.img
          cp work/vbmeta_new.img out/vbmeta.img
          cd out
          zip ${{ github.event.inputs.output_zip }} boot.img vbmeta.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-images
          path: out/${{ github.event.inputs.output_zip }}
          if-no-files-found: error
