name: Resign vbmeta (exact structure, only boot hash changed)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '全イメージ (boot, dtbo, vendor_boot, odm, vendor, vbmeta_system, vbmeta) を含むZIPのURL'
        required: true
        type: string
      output_zip:
        description: '出力ZIPファイル名'
        required: false
        default: 'resigned_images.zip'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Python 2.7 and install avbtool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git unzip zip openssl libssl-dev zlib1g-dev
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations
          make -j$(nproc) || true
          sudo make altinstall
          cd ..
          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python2
          git clone --depth 1 --branch android-11.0.0_r39 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      - name: Download and extract ZIP
        run: |
          mkdir -p work
          wget -q -O work/images.zip "${{ github.event.inputs.zip_url }}"
          cd work
          unzip -q images.zip
          ls -la *.img

      - name: Extract all descriptor parameters from original images
        id: extract
        run: |
          python3 << 'EOF'
          import re, json, subprocess

          def run_avbtool(cmd):
              return subprocess.check_output(['python2', '/usr/local/bin/avbtool'] + cmd, text=True)

          # 1. 元の vbmeta からヘッダ情報とプロパティ、チェーンを取得
          vbmeta_info = run_avbtool(['info_image', '--image', 'work/vbmeta.img'])
          header = {
              'algorithm': re.search(r'Algorithm:\s+(\S+)', vbmeta_info).group(1),
              'rollback': re.search(r'Rollback Index:\s+(\d+)', vbmeta_info).group(1),
              'flags': re.search(r'Flags:\s+(\d+)', vbmeta_info).group(1),
          }
          props = re.findall(r'Prop:\s+(\S+)\s+->\s+\'(.*)\'', vbmeta_info)
          chain_match = re.search(
              r'Chain Partition descriptor:.*?Partition Name:\s+(\S+).*?Rollback Index Location:\s+(\d+)',
              vbmeta_info, re.DOTALL
          )
          chain = (chain_match.group(1), chain_match.group(2)) if chain_match else None

          # 2. 各パーティションイメージから記述子パラメータを抽出
          # 注意: boot は後で新しいものを使うので、ここではスキップ
          partitions = ['dtbo', 'vendor_boot', 'odm', 'vendor']
          descriptors = {}

          for part in partitions:
              info = run_avbtool(['info_image', '--image', f'work/{part}.img'])
              if 'Hash descriptor:' in info:
                  # ハッシュ記述子
                  m = re.search(
                      r'Hash descriptor:.*?Image Size:\s+(\d+)\s+bytes.*?Hash Algorithm:\s+(\S+).*?Salt:\s+(\S+).*?Digest:\s+(\S+).*?Flags:\s+(\d+)',
                      info, re.DOTALL
                  )
                  if m:
                      descriptors[part] = {
                          'type': 'hash',
                          'size': m.group(1),
                          'algo': m.group(2),
                          'salt': m.group(3),
                          'digest': m.group(4),
                          'flags': m.group(5),
                      }
              elif 'Hashtree descriptor:' in info:
                  # ハッシュツリー記述子
                  m = re.search(
                      r'Hashtree descriptor:.*?Image Size:\s+(\d+)\s+bytes.*?Tree Offset:\s+(\d+).*?Tree Size:\s+(\d+).*?Data Block Size:\s+(\d+).*?Hash Block Size:\s+(\d+).*?FEC num roots:\s+(\d+).*?FEC offset:\s+(\d+).*?FEC size:\s+(\d+).*?Hash Algorithm:\s+(\S+).*?Salt:\s+(\S+).*?Root Digest:\s+(\S+).*?Flags:\s+(\d+)',
                      info, re.DOTALL
                  )
                  if m:
                      descriptors[part] = {
                          'type': 'hashtree',
                          'image_size': m.group(1),
                          'tree_offset': m.group(2),
                          'tree_size': m.group(3),
                          'data_block_size': m.group(4),
                          'hash_block_size': m.group(5),
                          'fec_num_roots': m.group(6),
                          'fec_offset': m.group(7),
                          'fec_size': m.group(8),
                          'hash_alg': m.group(9),
                          'salt': m.group(10),
                          'root_digest': m.group(11),
                          'flags': m.group(12),
                      }

          # 3. 新しい boot.img にハッシュフッターを追加（プロパティなし）
          subprocess.check_call([
              'python2', '/usr/local/bin/avbtool', 'erase_footer', '--image', 'work/boot.img'
          ], stderr=subprocess.DEVNULL)
          subprocess.check_call([
              'python2', '/usr/local/bin/avbtool', 'add_hash_footer',
              '--image', 'work/boot.img',
              '--partition_name', 'boot',
              '--partition_size', '100663296',   # 元の boot パーティションサイズ（固定）
              '--hash_algorithm', 'sha256',
              '--algorithm', 'NONE'
          ])
          # 新しい boot のハッシュ情報を抽出
          boot_info = run_avbtool(['info_image', '--image', 'work/boot.img'])
          boot_m = re.search(
              r'Hash descriptor:.*?Image Size:\s+(\d+)\s+bytes.*?Salt:\s+(\S+).*?Digest:\s+(\S+)',
              boot_info, re.DOTALL
          )
          boot_hash = {
              'size': boot_m.group(1),
              'salt': boot_m.group(2),
              'digest': boot_m.group(3),
          }

          # 4. チェーン公開鍵を元の vbmeta から抽出（vbmeta_system の公開鍵）
          if chain:
              subprocess.check_call([
                  'python2', '/usr/local/bin/avbtool', 'extract_public_key',
                  '--vbmeta_image', 'work/vbmeta.img',
                  '--chain_partition', chain[0],
                  '--output', 'work/chain.avbpubkey'
              ])

          # すべてのデータを JSON に保存
          with open('work/params.json', 'w') as f:
              json.dump({
                  'header': header,
                  'props': props,
                  'chain': chain,
                  'descriptors': descriptors,
                  'boot_hash': boot_hash,
              }, f)
          EOF

      - name: Build new vbmeta with exact structure
        run: |
          python3 << 'EOF'
          import json, subprocess

          with open('work/params.json', 'r') as f:
              p = json.load(f)

          cmd = [
              'python2', '/usr/local/bin/avbtool', 'make_vbmeta_image',
              '--output', 'work/vbmeta_new.img',
              '--key', 'keys/vbmeta.pem',
              '--algorithm', p['header']['algorithm'],
              '--rollback_index', p['header']['rollback'],
              '--flags', p['header']['flags']
          ]

          # 1. チェーンパーティション（元の vbmeta と同じ順序）
          if p['chain']:
              cmd.extend([
                  '--chain_partition',
                  f"{p['chain'][0]}:{p['chain'][1]}:work/chain.avbpubkey"
              ])

          # 2. プロパティ（元の vbmeta と同じ順序）
          for key, value in p['props']:
              cmd.extend(['--prop', f'{key}:{value}'])

          # 3. boot ハッシュ（新しいもの）
          bh = p['boot_hash']
          cmd.extend([
              '--hash', f"boot:{bh['size']}:sha256:{bh['salt']}:{bh['digest']}:0"
          ])

          # 4. dtbo ハッシュ（元のまま）
          dtbo = p['descriptors']['dtbo']
          cmd.extend([
              '--hash', f"dtbo:{dtbo['size']}:{dtbo['algo']}:{dtbo['salt']}:{dtbo['digest']}:{dtbo['flags']}"
          ])

          # 5. vendor_boot ハッシュ（元のまま）
          vboot = p['descriptors']['vendor_boot']
          cmd.extend([
              '--hash', f"vendor_boot:{vboot['size']}:{vboot['algo']}:{vboot['salt']}:{vboot['digest']}:{vboot['flags']}"
          ])

          # 6. odm ハッシュツリー（元のまま）
          odm = p['descriptors']['odm']
          cmd.extend([
              '--hashtree',
              f"odm:{odm['image_size']}:{odm['tree_offset']}:{odm['tree_size']}:{odm['data_block_size']}:{odm['hash_block_size']}:{odm['fec_num_roots']}:{odm['fec_offset']}:{odm['fec_size']}:{odm['hash_alg']}:{odm['salt']}:{odm['root_digest']}:{odm['flags']}"
          ])

          # 7. vendor ハッシュツリー（元のまま）
          vendor = p['descriptors']['vendor']
          cmd.extend([
              '--hashtree',
              f"vendor:{vendor['image_size']}:{vendor['tree_offset']}:{vendor['tree_size']}:{vendor['data_block_size']}:{vendor['hash_block_size']}:{vendor['fec_num_roots']}:{vendor['fec_offset']}:{vendor['fec_size']}:{vendor['hash_alg']}:{vendor['salt']}:{vendor['root_digest']}:{vendor['flags']}"
          ])

          subprocess.check_call(cmd)
          print("vbmeta_new.img generated with exact structure.")
          EOF

      - name: Verify structure matches original
        run: |
          echo "=== Original vbmeta ==="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img
          echo ""
          echo "=== New vbmeta (should have same structure, only boot hash changed) ==="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_new.img
          echo ""
          echo "=== Boot hash comparison ==="
          echo "Original boot digest:"
          grep -A 6 "Hash descriptor:" work/vbmeta_info.txt | grep -A 1 "Partition Name:.*boot" | grep Digest
          echo "New boot digest:"
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_new.img | grep -A 6 "Hash descriptor:" | grep -A 1 "Partition Name:.*boot" | grep Digest

      - name: Create output ZIP
        run: |
          mkdir -p out
          cp work/boot.img out/boot.img
          cp work/vbmeta_new.img out/vbmeta.img
          cd out
          zip ${{ github.event.inputs.output_zip }} boot.img vbmeta.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-images
          path: out/${{ github.event.inputs.output_zip }}
          if-no-files-found: error
