name: BootIMG to Device Tree
on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'Direct URL to boot.img (optional)'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cpio device-tree-compiler python3 git gcc make flex bison libssl-dev
      - name: Download boot.img
        run: |
          if [ -z "${{ github.event.inputs.boot_img_url }}" ]; then
            echo "No URL provided, assuming boot.img is already in workspace"
            if [ ! -f boot.img ]; then
              echo "Error: boot.img not found and no URL given"
              exit 1
            fi
          else
            wget --tries=5 --timeout=30 --no-check-certificate -O boot.img "${{ github.event.inputs.boot_img_url }}"
          fi
          file boot.img
          ls -lh boot.img
      - name: Setup Android Image Kitchen
        run: |
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git aik
          cd aik
          chmod +x unpackimg.sh repackimg.sh
      - name: Unpack boot.img with AIK
        run: |
          cd aik
          ./unpackimg.sh ../boot.img
          cp -r split_img ../split_img
          cp -r ramdisk ../ramdisk 2>/dev/null || true
          cd ..
      - name: Extract DTB from boot.img-dtb
        run: |
          if [ -f split_img/boot.img-dtb ]; then
            cp split_img/boot.img-dtb ./dtb_original
            echo "DTB extracted from boot.img"
          else
            echo "No combined dtb, trying to find dtb inside kernel"
            if [ -f split_img/boot.img-zImage ]; then
              dd if=split_img/boot.img-zImage of=kernel.gz bs=1 skip=$(($(strings -t d split_img/boot.img-zImage | grep -m1 'x00x00x00x00x00x00x00x00x00x00x00x00' | awk '{print $1}') 2>/dev/null || echo 0)) 2>/dev/null
              echo "Kernel extracted"
            fi
            exit 1
          fi
      - name: Split DTB into multiple DTBs
        run: |
          if [ -f dtb_original ]; then
            dtc -I dtb -O dts -o all_dump.dts dtb_original 2>/dev/null || true
            if [ -f all_dump.dts ]; then
              echo "Single DTS created"
            else
              python3 <<EOF
          import struct
          with open("dtb_original", "rb") as f:
              data = f.read()
          offset = 0
          idx = 0
          while offset < len(data):
              if len(data) - offset < 8:
                  break
              magic = struct.unpack(">I", data[offset:offset+4])[0]
              if magic == 0xd00dfeed:
                  size = struct.unpack(">I", data[offset+4:offset+8])[0]
                  with open(f"dtb_{idx:03d}.dtb", "wb") as out:
                      out.write(data[offset:offset+size])
                  idx += 1
                  offset += size
              else:
                  offset += 4
          print(f"Split into {idx} dtb files")
          EOF
            fi
          fi
      - name: Convert all DTB to DTS
        run: |
          mkdir dts_output
          if [ -f all_dump.dts ]; then
            cp all_dump.dts dts_output/device_tree.dts
          else
            for dtb in dtb_*.dtb; do
              if [ -f "$dtb" ]; then
                base=$(basename "$dtb" .dtb)
                dtc -I dtb -O dts -o "dts_output/${base}.dts" "$dtb" 2>/dev/null
              fi
            done
          fi
          if [ -f split_img/boot.img-dtb ]; then
            dtc -I dtb -O dts -o dts_output/full_dtb.dts split_img/boot.img-dtb 2>/dev/null || true
          fi
          echo "DTS files generated:"
          ls -la dts_output/
      - name: Auto-generate device tree makefiles
        run: |
          mkdir device_tree_mk
          SOC="MT6765"
          MANUFACTURER="unknown"
          DEVICE="iphone17_clone"
          if ls dts_output/*.dts 1>/dev/null 2>&1; then
            SOC=$(grep -oP 'compatible\s*=\s*"\K[^"]+' dts_output/*.dts | head -1 | grep -oP 'mt\d+' || echo "MT6765")
            SOC=$(echo $SOC | tr '[:lower:]' '[:upper:]')
            if grep -qi "mediatek" dts_output/*.dts; then
              MANUFACTURER="mediatek"
            fi
          fi
          cat > device_tree_mk/AndroidProducts.mk <<'MK1'
          PRODUCT_MAKEFILES := \\
              \$(LOCAL_DIR)/device.mk
          MK1
          cat > device_tree_mk/BoardConfig.mk <<'MK2'
          USE_CAMERA_STUB := true
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=
          TARGET_CPU_VARIANT := generic
          TARGET_CPU_VARIANT_RUNTIME := generic
          TARGET_BOARD_PLATFORM := ${SOC,,}
          TARGET_BOARD_PLATFORM_GPU := Mali-G52
          TARGET_NO_BOOTLOADER := true
          TARGET_NO_KERNEL := false
          BOARD_USES_GENERIC_AUDIO := true
          BOARD_USES_GENERIC_INVENSENSE := true
          BOARD_KERNEL_CMDLINE := $(cat split_img/boot.img-cmdline 2>/dev/null || echo "console=tty0")
          BOARD_KERNEL_BASE := $(cat split_img/boot.img-base 2>/dev/null || echo "0x40000000")
          BOARD_KERNEL_PAGESIZE := $(cat split_img/boot.img-pagesize 2>/dev/null || echo "2048")
          BOARD_MKBOOTIMG_ARGS := --ramdisk_offset $(cat split_img/boot.img-ramdisk_offset 2>/dev/null || echo "0x01000000") --tags_offset $(cat split_img/boot.img-tags_offset 2>/dev/null || echo "0x00000100")
          BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb
          TARGET_KERNEL_CONFIG := ${SOC,,}_defconfig
          MK2
          cat > device_tree_mk/device.mk <<'MK3'
          \$(call inherit-product, \$(SRC_TARGET_DIR)/product/languages_full.mk)
          \$(call inherit-product, \$(SRC_TARGET_DIR)/product/base.mk)
          PRODUCT_NAME := ${DEVICE}
          PRODUCT_DEVICE := ${DEVICE}
          PRODUCT_MANUFACTURER := ${MANUFACTURER}
          PRODUCT_BRAND := ${MANUFACTURER}
          PRODUCT_MODEL := ${DEVICE}
          PRODUCT_PROPERTY_OVERRIDES += \\
              ro.product.model=${DEVICE} \\
              ro.product.manufacturer=${MANUFACTURER}
          MK3
          cat > device_tree_mk/device_dependencies.mk <<'MK4'
          # Auto-generated dependencies for ${SOC}
          $(echo "# DTB files: $(ls dts_output/ 2>/dev/null)")
          MK4
          cat > device_tree_mk/Android.mk <<'MK5'
          LOCAL_PATH := \$(call my-dir)
          include \$(CLEAR_VARS)
          LOCAL_MODULE := device_tree_files
          LOCAL_MODULE_TAGS := optional
          include \$(BUILD_PHONY_PACKAGE)
          MK5
          echo "Generated .mk files:"
          ls -la device_tree_mk/
      - name: Create final ZIP
        run: |
          mkdir final_artifact
          cp -r dts_output final_artifact/
          cp -r device_tree_mk final_artifact/
          cp split_img/boot.img-dtb final_artifact/ 2>/dev/null || true
          cp boot.img final_artifact/ 2>/dev/null || true
          cd final_artifact
          zip -r ../device_tree_complete.zip .
          cd ..
          ls -lh device_tree_complete.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: device_tree_auto_generated
          path: device_tree_complete.zip
          retention-days: 7
