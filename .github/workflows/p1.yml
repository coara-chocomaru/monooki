name: Kernel to Device Tree
on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: 'Direct URL to kernel image (optional)'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget device-tree-compiler python3 git gcc make
      - name: Download kernel
        run: |
          if [ -z "${{ github.event.inputs.kernel_url }}" ]; then
            echo "No URL provided, assuming kernel file is already in workspace"
            if [ ! -f kernel ]; then
              echo "Error: kernel not found and no URL given"
              exit 1
            fi
          else
            wget --tries=5 --timeout=30 --no-check-certificate -O kernel "${{ github.event.inputs.kernel_url }}"
          fi
          file kernel
          ls -lh kernel
      - name: Setup extract-dtb
        run: |
          git clone https://github.com/DSecurity/extract-dtb.git
          cd extract-dtb
          chmod +x extractdtb.sh
          sudo cp extractdtb.sh /usr/local/bin/extract-dtb
          cd ..
      - name: Extract DTB from kernel
        run: |
          mkdir dtb_output
          extract-dtb kernel --output dtb_output
          if [ ! "$(ls -A dtb_output)" ]; then
            echo "extract-dtb failed, trying manual extraction"
            dd if=kernel of=kernel_dump bs=1 skip=$(strings -t d kernel | grep -m1 'x00x00x00x00x00x00x00x00x00x00x00x00' | awk '{print $1}' 2>/dev/null || echo 0) 2>/dev/null
            dtc -I dtb -O dts -o manual.dts kernel_dump 2>/dev/null || true
            if [ -f manual.dts ]; then
              mkdir -p dtb_output
              cp manual.dts dtb_output/
            else
              echo "No DTB found in kernel"
              exit 1
            fi
          fi
          echo "Extracted files:"
          ls -la dtb_output/
      - name: Convert DTB to DTS
        run: |
          mkdir dts_output
          for dtb in dtb_output/*.dtb; do
            if [ -f "$dtb" ]; then
              base=$(basename "$dtb" .dtb)
              dtc -I dtb -O dts -o "dts_output/${base}.dts" "$dtb" 2>/dev/null
            fi
          done
          for dump in dtb_output/*.dump; do
            if [ -f "$dump" ]; then
              base=$(basename "$dump" .dump)
              dtc -I dtb -O dts -o "dts_output/${base}.dts" "$dump" 2>/dev/null
            fi
          done
          if [ ! "$(ls -A dts_output)" ]; then
            echo "No DTS files generated"
            exit 1
          fi
          echo "DTS files:"
          ls -la dts_output/
      - name: Auto-generate device tree makefiles
        run: |
          mkdir device_tree_mk
          SOC="MT6765"
          MANUFACTURER="unknown"
          DEVICE="generic_mt6765"
          if ls dts_output/*.dts 1>/dev/null 2>&1; then
            SOC=$(grep -oP 'compatible\s*=\s*"\K[^"]+' dts_output/*.dts | head -1 | grep -oP 'mt\d+' || echo "MT6765")
            SOC=$(echo $SOC | tr '[:lower:]' '[:upper:]')
            if grep -qi "mediatek" dts_output/*.dts; then
              MANUFACTURER="mediatek"
            fi
          fi
          cat > device_tree_mk/AndroidProducts.mk <<'MK1'
          PRODUCT_MAKEFILES := \\
              \$(LOCAL_DIR)/device.mk
          MK1
          cat > device_tree_mk/BoardConfig.mk <<'MK2'
          USE_CAMERA_STUB := true
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=
          TARGET_CPU_VARIANT := generic
          TARGET_CPU_VARIANT_RUNTIME := generic
          TARGET_BOARD_PLATFORM := ${SOC,,}
          TARGET_BOARD_PLATFORM_GPU := Mali-G52
          TARGET_NO_BOOTLOADER := true
          TARGET_NO_KERNEL := false
          BOARD_KERNEL_CMDLINE := console=tty0
          BOARD_KERNEL_BASE := 0x40000000
          BOARD_KERNEL_PAGESIZE := 2048
          BOARD_MKBOOTIMG_ARGS := --ramdisk_offset 0x01000000 --tags_offset 0x00000100
          BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb
          TARGET_KERNEL_CONFIG := ${SOC,,}_defconfig
          MK2
          cat > device_tree_mk/device.mk <<'MK3'
          \$(call inherit-product, \$(SRC_TARGET_DIR)/product/languages_full.mk)
          \$(call inherit-product, \$(SRC_TARGET_DIR)/product/base.mk)
          PRODUCT_NAME := ${DEVICE}
          PRODUCT_DEVICE := ${DEVICE}
          PRODUCT_MANUFACTURER := ${MANUFACTURER}
          PRODUCT_BRAND := ${MANUFACTURER}
          PRODUCT_MODEL := ${DEVICE}
          PRODUCT_PROPERTY_OVERRIDES += \\
              ro.product.model=${DEVICE} \\
              ro.product.manufacturer=${MANUFACTURER}
          MK3
          cat > device_tree_mk/device_dependencies.mk <<'MK4'
          # Auto-generated dependencies for ${SOC}
          $(echo "# DTB files: $(ls dts_output/ 2>/dev/null)")
          MK4
          cat > device_tree_mk/Android.mk <<'MK5'
          LOCAL_PATH := \$(call my-dir)
          include \$(CLEAR_VARS)
          LOCAL_MODULE := device_tree_files
          LOCAL_MODULE_TAGS := optional
          include \$(BUILD_PHONY_PACKAGE)
          MK5
          echo "Generated .mk files:"
          ls -la device_tree_mk/
      - name: Create final ZIP
        run: |
          mkdir final_artifact
          cp -r dts_output final_artifact/
          cp -r device_tree_mk final_artifact/
          cp kernel final_artifact/ 2>/dev/null || true
          cd final_artifact
          zip -r ../device_tree_complete.zip .
          cd ..
          ls -lh device_tree_complete.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: device_tree_auto_generated
          path: device_tree_complete.zip
          retention-days: 7
