name: VBMeta Analyze Only

on:
  workflow_dispatch:
    inputs:
      vbmeta_url:
        description: 'vbmeta.img の直接ダウンロードURL'
        required: true
        type: string
      vbmeta_system_url:
        description: 'vbmeta_system.img の直接ダウンロードURL'
        required: true
        type: string

env:
  AVBTOOL_BRANCH: 'android12-release'

jobs:
  analyze:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::Inputs"
          echo "vbmeta URL: ${{ inputs.vbmeta_url }}"
          echo "vbmeta_system URL: ${{ inputs.vbmeta_system_url }}"
          echo "avbtool branch: ${{ env.AVBTOOL_BRANCH }}"
          echo "::endgroup::"

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt -y install python3 python3-pip xxd curl unzip
          mkdir -p work/images work/logs

      - name: Clone avbtool (AVB 1.2.0 / android12-release)
        run: |
          git clone --depth 1 --branch ${{ env.AVBTOOL_BRANCH }} \
            https://android.googlesource.com/platform/external/avb avb

      - name: Download vbmeta.img
        working-directory: work/images
        run: |
          curl -L -o vbmeta.img "${{ inputs.vbmeta_url }}"
          ls -la

      - name: Download vbmeta_system.img
        working-directory: work/images
        run: |
          curl -L -o vbmeta_system.img "${{ inputs.vbmeta_system_url }}"
          ls -la

      - name: Analyze vbmeta.img (info_image)
        run: |
          python3 avb/avbtool.py info_image \
            --image work/images/vbmeta.img \
            > work/logs/vbmeta_info.log 2>&1 || true
          cat work/logs/vbmeta_info.log

      - name: Analyze vbmeta_system.img (info_image)
        run: |
          python3 avb/avbtool.py info_image \
            --image work/images/vbmeta_system.img \
            > work/logs/vbmeta_system_info.log 2>&1 || true
          cat work/logs/vbmeta_system_info.log

      - name: Hexdump vbmeta.img header
        run: |
          xxd work/images/vbmeta.img | head -60 \
            > work/logs/vbmeta_hexdump.log
          cat work/logs/vbmeta_hexdump.log

      - name: Hexdump vbmeta_system.img header
        run: |
          xxd work/images/vbmeta_system.img | head -60 \
            > work/logs/vbmeta_system_hexdump.log
          cat work/logs/vbmeta_system_hexdump.log

      - name: Extract public key blobs from info_image (署名鍵情報)
        run: |
          {
            echo "=== vbmeta.img public key section ==="
            grep -A 20 "Public key" work/logs/vbmeta_info.log || echo "no public key section found"
            echo ""
            echo "=== vbmeta_system.img public key section ==="
            grep -A 20 "Public key" work/logs/vbmeta_system_info.log || echo "no public key section found"
          } > work/logs/pubkey_summary.log
          cat work/logs/pubkey_summary.log

      - name: Extract descriptor / chain partition summary
        run: |
          {
            echo "=== vbmeta.img descriptors ==="
            grep -E "Algorithm|Descriptor|Partition Name|Rollback|Flags" work/logs/vbmeta_info.log || true
            echo ""
            echo "=== vbmeta_system.img descriptors ==="
            grep -E "Algorithm|Descriptor|Partition Name|Rollback|Flags" work/logs/vbmeta_system_info.log || true
          } > work/logs/descriptor_summary.log
          cat work/logs/descriptor_summary.log

      - name: Zip logs
        run: |
          cd work
          zip -r vbmeta_analysis_logs.zip logs/

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: vbmeta-analysis-logs
          path: work/vbmeta_analysis_logs.zip
