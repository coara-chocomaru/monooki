name: Extract DTB, Patch ION Size, Rebuild boot.img (No Sort)

on:
  workflow_dispatch:
    inputs:
      img_url:
        description: "boot.img file URL"
        required: true
        type: string
      output_name:
        description: "Output ZIP base name"
        required: false
        default: "patched_boot"
        type: string
      ion_size_hex:
        description: "New ION carveout size (hex, e.g., 0x2000000)"
        required: false
        default: "0x2000000"
        type: string

jobs:
  patch-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            abootimg \
            python3 \
            python3-pip \
            curl \
            file \
            zip \
            unzip \
            xxd
          pip3 install extract-dtb

      - name: Prepare workspace
        run: |
          rm -rf work
          mkdir -p work/input work/dtb_work work/out

      - name: Download boot image
        run: |
          curl -L --fail --retry 5 --retry-delay 2 "${{ inputs.img_url }}" -o work/input/boot.img
          file work/input/boot.img

      - name: Unpack boot.img with abootimg
        run: |
          cd work/input
          abootimg -x boot.img
          ls -la

      - name: Extract DTB from 'second' or zImage
        run: |
          cd work/input
          if [ -f second ]; then
            magic=$(xxd -p -l 4 second)
            if [ "$magic" = "d00dfeed" ]; then
              echo "DTB found in 'second'"
              cp second ../dtb_work/original.dtb
              exit 0
            fi
          fi

          # Extract from zImage
          echo "Extracting DTB from zImage..."
          mkdir -p ../dtb_work/extracted
          extract-dtb zImage -o ../dtb_work/extracted/
          if [ -d ../dtb_work/extracted ] && [ "$(ls -A ../dtb_work/extracted)" ]; then
            first_dtb=$(ls ../dtb_work/extracted/*.dtb | head -n1)
            cp "$first_dtb" ../dtb_work/original.dtb
          else
            echo "No DTB found" >&2
            exit 1
          fi

      - name: Verify DTB magic
        run: |
          magic=$(xxd -p -l 4 work/dtb_work/original.dtb)
          if [ "$magic" != "d00dfeed" ]; then
            echo "Invalid DTB" >&2
            exit 1
          fi

      - name: Decompile DTB to DTS (no sort)
        run: |
          # -s オプションを使わず、そのまま逆コンパイル
          dtc -I dtb -O dts -o work/dtb_work/original.dts work/dtb_work/original.dtb

      - name: Patch ION carveout size in DTS
        run: |
          cat > work/patch_ion.py << 'PY'
          import re, sys
          dts = sys.argv[1]
          new_size = sys.argv[2]
          with open(dts, 'r') as f:
              lines = f.readlines()
          in_carveout = False
          patched = False
          out_lines = []
          for line in lines:
              if re.search(r'marvell,ion-name\s*=\s*"carveout_heap"', line):
                  in_carveout = True
              elif in_carveout and re.search(r'^\s*\}\s*;', line):
                  in_carveout = False
              if in_carveout and re.search(r'marvell,ion-size\s*=', line):
                  line = re.sub(r'<0x[0-9a-fA-F]+>', f'<{new_size}>', line)
                  patched = True
              out_lines.append(line)
          if not patched:
              print("ERROR: ion-size not found in carveout_heap")
              sys.exit(1)
          with open(dts, 'w') as f:
              f.writelines(out_lines)
          PY
          python3 work/patch_ion.py work/dtb_work/original.dts "${{ inputs.ion_size_hex }}"

      - name: Recompile patched DTS to DTB (no sort, no symbols)
        run: |
          # -s を使わず、-@ (シンボル生成) も無効にする
          dtc -I dts -O dtb -o work/dtb_work/patched.dtb work/dtb_work/original.dts
          # サイズ確認（ソートなしなので若干大きくなる可能性あり）
          orig_size=$(stat -c%s work/dtb_work/original.dtb)
          new_size=$(stat -c%s work/dtb_work/patched.dtb)
          echo "Original DTB: $orig_size bytes, Patched: $new_size bytes"

      - name: Verify patched DTB
        run: |
          # パッチ後のDTBが有効かチェック
          dtc -I dtb -O dts -o work/dtb_work/patched_check.dts work/dtb_work/patched.dtb
          grep "carveout_heap" work/dtb_work/patched_check.dts -A5 || echo "WARNING: carveout_heap not found"

      - name: Rebuild boot.img with abootimg (override size limit)
        run: |
          cd work/input
          # 元の boot.img サイズに 1MB のマージンを追加
          orig_boot_size=$(stat -c%s boot.img)
          new_boot_size=$((orig_boot_size + 0x100000))
          echo "Original boot.img size: $orig_boot_size bytes, new limit: $new_boot_size"

          # Re-create using abootimg with custom bootsize
          if [ -f initrd.img ]; then
            abootimg --create new_boot.img \
              -f bootimg.cfg \
              -k zImage \
              -r initrd.img \
              -s ../dtb_work/patched.dtb \
              -c "bootsize=$new_boot_size"
          else
            abootimg --create new_boot.img \
              -f bootimg.cfg \
              -k zImage \
              -s ../dtb_work/patched.dtb \
              -c "bootsize=$new_boot_size"
          fi

          # 検証
          file new_boot.img
          abootimg -i new_boot.img

      - name: Collect outputs
        run: |
          mkdir -p work/out
          cp work/input/new_boot.img work/out/
          cp work/input/bootimg.cfg work/out/
          cp work/dtb_work/original.dtb work/out/
          cp work/dtb_work/original.dts work/out/
          cp work/dtb_work/patched.dtb work/out/
          cp work/dtb_work/patched.dts work/out/
          cat > work/out/README.txt << EOF
          Patched boot.img (No Sort, abootimg)
          =====================================
          Original boot.img: ${{ inputs.img_url }}
          Patched ION carveout size to: ${{ inputs.ion_size_hex }}
          Date: $(date -u)

          Files:
          - new_boot.img      : Patched boot image (ready to flash)
          - original.dtb/dts  : Original Device Tree
          - patched.dtb/dts   : Patched Device Tree (ion-size changed)
          - bootimg.cfg       : abootimg config used

          Note: -s (sort) was NOT used to avoid possible breakage.
          Flash with: fastboot flash boot new_boot.img
          EOF

      - name: Package ZIP
        run: |
          cd work/out
          zip -9 -r "../../${{ inputs.output_name }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}.zip
          if-no-files-found: error
