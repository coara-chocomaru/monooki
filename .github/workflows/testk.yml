name: Patch ION Carveout Size and Rebuild boot.img

on:
  workflow_dispatch:
    inputs:
      img_url:
        description: "boot.img file URL"
        required: true
        type: string
      output_name:
        description: "Output ZIP base name"
        required: false
        default: "patched_boot"
        type: string
      ion_size_hex:
        description: "New ION carveout size (hex, e.g., 0x2000000)"
        required: false
        default: "0x2000000"
        type: string

jobs:
  patch-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            python3 \
            python3-pip \
            curl \
            file \
            zip \
            unzip \
            xxd
          pip3 install extract-dtb

      - name: Prepare workspace
        run: |
          rm -rf work
          mkdir -p work/input work/dtb_work work/out

      - name: Download boot image
        run: |
          curl -L --fail --retry 5 --retry-delay 2 "${{ inputs.img_url }}" -o work/input/boot.img
          file work/input/boot.img

      - name: Unpack boot.img with abootimg (just to get components)
        run: |
          cd work/input
          abootimg -x boot.img
          ls -la

      - name: Extract and select correct DTB
        run: |
          cd work/input
          # If 'second' exists and is a valid DTB, use it
          if [ -f second ]; then
            magic=$(xxd -p -l 4 second)
            if [ "$magic" = "d00dfeed" ]; then
              echo "Using DTB from 'second'"
              cp second ../dtb_work/original.dtb
              echo "source=second" > ../dtb_work/source.txt
              exit 0
            fi
          fi

          # Otherwise extract from zImage and pick the largest DTB
          echo "Extracting DTBs from zImage..."
          mkdir -p ../dtb_work/extracted
          extract-dtb zImage -o ../dtb_work/extracted/
          if [ -d ../dtb_work/extracted ]; then
            # List all extracted DTBs with sizes
            cd ../dtb_work/extracted
            ls -la *.dtb
            # Pick the largest one (likely the main DTB)
            largest=$(ls -S *.dtb | head -n1)
            echo "Selected largest DTB: $largest"
            cp "$largest" ../original.dtb
            cd ..
            echo "source=kernel" > source.txt
          else
            echo "No DTB found" >&2
            exit 1
          fi

      - name: Verify selected DTB
        run: |
          magic=$(xxd -p -l 4 work/dtb_work/original.dtb)
          if [ "$magic" != "d00dfeed" ]; then
            echo "Invalid DTB" >&2
            exit 1
          fi
          size=$(stat -c%s work/dtb_work/original.dtb)
          echo "Selected DTB size: $size bytes"

      - name: Decompile DTB to DTS (no sort)
        run: |
          dtc -I dtb -O dts -o work/dtb_work/original.dts work/dtb_work/original.dtb

      - name: Patch ION carveout size in DTS
        run: |
          cat > work/patch_ion.py << 'PY'
          import re, sys
          dts = sys.argv[1]
          new_size = sys.argv[2]
          with open(dts, 'r') as f:
              lines = f.readlines()
          in_carveout = False
          patched = False
          out_lines = []
          for line in lines:
              if re.search(r'marvell,ion-name\s*=\s*"carveout_heap"', line):
                  in_carveout = True
              elif in_carveout and re.search(r'^\s*\}\s*;', line):
                  in_carveout = False
              if in_carveout and re.search(r'marvell,ion-size\s*=', line):
                  line = re.sub(r'<0x[0-9a-fA-F]+>', f'<{new_size}>', line)
                  patched = True
              out_lines.append(line)
          if not patched:
              print("ERROR: ion-size not found in carveout_heap")
              sys.exit(1)
          with open(dts, 'w') as f:
              f.writelines(out_lines)
          PY
          python3 work/patch_ion.py work/dtb_work/original.dts "${{ inputs.ion_size_hex }}"

      - name: Recompile patched DTS to DTB (no sort, no symbols)
        run: |
          dtc -I dts -O dtb -o work/dtb_work/patched.dtb work/dtb_work/original.dts
          orig_size=$(stat -c%s work/dtb_work/original.dtb)
          new_size=$(stat -c%s work/dtb_work/patched.dtb)
          echo "Original DTB: $orig_size bytes, Patched: $new_size bytes"
          # Verify the patched DTB is valid
          dtc -I dtb -O dts -o work/dtb_work/patched_check.dts work/dtb_work/patched.dtb

      - name: Repack boot.img using Python (exact control)
        run: |
          cd work/input
          cat > repack.py << 'EOF'
          import struct, json, os

          BOOT_MAGIC = b'ANDROID!'
          HEADER_SIZE = 2048

          # Read original boot.img header to extract metadata
          with open('boot.img', 'rb') as f:
              orig_data = f.read()
              header = orig_data[:HEADER_SIZE]
              # Parse header
              magic = header[:8]
              if magic != BOOT_MAGIC:
                  raise ValueError("Not a valid boot image")
              kernel_size = struct.unpack('<I', header[8:12])[0]
              kernel_addr = struct.unpack('<I', header[12:16])[0]
              ramdisk_size = struct.unpack('<I', header[16:20])[0]
              ramdisk_addr = struct.unpack('<I', header[20:24])[0]
              second_size = struct.unpack('<I', header[24:28])[0]
              second_addr = struct.unpack('<I', header[28:32])[0]
              tags_addr = struct.unpack('<I', header[32:36])[0]
              page_size = struct.unpack('<I', header[36:40])[0]
              # Read components
              kernel_data = orig_data[HEADER_SIZE:HEADER_SIZE+kernel_size]
              ramdisk_data = orig_data[HEADER_SIZE+kernel_size:HEADER_SIZE+kernel_size+ramdisk_size]
              # second stage might be zero size; we'll replace with patched DTB
              # Keep the original second addr
          # Read patched DTB
          with open('../dtb_work/patched.dtb', 'rb') as f:
              second_data = f.read()
          second_size_new = len(second_data)

          # Prepare new header, copy most fields
          new_header = bytearray(header)
          # Update sizes
          struct.pack_into('<I', new_header, 24, second_size_new)
          # The rest (addresses, page size, cmdline) remain as original
          # Write new boot.img
          with open('new_boot.img', 'wb') as f:
              f.write(new_header)
              f.write(kernel_data)
              f.write(ramdisk_data)
              f.write(second_data)
          # Print info
          print(f"Kernel: {len(kernel_data)} bytes")
          print(f"Ramdisk: {len(ramdisk_data)} bytes")
          print(f"Second stage (DTB): {len(second_data)} bytes")
          print(f"New boot.img size: {os.path.getsize('new_boot.img')} bytes")
          EOF
          python3 repack.py

      - name: Verify new boot.img
        run: |
          file work/input/new_boot.img
          magic=$(xxd -p -l 8 work/input/new_boot.img)
          if [ "$magic" != "414e44524f494421" ]; then
            echo "Invalid boot image" >&2
            exit 1
          fi
          # Also check second stage size in header
          cd work/input
          python3 -c "
          import struct
          with open('new_boot.img', 'rb') as f:
              f.seek(24)
              second_size = struct.unpack('<I', f.read(4))[0]
              print(f'Second stage size in header: {second_size} bytes')
          "

      - name: Collect outputs
        run: |
          mkdir -p work/out
          cp work/input/new_boot.img work/out/
          cp work/input/bootimg.cfg work/out/
          cp work/dtb_work/original.dtb work/out/
          cp work/dtb_work/original.dts work/out/
          cp work/dtb_work/patched.dtb work/out/
          cp work/dtb_work/patched.dts work/out/
          cat > work/out/README.txt << EOF
          Patched boot.img (Manual Python Repack)
          ========================================
          Original boot.img: ${{ inputs.img_url }}
          Patched ION carveout size to: ${{ inputs.ion_size_hex }}
          Date: $(date -u)

          Files:
          - new_boot.img      : Patched boot image (ready to flash)
          - original.dtb/dts  : Original Device Tree
          - patched.dtb/dts   : Patched Device Tree (ion-size changed)
          - bootimg.cfg       : abootimg config used for extraction only

          Note: Repacked manually to ensure correct sizes.
          Flash with: fastboot flash boot new_boot.img
          EOF

      - name: Package ZIP
        run: |
          cd work/out
          zip -9 -r "../../${{ inputs.output_name }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}.zip
          if-no-files-found: error
