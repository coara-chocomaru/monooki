name: Patch ION Size in DTB (Binary Edit) and Rebuild boot.img

on:
  workflow_dispatch:
    inputs:
      img_url:
        description: "boot.img file URL"
        required: true
        type: string
      output_name:
        description: "Output ZIP base name"
        required: false
        default: "patched_boot"
        type: string
      ion_size_hex:
        description: "New ION carveout size (hex, e.g., 0x2000000)"
        required: false
        default: "0x2000000"
        type: string

jobs:
  patch-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            abootimg \
            python3 \
            python3-pip \
            curl \
            file \
            zip \
            unzip \
            xxd
          pip3 install extract-dtb

      - name: Prepare workspace
        run: |
          rm -rf work
          mkdir -p work/input work/dtb_work work/out

      - name: Download boot image
        run: |
          curl -L --fail --retry 5 --retry-delay 2 "${{ inputs.img_url }}" -o work/input/boot.img
          file work/input/boot.img

      - name: Unpack boot.img with abootimg
        run: |
          cd work/input
          abootimg -x boot.img
          ls -la

      - name: Extract and select correct DTB (by size and ion node)
        run: |
          cd work/input
          # If 'second' exists and is a valid DTB, use it
          if [ -f second ]; then
            magic=$(xxd -p -l 4 second)
            if [ "$magic" = "d00dfeed" ]; then
              echo "Using DTB from 'second'"
              cp second ../dtb_work/original.dtb
              echo "source=second" > ../dtb_work/source.txt
              exit 0
            fi
          fi

          # Extract from zImage
          echo "Extracting DTBs from zImage..."
          mkdir -p ../dtb_work/extracted
          extract-dtb zImage -o ../dtb_work/extracted/
          if [ ! -d ../dtb_work/extracted ] || [ -z "$(ls ../dtb_work/extracted/*.dtb 2>/dev/null)" ]; then
            echo "No DTB found" >&2
            exit 1
          fi

          # List all extracted DTBs with sizes
          echo "Extracted DTBs:"
          ls -la ../dtb_work/extracted/*.dtb

          # Pick the largest DTB (likely the main one)
          largest=$(ls -S ../dtb_work/extracted/*.dtb | head -n1)
          largest_size=$(stat -c%s "$largest")
          echo "Largest DTB: $(basename "$largest") size: $largest_size bytes"

          # Ensure the size is reasonable (should be > 100KB for a main DTB)
          if [ $largest_size -lt 102400 ]; then
            echo "WARNING: Largest DTB is less than 100KB. This may be a sub-DTB."
            # Try to find any DTB with ion node
            for dtb in ../dtb_work/extracted/*.dtb; do
              if fdtget -t s "$dtb" /ion compatible 2>/dev/null >/dev/null; then
                echo "Found DTB with ion node: $(basename "$dtb")"
                cp "$dtb" ../dtb_work/original.dtb
                echo "source=kernel(ion)" > ../dtb_work/source.txt
                break
              fi
            done
          fi

          # If no DTB selected yet, use the largest
          if [ ! -f ../dtb_work/original.dtb ]; then
            cp "$largest" ../dtb_work/original.dtb
            echo "source=kernel(largest)" > ../dtb_work/source.txt
          fi

      - name: Verify DTB and check ion node
        run: |
          cd work/dtb_work
          magic=$(xxd -p -l 4 original.dtb)
          if [ "$magic" != "d00dfeed" ]; then
            echo "Invalid DTB" >&2
            exit 1
          fi
          size=$(stat -c%s original.dtb)
          echo "Selected DTB size: $size bytes"
          if [ $size -lt 102400 ]; then
            echo "ERROR: DTB size is less than 100KB. This is not the main DTB." >&2
            echo "Please check the extracted DTB files manually." >&2
            exit 1
          fi
          # Check for ion node
          if ! fdtget -t s original.dtb /ion compatible 2>/dev/null >/dev/null; then
            echo "WARNING: ion node not found in this DTB."
            echo "This may not be the correct DTB, but proceeding anyway."
          else
            echo "ion node found"
          fi

      - name: Check current ion-size value
        run: |
          cd work/dtb_work
          current=$(fdtget -t x original.dtb /ion/heap1 marvell,ion-size 2>/dev/null || echo "not found")
          echo "Current ion-size: $current"
          if [ "$current" = "not found" ]; then
            echo "ERROR: marvell,ion-size property not found in DTB" >&2
            exit 1
          fi

      - name: Patch ion-size using fdtput (binary edit)
        run: |
          cd work/dtb_work
          new_size="${{ inputs.ion_size_hex }}"
          new_size_clean="${new_size#0x}"
          echo "New ion-size: $new_size"
          fdtput -t x original.dtb /ion/heap1 marvell,ion-size "$new_size_clean"
          # Verify
          patched=$(fdtget -t x original.dtb /ion/heap1 marvell,ion-size 2>/dev/null)
          echo "Patched ion-size: $patched"
          cp original.dtb patched.dtb

      - name: Verify patched DTB size (should be identical)
        run: |
          orig_size=$(stat -c%s work/dtb_work/original.dtb)
          new_size=$(stat -c%s work/dtb_work/patched.dtb)
          echo "Original DTB: $orig_size bytes, Patched: $new_size bytes"
          if [ "$orig_size" -ne "$new_size" ]; then
            echo "ERROR: DTB size changed after binary patch!" >&2
            exit 1
          fi

      - name: Repack boot.img using Python (exact control)
        run: |
          cd work/input
          cat > repack.py << 'EOF'
          import struct, os

          BOOT_MAGIC = b'ANDROID!'
          HEADER_SIZE = 2048

          with open('boot.img', 'rb') as f:
              orig_data = f.read()
              header = orig_data[:HEADER_SIZE]
              if header[:8] != BOOT_MAGIC:
                  raise ValueError("Not a valid boot image")
              kernel_size = struct.unpack('<I', header[8:12])[0]
              kernel_addr = struct.unpack('<I', header[12:16])[0]
              ramdisk_size = struct.unpack('<I', header[16:20])[0]
              ramdisk_addr = struct.unpack('<I', header[20:24])[0]
              second_size = struct.unpack('<I', header[24:28])[0]
              second_addr = struct.unpack('<I', header[28:32])[0]
              tags_addr = struct.unpack('<I', header[32:36])[0]
              page_size = struct.unpack('<I', header[36:40])[0]
              kernel_data = orig_data[HEADER_SIZE:HEADER_SIZE+kernel_size]
              ramdisk_data = orig_data[HEADER_SIZE+kernel_size:HEADER_SIZE+kernel_size+ramdisk_size]

          with open('../dtb_work/patched.dtb', 'rb') as f:
              second_data = f.read()
          second_size_new = len(second_data)

          new_header = bytearray(header)
          struct.pack_into('<I', new_header, 24, second_size_new)
          with open('new_boot.img', 'wb') as f:
              f.write(new_header)
              f.write(kernel_data)
              f.write(ramdisk_data)
              f.write(second_data)

          print(f"Kernel: {len(kernel_data)} bytes")
          print(f"Ramdisk: {len(ramdisk_data)} bytes")
          print(f"Second stage (DTB): {len(second_data)} bytes")
          print(f"New boot.img size: {os.path.getsize('new_boot.img')} bytes")
          EOF
          python3 repack.py

      - name: Verify new boot.img
        run: |
          file work/input/new_boot.img
          magic=$(xxd -p -l 8 work/input/new_boot.img)
          if [ "$magic" != "414e44524f494421" ]; then
            echo "Invalid boot image" >&2
            exit 1
          fi
          cd work/input
          python3 -c "
          import struct
          with open('new_boot.img', 'rb') as f:
              f.seek(24)
              second_size = struct.unpack('<I', f.read(4))[0]
              print(f'Second stage size in header: {second_size} bytes')
          "

      - name: Collect outputs
        run: |
          mkdir -p work/out
          cp work/input/new_boot.img work/out/
          cp work/dtb_work/original.dtb work/out/
          cp work/dtb_work/patched.dtb work/out/
          cat > work/out/README.txt << EOF
          Patched boot.img (Binary Edit with fdtput)
          ===========================================
          Original boot.img: ${{ inputs.img_url }}
          Patched ION carveout size to: ${{ inputs.ion_size_hex }}
          Date: $(date -u)

          Files:
          - new_boot.img      : Patched boot image (ready to flash)
          - original.dtb      : Original Device Tree (unchanged)
          - patched.dtb       : Patched Device Tree (binary edited)

          Note: DTB was modified in-place without decompile/recompile.
          Flash with: fastboot flash boot new_boot.img
          EOF

      - name: Package ZIP
        run: |
          cd work/out
          zip -9 -r "../../${{ inputs.output_name }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}.zip
          if-no-files-found: error
