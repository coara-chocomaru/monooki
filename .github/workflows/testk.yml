name: Patch ION Carveout Size (Binary Edit) and Rebuild boot.img

on:
  workflow_dispatch:
    inputs:
      img_url:
        description: "boot.img file URL"
        required: true
        type: string
      output_name:
        description: "Output ZIP base name"
        required: false
        default: "patched_boot"
        type: string
      ion_size_hex:
        description: "New ION carveout size (hex, e.g., 0x2000000)"
        required: false
        default: "0x2000000"
        type: string

jobs:
  patch-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            abootimg \
            python3 \
            python3-pip \
            curl \
            file \
            zip \
            unzip \
            xxd
          pip3 install extract-dtb

      - name: Prepare workspace
        run: |
          rm -rf work
          mkdir -p work/input work/dtb_work work/out

      - name: Download boot image
        run: |
          curl -L --fail --retry 5 --retry-delay 2 "${{ inputs.img_url }}" -o work/input/boot.img
          file work/input/boot.img

      - name: Unpack boot.img with abootimg
        run: |
          cd work/input
          abootimg -x boot.img
          ls -la

      - name: Extract DTB from zImage
        run: |
          cd work/input
          mkdir -p ../dtb_work/extracted
          extract-dtb zImage -o ../dtb_work/extracted/
          if [ ! -d ../dtb_work/extracted ] || [ -z "$(ls ../dtb_work/extracted/*.dtb 2>/dev/null)" ]; then
            echo "No DTB found" >&2
            exit 1
          fi
          cp ../dtb_work/extracted/01_dtbdump_PXA1928.dtb ../dtb_work/original.dtb
          echo "DTB extracted successfully"

      - name: Verify DTB size
        run: |
          cd work/dtb_work
          size=$(stat -c%s original.dtb)
          echo "Original DTB size: $size bytes"
          if [ $size -lt 102400 ]; then
            echo "ERROR: DTB too small (<100KB)" >&2
            exit 1
          fi

      - name: Patch ion-size using Python (binary direct edit)
        run: |
          cd work/dtb_work
          cat > patch_ion.py << 'PY'
          import struct, sys, os

          FDT_MAGIC = 0xD00DFEED
          FDT_BEGIN_NODE = 0x1
          FDT_END_NODE = 0x2
          FDT_PROP = 0x3
          FDT_NOP = 0x4
          FDT_END = 0x9

          def be32(data, off):
              return struct.unpack_from('>I', data, off)[0]

          def be32_set(data, off, val):
              struct.pack_into('>I', data, off, val)

          def align4(n):
              return (n + 3) & ~3

          def find_property_offset(data, node_path, prop_name):
              if len(data) < 40:
                  raise ValueError("DTB too small")
              magic = be32(data, 0)
              if magic != FDT_MAGIC:
                  raise ValueError("Invalid DTB magic")
              off_struct = be32(data, 8)
              off_strings = be32(data, 12)
              size_struct = be32(data, 36)
              size_strings = be32(data, 32)
              strings = data[off_strings:off_strings+size_strings]

              p = off_struct
              path_parts = node_path.strip('/').split('/')
              current_path = ""
              stack = []
              target_path = node_path
              found_node = False
              prop_offset = None
              prop_len = None

              while p < off_struct + size_struct:
                  token = be32(data, p)
                  p += 4
                  if token == FDT_BEGIN_NODE:
                      end = data.find(b'\x00', p)
                      if end < 0:
                          break
                      name = data[p:end].decode('ascii')
                      p = align4(end + 1)
                      if current_path == "":
                          current_path = "/" + name
                      else:
                          if current_path == "/":
                              current_path = "/" + name
                          else:
                              current_path = current_path + "/" + name
                      stack.append(name)
                      if current_path == target_path:
                          # このノード内のプロパティを探索
                          while p < off_struct + size_struct:
                              token2 = be32(data, p)
                              p += 4
                              if token2 == FDT_PROP:
                                  plen = be32(data, p)
                                  pname_off = be32(data, p+4)
                                  p += 8
                                  pname_end = strings.find(b'\x00', pname_off)
                                  pname = strings[pname_off:pname_end].decode('ascii')
                                  if pname == prop_name:
                                      prop_offset = p
                                      prop_len = plen
                                      return prop_offset, prop_len
                                  p = align4(p + plen)
                              elif token2 == FDT_END_NODE:
                                  break
                              elif token2 == FDT_NOP:
                                  continue
                              else:
                                  # 他のトークンは無視（例: FDT_END）
                                  pass
                          # 見つからなかった
                          return None, None
                  elif token == FDT_END_NODE:
                      if stack:
                          stack.pop()
                          if current_path.rfind('/') > 0:
                              current_path = current_path[:current_path.rfind('/')]
                          else:
                              current_path = ""
                  elif token == FDT_PROP:
                      plen = be32(data, p)
                      p += 8
                      p = align4(p + plen)
                  elif token == FDT_NOP:
                      continue
                  elif token == FDT_END:
                      break
              return None, None

          def patch_ion_size(dtb_path, new_size_hex):
              new_size = int(new_size_hex, 16)
              with open(dtb_path, 'rb') as f:
                  data = bytearray(f.read())
              node_path = "/ion/heap1"
              prop_name = "marvell,ion-size"
              offset, length = find_property_offset(data, node_path, prop_name)
              if offset is None:
                  raise ValueError(f"Property {prop_name} not found in {node_path}")
              if length != 4:
                  raise ValueError(f"Property length is {length}, expected 4")
              # 値を書き換え
              be32_set(data, offset, new_size)
              # チェックサムは再計算しない（多くのブートローダーはチェックしない）
              with open(dtb_path, 'wb') as f:
                  f.write(data)
              print(f"Patched {prop_name} to 0x{new_size:08x} at offset 0x{offset:x}")

          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  print("Usage: patch_ion.py <dtb_file> <new_size_hex>")
                  sys.exit(1)
              patch_ion_size(sys.argv[1], sys.argv[2])
          PY

          python3 patch_ion.py original.dtb "${{ inputs.ion_size_hex }}"
          # Verify size unchanged
          orig_size=$(stat -c%s original.dtb)
          new_size=$(stat -c%s original.dtb)
          echo "Original DTB: $orig_size bytes, Patched: $new_size bytes"
          if [ "$orig_size" -ne "$new_size" ]; then
            echo "ERROR: DTB size changed!" >&2
            exit 1
          fi
          cp original.dtb patched.dtb

      - name: Repack boot.img using Python
        run: |
          cd work/input
          cat > repack.py << 'EOF'
          import struct, os

          BOOT_MAGIC = b'ANDROID!'
          HEADER_SIZE = 2048

          with open('boot.img', 'rb') as f:
              orig_data = f.read()
              header = orig_data[:HEADER_SIZE]
              if header[:8] != BOOT_MAGIC:
                  raise ValueError("Not a valid boot image")
              kernel_size = struct.unpack('<I', header[8:12])[0]
              kernel_addr = struct.unpack('<I', header[12:16])[0]
              ramdisk_size = struct.unpack('<I', header[16:20])[0]
              ramdisk_addr = struct.unpack('<I', header[20:24])[0]
              second_addr = struct.unpack('<I', header[28:32])[0]
              tags_addr = struct.unpack('<I', header[32:36])[0]
              page_size = struct.unpack('<I', header[36:40])[0]
              kernel_data = orig_data[HEADER_SIZE:HEADER_SIZE+kernel_size]
              ramdisk_data = orig_data[HEADER_SIZE+kernel_size:HEADER_SIZE+kernel_size+ramdisk_size]

          with open('../dtb_work/patched.dtb', 'rb') as f:
              second_data = f.read()
          second_size_new = len(second_data)

          new_header = bytearray(header)
          struct.pack_into('<I', new_header, 24, second_size_new)
          with open('new_boot.img', 'wb') as f:
              f.write(new_header)
              f.write(kernel_data)
              f.write(ramdisk_data)
              f.write(second_data)

          print(f"Kernel: {len(kernel_data)} bytes")
          print(f"Ramdisk: {len(ramdisk_data)} bytes")
          print(f"Second stage (DTB): {len(second_data)} bytes")
          print(f"New boot.img size: {os.path.getsize('new_boot.img')} bytes")
          EOF
          python3 repack.py

      - name: Verify new boot.img
        run: |
          file work/input/new_boot.img
          magic=$(xxd -p -l 8 work/input/new_boot.img)
          if [ "$magic" != "414e44524f494421" ]; then
            echo "Invalid boot image" >&2
            exit 1
          fi

      - name: Collect outputs
        run: |
          mkdir -p work/out
          cp work/input/new_boot.img work/out/
          cp work/dtb_work/original.dtb work/out/
          cp work/dtb_work/patched.dtb work/out/
          cat > work/out/README.txt << EOF
          Patched boot.img (Binary Direct Edit)
          ======================================
          Original boot.img: ${{ inputs.img_url }}
          Patched ION carveout size to: ${{ inputs.ion_size_hex }}
          Date: $(date -u)

          Files:
          - new_boot.img      : Patched boot image (ready to flash)
          - original.dtb      : Original Device Tree (unchanged)
          - patched.dtb       : Patched Device Tree (binary edited)

          Note: DTB was patched directly without decompile/recompile.
          Flash with: fastboot flash boot new_boot.img
          EOF

      - name: Package ZIP
        run: |
          cd work/out
          zip -9 -r "../../${{ inputs.output_name }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}.zip
          if-no-files-found: error
