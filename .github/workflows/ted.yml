# .github/workflows/build-preload.yml
name: CVE-2026-43499 preload.so 自動ビルド (kallsyms利用)

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'boot.img の直接ダウンロードURL'
        required: true
        type: string
        default: 'https://example.com/path/to/boot.img'
      xbl_config_url:
        description: 'xbl_config.img の直接ダウンロードURL（高通デバイスの場合必要、無ければ空）'
        required: false
        type: string
        default: ''
      api_level:
        description: 'Android APIレベル（デフォルト: 28 = Android 9）'
        required: false
        type: number
        default: 28

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 自分のリポジトリをチェックアウト（kallsyms.txt を配置する場所）
      - name: 自分のリポジトリをチェックアウト
        uses: actions/checkout@v4

      # 2. PoCリポジトリを別ディレクトリにクローン（x-spy/popsicle を使用）
      - name: PoCリポジトリをクローン
        uses: actions/checkout@v4
        with:
          repository: x-spy/CVE-2026-43499-popsicle
          ref: main
          path: exploit

      # 3. 依存パッケージのインストール
      - name: 依存パッケージをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y make wget unzip python3 python3-pip llvm lld
          pip3 install pyelftools

      # 4. Android NDK r29 のダウンロード＆セットアップ
      - name: Android NDK r29 をダウンロード
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip -d $HOME
          if [ -d "$HOME/android-ndk-r29" ]; then
            mv $HOME/android-ndk-r29 $HOME/android-ndk-r29-linux
          fi
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r29-linux" >> $GITHUB_ENV
          echo "NDK_ROOT=$HOME/android-ndk-r29-linux" >> $GITHUB_ENV
          echo "$HOME/android-ndk-r29-linux/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # 5. NDK ツールチェーンに実行権限を付与
      - name: NDK ツールチェーンに実行権限を付与
        run: |
          NDK_BIN="$HOME/android-ndk-r29-linux/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -d "$NDK_BIN" ]; then
            chmod -R +x "$NDK_BIN"
          else
            ALT_NDK_BIN="$HOME/android-ndk-r29-linux/toolchains/llvm/prebuilt/linux-x86/bin"
            if [ -d "$ALT_NDK_BIN" ]; then
              chmod -R +x "$ALT_NDK_BIN"
            else
              echo "エラー: NDK ツールチェーンが見つかりません。"
              exit 1
            fi
          fi

      # 6. boot.img をダウンロード
      - name: boot.img をダウンロード
        run: |
          cd exploit
          wget -q -O boot.img "${{ github.event.inputs.boot_img_url }}"
          ls -la boot.img

      # 7. xbl_config.img をダウンロード（指定があれば）
      - name: xbl_config.img をダウンロード
        if: github.event.inputs.xbl_config_url != ''
        run: |
          cd exploit
          wget -q -O xbl_config.img "${{ github.event.inputs.xbl_config_url }}"
          ls -la xbl_config.img

      # 8. kallsyms.txt を配置（自分のリポジトリからコピー）
      - name: kallsyms.txt を配置
        run: |
          if [ ! -f kallsyms.txt ]; then
            echo "エラー: kallsyms.txt がリポジトリのルートにありません。"
            exit 1
          fi
          cp kallsyms.txt exploit/kallsyms.txt
          echo "kallsyms.txt をコピーしました"
          head -5 exploit/kallsyms.txt

      # 9. extract_target.py を使用して target.h を生成
      - name: target.h を生成（extract_target.py）
        run: |
          cd exploit
          if [ -f tools/extract_target.py ]; then
            echo "tools/extract_target.py を使用します"
            if [ -f xbl_config.img ]; then
              python3 tools/extract_target.py \
                boot.img \
                --xbl-config xbl_config.img \
                --kallsyms kallsyms.txt \
                --format c \
                --out source/src/target.h
            else
              python3 tools/extract_target.py \
                boot.img \
                --kallsyms kallsyms.txt \
                --format c \
                --out source/src/target.h
            fi
          else
            echo "エラー: tools/extract_target.py が見つかりません。"
            exit 1
          fi

      # 10. target.h の内容を確認（デバッグ用）
      - name: target.h を確認
        run: |
          cd exploit
          if [ -f source/src/target.h ]; then
            echo "target.h が生成されました。先頭50行:"
            head -50 source/src/target.h
          else
            echo "エラー: target.h が生成されていません"
            exit 1
          fi

      # 11. preload.so をコンパイル
      - name: preload.so をコンパイル
        run: |
          cd exploit
          export ANDROID_API="${{ github.event.inputs.api_level }}"
          make -C source clean preload

      # 12. ビルド成果物をアップロード
      - name: preload.so をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: preload-so
          path: exploit/source/build/bin/preload.so
          if-no-files-found: error
