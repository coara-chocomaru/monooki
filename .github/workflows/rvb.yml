name: Fast resign vbmeta (boot only)

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: '新しい boot.img のダウンロードURL'
        required: true
        type: string
      vbmeta_img_url:
        description: '元の vbmeta.img のダウンロードURL'
        required: true
        type: string
      output_name:
        description: '出力ファイル名（デフォルト: vbmeta_signed.img）'
        required: false
        default: 'vbmeta_signed.img'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      # ---- リポジトリのチェックアウト（keys/vbmeta.pem を取得） ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Python 2.7 と必要なパッケージのインストール ----
      - name: Install Python 2.7 and tools
        run: |
          sudo apt update
          sudo apt install -y python2 wget git

      # ---- avbtool 1.1.0 を AOSP android-9.0.0_r34 からクローン ----
      - name: Clone avbtool 1.1.0
        run: |
          git clone --depth 1 --branch android-9.0.0_r34 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      # ---- 入力URLから boot.img と vbmeta.img をダウンロード ----
      - name: Download boot.img and vbmeta.img
        run: |
          mkdir -p work
          wget -q -O work/boot.img "${{ github.event.inputs.boot_img_url }}"
          wget -q -O work/vbmeta.img "${{ github.event.inputs.vbmeta_img_url }}"

      # ---- 元の vbmeta から boot の Salt とサイズを抽出 ----
      - name: Extract boot salt and size from original vbmeta
        id: extract
        run: |
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img > work/vbmeta_info.txt
          # Salt の抽出
          SALT=$(grep -A10 "Hash descriptor:" work/vbmeta_info.txt | \
                 grep -A5 "Partition Name:        boot" | \
                 grep "Salt:" | head -1 | awk '{print $2}')
          if [ -z "$SALT" ]; then
            echo "Salt 抽出失敗。フォールバック値を使用します。"
            SALT="07b334c6199b399511f08ea05c0ea1b37fcac0a226bf82e2a2284e0d7adcd16b"
          fi
          # サイズの抽出
          SIZE=$(grep -A10 "Hash descriptor:" work/vbmeta_info.txt | \
                 grep -A5 "Partition Name:        boot" | \
                 grep "Image Size:" | head -1 | awk '{print $3}')
          if [ -z "$SIZE" ]; then
            echo "サイズ抽出失敗。フォールバック値を使用します。"
            SIZE="51408896"
          fi
          echo "BOOT_SALT=$SALT" >> $GITHUB_ENV
          echo "BOOT_SIZE=$SIZE" >> $GITHUB_ENV
          echo "抽出した Salt: $SALT, サイズ: $SIZE"

      # ---- 新しい boot.img にハッシュフッターを追加（署名なし） ----
      - name: Add hash footer to new boot.img
        run: |
          cp work/boot.img work/boot_with_footer.img
          python2 /usr/local/bin/avbtool add_hash_footer \
            --image work/boot_with_footer.img \
            --partition_name boot \
            --partition_size ${{ env.BOOT_SIZE }} \
            --hash_algorithm sha256 \
            --salt ${{ env.BOOT_SALT }} \
            --algorithm NONE

      # ---- 元の vbmeta とフッター付き boot を合成して再署名 ----
      - name: Build signed vbmeta
        run: |
          python2 /usr/local/bin/avbtool make_vbmeta_image \
            --include_descriptors_from_image work/vbmeta.img \
            --include_descriptors_from_image work/boot_with_footer.img \
            --key keys/vbmeta.pem \
            --algorithm SHA256_RSA4096 \
            --rollback_index 0 \
            --flags 0 \
            --output work/${{ github.event.inputs.output_name }}

      # ---- 生成された vbmeta の情報を表示（検証） ----
      - name: Show signed vbmeta info
        run: |
          python2 /usr/local/bin/avbtool info_image --image work/${{ github.event.inputs.output_name }}

      # ---- アーティファクトとしてアップロード ----
      - name: Upload signed vbmeta
        uses: actions/upload-artifact@v4
        with:
          name: signed-vbmeta
          path: work/${{ github.event.inputs.output_name }}
          if-no-files-found: error
