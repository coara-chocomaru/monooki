name: Resign vbmeta (with avbtool Android 11)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '全イメージ (boot, dtbo, vendor_boot, odm, vendor, vbmeta) を含むZIPファイルのURL'
        required: true
        type: string
      output_zip:
        description: '出力ZIPファイル名'
        required: false
        default: 'resigned_images.zip'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Python 2.7 のインストール ----
      - name: Build Python 2.7 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git unzip zip openssl libssl-dev zlib1g-dev
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations
          make -j$(nproc)
          sudo make altinstall
          cd ..
          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python2

      # ---- avbtool を Android 11 のタグから取得 ----
      - name: Clone avbtool from android-11.0.0_r39
        run: |
          git clone --depth 1 --branch android-11.0.0_r39 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      - name: Download and extract ZIP
        run: |
          mkdir -p work
          wget -q -O work/images.zip "${{ github.event.inputs.zip_url }}"
          cd work
          unzip -q images.zip
          ls -la *.img

      # ---- 元の vbmeta からパラメータを抽出 ----
      - name: Extract original vbmeta parameters
        id: parse
        run: |
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img > work/vbmeta_info.txt

          python3 << 'EOF'
          import re, json

          with open('work/vbmeta_info.txt', 'r') as f:
              data = f.read()

          algorithm = re.search(r'Algorithm:\s*(\S+)', data).group(1)
          rollback = re.search(r'Rollback Index:\s*(\d+)', data).group(1)
          flags = re.search(r'Flags:\s*(\d+)', data).group(1)

          props = []
          for m in re.finditer(r'Prop:\s+(\S+)\s+->\s+\'(.*)\'', data):
              props.append((m.group(1), m.group(2)))

          chain = None
          cm = re.search(r'Chain Partition descriptor:.*?Partition Name:\s+(\S+).*?Rollback Index Location:\s+(\d+).*?Public key \(sha1\):\s+(\S+)', data, re.DOTALL)
          if cm:
              chain = (cm.group(1), cm.group(2), cm.group(3))

          boot_salt = re.search(r'(?s)Hash descriptor:.*?Partition Name:\s+boot\b.*?Salt:\s+(\S+)', data).group(1)

          with open('work/params.json', 'w') as f:
              json.dump({
                  'algorithm': algorithm,
                  'rollback': rollback,
                  'flags': flags,
                  'props': props,
                  'chain': chain,
                  'boot_salt': boot_salt
              }, f)
          EOF

      # ---- 新しい boot.img にハッシュフッターを追加 ----
      - name: Prepare new boot.img (hash footer only)
        run: |
          cp work/boot.img work/boot_new.img
          python2 /usr/local/bin/avbtool erase_footer --image work/boot_new.img 2>/dev/null || true
          BOOT_SALT=$(python3 -c "import json; print(json.load(open('work/params.json'))['boot_salt'])")
          # パーティションサイズは元の vbmeta の値を使用（もしくは boot.img のファイルサイズ）
          # ここでは boot.img のファイルサイズを使用（Magisk でサイズが変わっても対応）
          BOOT_PARTITION_SIZE=$(stat -c%s work/boot_new.img)
          python2 /usr/local/bin/avbtool add_hash_footer \
            --image work/boot_new.img \
            --partition_name boot \
            --partition_size $BOOT_PARTITION_SIZE \
            --hash_algorithm sha256 \
            --salt $BOOT_SALT \
            --algorithm NONE

      # ---- vbmeta を再構築（vbmeta.img は使わず、各パーティション個別に指定） ----
      - name: Build vbmeta
        run: |
          python3 << 'EOF'
          import json, subprocess

          with open('work/params.json', 'r') as f:
              p = json.load(f)

          cmd = [
              'python2', '/usr/local/bin/avbtool', 'make_vbmeta_image',
              '--output', 'work/vbmeta_new.img',
              '--key', 'keys/vbmeta.pem',
              '--algorithm', p['algorithm'],
              '--rollback_index', p['rollback'],
              '--flags', p['flags']
          ]

          # チェーン
          if p['chain']:
              cmd.extend(['--chain_partition', '{}:{}:{}'.format(p['chain'][0], p['chain'][1], p['chain'][2])])

          # プロパティ（Android 11 の avbtool は --property をサポートしているはず）
          for key, value in p['props']:
              cmd.extend(['--property', '{}:{}'.format(key, value)])

          # 各パーティションの記述子を取り込む（vbmeta.img は使わない）
          for img in ['dtbo.img', 'vendor_boot.img', 'odm.img', 'vendor.img', 'boot_new.img']:
              cmd.extend(['--include_descriptors_from_image', 'work/{}'.format(img)])

          subprocess.check_call(cmd)
          print("vbmeta_new.img generated.")
          EOF

      - name: Show signed vbmeta info
        run: |
          echo "=== Signed vbmeta_new.img ==="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_new.img

      - name: Create output ZIP
        run: |
          mkdir -p out
          cp work/boot_new.img out/boot.img
          cp work/vbmeta_new.img out/vbmeta.img
          cd out
          zip ${{ github.event.inputs.output_zip }} boot.img vbmeta.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-images
          path: out/${{ github.event.inputs.output_zip }}
          if-no-files-found: error
