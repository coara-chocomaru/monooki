name: Resign vbmeta with exact structure (avbtool 1.1.0)

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: '新しい boot.img のダウンロードURL'
        required: true
        type: string
      vbmeta_img_url:
        description: '元の vbmeta.img のダウンロードURL'
        required: true
        type: string
      output_zip:
        description: '出力ZIPファイル名'
        required: false
        default: 'resigned_images.zip'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 環境準備 ----------
      - name: Install Python 2.7 and tools
        run: |
          sudo apt update
          sudo apt install -y python2 wget git openssl

      - name: Clone avbtool 1.1.0 from AOSP
        run: |
          git clone --depth 1 --branch android-9.0.0_r34 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      # ---------- 入力ファイルのダウンロード ----------
      - name: Download boot.img and vbmeta.img
        run: |
          mkdir -p work
          wget -q -O work/boot.img "${{ github.event.inputs.boot_img_url }}"
          wget -q -O work/vbmeta.img "${{ github.event.inputs.vbmeta_img_url }}"


      # ---------- 新しい boot.img のフッターをクリーン ----------
      - name: Erase existing footer from new boot.img
        run: |
          cp work/boot.img work/boot_clean.img
          python2 /usr/local/bin/avbtool erase_footer --image work/boot_clean.img || true

      # ---------- 新しい boot.img にハッシュフッターを追加（プロパティなし） ----------
      - name: Add hash footer to new boot.img
        run: |
          python2 /usr/local/bin/avbtool add_hash_footer \
            --image work/boot_clean.img \
            --partition_name boot \
            --partition_size 100663296 \
            --hash_algorithm sha256 \
            --salt 07b334c6199b399511f08ea05c0ea1b37fcac0a226bf82e2a2284e0d7adcd16b \
            --algorithm NONE \
            --prop com.android.build.boot.fingerprint:'Rakuten/P780/P780:11/RKQ1.210715.001/263:user/release-keys' \
            --prop com.android.build.boot.os_version:'11' \
            --prop com.android.build.boot.security_patch:'2023-12-01' \
            --prop com.android.build.boot.security_patch:'2023-12-01'
          mv work/boot_clean.img work/boot_new.img

      # ---------- 構造確認 ----------
      - name: Verify boot_new.img structure
        run: |
          echo "=== boot_new.img の情報 ==="
          python2 /usr/local/bin/avbtool info_image --image work/boot_new.img

      # ---------- vbmeta を再構築（全記述子を保持し、boot だけ更新） ----------
      - name: Build signed vbmeta
        run: |
          python2 /usr/local/bin/avbtool make_vbmeta_image \
            --include_descriptors_from_image work/vbmeta.img \
            --include_descriptors_from_image work/boot_new.img \
            --key keys/vbmeta.pem \
            --algorithm SHA256_RSA4096 \
            --rollback_index 0 \
            --flags 0 \
            --output work/vbmeta_signed.img

      # ---------- 生成後の検証 ----------
      - name: Show signed vbmeta info
        run: |
          echo "=== 署名済み vbmeta_signed.img の情報 ==="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_signed.img

      # ---------- ZIP 出力 ----------
      - name: Create output ZIP
        run: |
          cp work/boot_new.img work/boot.img
          cd work
          zip ${{ github.event.inputs.output_zip }} boot.img vbmeta_signed.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-images
          path: work/${{ github.event.inputs.output_zip }}
          if-no-files-found: error
