name: Fast resign vbmeta (boot only) with avbtool 1.1.0

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'URL to download the NEW boot.img'
        required: true
        type: string
      original_vbmeta_url:
        description: 'URL to download the ORIGINAL vbmeta.img'
        required: true
        type: string
      output_name:
        description: 'Name of the output vbmeta image'
        required: false
        default: 'vbmeta_signed.img'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository (to get keys/vbmeta.pem)
        uses: actions/checkout@v4

      # ---- Python 2.7 のインストール ----
      - name: Install Python 2.7
        run: |
          sudo apt update
          sudo apt install -y python2 python2-dev wget git
          # pip2 のインストール（必要に応じて）
          curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
          sudo python2 get-pip.py
          python2 --version

      # ---- avbtool 1.1.0 を git clone で取得（確実） ----
      - name: Clone avbtool 1.1.0 from AOSP tag
        run: |
          git clone --depth 1 --branch avb-1.1.0 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool
          # 動作確認（Python 2 で実行）
          python2 /usr/local/bin/avbtool --version

      - name: Download boot.img and original vbmeta.img
        run: |
          mkdir -p work
          wget -q -O work/boot.img "${{ github.event.inputs.boot_img_url }}"
          wget -q -O work/vbmeta.img "${{ github.event.inputs.original_vbmeta_url }}"

      # ---- 元の vbmeta から全記述子を抽出 ----
      - name: Extract all descriptors from original vbmeta
        run: |
          python2 /usr/local/bin/avbtool info_image \
            --image work/vbmeta.img \
            --output_descriptor_path work/descriptors_all.txt

      # ---- boot の Salt を自動抽出（フォールバック付き） ----
      - name: Extract boot salt from original vbmeta
        id: extract_salt
        run: |
          SALT=$(python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img | \
                 awk '/Hash descriptor:/{flag=1} flag && /Partition Name:        boot/{flag2=1} flag2 && /Salt:/{print $2; exit}')
          if [ -z "$SALT" ]; then
            echo "Failed to extract boot salt. Using fallback salt."
            SALT="07b334c6199b399511f08ea05c0ea1b37fcac0a226bf82e2a2284e0d7adcd16b"
          fi
          echo "BOOT_SALT=$SALT" >> $GITHUB_ENV
          echo "Extracted boot salt: $SALT"

      # ---- 記述子から boot のハッシュ記述子を除去 ----
      - name: Remove boot hash descriptor
        run: |
          python2 -c "
          import re
          with open('work/descriptors_all.txt', 'r') as f:
              data = f.read()
          blocks = re.split(r'(?=^    (?:Hash|Hashtree|Chain|Prop) descriptor:)', data, flags=re.MULTILINE)
          filtered = [b for b in blocks if not re.search(r'Partition Name:\s+boot', b)]
          with open('work/descriptors_filtered.txt', 'w') as f:
              f.write(''.join(filtered))
          "

      # ---- 新しい vbmeta を再構成（boot のみ更新） ----
      - name: Resign vbmeta with new boot.img
        run: |
          python2 /usr/local/bin/avbtool make_vbmeta_image \
            --include_descriptors_from_image work/descriptors_filtered.txt \
            --algorithm SHA256_RSA4096 \
            --key keys/vbmeta.pem \
            --rollback_index 0 \
            --rollback_index_location 0 \
            --flags 0 \
            --release_string 'avbtool 1.1.0' \
            --calc_hash_image work/boot.img \
              --hash_algorithm sha256 \
              --partition_name boot \
              --salt "${{ env.BOOT_SALT }}" \
            --output work/${{ github.event.inputs.output_name }}

      # ---- 生成された vbmeta の情報を表示（検証） ----
      - name: Show signed vbmeta info
        run: |
          python2 /usr/local/bin/avbtool info_image --image work/${{ github.event.inputs.output_name }}

      # ---- アーティファクトとしてアップロード ----
      - name: Upload signed vbmeta
        uses: actions/upload-artifact@v4
        with:
          name: signed-vbmeta
          path: work/${{ github.event.inputs.output_name }}
          if-no-files-found: error
