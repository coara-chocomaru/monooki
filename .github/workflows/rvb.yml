name: Resign vbmeta with new boot.img

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'URL to download boot.img'
        required: true
        type: string
      vbmeta_url:
        description: 'URL to download original vbmeta.img'
        required: true
        type: string
      output_name:
        description: 'Output filename for signed vbmeta'
        required: false
        default: 'vbmeta_signed.img'
        type: string

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for keys/vbmeta.pem)
        uses: actions/checkout@v4

      # --- 新增：从源码编译 Python 2.7 ---
      - name: Install Python 2.7 from source
        run: |
          sudo apt update
          sudo apt install -y build-essential checkinstall libncurses-dev libssl-dev \
            libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev \
            libreadline-dev libdb-dev wget
          cd /usr/src
          sudo wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          sudo tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          sudo ./configure --prefix=/usr/local/python2.7
          sudo make
          sudo make install
          sudo ln -s /usr/local/python2.7/bin/python2.7 /usr/local/bin/python2
      # ----------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get install -y wget

      - name: Install avbtool 1.1.0 from AOSP tag
        run: |
          wget -q https://android.googlesource.com/platform/external/avb/+archive/refs/tags/avb-1.1.0.tar.gz -O - | tar xzf - avbtool
          chmod +x avbtool
          sudo mv avbtool /usr/local/bin/
          # 使用 python2 验证版本
          python2 /usr/local/bin/avbtool --version

      - name: Create working directory
        run: mkdir -p work

      - name: Download boot.img
        run: wget -q -O work/boot.img "${{ github.event.inputs.boot_url }}"

      - name: Download original vbmeta.img
        run: wget -q -O work/vbmeta.img "${{ github.event.inputs.vbmeta_url }}"

      - name: Extract all descriptors from original vbmeta
        run: |
          python2 /usr/local/bin/avbtool info_image \
            --image work/vbmeta.img \
            --output_descriptor_path work/descriptors.txt

      - name: Resign vbmeta with new boot.img
        run: |
          python2 /usr/local/bin/avbtool make_vbmeta_image \
            --include_descriptors_from_image work/descriptors.txt \
            --algorithm SHA256_RSA4096 \
            --key keys/vbmeta.pem \
            --rollback_index 0 \
            --rollback_index_location 0 \
            --flags 0 \
            --release_string 'avbtool 1.1.0' \
            --calc_hash_image work/boot.img \
              --hash_algorithm sha256 \
              --partition_name boot \
              --salt 07b334c6199b399511f08ea05c0ea1b37fcac0a226bf82e2a2284e0d7adcd16b \
            --output work/${{ github.event.inputs.output_name }}

      - name: Upload signed vbmeta as artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-vbmeta
          path: work/${{ github.event.inputs.output_name }}
          if-no-files-found: error
