name: Resign vbmeta with new boot (simple)

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'URL to download the NEW boot.img'
        required: true
        type: string
      original_vbmeta_url:
        description: 'URL to download the ORIGINAL vbmeta.img'
        required: true
        type: string
      output_name:
        description: 'Output vbmeta filename'
        required: false
        default: 'vbmeta_signed.img'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (for keys/vbmeta.pem)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget python3

      # ---- 最新の avbtool をインストール（Python 3 対応） ----
      - name: Install avbtool from AOSP main
        run: |
          wget -q https://android.googlesource.com/platform/external/avb/+archive/refs/heads/main.tar.gz -O - | tar xzf - avbtool.py
          chmod +x avbtool.py
          sudo mv avbtool.py /usr/local/bin/avbtool

      - name: Download images
        run: |
          mkdir work
          wget -q -O work/boot.img "${{ github.event.inputs.boot_img_url }}"
          wget -q -O work/vbmeta.img "${{ github.event.inputs.original_vbmeta_url }}"

      # ---- 元の vbmeta から boot の Salt を抽出 ----
      - name: Extract boot salt
        id: salt
        run: |
          SALT=$(avbtool info_image --image work/vbmeta.img | \
                 grep -A10 "Hash descriptor:" | \
                 grep -A5 "Partition Name:        boot" | \
                 grep "Salt:" | head -1 | awk '{print $2}')
          if [ -z "$SALT" ]; then
            echo "Salt extraction failed, using fallback"
            SALT="07b334c6199b399511f08ea05c0ea1b37fcac0a226bf82e2a2284e0d7adcd16b"
          fi
          echo "BOOT_SALT=$SALT" >> $GITHUB_ENV

      # ---- 再署名（たった 1 行のコマンド） ----
      - name: Resign vbmeta
        run: |
          avbtool make_vbmeta_image \
            --include_descriptors_from_image work/vbmeta.img \
            --calc_hash_image work/boot.img \
              --hash_algorithm sha256 \
              --partition_name boot \
              --salt "${{ env.BOOT_SALT }}" \
            --key keys/vbmeta.pem \
            --algorithm SHA256_RSA4096 \
            --rollback_index 0 \
            --flags 0 \
            --release_string 'avbtool 1.1.0' \
            --output work/${{ github.event.inputs.output_name }}

      - name: Verify signed vbmeta
        run: avbtool info_image --image work/${{ github.event.inputs.output_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-vbmeta
          path: work/${{ github.event.inputs.output_name }}
