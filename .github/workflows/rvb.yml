name: Resign vbmeta (exact structure, boot only updated)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '全イメージ (boot, dtbo, vendor_boot, odm, vendor, vbmeta) を含むZIPファイルのURL'
        required: true
        type: string
      output_zip:
        description: '出力ZIPファイル名'
        required: false
        default: 'resigned_images.zip'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Python 2.7 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git unzip zip openssl libssl-dev zlib1g-dev
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations
          make -j$(nproc)
          sudo make altinstall
          cd ..
          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python2

      - name: Clone avbtool from android-11.0.0_r39
        run: |
          git clone --depth 1 --branch android-11.0.0_r39 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      - name: Download and extract ZIP
        run: |
          mkdir -p work
          wget -q -O work/images.zip "${{ github.event.inputs.zip_url }}"
          cd work
          unzip -q images.zip
          ls -la *.img

      - name: Extract all descriptor info from original vbmeta
        id: parse
        run: |
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img > work/vbmeta_info.txt

          python3 << 'EOF'
          import re, json, subprocess

          with open('work/vbmeta_info.txt', 'r') as f:
              data = f.read()

          # Global
          algorithm = re.search(r'Algorithm:\s*(\S+)', data).group(1)
          rollback = re.search(r'Rollback Index:\s*(\d+)', data).group(1)
          flags = re.search(r'Flags:\s*(\d+)', data).group(1)

          # Props
          props = []
          for m in re.finditer(r'Prop:\s+(\S+)\s+->\s+\'(.*)\'', data):
              props.append((m.group(1), m.group(2)))

          # Chain
          chain = None
          cm = re.search(r'Chain Partition descriptor:.*?Partition Name:\s+(\S+).*?Rollback Index Location:\s+(\d+).*?Public key \(sha1\):\s+(\S+)', data, re.DOTALL)
          if cm:
              chain = (cm.group(1), cm.group(2), cm.group(3))

          # Hash descriptors (except boot)
          hash_descs = []
          blocks = re.split(r'(?=^    Hash descriptor:)', data, flags=re.MULTILINE)
          for block in blocks:
              if not block.startswith('    Hash descriptor:'):
                  continue
              if 'Partition Name:        boot' in block:
                  continue
              algo = re.search(r'Hash Algorithm:\s+(\S+)', block).group(1)
              name = re.search(r'Partition Name:\s+(\S+)', block).group(1)
              size = re.search(r'Image Size:\s+(\d+)', block).group(1)
              salt = re.search(r'Salt:\s+(\S+)', block).group(1)
              digest = re.search(r'Digest:\s+(\S+)', block).group(1)
              fl = re.search(r'Flags:\s+(\d+)', block).group(1)
              hash_descs.append((algo, name, size, salt, digest, fl))

          # Hashtree descriptors (odm, vendor)
          hashtree_descs = []
          blocks = re.split(r'(?=^    Hashtree descriptor:)', data, flags=re.MULTILINE)
          for block in blocks:
              if not block.startswith('    Hashtree descriptor:'):
                  continue
              name = re.search(r'Partition Name:\s+(\S+)', block).group(1)
              size = re.search(r'Image Size:\s+(\d+)', block).group(1)
              hashtree_algo = re.search(r'Hash Algorithm:\s+(\S+)', block).group(1)
              salt = re.search(r'Salt:\s+(\S+)', block).group(1)
              root = re.search(r'Root Digest:\s+(\S+)', block).group(1)
              fl = re.search(r'Flags:\s+(\d+)', block).group(1)
              hashtree_descs.append((name, size, hashtree_algo, salt, root, fl))

          # Boot salt
          boot_salt = re.search(r'(?s)Hash descriptor:.*?Partition Name:\s+boot\b.*?Salt:\s+(\S+)', data).group(1)

          # Write JSON
          with open('work/params.json', 'w') as f:
              json.dump({
                  'algorithm': algorithm,
                  'rollback': rollback,
                  'flags': flags,
                  'props': props,
                  'chain': chain,
                  'hash_descs': hash_descs,
                  'hashtree_descs': hashtree_descs,
                  'boot_salt': boot_salt
              }, f)
          EOF

      - name: Calculate new boot size and digest
        run: |
          BOOT_SIZE=$(stat -c%s work/boot.img)
          BOOT_DIGEST=$(sha256sum work/boot.img | awk '{print $1}')
          echo "BOOT_SIZE=$BOOT_SIZE" >> $GITHUB_ENV
          echo "BOOT_DIGEST=$BOOT_DIGEST" >> $GITHUB_ENV

      - name: Build vbmeta with exact structure
        run: |
          python3 << 'EOF'
          import json, subprocess, os

          with open('work/params.json', 'r') as f:
              p = json.load(f)

          cmd = [
              'python2', '/usr/local/bin/avbtool', 'make_vbmeta_image',
              '--output', 'work/vbmeta_new.img',
              '--key', 'keys/vbmeta.pem',
              '--algorithm', p['algorithm'],
              '--rollback_index', p['rollback'],
              '--flags', p['flags']
          ]

          if p['chain']:
              cmd.extend(['--chain_partition', '{}:{}:{}'.format(p['chain'][0], p['chain'][1], p['chain'][2])])

          for key, value in p['props']:
              cmd.extend(['--property', '{}:{}'.format(key, value)])

          for algo, name, size, salt, digest, fl in p['hash_descs']:
              cmd.extend(['--hash', algo, name, size, salt, digest, fl])

          for name, size, algo, salt, root, fl in p['hashtree_descs']:
              cmd.extend(['--hashtree', name, size, algo, salt, root, fl])

          # New boot descriptor
          boot_salt = p['boot_salt']
          boot_size = os.environ['BOOT_SIZE']
          boot_digest = os.environ['BOOT_DIGEST']
          cmd.extend(['--hash', 'sha256', 'boot', boot_size, boot_salt, boot_digest, '0'])

          subprocess.check_call(cmd)
          print("vbmeta_new.img generated.")
          EOF

      - name: Show signed vbmeta info
        run: |
          echo "=== Signed vbmeta_new.img ==="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_new.img

      - name: Create output ZIP
        run: |
          mkdir -p out
          cp work/boot.img out/boot.img
          cp work/vbmeta_new.img out/vbmeta.img
          cd out
          zip ${{ github.event.inputs.output_zip }} boot.img vbmeta.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-images
          path: out/${{ github.event.inputs.output_zip }}
          if-no-files-found: error
