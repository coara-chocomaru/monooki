name: Resign vbmeta with new boot (fast)

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'URL to download the NEW boot.img'
        required: true
        type: string
      original_vbmeta_url:
        description: 'URL to download the ORIGINAL vbmeta.img'
        required: true
        type: string
      output_name:
        description: 'Name of the output vbmeta image'
        required: false
        default: 'vbmeta_signed.img'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04   # 軽量で安定した環境
    permissions:
      contents: read

    steps:
      - name: Checkout repository (to get keys/vbmeta.pem)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip wget

      - name: Install avbtool (Python 3 compatible, from AOSP main)
        run: |
          wget -q https://android.googlesource.com/platform/external/avb/+archive/refs/heads/main.tar.gz -O - | tar xzf - avbtool
          chmod +x avbtool
          sudo mv avbtool /usr/local/bin/
          avbtool --version

      - name: Download boot.img and original vbmeta.img
        run: |
          mkdir work
          wget -q -O work/boot.img "${{ github.event.inputs.boot_img_url }}"
          wget -q -O work/vbmeta.img "${{ github.event.inputs.original_vbmeta_url }}"

      - name: Extract all descriptors from original vbmeta
        run: |
          avbtool info_image --image work/vbmeta.img --output_descriptor_path work/descriptors_all.txt

      - name: Extract boot partition salt from original vbmeta
        id: extract_boot_salt
        run: |
          salt=$(avbtool info_image --image work/vbmeta.img | \
                 awk '/Hash descriptor:/{flag=1} flag && /Partition Name:        boot/{flag2=1} flag2 && /Salt:/{print $2; exit}')
          echo "BOOT_SALT=${salt}" >> $GITHUB_ENV
          echo "Extracted boot salt: ${salt}"

      - name: Remove boot hash descriptor from extracted descriptors
        run: |
          # Python script to filter out the boot hash descriptor block
          python3 -c "
          import sys, re
          with open('work/descriptors_all.txt', 'r') as f:
              data = f.read()
          # Split into descriptor blocks (each starts with indentation and a type)
          blocks = re.split(r'(?=^    (?:Hash|Hashtree|Chain|Prop) descriptor:)', data, flags=re.MULTILINE)
          # Keep blocks that do NOT contain 'Partition Name:        boot'
          filtered = [b for b in blocks if not re.search(r'Partition Name:\s+boot', b)]
          with open('work/descriptors_filtered.txt', 'w') as f:
              f.write(''.join(filtered))
          "

      - name: Resign vbmeta with new boot.img and test-key
        run: |
          avbtool make_vbmeta_image \
            --include_descriptors_from_image work/descriptors_filtered.txt \
            --algorithm SHA256_RSA4096 \
            --key keys/vbmeta.pem \
            --rollback_index 0 \
            --rollback_index_location 0 \
            --flags 0 \
            --release_string 'avbtool 1.1.0' \
            --calc_hash_image work/boot.img \
              --hash_algorithm sha256 \
              --partition_name boot \
              --salt "${{ env.BOOT_SALT }}" \
            --output work/${{ github.event.inputs.output_name }}

      - name: Show info of signed vbmeta (for verification)
        run: |
          avbtool info_image --image work/${{ github.event.inputs.output_name }}

      - name: Upload signed vbmeta
        uses: actions/upload-artifact@v4
        with:
          name: signed-vbmeta
          path: work/${{ github.event.inputs.output_name }}
          if-no-files-found: error
