name: Resign vbmeta (AOSP official way)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '全イメージ (boot, dtbo, vendor_boot, odm, vendor, vbmeta) を含むZIPファイルのURL'
        required: true
        type: string
      output_zip:
        description: '出力ZIPファイル名'
        required: false
        default: 'resigned_images.zip'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 2 and tools
        run: |
          sudo apt update
          sudo apt install -y python2 python2-dev wget git unzip openssl

      - name: Clone avbtool from android-10.0.0_r47
        run: |
          git clone --depth 1 --branch android-10.0.0_r47 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      - name: Download and extract ZIP
        run: |
          mkdir -p work
          wget -q -O work/images.zip "${{ github.event.inputs.zip_url }}"
          cd work
          unzip -q images.zip
          ls -la *.img

      - name: Extract all needed parameters
        id: parse
        run: |
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img > work/vbmeta_info.txt

          python3 << 'EOF'
          import re, json, subprocess, os

          with open('work/vbmeta_info.txt', 'r') as f:
              data = f.read()

          algorithm = re.search(r'Algorithm:\s*(\S+)', data).group(1)
          rollback = re.search(r'Rollback Index:\s*(\d+)', data).group(1)
          flags = re.search(r'Flags:\s*(\d+)', data).group(1)

          props = []
          for m in re.finditer(r'Prop:\s+(\S+)\s+->\s+\'(.*)\'', data):
              props.append((m.group(1), m.group(2)))

          chain = None
          cm = re.search(r'Chain Partition descriptor:.*?Partition Name:\s+(\S+).*?Rollback Index Location:\s+(\d+).*?Public key \(sha1\):\s+(\S+)', data, re.DOTALL)
          if cm:
              chain = (cm.group(1), cm.group(2), cm.group(3))

          boot_block = re.search(r'(?s)Hash descriptor:.*?Partition Name:\s+boot.*?Salt:\s+(\S+)', data)
          boot_salt = boot_block.group(1) if boot_block else '07b334c6199b399511f08ea05c0ea1b37fcac0a226bf82e2a2284e0d7adcd16b'
          boot_size = re.search(r'(?s)Hash descriptor:.*?Partition Name:\s+boot.*?Image Size:\s+(\d+)', data)
          boot_size = boot_size.group(1) if boot_size else '51699712'

          with open('work/params.json', 'w') as f:
              json.dump({
                  'algorithm': algorithm,
                  'rollback': rollback,
                  'flags': flags,
                  'props': props,
                  'chain': chain,
                  'boot_salt': boot_salt,
                  'boot_size': boot_size
              }, f)
          EOF

      - name: Prepare new boot.img (hash footer only, no props)
        run: |
          BOOT_SALT=$(python3 -c "import json; print(json.load(open('work/params.json'))['boot_salt'])")
          cp work/boot.img work/boot_clean.img
          python2 /usr/local/bin/avbtool erase_footer --image work/boot_clean.img 2>/dev/null || true
          BOOT_SIZE=$(python3 -c "import json; print(json.load(open('work/params.json'))['boot_size'])")
          # Use the actual size of the patched boot (for partition size, use the partition size from original? 
          # Actually we need to use the original partition size for the footer, because avbtool add_hash_footer requires partition_size.
          # We should use the ORIGINAL partition size (boot_size from vbmeta), not the file size.
          # But if the patched boot is larger than original, it might overflow; we'll use the file size instead.
          # Since we are not going to flash this boot directly? Actually we will, so we need to match partition size.
          # Better: use the file size as partition size.
          FILE_SIZE=$(stat -c%s work/boot_clean.img)
          python2 /usr/local/bin/avbtool add_hash_footer \
            --image work/boot_clean.img \
            --partition_name boot \
            --partition_size $BOOT_SIZE\
            --hash_algorithm sha256 \
            --salt $BOOT_SALT \
            --algorithm NONE
          mv work/boot_clean.img work/boot_new.img

      - name: Build vbmeta (exact structure, props explicitly added)
        run: |
          python3 << 'EOF'
          import json, subprocess

          with open('work/params.json', 'r') as f:
              p = json.load(f)

          cmd = [
              'python2', '/usr/local/bin/avbtool', 'make_vbmeta_image',
              '--output', 'work/vbmeta_signed.img',
              '--key', 'keys/vbmeta.pem',
              '--algorithm', p['algorithm'],
              '--rollback_index', p['rollback'],
              '--flags', p['flags']
          ]

          # Chain partition
          if p['chain']:
              cmd.extend(['--chain_partition', f"{p['chain'][0]}:{p['chain'][1]}:{p['chain'][2]}"])

          # Props: add explicitly using --property
          for key, value in p['props']:
              cmd.extend(['--property', f"{key}:{value}"])

          # Include descriptors from all partition images (they have no props except boot? 
          # We are not including vbmeta.img, so no old boot, no duplication.
          # And we include boot_new.img which has only hash descriptor.
          for img in ['dtbo.img', 'vendor_boot.img', 'odm.img', 'vendor.img', 'boot_new.img']:
              cmd.extend(['--include_descriptors_from_image', f'work/{img}'])

          # Execute
          subprocess.check_call(cmd)
          print("vbmeta_signed.img generated.")
          EOF

      - name: Show signed vbmeta info
        run: |
          echo "=== Signed vbmeta_signed.img ==="
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta_signed.img

      - name: Create output ZIP
        run: |
          cd work
          zip ${{ github.event.inputs.output_zip }} boot.img vbmeta_signed.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-images
          path: work/${{ github.event.inputs.output_zip }}
          if-no-files-found: error
