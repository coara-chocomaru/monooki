name: Fast resign vbmeta (boot only) with avbtool 1.1.0

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'URL to download the NEW boot.img'
        required: true
        type: string
      original_vbmeta_url:
        description: 'URL to download the ORIGINAL vbmeta.img'
        required: true
        type: string
      output_name:
        description: 'Name of the output vbmeta image'
        required: false
        default: 'vbmeta_signed.img'
        type: string

jobs:
  resign:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository (to get keys/vbmeta.pem)
        uses: actions/checkout@v4

      - name: Install Python 2.7 and dependencies
        run: |
          sudo apt update
          sudo apt install -y python2 wget git

      - name: Clone avbtool from android-9.0.0_r34
        run: |
          git clone --depth 1 --branch android-9.0.0_r34 https://android.googlesource.com/platform/external/avb
          sudo cp avb/avbtool /usr/local/bin/
          sudo chmod +x /usr/local/bin/avbtool

      - name: Download boot.img and original vbmeta.img
        run: |
          mkdir -p work
          wget -q -O work/boot.img "${{ github.event.inputs.boot_img_url }}"
          wget -q -O work/vbmeta.img "${{ github.event.inputs.original_vbmeta_url }}"

      # ============================================================
      # 重要: info_image の出力を解析して記述子ファイルを生成
      # ============================================================
      - name: Extract descriptors from original vbmeta (via stdout parsing)
        run: |
          # info_image の出力全体を取得
          python2 /usr/local/bin/avbtool info_image --image work/vbmeta.img > work/vbmeta_info.txt

          # "Descriptors:" 以降の行を抽出して記述子ファイルを作成
          sed -n '/^Descriptors:/,$p' work/vbmeta_info.txt > work/descriptors_all.txt

          echo "=== Extracted descriptors (first 20 lines) ==="
          head -20 work/descriptors_all.txt

      - name: Extract boot salt from original vbmeta
        id: extract_salt
        run: |
          SALT=$(grep -A10 "Hash descriptor:" work/vbmeta_info.txt | \
                 grep -A5 "Partition Name:        boot" | \
                 grep "Salt:" | head -1 | awk '{print $2}')
          if [ -z "$SALT" ]; then
            echo "Failed to extract boot salt. Using fallback salt."
            SALT="07b334c6199b399511f08ea05c0ea1b37fcac0a226bf82e2a2284e0d7adcd16b"
          fi
          echo "BOOT_SALT=$SALT" >> $GITHUB_ENV
          echo "Extracted boot salt: $SALT"

      # ============================================================
      # 重要: boot の記述子ブロックを除去（sed で範囲削除）
      # ============================================================
      - name: Remove boot hash descriptor from descriptors file
        run: |
          # boot の Hash descriptor ブロックを特定して削除
          # パターン: "Hash descriptor:" から次の "    Hash descriptor:" または
          # "    Hashtree descriptor:" または "    Chain Partition" または
          # "    Prop:" までの間を削除（ただし Partition Name: boot を含むものだけ）
          python2 -c "
          import re
          with open('work/descriptors_all.txt', 'r') as f:
              data = f.read()

          # 各記述子ブロックに分割（インデント + タイプで始まる）
          blocks = re.split(r'(?=^    (?:Hash|Hashtree|Chain|Prop) descriptor:)', data, flags=re.MULTILINE)

          # boot の Hash descriptor を除外
          filtered = []
          for block in blocks:
              # 'Partition Name:        boot' を含む Hash descriptor をスキップ
              if re.search(r'^    Hash descriptor:', block, re.MULTILINE) and re.search(r'Partition Name:\s+boot', block):
                  print('Removing boot hash descriptor block')
                  continue
              filtered.append(block)

          with open('work/descriptors_filtered.txt', 'w') as f:
              f.write(''.join(filtered))
          "

          echo "=== Filtered descriptors (first 20 lines) ==="
          head -20 work/descriptors_filtered.txt

      # ============================================================
      # 重要: --include_descriptors_from_image で記述子ファイルを指定
      # ============================================================
      - name: Resign vbmeta with new boot.img
        run: |
          python2 /usr/local/bin/avbtool make_vbmeta_image \
            --include_descriptors_from_image work/descriptors_filtered.txt \
            --algorithm SHA256_RSA4096 \
            --key keys/vbmeta.pem \
            --rollback_index 0 \
            --rollback_index_location 0 \
            --flags 0 \
            --release_string 'avbtool 1.1.0' \
            --calc_hash_image work/boot.img \
              --hash_algorithm sha256 \
              --partition_name boot \
              --salt "${{ env.BOOT_SALT }}" \
            --output work/${{ github.event.inputs.output_name }}

      - name: Show signed vbmeta info
        run: |
          python2 /usr/local/bin/avbtool info_image --image work/${{ github.event.inputs.output_name }}

      - name: Upload signed vbmeta
        uses: actions/upload-artifact@v4
        with:
          name: signed-vbmeta
          path: work/${{ github.event.inputs.output_name }}
          if-no-files-found: error
