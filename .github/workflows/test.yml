name: NVRAM Analyze & MAC Rewrite (MTK MT8168/MT8365 Android9)

on:
  workflow_dispatch:
    inputs:
      nvram_path:
        description: "nvram.img のパス (repo内の相対パス)"
        required: false
        default: "nvram.img"
      dry_run:
        description: "Dry-run モード (true=書き換えなし、解析のみ)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      wifi_mac:
        description: "WiFi MAC アドレス (空欄=ランダム生成) 例: AA:BB:CC:DD:EE:FF"
        required: false
        default: ""
      bt_mac:
        description: "BT MAC アドレス (空欄=ランダム生成) 例: AA:BB:CC:DD:EE:FF"
        required: false
        default: ""
  push:
    paths:
      - "nvram.img"
      - "nvram/**/*.img"

permissions:
  contents: write

jobs:
  nvram_analyze_rewrite:
    name: "NVRAM 解析 & MAC 書き換え"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate NVRAM analyzer script
        run: |
          cat > nvram_tool.py << 'PYTHON_EOF'
          #!/usr/bin/env python3
          import sys, os, struct, random, json, datetime, hashlib, shutil, argparse

          class C:
              RESET  = "\033[0m";  BOLD   = "\033[1m"
              GREEN  = "\033[92m"; YELLOW = "\033[93m"
              CYAN   = "\033[96m"; BLUE   = "\033[94m"
              RED    = "\033[91m"

          def h(s):    return C.BOLD + C.CYAN   + s + C.RESET
          def ok(s):   return C.GREEN  + "✔ "  + s + C.RESET
          def warn(s): return C.YELLOW + "⚠ "  + s + C.RESET
          def info(s): return C.BLUE   + "  "  + s + C.RESET

          KNOWN_LIDS = {
              0x0001: {"name": "WIFI_CFG",  "desc": "WiFi 設定 / MAC アドレス"},
              0x0002: {"name": "BT_CFG",    "desc": "Bluetooth 設定 / MAC アドレス"},
              0x0003: {"name": "ETH_CFG",   "desc": "Ethernet 設定 / MAC アドレス"},
              0x0004: {"name": "MODEM_CFG", "desc": "モデム設定"},
              0x0010: {"name": "RF_CAL",    "desc": "RF キャリブレーションデータ"},
              0x0020: {"name": "FACTORY",   "desc": "工場出荷設定"},
              0x0030: {"name": "SYS_PARAM", "desc": "システムパラメータ"},
              0x00A0: {"name": "AUDIO_CAL", "desc": "オーディオキャリブレーション"},
              0x00B0: {"name": "CAM_CAL",   "desc": "カメラキャリブレーション"},
          }

          WIFI_MAC_OFFSET_IN_LID  = 0x04
          BT_MAC_OFFSET_IN_LID    = 0x00
          MT8168_WIFI_MAC_OFFSETS = [0x3C, 0x44, 0x80, 0x100, 0x104]
          MT8168_BT_MAC_OFFSETS   = [0x00, 0x06, 0x10, 0x80]

          def mac_bytes_to_str(b):
              return ":".join(f"{x:02X}" for x in b)

          def mac_str_to_bytes(s):
              return bytes(int(x, 16) for x in s.strip().split(":"))

          def is_valid_mac(b):
              if len(b) != 6:    return False
              if b == bytes(6):  return False
              if b == b'\xff'*6: return False
              return True

          def random_mac(locally_administered=True):
              mac = [random.randint(0x00, 0xFF) for _ in range(6)]
              if locally_administered:
                  mac[0] = (mac[0] | 0x02) & 0xFE
              else:
                  mac[0] = mac[0] & 0xFC
              return bytes(mac)

          def hex_dump(data, offset=0, width=16):
              lines = []
              for i in range(0, len(data), width):
                  chunk = data[i:i+width]
                  hex_part   = " ".join(f"{b:02X}" for b in chunk)
                  ascii_part = "".join(chr(b) if 0x20<=b<0x7F else "." for b in chunk)
                  lines.append(f"  {offset+i:08X}  {hex_part:<{width*3}}  |{ascii_part}|")
              return "\n".join(lines)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          class NVRAMAnalyzer:
              def __init__(self, path):
                  self.path  = path
                  self.data  = bytearray(open(path, "rb").read())
                  self.size  = len(self.data)
                  self.log   = []
                  self.found = {"wifi": [], "bt": [], "eth": [], "unknown": []}
                  self.lids  = []

              def _log(self, msg, raw=None):
                  ts = datetime.datetime.now().strftime("%H:%M:%S.%f")[:-3]
                  self.log.append(f"[{ts}] {msg}")
                  print(raw if raw is not None else f"[{ts}] {msg}")

              def analyze_header(self):
                  self._log("=" * 64, h("=" * 64))
                  self._log(f"NVRAM ファイル : {self.path}")
                  self._log(f"ファイルサイズ : {self.size} bytes ({self.size/1024:.1f} KB)")
                  self._log(f"SHA-256        : {sha256(self.data)}")
                  self._log("=" * 64, h("=" * 64))

                  magic_hits = []
                  for magic in [b"NVRAM", b"CALI", b"WIFI", b"\x4E\x56\x4D\x4C"]:
                      pos = 0
                      while True:
                          idx = self.data.find(magic, pos)
                          if idx == -1: break
                          magic_hits.append((idx, magic))
                          pos = idx + 1

                  self._log(f"\nマジックバイト検出 : {len(magic_hits)} 箇所")
                  for off, mg in sorted(magic_hits)[:20]:
                      self._log(f"  offset 0x{off:08X} ({off:>8d}) : {mg!r}")

                  return magic_hits

              def scan_lids(self):
                  self._log("\n" + "─" * 64, info("─" * 60 + " LID スキャン"))

                  found_lids = []
                  for offset in range(0, min(self.size - 8, 0x10000), 8):
                      lid, rec_num, rec_size, seq = struct.unpack_from("<HHHH", self.data, offset)
                      if lid == 0 or lid == 0xFFFF:          continue
                      if rec_size == 0 or rec_size > 0x4000: continue
                      if rec_num  == 0 or rec_num  > 0x100:  continue
                      total = rec_num * rec_size
                      if offset + 8 + total > self.size:     continue
                      name = KNOWN_LIDS.get(lid, {}).get("name", f"LID_{lid:04X}")
                      desc = KNOWN_LIDS.get(lid, {}).get("desc", "不明")
                      found_lids.append({
                          "offset": offset, "lid": lid, "name": name, "desc": desc,
                          "rec_num": rec_num, "rec_size": rec_size,
                          "data_offset": offset + 8, "total_bytes": total,
                      })

                  self.lids = found_lids
                  if found_lids:
                      self._log(f"LID エントリ検出 : {len(found_lids)} 個")
                      for e in found_lids:
                          self._log(
                              f"  LID 0x{e['lid']:04X} [{e['name']:12s}] "
                              f"offset=0x{e['offset']:08X} "
                              f"rec={e['rec_num']}x{e['rec_size']}B "
                              f"({e['desc']})"
                          )
                  else:
                      self._log(warn("LID テーブルが見つかりません。パターンスキャンに切り替えます。"))

                  return found_lids

              def find_mac_in_lid(self):
                  for lid_entry in self.lids:
                      lid  = lid_entry["lid"]
                      doff = lid_entry["data_offset"]
                      dsz  = lid_entry["total_bytes"]
                      blk  = self.data[doff:doff + dsz]

                      if lid == 0x0001:
                          for mac_off in MT8168_WIFI_MAC_OFFSETS + [WIFI_MAC_OFFSET_IN_LID]:
                              if mac_off + 6 <= len(blk):
                                  candidate = bytes(blk[mac_off:mac_off+6])
                                  if is_valid_mac(candidate):
                                      self.found["wifi"].append({
                                          "abs_offset": doff + mac_off, "lid": lid,
                                          "lid_rel": mac_off,
                                          "mac": mac_bytes_to_str(candidate),
                                          "raw": candidate,
                                      })
                      elif lid == 0x0002:
                          for mac_off in MT8168_BT_MAC_OFFSETS + [BT_MAC_OFFSET_IN_LID]:
                              if mac_off + 6 <= len(blk):
                                  candidate = bytes(blk[mac_off:mac_off+6])
                                  if is_valid_mac(candidate):
                                      self.found["bt"].append({
                                          "abs_offset": doff + mac_off, "lid": lid,
                                          "lid_rel": mac_off,
                                          "mac": mac_bytes_to_str(candidate),
                                          "raw": candidate,
                                      })
                      elif lid == 0x0003:
                          if 6 <= len(blk):
                              candidate = bytes(blk[0:6])
                              if is_valid_mac(candidate):
                                  self.found["eth"].append({
                                      "abs_offset": doff, "lid": lid, "lid_rel": 0,
                                      "mac": mac_bytes_to_str(candidate),
                                      "raw": candidate,
                                  })

              def pattern_scan_macs(self):
                  self._log("\n" + "─" * 64, info("─" * 60 + " MAC パターンスキャン"))

                  already = set()
                  for lid_type in self.found.values():
                      for e in lid_type:
                          already.add(e["abs_offset"])

                  candidates = []
                  for off in range(0, self.size - 5):
                      b = self.data[off:off+6]
                      if not is_valid_mac(b): continue
                      if off in already:      continue
                      if b[0] & 0x01:         continue
                      candidates.append({"abs_offset": off, "mac": mac_bytes_to_str(b), "raw": bytes(b)})

                  deduped = []
                  prev = -100
                  for c in candidates:
                      if c["abs_offset"] - prev > 6:
                          deduped.append(c)
                      prev = c["abs_offset"]

                  self._log(f"MAC候補 (パターンスキャン) : {len(deduped)} 箇所")
                  for c in deduped[:50]:
                      self._log(f"  0x{c['abs_offset']:08X} : {c['mac']}")

                  if not self.found["wifi"] and deduped:
                      self.found["wifi"].append(deduped[0])
                      self._log(warn(f"WiFi MAC フォールバック: offset 0x{deduped[0]['abs_offset']:08X}"))
                  if not self.found["bt"] and len(deduped) > 1:
                      self.found["bt"].append(deduped[1])
                      self._log(warn(f"BT MAC フォールバック: offset 0x{deduped[1]['abs_offset']:08X}"))

                  self.found["unknown"] = deduped

              def dump_regions(self):
                  self._log("\n" + "─" * 64, info("─" * 60 + " 周辺ダンプ"))
                  for kind, entries in self.found.items():
                      if kind == "unknown": continue
                      for e in entries:
                          off = max(0, e["abs_offset"] - 16)
                          end = min(self.size, e["abs_offset"] + 32)
                          blk = self.data[off:end]
                          self._log(f"\n[{kind.upper()} MAC] offset=0x{e['abs_offset']:08X}  {e['mac']}")
                          self._log(hex_dump(blk, off))

              def rewrite_mac(self, kind, new_mac_bytes):
                  entries = self.found.get(kind, [])
                  if not entries:
                      self._log(warn(f"{kind.upper()} MAC エントリが見つかりません。スキップ。"))
                      return False
                  for e in entries:
                      off = e["abs_offset"]
                      old = mac_bytes_to_str(self.data[off:off+6])
                      self.data[off:off+6] = new_mac_bytes
                      self._log(ok(f"{kind.upper()} MAC 書き換え: {old} → {mac_bytes_to_str(new_mac_bytes)}  (offset 0x{off:08X})"))
                  return True

              def save(self, out_path):
                  with open(out_path, "wb") as f:
                      f.write(self.data)
                  self._log(ok(f"出力ファイル保存: {out_path}"))

              def save_log(self, log_path):
                  report = {
                      "timestamp":          datetime.datetime.utcnow().isoformat() + "Z",
                      "tool":               "MTK NVRAM Analyzer (MT8168/MT8365 Android9)",
                      "source_file":        self.path,
                      "source_size":        self.size,
                      "source_sha256":      sha256(bytes(self.data)),
                      "lids": [
                          {k: (f"0x{v:04X}" if k == "lid" else
                               f"0x{v:08X}" if k in ("offset", "data_offset") else v)
                           for k, v in e.items()} for e in self.lids
                      ],
                      "mac_found": {
                          kind: [
                              {k: (f"0x{v:08X}" if k == "abs_offset" else
                                   v.hex(":").upper() if k == "raw" else v)
                               for k, v in e.items() if k != "raw"}
                              for e in entries
                          ]
                          for kind, entries in self.found.items() if kind != "unknown"
                      },
                      "pattern_scan_count": len(self.found.get("unknown", [])),
                      "log_lines":          self.log,
                  }
                  with open(log_path, "w", encoding="utf-8") as f:
                      json.dump(report, f, ensure_ascii=False, indent=2)
                  self._log(ok(f"解析ログ保存: {log_path}"))

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("nvram")
              ap.add_argument("--out",      default="")
              ap.add_argument("--log",      default="nvram_analysis.json")
              ap.add_argument("--dry-run",  action="store_true")
              ap.add_argument("--wifi-mac", default="")
              ap.add_argument("--bt-mac",   default="")
              args = ap.parse_args()

              if not os.path.exists(args.nvram):
                  print(f"✘ ファイルが見つかりません: {args.nvram}")
                  sys.exit(1)

              bak = args.nvram + ".bak"
              if not os.path.exists(bak):
                  shutil.copy2(args.nvram, bak)
                  print(f"✔ バックアップ作成: {bak}")

              az = NVRAMAnalyzer(args.nvram)
              az.analyze_header()
              az.scan_lids()
              az.find_mac_in_lid()
              az.pattern_scan_macs()
              az.dump_regions()

              wifi_new = mac_str_to_bytes(args.wifi_mac) if args.wifi_mac else random_mac()
              bt_new   = mac_str_to_bytes(args.bt_mac)   if args.bt_mac   else random_mac()

              print(f"\n  新 WiFi MAC : {mac_bytes_to_str(wifi_new)}")
              print(f"  新 BT   MAC : {mac_bytes_to_str(bt_new)}\n")

              if args.dry_run:
                  print("⚠ Dry-run モード: ファイルは変更しません。")
              else:
                  az.rewrite_mac("wifi", wifi_new)
                  az.rewrite_mac("bt",   bt_new)
                  az.save(args.out or args.nvram)

              az.save_log(args.log)

              gha_out = os.environ.get("GITHUB_OUTPUT", "")
              if gha_out:
                  with open(gha_out, "a") as f:
                      f.write(f"wifi_mac={mac_bytes_to_str(wifi_new)}\n")
                      f.write(f"bt_mac={mac_bytes_to_str(bt_new)}\n")
                      f.write(f"lid_count={len(az.lids)}\n")
                      f.write(f"log_path={args.log}\n")

          if __name__ == "__main__":
              main()
          PYTHON_EOF

      - name: Verify nvram.img exists
        run: |
          NVRAM="${{ github.event.inputs.nvram_path || 'nvram.img' }}"
          if [ ! -f "$NVRAM" ]; then
            echo "::error::nvram.img が見つかりません: $NVRAM"
            exit 1
          fi
          echo "NVRAM_PATH=$NVRAM" >> $GITHUB_ENV

      - name: Run NVRAM analyzer
        id: nvram
        run: |
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          WIFI="${{ github.event.inputs.wifi_mac }}"
          BT="${{ github.event.inputs.bt_mac }}"
          ARGS="$NVRAM_PATH --log nvram_analysis.json"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "$WIFI" ]      && ARGS="$ARGS --wifi-mac $WIFI"
          [ -n "$BT" ]        && ARGS="$ARGS --bt-mac $BT"
          python3 nvram_tool.py $ARGS

      - name: Show analysis summary
        run: |
          python3 - << 'EOF'
          import json, sys
          try:
              d = json.load(open("nvram_analysis.json"))
              print(f"ファイル    : {d['source_file']}")
              print(f"サイズ      : {d['source_size']} bytes")
              print(f"SHA-256     : {d['source_sha256'][:16]}...")
              print(f"LID 検出数  : {len(d['lids'])}")
              for lid in d['lids']:
                  print(f"  {lid.get('lid','?'):8s}  {lid.get('name','?'):12s}  offset={lid.get('offset','?')}  {lid.get('desc','')}")
              print()
              for kind, entries in d['mac_found'].items():
                  for e in entries:
                      print(f"  {kind.upper():5s} MAC : {e.get('mac','?')}  (offset {e.get('abs_offset','?')})")
          except Exception as ex:
              print(f"ログ読み込み失敗: {ex}", file=sys.stderr)
          EOF

      - name: Write job summary
        run: |
          python3 - << 'EOF'
          import json, os
          d = json.load(open("nvram_analysis.json"))
          out = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not out: exit()
          with open(out, "w") as f:
              f.write("# 📡 MTK NVRAM 解析レポート\n\n")
              f.write("| 項目 | 値 |\n|---|---|\n")
              f.write(f"| ファイル | `{d['source_file']}` |\n")
              f.write(f"| サイズ | {d['source_size']} bytes |\n")
              f.write(f"| SHA-256 | `{d['source_sha256']}` |\n")
              f.write(f"| タイムスタンプ | {d['timestamp']} |\n\n")
              f.write("## LID テーブル\n\n")
              f.write("| LID | 名前 | オフセット | レコード | 説明 |\n|---|---|---|---|---|\n")
              for e in d['lids']:
                  f.write(f"| `{e.get('lid','?')}` | {e.get('name','?')} | `{e.get('offset','?')}` | {e.get('rec_num','?')}×{e.get('rec_size','?')}B | {e.get('desc','')} |\n")
              f.write("\n## MAC アドレス\n\n")
              f.write("| 種別 | MAC アドレス | オフセット |\n|---|---|---|\n")
              for kind, entries in d['mac_found'].items():
                  for e in entries:
                      f.write(f"| {kind.upper()} | `{e.get('mac','?')}` | `{e.get('abs_offset','?')}` |\n")
              f.write(f"\n> パターンスキャン検出数: {d['pattern_scan_count']}\n")
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvram-output-${{ github.run_number }}
          path: |
            ${{ env.NVRAM_PATH }}
            ${{ env.NVRAM_PATH }}.bak
            nvram_analysis.json
            nvram_tool.py
          retention-days: 30

      - name: Commit rewritten nvram.img
        if: >
          github.event.inputs.dry_run != 'true' &&
          github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git add "$NVRAM_PATH" nvram_analysis.json || true
          git diff --cached --quiet && echo "変更なし。コミットをスキップ。" && exit 0
          git commit -m "chore: rewrite NVRAM MAC [$DATE]

          WiFi MAC : ${{ steps.nvram.outputs.wifi_mac }}
          BT   MAC : ${{ steps.nvram.outputs.bt_mac }}
          Source   : $NVRAM_PATH
          Runner   : GitHub Actions (#${{ github.run_number }})"
          git push

      - name: Print output variables
        run: |
          echo "WiFi MAC : ${{ steps.nvram.outputs.wifi_mac }}"
          echo "BT   MAC : ${{ steps.nvram.outputs.bt_mac }}"
          echo "LID 数   : ${{ steps.nvram.outputs.lid_count }}"
          echo "ログ     : ${{ steps.nvram.outputs.log_path }}"
