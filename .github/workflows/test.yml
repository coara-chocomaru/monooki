name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib

          src = "nvram.img"
          if not os.path.exists(src):
              sys.exit(1)

          with open(src, "rb") as f:
              data = bytearray(f.read())
          fsize = len(data)

          def valid_mac(b):
              if len(b) < 6:
                  return False
              if all(x == 0 for x in b) or all(x == 0xFF for x in b):
                  return False
              if b[0] & 1:
                  return False
              return True

          target_lid = b'\xD0\x04\x00\x00'
          candidates = []
          for i in range(0, fsize - 12, 4):
              if data[i:i+4] != target_lid:
                  continue
              off = struct.unpack_from('<I', data, i+4)[0]
              sz = struct.unpack_from('<I', data, i+8)[0]
              if off < 0x20000 or off >= fsize:
                  continue
              if sz < 64 or sz > 8192:
                  continue
              if off + sz > fsize:
                  continue
              mac_pos = off + 4
              if mac_pos + 6 > fsize:
                  continue
              mac = data[mac_pos:mac_pos+6]
              if not valid_mac(mac):
                  continue
              version = struct.unpack_from('<I', data, off)[0]
              candidates.append((off, sz, mac_pos, mac, version, i))

          if not candidates:
              print("No valid WIFI LID entry found")
              sys.exit(1)

          candidates.sort(key=lambda x: (x[0] < 0x20000, x[0]))
          data_off, data_sz, mac_off, old_mac, version, entry_pos = candidates[0]

          old_fmt = ':'.join(f'{b:02X}' for b in old_mac)
          print(f"WIFI data offset: 0x{data_off:X}")
          print(f"MAC offset: 0x{mac_off:X}")
          print(f"Entry LID at 0x{entry_pos:X}")
          print(f"Version: 0x{version:08X}")
          print(f"Existing MAC: {old_fmt}")

          user_mac = '${{ github.event.inputs.mac_addr }}'
          if user_mac:
              parts = user_mac.split(':')
              if len(parts) != 6 or any(len(p) != 2 for p in parts):
                  sys.exit(1)
              new_mac = bytes(int(p, 16) for p in parts)
          else:
              new_mac = bytearray(6)
              for idx in range(6):
                  new_mac[idx] = random.randint(0, 255)
              new_mac[0] = (new_mac[0] & 0xFC) | 0x02
              new_mac = bytes(new_mac)

          new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
          data[mac_off:mac_off+6] = new_mac

          out_path = "nvram_modified.img"
          with open(out_path, "wb") as f:
              f.write(data)

          sha256 = hashlib.sha256(data).hexdigest()

          with open("nvram_analysis.log", "w") as log:
              log.write(f"File: nvram.img ({fsize} bytes)\n")
              log.write(f"LID entry position: 0x{entry_pos:X}\n")
              log.write(f"WIFI data offset: 0x{data_off:X} size: 0x{data_sz:X}\n")
              log.write(f"MAC offset: 0x{mac_off:X}\n")
              log.write(f"Version: 0x{version:08X}\n")
              log.write(f"Old MAC: {old_fmt}\n")
              log.write(f"New MAC: {new_fmt}\n")
              log.write(f"Modified SHA256: {sha256}\n")
              log.write("\nWIFI data block hex:\n")
              for k in range(data_off, min(data_off + data_sz, fsize), 16):
                  line = data[k:k+16]
                  hex_str = ' '.join(f'{b:02X}' for b in line)
                  log.write(f"0x{k:08X}: {hex_str}\n")

          print(f"New MAC: {new_fmt}")
          print("Done")
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
