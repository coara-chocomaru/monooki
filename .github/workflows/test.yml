name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib

          src = "nvram.img"
          if not os.path.exists(src):
              sys.exit(1)

          with open(src, "rb") as f:
              data = bytearray(f.read())
          fsize = len(data)

          print(f"File size: {fsize} bytes")

          result = None
          for i in range(0x20000, min(0x500000, fsize - 256), 4):
              if data[i] == 0x00 and data[i+1] == 0x00 and data[i+2] == 0x00 and data[i+3] == 0x00:
                  continue
              if data[i] & 0x01:
                  continue
              if all(b == 0xFF for b in data[i:i+6]):
                  continue
              if all(b == 0x00 for b in data[i:i+6]):
                  continue

              b0 = data[i]
              if b0 not in (0x00, 0x02, 0x04, 0x06, 0x08, 0x0A, 0x0C, 0x0E, 0x10, 0x12, 0x14, 0x16, 0x18, 0x1A, 0x1C, 0x1E,
                             0x20, 0x22, 0x24, 0x26, 0x28, 0x2A, 0x2C, 0x2E, 0x30, 0x32, 0x34, 0x36, 0x38, 0x3A, 0x3C, 0x3E,
                             0x40, 0x42, 0x44, 0x46, 0x48, 0x4A, 0x4C, 0x4E, 0x50, 0x52, 0x54, 0x56, 0x58, 0x5A, 0x5C, 0x5E,
                             0x60, 0x62, 0x64, 0x66, 0x68, 0x6A, 0x6C, 0x6E, 0x70, 0x72, 0x74, 0x76, 0x78, 0x7A, 0x7C, 0x7E,
                             0x80, 0x82, 0x84, 0x86, 0x88, 0x8A, 0x8C, 0x8E, 0x90, 0x92, 0x94, 0x96, 0x98, 0x9A, 0x9C, 0x9E,
                             0xA0, 0xA2, 0xA4, 0xA6, 0xA8, 0xAA, 0xAC, 0xAE, 0xB0, 0xB2, 0xB4, 0xB6, 0xB8, 0xBA, 0xBC, 0xBE,
                             0xC0, 0xC2, 0xC4, 0xC6, 0xC8, 0xCA, 0xCC, 0xCE, 0xD0, 0xD2, 0xD4, 0xD6, 0xD8, 0xDA, 0xDC, 0xDE,
                             0xE0, 0xE2, 0xE4, 0xE6, 0xE8, 0xEA, 0xEC, 0xEE, 0xF0, 0xF2, 0xF4, 0xF6, 0xF8, 0xFA, 0xFC, 0xFE):
                  continue

              tail = data[i+6:i+8]
              if tail != b'\x00\x00':
                  before = data[i-2:i]
                  if before != b'\x00\x00':
                      continue

              before_pattern = data[max(0, i-16):i]
              if len(before_pattern) >= 12:
                  have_zero_block = False
                  for j in range(0, len(before_pattern)-4, 4):
                      if before_pattern[j:j+4] == b'\x00\x00\x00\x00':
                          have_zero_block = True
                          break
                  if not have_zero_block:
                      continue

              candidates = []
              for j in range(max(0, i-256), i):
                  if j + 4 > i:
                      break
                  off_val = struct.unpack_from('<I', data, j)[0]
                  if off_val == i:
                      candidates.append((j, off_val))
                  elif off_val > 0x20000 and off_val < fsize and off_val <= i and off_val + 256 >= i:
                      candidates.append((j, off_val))

              results = []
              for j, off_val in candidates:
                  file_start = j - 8
                  if file_start >= 0x20000:
                      maybe_len = struct.unpack_from('<I', data, file_start + 4)[0]
                      if 64 <= maybe_len <= 4096 and off_val + maybe_len <= fsize:
                          results.append((off_val, maybe_len, j))

              if results:
                  data_off, data_sz, ptr_loc = results[0]
                  mac_off = i
                  old_mac = bytes(data[mac_off:mac_off+6])
                  old_fmt = ':'.join(f'{b:02X}' for b in old_mac)
                  print(f"WIFI data offset: 0x{data_off:X}")
                  print(f"MAC offset: 0x{mac_off:X}")
                  print(f"Block size: 0x{data_sz:X}")
                  print(f"Existing MAC: {old_fmt}")

                  user_mac = '${{ github.event.inputs.mac_addr }}'
                  if user_mac:
                      parts = user_mac.split(':')
                      if len(parts) != 6 or any(len(p) != 2 for p in parts):
                          sys.exit(1)
                      new_mac = bytes(int(p, 16) for p in parts)
                  else:
                      new_mac = bytearray(6)
                      for idx in range(6):
                          new_mac[idx] = random.randint(0, 255)
                      new_mac[0] = (new_mac[0] & 0xFC) | 0x02
                      new_mac = bytes(new_mac)

                  new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
                  data[mac_off:mac_off+6] = new_mac

                  out_path = "nvram_modified.img"
                  with open(out_path, "wb") as f:
                      f.write(data)

                  sha256 = hashlib.sha256(data).hexdigest()

                  with open("nvram_analysis.log", "w") as log:
                      log.write(f"File: nvram.img ({fsize} bytes)\n")
                      log.write(f"WIFI data offset: 0x{data_off:X}\n")
                      log.write(f"MAC offset: 0x{mac_off:X}\n")
                      log.write(f"Block size: 0x{data_sz:X}\n")
                      log.write(f"Old MAC: {old_fmt}\n")
                      log.write(f"New MAC: {new_fmt}\n")
                      log.write(f"Modified SHA256: {sha256}\n")
                      log.write(f"Offset pointer location: 0x{ptr_loc:X}\n")
                      log.write("\nSurrounding bytes:\n")
                      for k in range(data_off, min(data_off + data_sz, fsize), 16):
                          line = data[k:k+16]
                          hex_str = ' '.join(f'{b:02X}' for b in line)
                          log.write(f"0x{k:08X}: {hex_str}\n")

                  print(f"New MAC: {new_fmt}")
                  print("Done")
                  sys.exit(0)

          print("Could not find WIFI block via offset pointing")
          sys.exit(1)
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
