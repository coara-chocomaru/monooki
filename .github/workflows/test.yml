name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib
          from collections import namedtuple

          src = "nvram.img"
          if not os.path.exists(src):
              print("nvram.img not found")
              sys.exit(1)

          with open(src, "rb") as f:
              data = bytearray(f.read())

          fsize = len(data)
          print(f"File size: {fsize} bytes")

          def find_wifi_item(data):
              best = None
              for i in range(0, fsize - 8, 2):
                  maybe_lid = struct.unpack_from('<I', data, i)[0]
                  if maybe_lid != 0x04D0:
                      continue
                  if i < 4:
                      continue
                  for check_off in range(i - 16, i, 4):
                      if check_off < 0:
                          continue
                      hdr_candidate = data[check_off:check_off+12]
                      if len(hdr_candidate) < 12:
                          continue
                      lid2, ioff, isize = struct.unpack_from('<III', hdr_candidate, 0)
                      if lid2 == 0x04D0 and 0 < ioff < fsize and 0 < isize <= 16384 and ioff + isize <= fsize:
                          print(f"Found WIFI item header at 0x{check_off:X}: LID=0x{lid2:08X} data_off=0x{ioff:08X} size=0x{isize:04X}")
                          return (ioff, isize)
                  maybe_ioff = struct.unpack_from('<I', data, i + 4)[0]
                  maybe_size = struct.unpack_from('<I', data, i + 8)[0]
                  if 0 < maybe_ioff < fsize and 0 < maybe_size <= 16384 and maybe_ioff + maybe_size <= fsize:
                      print(f"Found probable WIFI item at LID offset 0x{i:X}: data_off=0x{maybe_ioff:08X} size=0x{maybe_size:04X}")
                      return (maybe_ioff, maybe_size)
              return None

          result = find_wifi_item(data)
          if result is None:
              print("Searching for WIFI via filesystem strings...")
              for i in range(0, fsize - 20, 1):
                  if data[i:i+4] == b'WIFI':
                      for t in range(max(0, i-128), i):
                          if data[t:t+3] == b'/AP' or data[t:t+6] == b'APRDEB' or data[t:t+5] == b'APCFG':
                              search_start = max(0, t-256)
                              for j in range(search_start, min(t+256, fsize-6), 1):
                                  if j + 6 <= fsize:
                                      mac_test = data[j:j+6]
                                      if all(b != 0 for b in mac_test) and (mac_test[0] & 0x01) == 0:
                                          block_start = j - 4
                                          if block_start >= 0:
                                              print(f"Found potential MAC at offset 0x{block_start:X} near WIFI string")
                                              result = (block_start, 256)
                                              break
                              if result:
                                  break
                      if result:
                          break

          if result is None:
              print("Could not locate WIFI data block")
              sys.exit(1)

          data_off, data_size = result
          mac_off = data_off + 4
          if mac_off + 6 > fsize:
              print("MAC offset out of bounds")
              sys.exit(1)

          old_mac = bytes(data[mac_off:mac_off+6])
          old_fmt = ':'.join(f'{b:02X}' for b in old_mac)
          print(f"Existing MAC at 0x{mac_off:X}: {old_fmt}")

          user_mac = '${{ github.event.inputs.mac_addr }}'
          if user_mac:
              parts = user_mac.split(':')
              if len(parts) != 6 or any(len(p) != 2 for p in parts):
                  print("Invalid MAC format")
                  sys.exit(1)
              new_mac = bytes(int(p, 16) for p in parts)
          else:
              new_mac = bytearray(6)
              for idx in range(6):
                  new_mac[idx] = random.randint(0, 255)
              new_mac[0] = (new_mac[0] & 0xFC) | 0x02
              new_mac = bytes(new_mac)

          new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
          print(f"New MAC: {new_fmt}")

          data[mac_off:mac_off+6] = new_mac

          out_path = "nvram_modified.img"
          with open(out_path, "wb") as f:
              f.write(data)

          sha256 = hashlib.sha256(data).hexdigest()

          with open("nvram_analysis.log", "w") as log:
              log.write(f"File: nvram.img ({len(data)} bytes)\n")
              log.write(f"WIFI data offset: 0x{data_off:X}\n")
              log.write(f"MAC offset: 0x{mac_off:X}\n")
              log.write(f"Old MAC: {old_fmt}\n")
              log.write(f"New MAC: {new_fmt}\n")
              log.write(f"Modified SHA256: {sha256}\n")
              log.write("\nFirst 64 bytes of WIFI data block:\n")
              for k in range(data_off, min(data_off+64, fsize), 16):
                  line = data[k:k+16]
                  hex_str = ' '.join(f'{b:02X}' for b in line)
                  log.write(f"0x{k:08X}: {hex_str}\n")

          print("Done")
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
