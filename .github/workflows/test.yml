name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib

          src = "nvram.img"
          if not os.path.exists(src):
              print("nvram.img not found")
              sys.exit(1)

          with open(src, "rb") as f:
              data = bytearray(f.read())

          magic = struct.unpack_from('<I', data, 0)[0]
          if magic != 0x4D52564E and magic != 0x4E565241:
              print("No valid NVRAM magic")
              sys.exit(1)

          header_size = struct.unpack_from('<I', data, 4)[0]
          total_size = struct.unpack_from('<I', data, 8)[0]
          data_offset = struct.unpack_from('<I', data, 12)[0]
          item_count = struct.unpack_from('<I', data, 16)[0]

          item_base = 20
          found = None
          for i in range(item_count):
              off = item_base + i * 12
              lid = struct.unpack_from('<I', data, off)[0]
              ioff = struct.unpack_from('<I', data, off + 4)[0]
              isize = struct.unpack_from('<I', data, off + 8)[0]
              if lid == 0x04D0:
                  found = (ioff, isize)
                  break

          if found is None:
              print("WIFI LID not found")
              sys.exit(1)

          item_off, item_sz = found
          abs_off = data_offset + item_off
          mac_off = abs_off + 4

          old_mac = bytes(data[mac_off:mac_off+6])
          old_fmt = ':'.join(f'{b:02X}' for b in old_mac)

          user_mac = '${{ github.event.inputs.mac_addr }}'
          if user_mac:
              parts = user_mac.split(':')
              if len(parts) != 6 or any(len(p) != 2 for p in parts):
                  print("Invalid MAC format")
                  sys.exit(1)
              new_mac = bytes(int(p, 16) for p in parts)
          else:
              new_mac = bytearray(6)
              for idx in range(6):
                  new_mac[idx] = random.randint(0, 255)
              new_mac[0] = (new_mac[0] & 0xFC) | 0x02
              new_mac = bytes(new_mac)

          new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
          data[mac_off:mac_off+6] = new_mac

          out_path = "nvram_modified.img"
          with open(out_path, "wb") as f:
              f.write(data)

          sha256 = hashlib.sha256(data).hexdigest()

          with open("nvram_analysis.log", "w") as log:
              log.write(f"File: nvram.img ({len(data)} bytes)\n")
              log.write(f"Magic: 0x{magic:08X}\n")
              log.write(f"Data offset: 0x{data_offset:08X}\n")
              log.write(f"WIFI LID item offset: 0x{item_off:08X} size: 0x{item_sz:08X}\n")
              log.write(f"MAC absolute offset: 0x{mac_off:08X}\n")
              log.write(f"Old MAC: {old_fmt}\n")
              log.write(f"New MAC: {new_fmt}\n")
              log.write(f"Modified SHA256: {sha256}\n")

          print("Done")
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
