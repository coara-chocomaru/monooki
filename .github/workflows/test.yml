name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib, re

          src = "nvram.img"
          if not os.path.exists(src):
              sys.exit(1)

          with open(src, "rb") as f:
              data = bytearray(f.read())
          fsize = len(data)

          def is_likely_mac(b):
              if len(b) < 6:
                  return False
              if all(x == 0 for x in b) or all(x == 0xFF for x in b):
                  return False
              if b[0] & 1:
                  return False
              if b[0] == 0x02 and b[1] == 0x00 and b[2] == 0x00:
                  return True
              if b[0] in (0x00, 0x08, 0x0C, 0x10, 0x14, 0x18) and b[1] < 0x10:
                  return True
              return True

          def find_wifi_file(data):
              c = []
              for m in re.finditer(rb'[A-Za-z0-9_]+/WIFI\x00', data):
                  pos = m.start()
                  name_part = data[m.start():m.end()]
                  if b'APCFG' in name_part or b'APRDEB' in name_part:
                      c.append(pos)
              if not c:
                  for m in re.finditer(rb'APCFG/APRDEB/WIFI', data):
                      c.append(m.start())
              if not c:
                  for m in re.finditer(rb'WIFI\x00', data):
                      if m.start() > 0x1000:
                          c.append(m.start())
              results = []
              for hit in c:
                  for lookup in range(max(0, hit-64), hit):
                      if lookup + 16 > fsize:
                          continue
                      foff = struct.unpack_from('<I', data, lookup)[0]
                      fsize_candidate = struct.unpack_from('<I', data, lookup+4)[0]
                      if 0x20000 < foff < fsize and 0 < fsize_candidate < 8192 and foff + fsize_candidate <= fsize:
                          mac_candidate = data[foff+4:foff+10]
                          if is_likely_mac(mac_candidate):
                              results.append((foff, fsize_candidate, hit))
                              break
              return results

          file_candidates = find_wifi_file(data)

          if file_candidates:
              data_off, data_sz, path_pos = file_candidates[0]
              mac_off = data_off + 4
          else:
              valid_macs = []
              for i in range(0x1FFFF, fsize - 6, 4):
                  mac_bytes = data[i:i+6]
                  if not is_likely_mac(mac_bytes):
                      continue
                  ctx = data[max(0,i-16):min(fsize,i+24)]
                  valid_macs.append((i, mac_bytes, ctx))
              if not valid_macs:
                  sys.exit(1)
              candidates = [(off, mac, ctx) for off, mac, ctx in valid_macs if off > 0x30000]
              if not candidates:
                  candidates = valid_macs
              data_off = candidates[0][0]
              mac_off = data_off

          old_mac = bytes(data[mac_off:mac_off+6])
          if not is_likely_mac(old_mac):
              sys.exit(1)

          old_fmt = ':'.join(f'{b:02X}' for b in old_mac)

          user_mac = '${{ github.event.inputs.mac_addr }}'
          if user_mac:
              parts = user_mac.split(':')
              if len(parts) != 6 or any(len(p) != 2 for p in parts):
                  sys.exit(1)
              new_mac = bytes(int(p, 16) for p in parts)
          else:
              new_mac = bytearray(6)
              for idx in range(6):
                  new_mac[idx] = random.randint(0, 255)
              new_mac[0] = (new_mac[0] & 0xFC) | 0x02
              new_mac = bytes(new_mac)

          new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
          data[mac_off:mac_off+6] = new_mac

          out_path = "nvram_modified.img"
          with open(out_path, "wb") as f:
              f.write(data)

          sha256 = hashlib.sha256(data).hexdigest()

          with open("nvram_analysis.log", "w") as log:
              log.write(f"File: nvram.img ({len(data)} bytes)\n")
              log.write(f"WIFI data offset: 0x{data_off:X}\n")
              log.write(f"MAC offset: 0x{mac_off:X}\n")
              log.write(f"Old MAC: {old_fmt}\n")
              log.write(f"New MAC: {new_fmt}\n")
              log.write(f"Modified SHA256: {sha256}\n")
              log.write("\nSurrounding bytes:\n")
              for k in range(max(0, data_off-16), min(data_off+256, fsize), 16):
                  line = data[k:k+16]
                  hex_str = ' '.join(f'{b:02X}' for b in line)
                  log.write(f"0x{k:08X}: {hex_str}\n")

          print("Done")
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
