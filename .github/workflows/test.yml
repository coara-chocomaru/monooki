name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib

          src = "nvram.img"
          if not os.path.exists(src):
              print("nvram.img not found")
              sys.exit(1)

          with open(src, "rb") as f:
              data = bytearray(f.read())

          magic = data[0:4]
          if magic != b'NVRM' and magic != b'NVRA':
              print(f"No valid NVRAM magic: {magic.hex()}")
              sys.exit(1)

          header_size = struct.unpack_from('<I', data, 4)[0]
          total_size = struct.unpack_from('<I', data, 8)[0]
          data_size = struct.unpack_from('<I', data, 12)[0]
          item_count = struct.unpack_from('<I', data, 16)[0]

          if header_size < 20 or header_size > 0x10000:
              print(f"Invalid header_size: {header_size}")
              sys.exit(1)
          if total_size < header_size or total_size > 0x2000000:
              print(f"Invalid total_size: {total_size}")
              sys.exit(1)
          if data_size < 0 or data_size > total_size - header_size:
              print(f"Invalid data_size: {data_size}")
              sys.exit(1)
          if item_count < 0 or item_count > 0x2000:
              print(f"Invalid item_count: {item_count}")
              sys.exit(1)

          data_offset = header_size
          items_start = 20
          max_items = (header_size - items_start) // 12
          actual_items = item_count if item_count <= max_items else max_items

          found = None
          for i in range(actual_items):
              off = items_start + i * 12
              lid = struct.unpack_from('<I', data, off)[0]
              item_data_off = struct.unpack_from('<I', data, off + 4)[0]
              item_size = struct.unpack_from('<I', data, off + 8)[0]
              if lid == 0x04D0:
                  found = (item_data_off, item_size)
                  break

          if found is None:
              print("WIFI LID (0x04D0) not found")
              sys.exit(1)

          item_rel_off, item_sz = found
          abs_item_off = data_offset + item_rel_off
          if abs_item_off + item_sz > len(data):
              print("WIFI data block out of bounds")
              sys.exit(1)

          mac_off = abs_item_off + 4
          old_mac = bytes(data[mac_off:mac_off+6])
          old_fmt = ':'.join(f'{b:02X}' for b in old_mac)

          user_mac = '${{ github.event.inputs.mac_addr }}'
          if user_mac:
              parts = user_mac.split(':')
              if len(parts) != 6 or any(len(p) != 2 for p in parts):
                  print("Invalid MAC format")
                  sys.exit(1)
              new_mac = bytes(int(p, 16) for p in parts)
          else:
              new_mac = bytearray(6)
              for idx in range(6):
                  new_mac[idx] = random.randint(0, 255)
              new_mac[0] = (new_mac[0] & 0xFC) | 0x02
              new_mac = bytes(new_mac)

          new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
          data[mac_off:mac_off+6] = new_mac

          out_path = "nvram_modified.img"
          with open(out_path, "wb") as f:
              f.write(data)

          sha256 = hashlib.sha256(data).hexdigest()

          with open("nvram_analysis.log", "w") as log:
              log.write(f"File: nvram.img ({len(data)} bytes)\n")
              log.write(f"Signature: {magic.decode('ascii', errors='replace')}\n")
              log.write(f"Total size: {total_size}\n")
              log.write(f"Header size: 0x{header_size:X}\n")
              log.write(f"Data size: 0x{data_size:X}\n")
              log.write(f"Item count: {actual_items}\n")
              log.write(f"WIFI item offset (rel): 0x{item_rel_off:X} size: 0x{item_sz:X}\n")
              log.write(f"MAC absolute offset: 0x{mac_off:X}\n")
              log.write(f"Old MAC: {old_fmt}\n")
              log.write(f"New MAC: {new_fmt}\n")
              log.write(f"Modified SHA256: {sha256}\n")

          print("Done")
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
