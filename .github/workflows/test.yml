name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: parse_and_rewrite
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib

          src = "nvram.img"
          if not os.path.exists(src):
              print("nvram.img not found")
              sys.exit(1)

          with open(src, "rb") as f:
              data = f.read()
          fsize = len(data)
          print(f"File size: {fsize} bytes (expected 5MB)")

          target = b'WIFI'
          candidates = []
          step = 1
          for i in range(0, fsize - 12, step):
              if data[i:i+4] != target:
                  continue
              off = struct.unpack_from('<I', data, i+4)[0]
              sz = struct.unpack_from('<I', data, i+8)[0]
              if off < fsize and sz > 0 and (off + sz) <= fsize and off > 0x800:
                  candidates.append((i, off, sz))

          if not candidates:
              print("No valid WIFI section found")
              sys.exit(1)

          entry_pos, sec_off, sec_size = candidates[0]
          print(f"WIFI section entry at 0x{entry_pos:06X}, data offset 0x{sec_off:06X}, size 0x{sec_size:06X}")

          mac_off = sec_off + 4
          old_mac = data[mac_off:mac_off+6]
          old_fmt = ':'.join(f'{b:02X}' for b in old_mac)
          print(f"Existing MAC: {old_fmt}")

          user_mac = '${{ github.event.inputs.mac_addr }}'
          if user_mac:
              parts = user_mac.split(':')
              if len(parts) != 6 or any(len(p) != 2 for p in parts):
                  print("Invalid MAC format")
                  sys.exit(1)
              new_mac = bytes(int(p, 16) for p in parts)
          else:
              new_mac = bytearray(6)
              for idx in range(6):
                  new_mac[idx] = random.randint(0, 255)
              new_mac[0] = (new_mac[0] & 0xFC) | 0x02
              new_mac = bytes(new_mac)

          new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
          print(f"New MAC: {new_fmt}")

          mod_data = bytearray(data)
          mod_data[mac_off:mac_off+6] = new_mac

          out_path = "nvram_modified.img"
          with open(out_path, "wb") as f:
              f.write(mod_data)

          sha256 = hashlib.sha256(mod_data).hexdigest()
          print(f"Modified SHA256: {sha256}")

          with open("nvram_analysis.log", "w") as log:
              log.write(f"File: nvram.img ({fsize} bytes)\n")
              log.write(f"WIFI section entry: 0x{entry_pos:06X}\n")
              log.write(f"WIFI data offset: 0x{sec_off:06X}\n")
              log.write(f"MAC offset: 0x{mac_off:06X}\n")
              log.write(f"Old MAC: {old_fmt}\n")
              log.write(f"New MAC: {new_fmt}\n")
              log.write(f"Modified SHA256: {sha256}\n")

          print("Done")
          PYEOF
      - name: upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
