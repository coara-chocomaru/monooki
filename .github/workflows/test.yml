name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, struct, random, sys, hashlib

          src = "nvram.img"
          if not os.path.exists(src):
              sys.exit(1)

          with open(src, "rb") as f:
              data = bytearray(f.read())
          fsize = len(data)

          print(f"File size: {fsize} bytes")

          ptr = 0x20800
          while ptr < fsize - 32:
              maybe_magic = struct.unpack_from('<I', data, ptr)[0]
              if maybe_magic == 0x4D524F46:
                  print(f"Found FORM at 0x{ptr:X}")
                  base = ptr
                  total_len = struct.unpack_from('<I', data, base + 4)[0]
                  form_type = data[base + 8:base + 12]
                  print(f"Total length: {total_len}, type: {form_type.hex()}")

                  chunk_off = base + 12
                  while chunk_off < base + total_len and chunk_off < fsize - 8:
                      ck_id = data[chunk_off:chunk_off+4]
                      ck_size = struct.unpack_from('<I', data, chunk_off + 4)[0]
                      print(f"Chunk at 0x{chunk_off:X}: id={ck_id.decode('ascii','replace')} size={ck_size}")

                      if ck_id == b'FILE':
                          file_base = chunk_off + 8
                          file_id = struct.unpack_from('<I', data, file_base)[0]
                          file_name_off = struct.unpack_from('<I', data, file_base + 4)[0]
                          file_data_off = struct.unpack_from('<I', data, file_base + 8)[0]
                          file_size = struct.unpack_from('<I', data, file_base + 12)[0]

                          name_abs = file_base + file_name_off
                          name_len = 0
                          while name_abs + name_len < fsize and data[name_abs + name_len] != 0:
                              name_len += 1
                          name = data[name_abs:name_abs+name_len].decode('ascii', errors='replace')
                          print(f"  FILE: id=0x{file_id:08X} name='{name}' data_off=0x{file_data_off:X} size=0x{file_size:X}")

                          if 'WIFI' in name.upper() and ('APCFG' in name or 'APRDEB' in name or name.endswith('WIFI')):
                              data_abs = file_base + file_data_off
                              if data_abs + file_size <= fsize and file_size >= 10:
                                  mac_pos = data_abs + 4
                                  old_mac = bytes(data[mac_pos:mac_pos+6])
                                  old_fmt = ':'.join(f'{b:02X}' for b in old_mac)
                                  print(f"    WIFI MAC offset: 0x{mac_pos:X}")
                                  print(f"    Existing MAC: {old_fmt}")

                                  user_mac = '${{ github.event.inputs.mac_addr }}'
                                  if user_mac:
                                      parts = user_mac.split(':')
                                      if len(parts) != 6 or any(len(p) != 2 for p in parts):
                                          sys.exit(1)
                                      new_mac = bytes(int(p, 16) for p in parts)
                                  else:
                                      new_mac = bytearray(6)
                                      for idx in range(6):
                                          new_mac[idx] = random.randint(0, 255)
                                      new_mac[0] = (new_mac[0] & 0xFC) | 0x02
                                      new_mac = bytes(new_mac)

                                  new_fmt = ':'.join(f'{b:02X}' for b in new_mac)
                                  data[mac_pos:mac_pos+6] = new_mac

                                  out_path = "nvram_modified.img"
                                  with open(out_path, "wb") as f:
                                      f.write(data)

                                  sha256 = hashlib.sha256(data).hexdigest()

                                  with open("nvram_analysis.log", "w") as log:
                                      log.write(f"File: nvram.img ({fsize} bytes)\n")
                                      log.write(f"FORM base: 0x{base:X}\n")
                                      log.write(f"WIFI file: {name}\n")
                                      log.write(f"File data offset: 0x{data_abs:X}\n")
                                      log.write(f"MAC offset: 0x{mac_pos:X}\n")
                                      log.write(f"Old MAC: {old_fmt}\n")
                                      log.write(f"New MAC: {new_fmt}\n")
                                      log.write(f"Modified SHA256: {sha256}\n")
                                      log.write("\nWIFI file data hex dump:\n")
                                      for k in range(data_abs, min(data_abs + file_size, fsize), 16):
                                          line = data[k:k+16]
                                          hex_str = ' '.join(f'{b:02X}' for b in line)
                                          log.write(f"0x{k:08X}: {hex_str}\n")

                                  print("Done")
                                  print(f"New MAC: {new_fmt}")
                                  sys.exit(0)

                      chunk_off += (ck_size + 8 + 3) & ~3

                  break
              ptr += 4

          print("FORM structure with WIFI file not found")
          sys.exit(1)
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
