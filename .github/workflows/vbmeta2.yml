name: VBMeta Analyze Only

on:
  workflow_dispatch:
    inputs:
      firmware_zip_url:
        description: 'ファームウェアZIPの直接ダウンロードURL'
        required: true
        type: string

env:
  AVBTOOL_BRANCH: 'android12-release'
  LPUNPACK_REPO: 'https://github.com/LonelyFool/lpunpack_and_lpmake'

jobs:
  analyze:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::Inputs"
          echo "Firmware ZIP URL: ${{ inputs.firmware_zip_url }}"
          echo "avbtool branch: ${{ env.AVBTOOL_BRANCH }}"
          echo "::endgroup::"

      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt -y install python3 python3-pip xxd curl unzip git android-sdk-libsparse-utils
          mkdir -p work/download work/extracted work/super_unpacked work/logs

      - name: Clone avbtool (AVB 1.2.0 / android12-release)
        run: |
          git clone --depth 1 --branch ${{ env.AVBTOOL_BRANCH }} \
            https://android.googlesource.com/platform/external/avb avb

      - name: Clone lpunpack_and_lpmake
        run: |
          git clone --depth 1 ${{ env.LPUNPACK_REPO }} lpunpack_and_lpmake
          find lpunpack_and_lpmake -iname "lpunpack" -exec chmod +x {} \;

      - name: Download firmware ZIP
        working-directory: work/download
        run: |
          curl -L -o firmware.zip "${{ inputs.firmware_zip_url }}"
          ls -la

      - name: Extract firmware ZIP
        run: |
          unzip -o work/download/firmware.zip -d work/extracted
          find work/extracted -maxdepth 4 -type f -iname "*.img" | sort

      - name: Locate and unpack super.img
        run: |
          SUPER_IMG=$(find work/extracted -iname "super.img" | head -1)
          if [ -z "$SUPER_IMG" ]; then
            echo "super.img not found in firmware ZIP"
            exit 0
          fi
          echo "Found super.img: $SUPER_IMG"
          MAGIC=$(xxd -p -l 4 "$SUPER_IMG")
          if [ "$MAGIC" == "3aff26ed" ]; then
            echo "super.img is sparse, converting to raw..."
            simg2img "$SUPER_IMG" work/super_unpacked/super.raw.img
            SUPER_RAW="work/super_unpacked/super.raw.img"
          else
            SUPER_RAW="$SUPER_IMG"
          fi
          LPUNPACK_BIN=$(find lpunpack_and_lpmake -iname "lpunpack" -type f | head -1)
          if [ -z "$LPUNPACK_BIN" ]; then
            echo "lpunpack binary not found"
            exit 0
          fi
          "$LPUNPACK_BIN" "$SUPER_RAW" work/super_unpacked || true
          find work/super_unpacked -type f -iname "*.img" | sort

      - name: Analyze all partitions
        run: |
          PARTITIONS="vendor_boot init_boot boot system product vendor vendor_dlkm odm_dlkm odm vbmeta vbmeta_system vbmeta_vendor"
          {
            echo "=== AVB Full Analysis Summary ==="
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
          } > work/logs/all_summary.log

          for NAME in $PARTITIONS; do
            IMG_PATH=$(find work/extracted -maxdepth 6 -type f \( -iname "${NAME}.img" -o -iname "${NAME}_a.img" \) | head -1)
            if [ -z "$IMG_PATH" ]; then
              IMG_PATH=$(find work/super_unpacked -maxdepth 2 -type f \( -iname "${NAME}.img" -o -iname "${NAME}_a.img" \) | head -1)
            fi

            LOG_FILE="work/logs/${NAME}_info.log"

            if [ -z "$IMG_PATH" ]; then
              echo "${NAME}.img not found" > "$LOG_FILE"
            else
              echo "Analyzing: $IMG_PATH"
              {
                echo "=== $NAME ($IMG_PATH) ==="
                python3 avb/avbtool.py info_image --image "$IMG_PATH" 2>&1
              } > "$LOG_FILE" || true
            fi

            {
              echo "----- $NAME -----"
              cat "$LOG_FILE"
              echo ""
            } >> work/logs/all_summary.log
          done

          cat work/logs/all_summary.log

      - name: Analyze super.img itself
        run: |
          SUPER_IMG=$(find work/extracted -iname "super.img" | head -1)
          LOG_FILE="work/logs/super_info.log"
          if [ -z "$SUPER_IMG" ]; then
            echo "super.img not found" > "$LOG_FILE"
          else
            {
              echo "=== super ($SUPER_IMG) ==="
              python3 avb/avbtool.py info_image --image "$SUPER_IMG" 2>&1
            } > "$LOG_FILE" || true
          fi
          cat "$LOG_FILE"

      - name: Extract public key and chain summary
        run: |
          {
            echo "=== Public Key / Chain Partition Summary ==="
            for LOG in work/logs/*_info.log; do
              NAME=$(basename "$LOG" _info.log)
              echo ""
              echo "### $NAME ###"
              grep -E "Public key|Algorithm|Rollback Index|Release String|Chain Partition|Partition Name|Flags" "$LOG" || echo "no data"
            done
          } > work/logs/pubkey_chain_summary.log
          cat work/logs/pubkey_chain_summary.log

      - name: Extract descriptor summary
        run: |
          {
            echo "=== Descriptor Summary (all partitions) ==="
            for LOG in work/logs/*_info.log; do
              NAME=$(basename "$LOG" _info.log)
              echo ""
              echo "### $NAME ###"
              grep -E "Descriptor|Hash Algorithm|Image Size|Tree Size|FEC num roots|FEC size|Root Digest|Digest|Salt" "$LOG" || echo "no data"
            done
          } > work/logs/descriptor_summary_all.log
          cat work/logs/descriptor_summary_all.log

      - name: Hexdump headers
        run: |
          for NAME in vendor_boot init_boot boot system product vendor vendor_dlkm odm_dlkm odm super vbmeta vbmeta_system vbmeta_vendor; do
            IMG_PATH=$(find work/extracted work/super_unpacked -maxdepth 6 -type f \( -iname "${NAME}.img" -o -iname "${NAME}_a.img" \) | head -1)
            if [ -n "$IMG_PATH" ]; then
              xxd "$IMG_PATH" | head -30 > "work/logs/${NAME}_hexdump.log"
            fi
          done
          ls -la work/logs

      - name: Zip logs
        run: |
          cd work
          zip -r vbmeta_analysis_logs.zip logs/

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: vbmeta-analysis-logs
          path: work/vbmeta_analysis_logs.zip
