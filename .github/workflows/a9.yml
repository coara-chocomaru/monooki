name: extract-boot-kernel

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Download target URL'
        required: true
        type: string
      filename:
        description: 'Output filename'
        required: false
        type: string
        default: 'target.bin'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Setup workspace
        run: |
          mkdir -p work/input work/extracted work/found
          echo "TARGET_URL=${{ inputs.target_url }}" >> $GITHUB_ENV
          echo "TARGET_FILE=${{ inputs.filename }}" >> $GITHUB_ENV

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk file xz-utils p7zip-full zlib1g-dev

      - name: Download target file
        run: |
          cd work/input
          curl -L --fail --retry 5 --retry-delay 3 -o "${TARGET_FILE}" "${TARGET_URL}"
          ls -la

      - name: Binwalk extraction
        run: |
          cd work/extracted
          binwalk --extract --matryoshka --directory=. "../input/${TARGET_FILE}" || true

      - name: Search for boot image and kernel candidates
        run: |
          mkdir -p work/found
          find work/extracted -type f | while read -r f; do
            desc=$(file -b "${f}")
            case "${desc}" in
              *"Android bootimg"*|*"ANDROID!"*)
                echo "boot image candidate: ${f} (${desc})"
                cp "${f}" "work/found/$(basename "${f}")_bootimg.img"
                ;;
              *"Linux kernel"*|*"kernel"*)
                echo "kernel candidate: ${f} (${desc})"
                cp "${f}" "work/found/$(basename "${f}")_kernel.img"
                ;;
              *"gzip compressed"*)
                if head -c 4 "${f}" | grep -q $'\x1f\x8b'; then
                  echo "gzip candidate (possible kernel): ${f} (${desc})"
                  cp "${f}" "work/found/$(basename "${f}")_gzip.gz"
                fi
                ;;
            esac
          done

      - name: Grep magic bytes directly in raw file as fallback
        run: |
          python3 - "work/input/${TARGET_FILE}" <<'PYEOF'
import sys

path = sys.argv[1]
with open(path, "rb") as f:
    data = f.read()

markers = {
    b"ANDROID!": "boot_img",
    b"\x1f\x8b\x08": "gzip_kernel",
    b"\x02\x21\x4c\x18": "lz4_kernel",
}

for magic, label in markers.items():
    idx = 0
    while True:
        idx = data.find(magic, idx)
        if idx == -1:
            break
        outname = f"work/found/raw_offset_{idx:x}_{label}.bin"
        with open(outname, "wb") as out:
            out.write(data[idx:idx+67108864])
        print(f"found {label} at offset 0x{idx:x} -> {outname}")
        idx += 1
PYEOF

      - name: List found candidates
        run: |
          ls -la work/found || echo "no candidates found"

      - name: Upload found boot/kernel candidates
        uses: actions/upload-artifact@v4
        with:
          name: boot-kernel-candidates
          path: work/found/*
          retention-days: 14
          if-no-files-found: warn
