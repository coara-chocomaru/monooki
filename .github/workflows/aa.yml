name: Extract vmlinux and kallsyms

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extract-vmlinux
        run: |
          curl -fsSL -o extract-vmlinux \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux"
          chmod +x extract-vmlinux

      - name: Download zImage kernel.img
        run: |
          curl -fsSL -o kernel.img \
            "https://github.com/coara-chocomaru/monooki/releases/download/%E3%81%A7%E3%83%BC%E3%81%9F2/zImage"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu gzip xz-utils bzip2 lzma lzop lz4 zstd

      - name: Decompress zImage to vmlinux
        run: ./extract-vmlinux kernel.img 2>/dev/null > vmlinux

      - name: Verify ELF format
        run: |
          if ! file vmlinux | grep -q ELF; then
            echo "ERROR: vmlinux is not a valid ELF file"
            exit 1
          fi
          echo "ELF validation passed"

      - name: Check for symbol table
        run: |
          if ! aarch64-linux-gnu-nm -n vmlinux > kallsyms.txt 2>/dev/null; then
            echo "ERROR: nm failed (no symbol table or malformed ELF)"
            exit 1
          fi
          if [ ! -s kallsyms.txt ]; then
            echo "ERROR: Symbol table exists but is empty (stripped kernel)"
            exit 1
          fi
          echo "Symbol extraction successful"

      - name: Upload kallsyms
        uses: actions/upload-artifact@v4
        with:
          name: kallsyms
          path: kallsyms.txt
          retention-days: 30
