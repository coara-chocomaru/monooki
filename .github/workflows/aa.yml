name: Extract vmlinux and kallsyms

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extract-vmlinux
        run: |
          curl -fsSL -o extract-vmlinux \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux"
          chmod +x extract-vmlinux

      - name: Download kernel.img (zImage)
        run: |
          curl -fsSL -o kernel.img \
            "https://github.com/coara-chocomaru/monooki/releases/download/%E3%81%A7%E3%83%BC%E3%81%9F2/zImage"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu gzip xz-utils bzip2 lzma lzop lz4 zstd

      - name: Decompress zImage to vmlinux
        run: |
          ./extract-vmlinux kernel.img 2>/dev/null > vmlinux.raw
          mv vmlinux.raw vmlinux

      - name: Bruteforce search for symbols with offsets
        run: |
          echo "=== Extracting potential kallsyms (address/symbol pairs) from raw binary ==="
          printf "Offset(hex) Symbol\n" > kallsyms.txt
          strings -t x vmlinux | grep -E '^[0-9a-f]+ [a-zA-Z_][a-zA-Z0-9_]*$' | awk '{print $1 " T " $2}' >> kallsyms.txt

      - name: Upload kallsyms artifact
        uses: actions/upload-artifact@v4
        with:
          name: kallsyms
          path: kallsyms.txt
          retention-days: 30
