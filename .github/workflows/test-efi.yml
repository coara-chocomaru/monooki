                      f"<td>{html.escape(str(item.get('fastboot_match_count', '')))}</td>"
                      f"<td>{html.escape(str(item.get('vendor_match_count', '')))}</td>"
                      f"<td>{html.escape(str(item.get('oem_match_count', '')))}</td>"
                      "</tr>\n"
                  )

              output.write(
                  "</tbody>"
                  "</table>\n"
              )

              output.write(
                  "</body>\n"
                  "</html>\n"
              )

          print(
              f"Markdown report: {markdown_path}"
          )

          print(
              f"HTML report: {html_path}"
          )
          PYEOF

          python3 -m py_compile \
            /tmp/generate_global_report.py

          python3 \
            /tmp/generate_global_report.py

          test -f \
            "${ARTIFACT_ROOT}/reports/FULL_ANALYSIS_REPORT.md"

          test -f \
            "${ARTIFACT_ROOT}/reports/index.html"

      - name: Validate Final Artifacts
        shell: bash
        run: |
          set -e

          test -d \
            "${ARTIFACT_ROOT}"

          test -f \
            "${ARTIFACT_ROOT}/analysis_manifest.json"

          test -f \
            "${ARTIFACT_ROOT}/analysis_index.csv"

          test -f \
            "${ARTIFACT_ROOT}/reports/FULL_ANALYSIS_REPORT.md"

          test -f \
            "${ARTIFACT_ROOT}/reports/index.html"

          python3 - <<'PYEOF'
          import json
          import os
          from pathlib import Path

          root = Path(
              os.environ["ARTIFACT_ROOT"]
          )

          manifest_path = (
              root
              / "analysis_manifest.json"
          )

          with open(
              manifest_path,
              "r",
              encoding="utf-8"
          ) as source:
              manifest = json.load(
                  source
              )

          required = [
              "input_zip",
              "input_size",
              "input_sha256",
              "file_count_discovered",
              "file_count_analyzed",
              "file_count_failed",
              "files",
              "failures"
          ]

          for key in required:
              if key not in manifest:
                  raise SystemExit(
                      f"Missing manifest key: {key}"
                  )

          discovered = int(
              manifest[
                  "file_count_discovered"
              ]
          )

          analyzed = int(
              manifest[
                  "file_count_analyzed"
              ]
          )

          failed = int(
              manifest[
                  "file_count_failed"
              ]
          )

          if discovered < analyzed:
              raise SystemExit(
                  "Manifest count inconsistency."
              )

          if (
              analyzed + failed
              < discovered
          ):
              raise SystemExit(
                  "Manifest analysis accounting inconsistency."
              )

          print(
              f"Discovered={discovered}"
          )

          print(
              f"Analyzed={analyzed}"
          )

          print(
              f"Failed={failed}"
          )

          print(
              f"Manifest={manifest_path}"
          )
          PYEOF

      - name: Collect Diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            "${ARTIFACT_ROOT}/logs"

          {
            echo "===== DATE ====="
            date

            echo "===== PWD ====="
            pwd

            echo "===== SYSTEM ====="
            uname -a

            echo "===== CPU ====="
            nproc

            echo "===== MEMORY ====="
            free -h

            echo "===== DISK ====="
            df -h

            echo "===== ENV ====="
            env | sort

            echo "===== ANALYSIS TREE ====="

            if [ -d "${ANALYSIS_ROOT}" ]; then
              find \
                "${ANALYSIS_ROOT}" \
                -maxdepth 6 \
                -type f \
                -printf '%p %s bytes\n' \
                | sort
            else
              echo "ANALYSIS_ROOT does not exist"
            fi

            echo "===== ARTIFACT TREE ====="

            if [ -d "${ARTIFACT_ROOT}" ]; then
              find \
                "${ARTIFACT_ROOT}" \
                -maxdepth 6 \
                -type f \
                -printf '%p %s bytes\n' \
                | sort
            else
              echo "ARTIFACT_ROOT does not exist"
            fi

          } > \
            "${ARTIFACT_ROOT}/logs/diagnostics.log"

      - name: Upload All Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_full_recursive_analysis
          path: |
            artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Notify Completion
        if: success()
        shell: bash
        run: |
          echo "::notice title=Bootloader Analysis Complete::Recursive extraction, file analysis, disassembly and report generation completed successfully."

      - name: Notify Failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=Bootloader Analysis Failed::The workflow failed after or during analysis. Diagnostic logs and generated artifacts were uploaded."
          exit 1
