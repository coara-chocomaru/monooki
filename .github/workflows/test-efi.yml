                  )

              output.write(
                  "</div>\n"
              )

              output.write(
                  "<p>"
                  "<a href='FULL_ANALYSIS_REPORT.md'>"
                  "FULL_ANALYSIS_REPORT.md"
                  "</a>"
                  "</p>\n"
              )

              output.write(
                  "<p>"
                  "<a href='../analysis_manifest.json'>"
                  "analysis_manifest.json"
                  "</a>"
                  "</p>\n"
              )

              output.write(
                  "<p>"
                  "<a href='../analysis_index.csv'>"
                  "analysis_index.csv"
                  "</a>"
                  "</p>\n"
              )

              output.write(
                  "<table>\n"
              )

              output.write(
                  "<thead>"
                  "<tr>"
                  "<th>#</th>"
                  "<th>Depth</th>"
                  "<th>File</th>"
                  "<th>Size</th>"
                  "<th>Entropy</th>"
                  "<th>Functions</th>"
                  "<th>Unlock</th>"
                  "<th>Fastboot</th>"
                  "<th>Vendor</th>"
                  "<th>OEM</th>"
                  "</tr>"
                  "</thead>\n"
              )

              output.write(
                  "<tbody>\n"
              )

              for item in files:
                  output.write(
                      "<tr>"
                      f"<td>{html.escape(str(item.get('sequence', '')))}</td>"
                      f"<td>{html.escape(str(item.get('depth', '')))}</td>"
                      f"<td>{html.escape(str(item.get('relative_name', '')))}</td>"
                      f"<td>{html.escape(str(item.get('size', '')))}</td>"
                      f"<td>{html.escape(str(item.get('entropy', '')))}</td>"
                      f"<td>{html.escape(str(item.get('function_count', '')))}</td>"
                      f"<td>{html.escape(str(item.get('unlock_match_count', '')))}</td>"
                      f"<td>{html.escape(str(item.get('fastboot_match_count', '')))}</td>"
                      f"<td>{html.escape(str(item.get('vendor_match_count', '')))}</td>"
                      f"<td>{html.escape(str(item.get('oem_match_count', '')))}</td>"
