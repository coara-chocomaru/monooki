name: QCOM Bootloader Full Recursive Disassembly & Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      zip_url:
        description: ZIP URL
        required: false
        type: string
        default: https://github.com/coara-chocomaru/monooki/raw/refs/heads/main/wish2.zip

jobs:
  full-disassembly:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:22.04
      options: --privileged

    env:
      ZIP_URL: ${{ github.event.inputs.zip_url || 'https://github.com/coara-chocomaru/monooki/raw/refs/heads/main/wish2.zip' }}
      ANALYSIS_ROOT: ${{ github.workspace }}/analysis
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts
      PYTHONUNBUFFERED: "1"
      PATH: /usr/local/bin:/usr/bin:/bin
      LD_LIBRARY_PATH: /usr/local/lib:/usr/lib:/lib

    steps:
      - name: Prepare Artifact Directory
        shell: bash
        run: |
          set -e

          mkdir -p \
            "${ANALYSIS_ROOT}/input" \
            "${ANALYSIS_ROOT}/files" \
            "${ANALYSIS_ROOT}/extracted" \
            "${ANALYSIS_ROOT}/work" \
            "${ARTIFACT_ROOT}" \
            "${ARTIFACT_ROOT}/logs" \
            "${ARTIFACT_ROOT}/reports" \
            "${ARTIFACT_ROOT}/reports/files" \
            "${ARTIFACT_ROOT}/reports/disassembly" \
            "${ARTIFACT_ROOT}/raw"

          printf '%s\n' \
            "workflow_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "${ARTIFACT_ROOT}/logs/workflow_status.txt"

          printf '%s\n' \
            "ZIP_URL=${ZIP_URL}" \
            >> "${ARTIFACT_ROOT}/logs/workflow_status.txt"

      - name: Install Base Packages
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y

          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            git \
            libc-bin \
            libgcc-s1 \
            libstdc++6

          apt-get clean

          rm -rf /var/lib/apt/lists/*

          command -v ldconfig
          ldconfig --version

          command -v curl
          command -v wget
          command -v git

      - name: Install Analysis Packages
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y

          apt-get install -y --no-install-recommends \
            unzip \
            zip \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            zstd \
            lz4 \
            p7zip-full \
            file \
            binutils \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            pkg-config \
            autoconf \
            automake \
            libtool \
            python3 \
            python3-pip \
            python3-dev \
            python3-setuptools \
            python3-wheel \
            python3-venv \
            default-jdk-headless \
            binwalk \
            liblzma-dev \
            libmagic1 \
            gdb-multiarch \
            qemu-user-static \
            bsdmainutils \
            bsdextrautils \
            libc-bin

          apt-get clean

          rm -rf /var/lib/apt/lists/*

          command -v python3
          command -v pip3
          command -v file
          command -v 7z
          command -v tar
          command -v xz
          command -v ldconfig

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Environment
        shell: bash
        run: |
          set -e

          {
            echo "===== DATE ====="
            date -u

            echo "===== UNAME ====="
            uname -a

            echo "===== CPU ====="
            nproc

            echo "===== MEMORY ====="
            free -h

            echo "===== DISK ====="
            df -h

            echo "===== PYTHON ====="
            python3 --version

            echo "===== GCC ====="
            gcc --version | head -n 1

            echo "===== MAKE ====="
            make --version | head -n 1

            echo "===== FILE ====="
            file --version | head -n 1

            echo "===== LD CONFIG ====="
            ldconfig --version | head -n 1

            echo "===== RADARE PATH ====="
            echo "${PATH}"

            echo "===== LIBRARY PATH ====="
            echo "${LD_LIBRARY_PATH}"

          } | tee \
            "${ARTIFACT_ROOT}/logs/environment.txt"

      - name: Install Radare2
        shell: bash
        run: |
          set -e

          rm -rf /tmp/radare2

          git clone \
            --depth 1 \
            https://github.com/radareorg/radare2.git \
            /tmp/radare2

          cd /tmp/radare2

          ./configure \
            --prefix=/usr/local

          make -j"$(nproc)"

          make install

          cd /

          rm -rf /tmp/radare2

          mkdir -p \
            /usr/local/lib \
            /usr/local/bin

          ldconfig

          export PATH="/usr/local/bin:${PATH}"
          export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"

          command -v r2
          command -v rabin2
          command -v rabin2
          command -v rasm2

          r2 -v
          rabin2 -v
          rabin2 -L

      - name: Install Python Libraries
        shell: bash
        run: |
          set -e

          python3 -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python3 -m pip install \
            r2pipe \
            pefile \
            capstone \
            pyelftools \
            pycryptodome \
            unicorn \
            python-magic

          python3 - <<'PYEOF'
          import importlib

          modules = [
              "r2pipe",
              "pefile",
              "capstone",
              "elftools",
              "Crypto",
              "unicorn",
              "magic"
          ]

          for module in modules:
              importlib.import_module(module)
              print(f"OK: {module}")
          PYEOF

      - name: Download ZIP
        shell: bash
        run: |
          set -e

          if [ -z "${ZIP_URL}" ]; then
            echo "ZIP_URL is empty."
            exit 10
          fi

          rm -f \
            "${ANALYSIS_ROOT}/input/source.zip"

          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 3600 \
            --output \
            "${ANALYSIS_ROOT}/input/source.zip" \
            "${ZIP_URL}"

          test -f \
            "${ANALYSIS_ROOT}/input/source.zip"

          ZIP_SIZE="$(stat -c '%s' "${ANALYSIS_ROOT}/input/source.zip")"

          if [ "${ZIP_SIZE}" -le 0 ]; then
            echo "Downloaded ZIP is empty."
            exit 11
          fi

          file \
            "${ANALYSIS_ROOT}/input/source.zip"

          sha256sum \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee \
            "${ARTIFACT_ROOT}/logs/source_sha256.txt"

          md5sum \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee \
            "${ARTIFACT_ROOT}/logs/source_md5.txt"

          stat \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee \
            "${ARTIFACT_ROOT}/logs/source_stat.txt"

          unzip \
            -t \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee \
            "${ARTIFACT_ROOT}/logs/zip_test.txt"

      - name: Create Recursive Analysis Script
        shell: bash
        run: |
          set -e

          cat > /tmp/recursive_analysis.py <<'PYEOF'
          #!/usr/bin/env python3

          import os
          import sys
          import json
          import math
          import shutil
          import hashlib
          import subprocess
          import zipfile
          import tarfile
          import gzip
          import bz2
          import lzma
          import re
          import mimetypes
          import traceback

          from pathlib import Path
          from collections import deque

          import r2pipe

          ROOT = Path(
              os.environ["ANALYSIS_ROOT"]
          )

          ARTIFACT_ROOT = Path(
              os.environ["ARTIFACT_ROOT"]
          )

          INPUT = (
              ROOT
              / "input"
              / "source.zip"
          )

          FILE_ROOT = (
              ROOT
              / "files"
          )

          EXTRACT_ROOT = (
              ROOT
              / "extracted"
          )

          WORK_ROOT = (
              ROOT
              / "work"
          )

          REPORT_ROOT = (
              ARTIFACT_ROOT
              / "reports"
          )

          REPORT_FILES_ROOT = (
              REPORT_ROOT
              / "files"
          )

          REPORT_DISASM_ROOT = (
              REPORT_ROOT
              / "disassembly"
          )

          RAW_ROOT = (
              ARTIFACT_ROOT
              / "raw"
          )

          LOG_ROOT = (
              ARTIFACT_ROOT
              / "logs"
          )

          MAX_ARCHIVE_DEPTH = 32
          MAX_FILES = 100000
          MAX_DECOMPRESSED_FILE_SIZE = 1024 * 1024 * 1024
          MAX_STRING_OUTPUT = 2000000
          READ_CHUNK = 1024 * 1024

          FASTBOOT_KEYWORDS = [
              "flash",
              "erase",
              "reboot",
              "getvar",
              "setvar",
              "oem",
              "download",
              "continue",
              "boot",
              "update",
              "unlock",
              "lock",
              "device_state",
              "secure",
              "critical",
              "slot",
              "partition",
              "flag",
              "userdata",
              "recovery",
              "system",
              "vendor",
              "product",
              "modem",
              "xbl",
              "abl",
              "sbl",
              "tz",
              "hyp",
              "devcfg",
              "vbmeta",
              "super"
          ]

          UNLOCK_KEYWORDS = [
              "unlock",
              "locked",
              "unlocked",
              "oem_unlock",
              "device_locked",
              "device_unlocked",
              "lock_state",
              "secure_boot",
              "unlock_ability",
              "allow_unlock",
              "unlock_code",
              "unlock-go",
              "unlock_go",
              "is_unlocked",
              "is_locked",
              "flashing_unlock",
              "get_unlock_ability"
          ]

          VENDOR_KEYWORDS = [
              "qualcomm",
              "qcom",
              "snapdragon",
              "littlekernel",
              "fastboot",
              "firehose",
              "sahara",
              "edl",
              "smem",
              "rpm",
              "tz",
              "hyp",
              "devcfg",
              "uefi",
              "xbl",
              "abl"
          ]

          OEM_COMMAND_PATTERNS = [
              r"oem\s+unlock",
              r"oem\s+lock",
              r"oem\s+device-info",
              r"oem\s+getvar",
              r"oem\s+setvar",
              r"fastboot\s+oem",
              r"androidboot\.unlocked",
              r"androidboot\.verifiedbootstate",
              r"ro\.oem_unlock",
              r"oem\s+unlock-go",
              r"oem\s+set",
              r"oem\s+flag",
              r"unlock-go",
              r"unlock_go",
              r"flashing\s+unlock",
              r"get_unlock_ability",
              r"allow_unlock"
          ]

          FILE_MAGIC_PATTERNS = {
              "elf": b"\x7fELF",
              "pe": b"MZ",
              "zip": b"PK\x03\x04",
              "gzip": b"\x1f\x8b",
              "bzip2": b"BZh",
              "xz": b"\xfd7zXZ\x00",
              "7z": b"7z\xbc\xaf\x27\x1c",
              "png": b"\x89PNG\r\n\x1a\n",
              "jpeg": b"\xff\xd8\xff",
              "bmp": b"BM",
              "pdf": b"%PDF",
              "sqlite": b"SQLite format 3\x00"
          }

          def run_command(
              command,
              timeout=300,
              cwd=None
          ):
              try:
                  process = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=timeout,
                      cwd=cwd
                  )

                  return (
                      process.returncode,
                      process.stdout
                  )

              except subprocess.TimeoutExpired as exc:
                  output = (
                      exc.stdout
                      if isinstance(
                          exc.stdout,
                          str
                      )
                      else ""
                  )

                  return (
                      124,
                      output
                      + "\nTIMEOUT\n"
                  )

              except Exception as exc:
                  return (
                      125,
                      str(exc)
                  )

          def safe_name(
              value,
              limit=180
          ):
              value = str(
                  value
              )

              value = value.replace(
                  "\\",
                  "_"
              )

              value = value.replace(
                  "/",
                  "_"
              )

              value = re.sub(
                  r"[^A-Za-z0-9._@+-]+",
                  "_",
                  value
              )

              value = value.strip(
                  "._"
              )

              if not value:
                  value = "file"

              return value[
                  :limit
              ]

          def sha256_file(
              path
          ):
              digest = hashlib.sha256()

              with open(
                  path,
                  "rb"
              ) as source:
                  while True:
                      chunk = source.read(
                          READ_CHUNK
                      )

                      if not chunk:
                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()

          def md5_file(
              path
          ):
              digest = hashlib.md5()

              with open(
                  path,
                  "rb"
              ) as source:
                  while True:
                      chunk = source.read(
                          READ_CHUNK
                      )

                      if not chunk:
                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()

          def calculate_entropy(
              path
          ):
              counts = [
                  0
                  for _ in range(256)
              ]

              total = 0

              with open(
                  path,
                  "rb"
              ) as source:
                  while True:
                      chunk = source.read(
                          READ_CHUNK
                      )

                      if not chunk:
                          break

                      total += len(
                          chunk
                      )

                      for value in chunk:
                          counts[value] += 1

              if total == 0:
                  return 0.0

              result = 0.0

              for count in counts:
                  if count:
                      probability = (
                          count
                          / total
                      )

                      result -= (
                          probability
                          * math.log2(
                              probability
                          )
                      )

              return result

          def calculate_block_entropy(
              data
          ):
              if not data:
                  return 0.0

              counts = [
                  0
                  for _ in range(256)
              ]

              for value in data:
                  counts[value] += 1

              total = len(
                  data
              )

              result = 0.0

              for count in counts:
                  if count:
                      probability = (
                          count
                          / total
                      )

                      result -= (
                          probability
                          * math.log2(
                              probability
                          )
                      )

              return result

          def entropy_regions(
              path,
              block_size=65536,
              threshold=7.0
          ):
              result = []
              offset = 0

              with open(
                  path,
                  "rb"
              ) as source:
                  while True:
                      block = source.read(
                          block_size
                      )

                      if not block:
                          break

                      value = (
                          calculate_block_entropy(
                              block
                          )
                      )

                      if value >= threshold:
                          result.append(
                              {
                                  "offset": offset,
                                  "size": len(
                                      block
                                  ),
                                  "entropy": round(
                                      value,
                                      6
                                  )
                              }
                          )

                      offset += len(
                          block
                      )

              return result

          def hex_preview(
              path,
              size=4096
          ):
              with open(
                  path,
                  "rb"
              ) as source:
                  data = source.read(
                      size
                  )

              result = []

              for index in range(
                  0,
                  len(data),
                  16
              ):
                  block = data[
                      index:index + 16
                  ]

                  hex_part = " ".join(
                      f"{value:02x}"
                      for value in block
                  )

                  ascii_part = "".join(
                      chr(value)
                      if 32 <= value <= 126
                      else "."
                      for value in block
                  )

                  result.append(
                      f"{index:08x}  "
                      f"{hex_part:<47}  "
                      f"{ascii_part}"
                  )

              return "\n".join(
                  result
              )

          def initial_magic(
              path
          ):
              try:
                  with open(
                      path,
                      "rb"
                  ) as source:
                      data = source.read(
                          64
                      )

                  for name, magic in FILE_MAGIC_PATTERNS.items():
                      if data.startswith(
                          magic
                      ):
                          return name

              except Exception:
                  pass

              return "unknown"

          def detect_file(
              path
          ):
              code, output = run_command(
                  [
                      "file",
                      "-b",
                      path
                  ],
                  timeout=60
              )

              mime_code, mime_output = run_command(
                  [
                      "file",
                      "-b",
                      "--mime",
                      path
                  ],
                  timeout=60
              )

              return {
                  "description": output.strip(),
                  "description_exit_code": code,
                  "mime": mime_output.strip(),
                  "mime_exit_code": mime_code,
                  "magic_prefix": initial_magic(
                      path
                  )
              }

          def extract_strings(
              path
          ):
              code_ascii, ascii_output = run_command(
                  [
                      "strings",
                      "-a",
                      "-n",
                      "4",
                      "-t",
                      "x",
                      path
                  ],
                  timeout=1200
              )

              code_utf16, utf16_output = run_command(
                  [
                      "strings",
                      "-a",
                      "-el",
                      "-n",
                      "4",
                      "-t",
                      "x",
                      path
                  ],
                  timeout=1200
              )

              if len(ascii_output) > MAX_STRING_OUTPUT:
                  ascii_output = ascii_output[
                      :MAX_STRING_OUTPUT
                  ]

              if len(utf16_output) > MAX_STRING_OUTPUT:
                  utf16_output = utf16_output[
                      :MAX_STRING_OUTPUT
                  ]

              return {
                  "ascii": ascii_output,
                  "utf16le": utf16_output,
                  "ascii_exit_code": code_ascii,
                  "utf16le_exit_code": code_utf16
              }

          def safe_extract_path(
              destination,
              name
          ):
              destination_real = os.path.realpath(
                  destination
              )

              target_real = os.path.realpath(
                  os.path.join(
                      destination,
                      name
                  )
              )

              return (
                  target_real == destination_real
                  or target_real.startswith(
                      destination_real
                      + os.sep
                  )
              )

          def extract_zip(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              result = []

              with zipfile.ZipFile(
                  path,
                  "r"
              ) as archive:

                  for member in archive.infolist():
                      name = member.filename

                      if not safe_extract_path(
                          destination,
                          name
                      ):
                          continue

                      target = os.path.join(
                          destination,
                          name
                      )

                      if member.is_dir():
                          os.makedirs(
                              target,
                              exist_ok=True
                          )

                          continue

                      os.makedirs(
                          os.path.dirname(
                              target
                          ),
                          exist_ok=True
                      )

                      with archive.open(
                          member,
                          "r"
                      ) as source:
                          with open(
                              target,
                              "wb"
                          ) as output:
                              shutil.copyfileobj(
                                  source,
                                  output,
                                  READ_CHUNK
                              )

                      if not os.path.isfile(
                          target
                      ):
                          continue

                      size = os.path.getsize(
                          target
                      )

                      if (
                          size
                          <= MAX_DECOMPRESSED_FILE_SIZE
                      ):
                          result.append(
                              target
                          )

              return result

          def extract_tar(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              result = []

              with tarfile.open(
                  path,
                  "r:*"
              ) as archive:

                  for member in archive.getmembers():

                      if (
                          member.issym()
                          or member.islnk()
                          or member.isdev()
                      ):
                          continue

                      if not safe_extract_path(
                          destination,
                          member.name
                      ):
                          continue

                      target = os.path.join(
                          destination,
                          member.name
                      )

                      if member.isdir():
                          os.makedirs(
                              target,
                              exist_ok=True
                          )

                          continue

                      source = archive.extractfile(
                          member
                      )

                      if source is None:
                          continue

                      os.makedirs(
                          os.path.dirname(
                              target
                          ),
                          exist_ok=True
                      )

                      with source:
                          with open(
                              target,
                              "wb"
                          ) as output:
                              shutil.copyfileobj(
                                  source,
                                  output,
                                  READ_CHUNK
                              )

                      if not os.path.isfile(
                          target
                      ):
                          continue

                      size = os.path.getsize(
                          target
                      )

                      if (
                          size
                          <= MAX_DECOMPRESSED_FILE_SIZE
                      ):
                          result.append(
                              target
                          )

              return result

          def extract_7z(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              code, output = run_command(
                  [
                      "7z",
                      "x",
                      "-y",
                      "-bd",
                      f"-o{destination}",
                      path
                  ],
                  timeout=1800
              )

              result = []

              if code != 0:
                  return (
                      result,
                      code,
                      output
                  )

              for root, _, filenames in os.walk(
                  destination
              ):
                  for filename in filenames:
                      current = os.path.join(
                          root,
                          filename
                      )

                      if not os.path.isfile(
                          current
                      ):
                          continue

                      try:
                          size = os.path.getsize(
                              current
                          )
                      except Exception:
                          continue

                      if (
                          size
                          <= MAX_DECOMPRESSED_FILE_SIZE
                      ):
                          result.append(
                              current
                          )

              return (
                  result,
                  code,
                  output
              )

          def extract_stream(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              try:
                  with open(
                      path,
                      "rb"
                  ) as source:
                      magic = source.read(
                          16
                      )
              except Exception:
                  return []

              if magic.startswith(
                  b"\x1f\x8b"
              ):
                  opener = gzip.open

              elif magic.startswith(
                  b"BZh"
              ):
                  opener = bz2.open

              elif magic.startswith(
                  b"\xfd7zXZ\x00"
              ):
                  opener = lzma.open

              else:
                  return []

              output_path = (
                  Path(destination)
                  / (
                      safe_name(
                          Path(path).name
                      )
                      + ".decompressed"
                  )
              )

              try:
                  with opener(
                      path,
                      "rb"
                  ) as source:
                      with open(
                          output_path,
                          "wb"
                      ) as output:
                          total = 0

                          while True:
                              chunk = source.read(
                                  READ_CHUNK
                              )

                              if not chunk:
                                  break

                              total += len(
                                  chunk
                              )

                              if (
                                  total
                                  > MAX_DECOMPRESSED_FILE_SIZE
                              ):
                                  raise RuntimeError(
                                      "Decompressed size limit exceeded"
                                  )

                              output.write(
                                  chunk
                              )

                  if (
                      not output_path.is_file()
                      or output_path.stat().st_size <= 0
                  ):
                      return []

                  return [
                      str(output_path)
                  ]

              except Exception:
                  try:
                      output_path.unlink(
                          missing_ok=True
                      )
                  except Exception:
                      pass

                  return []

          def extract_binwalk(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              code, output = run_command(
                  [
                      "binwalk",
                      "-Me",
                      "--run-as=root",
                      "--directory=" + destination,
                      path
                  ],
                  timeout=1800
              )

              result = []

              for root, _, filenames in os.walk(
                  destination
              ):
                  for filename in filenames:
                      current = os.path.join(
                          root,
                          filename
                      )

                      if not os.path.isfile(
                          current
                      ):
                          continue

                      try:
                          size = os.path.getsize(
                              current
                          )
                      except Exception:
                          continue

                      if (
                          size
                          <= MAX_DECOMPRESSED_FILE_SIZE
                      ):
                          result.append(
                              current
                          )

              return (
                  result,
                  code,
                  output
              )

          def extract_recursive_layers(
              source_path,
              relative_name,
              depth,
              known_hashes,
              extraction_records
          ):
              if depth > MAX_ARCHIVE_DEPTH:
                  return []

              generated = []

              source_hash = sha256_file(
                  source_path
              )

              if source_hash in known_hashes:
                  return []

              known_hashes.add(
                  source_hash
              )

              base = (
                  EXTRACT_ROOT
                  / (
                      f"{source_hash[:16]}_"
                      f"{safe_name(relative_name)}"
                  )
              )

              base.mkdir(
                  parents=True,
                  exist_ok=True
              )

              try:
                  if zipfile.is_zipfile(
                      source_path
                  ):
                      destination = (
                          base
                          / "zip"
                      )

                      try:
                          files = extract_zip(
                              source_path,
                              destination
                          )

                          generated.extend(
                              files
                          )

                          extraction_records.append(
                              {
                                  "source": source_path,
                                  "depth": depth,
                                  "method": "zip",
                                  "success": True,
                                  "count": len(
                                      files
                                  )
                              }
                          )

                      except Exception as exc:
                          extraction_records.append(
                              {
                                  "source": source_path,
                                  "depth": depth,
                                  "method": "zip",
                                  "success": False,
                                  "count": 0,
                                  "error": str(exc)
                              }
                          )

              except Exception as exc:
                  extraction_records.append(
                      {
                          "source": source_path,
                          "depth": depth,
                          "method": "zip_detection",
                          "success": False,
                          "count": 0,
                          "error": str(exc)
                      }
                  )

              try:
                  if tarfile.is_tarfile(
                      source_path
                  ):
                      destination = (
                          base
                          / "tar"
                      )

                      try:
                          files = extract_tar(
                              source_path,
                              destination
                          )

                          generated.extend(
                              files
                          )

                          extraction_records.append(
                              {
                                  "source": source_path,
                                  "depth": depth,
                                  "method": "tar",
                                  "success": True,
                                  "count": len(
                                      files
                                  )
                              }
                          )

                      except Exception as exc:
                          extraction_records.append(
                              {
                                  "source": source_path,
                                  "depth": depth,
                                  "method": "tar",
                                  "success": False,
                                  "count": 0,
                                  "error": str(exc)
                              }
                          )

              except Exception:
                  pass

              try:
                  with open(
                      source_path,
                      "rb"
                  ) as source:
                      magic = source.read(
                          16
                      )

                  if magic.startswith(
                      b"7z\xbc\xaf\x27\x1c"
                  ):
                      destination = (
                          base
                          / "7z"
                      )

                      (
                          files,
                          code,
                          output
                      ) = extract_7z(
                          source_path,
                          destination
                      )

                      generated.extend(
                          files
                      )

                      extraction_records.append(
                          {
                              "source": source_path,
                              "depth": depth,
                              "method": "7z",
                              "success": code == 0,
                              "count": len(
                                  files
                              ),
                              "output": output[
                                  -20000:
                              ]
                          }
                      )

              except Exception:
                  pass

              try:
                  destination = (
                      base
                      / "stream"
                  )

                  files = extract_stream(
                      source_path,
                      destination
                  )

                  generated.extend(
                      files
                  )

                  extraction_records.append(
                      {
                          "source": source_path,
                          "depth": depth,
                          "method": "stream",
                          "success": bool(
                              files
                          ),
                          "count": len(
                              files
                          )
                      }
                  )

              except Exception:
                  pass

              try:
                  destination = (
                      base
                      / "binwalk"
                  )

                  (
                      files,
                      code,
                      output
                  ) = extract_binwalk(
                      source_path,
                      destination
                  )

                  generated.extend(
                      files
                  )

                  extraction_records.append(
                      {
                          "source": source_path,
                          "depth": depth,
                          "method": "binwalk",
                          "success": code == 0,
                          "count": len(
                              files
                          ),
                          "output": output[
                              -20000:
                          ]
                      }
                  )

              except Exception as exc:
                  extraction_records.append(
                      {
                          "source": source_path,
                          "depth": depth,
                          "method": "binwalk",
                          "success": False,
                          "count": 0,
                          "error": str(exc)
                      }
                  )

              unique = []
              local_hashes = set()

              for generated_path in generated:
                  if not os.path.isfile(
                      generated_path
                  ):
                      continue

                  try:
                      generated_hash = (
                          sha256_file(
                              generated_path
                          )
                      )
                  except Exception:
                      continue

                  if generated_hash == source_hash:
                      continue

                  if generated_hash in local_hashes:
                      continue

                  if generated_hash in known_hashes:
                      continue

                  local_hashes.add(
                      generated_hash
                  )

                  unique.append(
                      {
                          "path": generated_path,
                          "parent": source_path,
                          "depth": depth + 1,
                          "sha256": generated_hash
                      }
                  )

              return unique

          def r2_json(
              r2,
              command
          ):
              try:
                  value = r2.cmdj(
                      command
                  )

                  if value is None:
                      return []

                  return value

              except Exception:
                  return []

          def analyze_with_r2(
              path,
              base_name
          ):
              result = {
                  "available": False,
                  "open_error": None,
                  "analysis_error": None,
                  "info": {},
                  "sections": [],
                  "symbols": [],
                  "imports": [],
                  "exports": [],
                  "strings": [],
                  "entrypoints": [],
                  "functions": [],
                  "function_count": 0,
                  "disassembly_file": None,
                  "entry_disassembly_file": None
              }

              try:
                  r2 = r2pipe.open(
                      str(path),
                      flags=[
                          "-2"
                      ]
                  )

              except Exception as exc:
                  result[
                      "open_error"
                  ] = str(exc)

                  return result

              result[
                  "available"
              ] = True

              try:
                  result[
                      "info"
                  ] = r2_json(
                      r2,
                      "ij"
                  )

                  result[
                      "sections"
                  ] = r2_json(
                      r2,
                      "iSj"
                  )

                  result[
                      "symbols"
                  ] = r2_json(
                      r2,
                      "isj"
                  )

                  result[
                      "imports"
                  ] = r2_json(
                      r2,
                      "iij"
                  )

                  result[
                      "exports"
                  ] = r2_json(
                      r2,
                      "iEj"
                  )

                  result[
                      "strings"
                  ] = r2_json(
                      r2,
                      "izzj"
                  )

                  result[
                      "entrypoints"
                  ] = r2_json(
                      r2,
                      "iej"
                  )

                  for command in [
                      "aaa",
                      "aac",
                      "aav",
                      "aaf"
                  ]:
                      try:
                          r2.cmd(
                              command
                          )
                      except Exception:
                          pass

                  result[
                      "functions"
                  ] = r2_json(
                      r2,
                      "aflj"
                  )

                  if not isinstance(
                      result[
                          "functions"
                      ],
                      list
                  ):
                      result[
                          "functions"
                      ] = []

                  result[
                      "function_count"
                  ] = len(
                      result[
                          "functions"
                      ]
                  )

                  disassembly_path = (
                      REPORT_DISASM_ROOT
                      / f"{base_name}.asm"
                  )

                  disassembly_path.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with open(
                      disassembly_path,
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  ) as output:

                      output.write(
                          "===== FILE =====\n"
                      )

                      output.write(
                          str(path)
                      )

                      output.write(
                          "\n\n"
                      )

                      for index, function in enumerate(
                          result[
                              "functions"
                          ]
                      ):

                          address = function.get(
                              "offset",
                              function.get(
                                  "addr"
                              )
                          )

                          if address is None:
                              continue

                          name = str(
                              function.get(
                                  "name",
                                  ""
                              )
                          )

                          output.write(
                              "\n"
                              + "=" * 120
                              + "\n"
                          )

                          output.write(
                              f"INDEX={index}\n"
                          )

                          output.write(
                              f"ADDRESS={address:#x}\n"
                          )

                          output.write(
                              f"NAME={name}\n"
                          )

                          output.write(
                              "=" * 120
                              + "\n"
                          )

                          try:
                              disassembly = r2.cmd(
                                  f"pdf @ {address}"
                              )
                          except Exception as exc:
                              disassembly = (
                                  "DISASSEMBLY_ERROR: "
                                  + str(exc)
                                  + "\n"
                              )

                          output.write(
                              disassembly
                          )

                          output.write(
                              "\n"
                          )

                  result[
                      "disassembly_file"
                  ] = str(
                      disassembly_path
                  )

                  entry_path = (
                      REPORT_DISASM_ROOT
                      / f"{base_name}_entry.asm"
                  )

                  entry_path.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  entry_text = ""

                  try:
                      entry_text = r2.cmd(
                          "pd 1024 @ entry0"
                      )

                  except Exception:
                      try:
                          entry_text = r2.cmd(
                              "pd 1024 @ eip"
                          )

                      except Exception as exc:
                          entry_text = str(
                              exc
                          )

                  with open(
                      entry_path,
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  ) as output:
                      output.write(
                          entry_text
                      )

                  result[
                      "entry_disassembly_file"
                  ] = str(
                      entry_path
                  )

              except Exception as exc:
                  result[
                      "analysis_error"
                  ] = str(exc)

              finally:
                  try:
                      r2.quit()
                  except Exception:
                      pass

              return result

          def match_strings(
              strings
          ):
              result = {
                  "fastboot": [],
                  "unlock": [],
                  "vendor": [],
                  "oem": []
              }

              if not isinstance(
                  strings,
                  list
              ):
                  return result

              for entry in strings:
                  if not isinstance(
                      entry,
                      dict
                  ):
                      continue

                  text = str(
                      entry.get(
                          "string",
                          ""
                      )
                  )

                  lower = text.lower()

                  address = entry.get(
                      "vaddr",
                      entry.get(
                          "paddr",
                          entry.get(
                              "addr"
                          )
                      )
                  )

                  for keyword in FASTBOOT_KEYWORDS:
                      if keyword in lower:
                          result[
                              "fastboot"
                          ].append(
                              {
                                  "address": address,
                                  "keyword": keyword,
                                  "string": text
                              }
                          )

                          break

                  for keyword in UNLOCK_KEYWORDS:
                      if keyword in lower:
                          result[
                              "unlock"
                          ].append(
                              {
                                  "address": address,
                                  "keyword": keyword,
                                  "string": text
                              }
                          )

                          break

                  for keyword in VENDOR_KEYWORDS:
                      if keyword in lower:
                          result[
                              "vendor"
                          ].append(
                              {
                                  "address": address,
                                  "keyword": keyword,
                                  "string": text
                              }
                          )

                          break

                  for pattern in OEM_COMMAND_PATTERNS:
                      try:
                          if re.search(
                              pattern,
                              lower
                          ):
                              result[
                                  "oem"
                              ].append(
                                  {
                                      "address": address,
                                      "pattern": pattern,
                                      "string": text
                                  }
                              )

                              break

                      except Exception:
                          pass

              return result

          def partition_candidates(
              strings
          ):
              keywords = [
                  "partition",
                  "xbl",
                  "xbl_config",
                  "abl",
                  "aop",
                  "boot",
                  "vendor_boot",
                  "system",
                  "system_ext",
                  "product",
                  "userdata",
                  "cache",
                  "recovery",
                  "misc",
                  "modem",
                  "modemst1",
                  "modemst2",
                  "fsg",
                  "persist",
                  "metadata",
                  "super",
                  "vbmeta",
                  "vbmeta_system",
                  "vbmeta_vendor",
                  "dtbo",
                  "devcfg",
                  "rpm",
                  "tz",
                  "hyp",
                  "keymaster",
                  "frp"
              ]

              result = set()

              if not isinstance(
                  strings,
                  list
              ):
                  return []

              for entry in strings:
                  if not isinstance(
                      entry,
                      dict
                  ):
                      continue

                  text = str(
                      entry.get(
                          "string",
                          ""
                      )
                  )

                  lower = text.lower()

                  if any(
                      keyword in lower
                      for keyword in keywords
                  ):
                      result.add(
                          text
                      )

              return sorted(
                  result
              )

          def analyze_file(
              path,
              relative_name,
              sequence,
              parent,
              depth
          ):
              file_hash = sha256_file(
                  path
              )

              file_md5 = md5_file(
                  path
              )

              size = os.path.getsize(
                  path
              )

              base_name = (
                  f"{sequence:06d}_"
                  f"{safe_name(relative_name)}_"
                  f"{file_hash[:16]}"
              )

              raw_dir = (
                  RAW_ROOT
                  / base_name
              )

              raw_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              report_json = (
                  REPORT_FILES_ROOT
                  / f"{base_name}.json"
              )

              report_markdown = (
                  REPORT_FILES_ROOT
                  / f"{base_name}.md"
              )

              report_json.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              report_markdown.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              detection = detect_file(
                  path
              )

              strings = extract_strings(
                  path
              )

              with open(
                  raw_dir
                  / "ascii_strings.txt",
                  "w",
                  encoding="utf-8",
                  errors="replace"
              ) as output:
                  output.write(
                      strings[
                          "ascii"
                      ]
                  )

              with open(
                  raw_dir
                  / "utf16le_strings.txt",
                  "w",
                  encoding="utf-8",
                  errors="replace"
              ) as output:
                  output.write(
                      strings[
                          "utf16le"
                      ]
                  )

              with open(
                  raw_dir
                  / "hex_preview.txt",
                  "w",
                  encoding="utf-8"
              ) as output:
                  output.write(
                      hex_preview(
                          path
                      )
                  )

              try:
                  entropy = calculate_entropy(
                      path
                  )
              except Exception:
                  entropy = 0.0

              try:
                  entropy_blocks = entropy_regions(
                      path
                  )
              except Exception:
                  entropy_blocks = []

              r2 = analyze_with_r2(
                  path,
                  base_name
              )

              matches = match_strings(
                  r2.get(
                      "strings",
                      []
                  )
              )

              partitions = partition_candidates(
                  r2.get(
                      "strings",
                      []
                  )
              )

              original_copy = None

              if size <= 64 * 1024 * 1024:
                  target = (
                      raw_dir
                      / "original.bin"
                  )

                  try:
                      shutil.copy2(
                          path,
                          target
                      )

                      original_copy = str(
                          target
                      )

                  except Exception:
                      original_copy = None

              result = {
                  "sequence": sequence,
                  "relative_name": relative_name,
                  "path": path,
                  "parent": parent,
                  "depth": depth,
                  "size": size,
                  "sha256": file_hash,
                  "md5": file_md5,
                  "file_description": detection[
                      "description"
                  ],
                  "mime": detection[
                      "mime"
                  ],
                  "magic_prefix": detection[
                      "magic_prefix"
                  ],
                  "entropy": entropy,
                  "high_entropy_blocks": entropy_blocks,
                  "high_entropy_block_count": len(
                      entropy_blocks
                  ),
                  "fastboot_matches": matches[
                      "fastboot"
                  ],
                  "unlock_matches": matches[
                      "unlock"
                  ],
                  "vendor_matches": matches[
                      "vendor"
                  ],
                  "oem_matches": matches[
                      "oem"
                  ],
                  "partition_candidates": partitions,
                  "r2": r2,
                  "raw_directory": str(
                      raw_dir
                  ),
                  "ascii_strings": str(
                      raw_dir
                      / "ascii_strings.txt"
                  ),
                  "utf16le_strings": str(
                      raw_dir
                      / "utf16le_strings.txt"
                  ),
                  "hex_preview": str(
                      raw_dir
                      / "hex_preview.txt"
                  ),
                  "original_copy": original_copy,
                  "disassembly_file": r2.get(
                      "disassembly_file"
                  ),
                  "entry_disassembly_file": r2.get(
                      "entry_disassembly_file"
                  )
              }

              with open(
                  report_json,
                  "w",
                  encoding="utf-8"
              ) as output:
                  json.dump(
                      result,
                      output,
                      indent=2,
                      ensure_ascii=False
                  )

              with open(
                  report_markdown,
                  "w",
                  encoding="utf-8"
              ) as output:

                  output.write(
                      "# Recursive File Analysis Report\n\n"
                  )

                  output.write(
                      "## Basic Information\n\n"
                  )

                  output.write(
                      "| Field | Value |\n"
                  )

                  output.write(
                      "|---|---|\n"
                  )

                  output.write(
                      f"| File | `{relative_name}` |\n"
                  )

                  output.write(
                      f"| Size | `{size}` bytes |\n"
                  )

                  output.write(
                      f"| SHA256 | `{file_hash}` |\n"
                  )

                  output.write(
                      f"| MD5 | `{file_md5}` |\n"
                  )

                  output.write(
                      f"| File | `{detection['description']}` |\n"
                  )

                  output.write(
                      f"| MIME | `{detection['mime']}` |\n"
                  )

                  output.write(
                      f"| Magic | `{detection['magic_prefix']}` |\n"
                  )

                  output.write(
                      f"| Entropy | `{entropy:.6f}` |\n"
                  )

                  output.write(
                      f"| Depth | `{depth}` |\n"
                  )

                  output.write(
                      f"| Functions | `{r2.get('function_count', 0)}` |\n"
                  )

                  output.write(
                      "\n"
                  )

                  output.write(
                      "## Fastboot Matches\n\n"
                  )

                  if matches[
                      "fastboot"
