          def main():
              FILE_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              EXTRACT_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              WORK_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              REPORT_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              REPORT_FILES_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              REPORT_DISASM_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              RAW_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              LOG_ROOT.mkdir(
                  parents=True,
                  exist_ok=True
              )

              if not INPUT.exists():
                  print(
                      f"INPUT ZIP NOT FOUND: {INPUT}"
                  )
                  sys.exit(10)

              if not INPUT.is_file():
                  print(
                      f"INPUT ZIP IS NOT A FILE: {INPUT}"
                  )
                  sys.exit(11)

              input_size = INPUT.stat().st_size

              if input_size <= 0:
                  print(
                      f"INPUT ZIP IS EMPTY: {INPUT}"
                  )
                  sys.exit(12)

              initial_destination = (
                  FILE_ROOT / "source"
              )

              initial_destination.mkdir(
                  parents=True,
                  exist_ok=True
              )

              initial_files = []

              try:
                  initial_files = safe_extract_zip(
                      str(INPUT),
                      str(initial_destination)
                  )

              except Exception as exc:
                  print(
                      f"Initial ZIP extraction failed: {exc}"
                  )

                  sys.exit(20)

              if not initial_files:
                  print(
                      "Initial ZIP extraction produced no regular files."
                  )

                  sys.exit(21)

              extraction_log = []

              discovered = []

              seen_hashes = set()

              for item in initial_files:
                  if not os.path.isfile(item):
                      continue

                  try:
                      item_hash = sha256_file(
                          item
                      )

                  except Exception:
                      continue

                  discovered.append(
                      {
                          "path": item,
                          "parent": str(INPUT),
                          "depth": 1,
                          "sha256": item_hash
                      }
                  )

              queue = deque(
                  discovered
              )

              processed_queue_hashes = set()

              while queue:
                  current = queue.popleft()

                  current_path = (
                      current["path"]
                  )

                  current_hash = (
                      current["sha256"]
                  )

                  if current_hash in processed_queue_hashes:
                      continue

                  processed_queue_hashes.add(
                      current_hash
                  )

                  if len(discovered) >= MAX_FILES:
                      break

                  relative_name = os.path.relpath(
                      current_path,
                      str(FILE_ROOT)
                  )

                  before = len(
                      discovered
                  )

                  recursive_extract(
                      current_path,
                      relative_name,
                      int(
                          current.get(
                              "depth",
                              1
                          )
                      ),
                      seen_hashes,
                      discovered,
                      extraction_log
                  )

                  after = len(
                      discovered
                  )

                  if after > before:
                      for item in discovered[
                          before:after
                      ]:
                          item_hash = item[
                              "sha256"
                          ]

                          if (
                              item_hash
                              not in processed_queue_hashes
                          ):
                              queue.append(
                                  item
                              )

              unique_files = []

              unique_file_hashes = set()

              for item in discovered:
                  path = item["path"]

                  if not os.path.isfile(path):
                      continue

                  try:
                      item_hash = sha256_file(
                          path
                      )
                  except Exception:
                      continue

                  if item_hash in unique_file_hashes:
                      continue

                  unique_file_hashes.add(
                      item_hash
                  )

                  unique_files.append(
                      {
                          "path": path,
                          "parent": item.get(
                              "parent"
                          ),
                          "depth": item.get(
                              "depth",
                              0
                          ),
                          "sha256": item_hash
                      }
                  )

                  if len(unique_files) >= MAX_FILES:
                      break

              unique_files.sort(
                  key=lambda item: (
                      int(
                          item.get(
                              "depth",
                              0
                          )
                      ),
                      str(
                          item.get(
                              "path",
                              ""
                          )
                      )
                  )
              )

              summaries = []

              failures = []

              total_files = len(
                  unique_files
              )

              for index, item in enumerate(
                  unique_files,
                  1
              ):
                  path = item["path"]

                  relative_name = os.path.relpath(
                      path,
                      str(FILE_ROOT)
                  )

                  print(
                      f"[{index}/{total_files}] "
                      f"Analyzing {relative_name}",
                      flush=True
                  )

                  try:
                      summary = analyze_file(
                          path,
                          relative_name,
                          index
                      )

                      summary["parent"] = (
                          item.get(
                              "parent"
                          )
                      )

                      summary["depth"] = (
                          item.get(
                              "depth",
                              0
                          )
                      )

                      summaries.append(
                          summary
                      )

                  except Exception as exc:
                      failure = {
                          "sequence": index,
                          "path": path,
                          "relative_name": relative_name,
                          "depth": item.get(
                              "depth",
                              0
                          ),
                          "error": str(exc)
                      }

                      failures.append(
                          failure
                      )

                      with open(
                          LOG_ROOT / "failures.log",
                          "a",
                          encoding="utf-8"
                      ) as f:
                          f.write(
                              json.dumps(
                                  failure,
                                  ensure_ascii=False
                              )
                          )

                          f.write(
                              "\n"
                          )

                      print(
                          f"Analysis failed: {relative_name}: {exc}",
                          flush=True
                      )

              extraction_log_path = (
                  LOG_ROOT
                  / "recursive_extraction.json"
              )

              with open(
                  extraction_log_path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      extraction_log,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              manifest = {
                  "input_zip": str(INPUT),
                  "input_size": input_size,
                  "input_sha256": sha256_file(
                      INPUT
                  ),
                  "analysis_root": str(ROOT),
                  "artifact_root": str(
                      ARTIFACT_ROOT
                  ),
                  "max_archive_depth": MAX_ARCHIVE_DEPTH,
                  "max_files": MAX_FILES,
                  "max_decompressed_file_size": MAX_DECOMPRESSED_FILE_SIZE,
                  "file_count_discovered": len(
                      unique_files
                  ),
                  "file_count_analyzed": len(
                      summaries
                  ),
                  "file_count_failed": len(
                      failures
                  ),
                  "files": summaries,
                  "failures": failures
              }

              manifest_path = (
                  ARTIFACT_ROOT
                  / "analysis_manifest.json"
              )

              with open(
                  manifest_path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      manifest,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              csv_path = (
                  ARTIFACT_ROOT
                  / "analysis_index.csv"
              )

              with open(
                  csv_path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "sequence,depth,relative_name,size,"
                      "sha256,md5,entropy,function_count,"
                      "fastboot_match_count,unlock_match_count,"
                      "vendor_match_count,oem_match_count,"
                      "partition_candidate_count,"
                      "high_entropy_block_count,"
                      "report_markdown,report_json,"
                      "disassembly_file,entry_disassembly_file\n"
                  )

                  for item in summaries:
                      def csv_escape(value):
                          value = str(
                              value
                          )

                          return (
                              '"'
                              + value.replace(
                                  '"',
                                  '""'
                              )
                              + '"'
                          )

                      f.write(
                          ",".join(
                              [
                                  str(
                                      item.get(
                                          "sequence",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "depth",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "relative_name",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "size",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "sha256",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "md5",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "entropy",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "function_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "fastboot_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "unlock_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "vendor_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "oem_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "partition_candidate_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "high_entropy_block_count",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "report_markdown",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "report_json",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "disassembly_file",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "entry_disassembly_file",
                                          ""
                                      )
                                  )
                              ]
                          )
                      )

                      f.write(
                          "\n"
                      )

              if not manifest_path.is_file():
                  print(
                      "Manifest creation failed."
                  )

                  sys.exit(30)

              if not summaries:
                  print(
                      "No files were successfully analyzed."
                  )

                  sys.exit(31)

              print(
                  "=============================================="
              )

              print(
                  "Recursive Analysis Complete"
              )

              print(
                  f"Discovered files : {len(unique_files)}"
              )

              print(
                  f"Analyzed files   : {len(summaries)}"
              )

              print(
                  f"Failed files     : {len(failures)}"
              )

              print(
                  f"Manifest         : {manifest_path}"
              )

              print(
                  "=============================================="
              )

          if __name__ == "__main__":
              main()
          PYEOF

          chmod +x /tmp/recursive_analysis.py

