                      f.write("| Address | Name | Size | Type |\n")
                      f.write("|---:|---|---:|---|\n")
                      for function in r2_result["functions"]:
                          address = function.get("offset", function.get("addr"))
                          name = str(function.get("name", ""))
                          function_size = function.get("size", "")
                          function_type = function.get("type", "")
                          f.write(
                              f"| `{address}` | `{name.replace('|', ' ')}` | "
                              f"`{function_size}` | `{function_type}` |\n"
                          )
                  else:
                      f.write("No functions identified by radare2.\n")

                  f.write("\n## Raw String Files\n\n")
