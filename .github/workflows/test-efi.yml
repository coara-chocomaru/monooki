                  f.write(f"- UTF-16LE: `{raw_dir / 'utf16le_strings.txt'}`\n")
                  f.write(f"- Hex preview: `{raw_dir / 'hex_preview.txt'}`\n")

                  if r2_result.get("disassembly_file"):
