                  "vertical-align:top}"
                  "th{background:#333;color:#fff}"
                  "tr:nth-child(even){background:#fafafa}"
                  "a{color:#0645ad}"
                  "code{word-break:break-word}"
                  "</style>\n"
                  "</head>\n"
              )

              output.write(
                  "<body>\n"
              )

              output.write(
                  "<h1>QCOM Bootloader Full Recursive Analysis</h1>\n"
              )

              output.write(
                  "<div class='grid'>\n"
              )

              cards = [
                  (
                      "Discovered Files",
                      manifest.get(
                          "file_count_discovered",
                          0
                      )
                  ),
                  (
                      "Analyzed Files",
                      manifest.get(
                          "file_count_analyzed",
                          0
                      )
                  ),
                  (
                      "Failed Files",
                      manifest.get(
                          "file_count_failed",
                          0
                      )
                  ),
                  (
                      "Functions",
                      total_functions
                  ),
                  (
                      "Unlock Matches",
                      total_unlock
                  ),
                  (
                      "Fastboot Matches",
                      total_fastboot
                  ),
                  (
                      "Vendor Matches",
                      total_vendor
                  ),
                  (
                      "OEM Matches",
                      total_oem
