name: QCOM Bootloader Full Recursive Disassembly & Analysis

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Analysis ZIP URL"
        required: true
        type: string

jobs:
  full-disassembly:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    env:
      ZIP_URL: ${{ inputs.zip_url || vars.ANALYSIS_ZIP_URL || secrets.ANALYSIS_ZIP_URL }}
      ANALYSIS_ROOT: ${{ github.workspace }}/analysis
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts

    steps:
      - name: Install Git
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate URL
        run: |
          if [ -z "${ZIP_URL}" ]; then
            echo "ZIP_URL is empty."
            echo "Set workflow_dispatch input zip_url, repository variable ANALYSIS_ZIP_URL, or secret ANALYSIS_ZIP_URL."
            exit 1
          fi

      - name: Install Analysis Tools
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            wget curl unzip zip \
            p7zip-full p7zip-rar \
            tar gzip bzip2 xz-utils zstd lz4 \
            file binutils \
            build-essential \
            python3 python3-pip python3-dev \
            git cmake pkg-config \
            bsdmainutils \
            default-jdk-headless \
            binwalk \
            liblzma-dev \
            libmagic1 \
            gdb-multiarch \
            qemu-user-static \
            ca-certificates
          apt-get clean
          rm -rf /var/lib/apt/lists/*

          if ! command -v r2 >/dev/null 2>&1; then
            git clone --depth 1 https://github.com/radareorg/radare2.git /tmp/radare2
            cd /tmp/radare2
            ./configure --prefix=/usr/local
            make -j"$(nproc)"
            make install
            cd /
            rm -rf /tmp/radare2
          fi

          ldconfig
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/bin:${PATH}"
          r2 -v
          binwalk --help >/dev/null 2>&1 || true
          7z i >/dev/null 2>&1

      - name: Install Python Libraries
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            r2pipe \
            pefile \
            capstone \
            pyelftools \
            pycryptodome \
            unicorn \
            python-magic

      - name: Prepare Analysis Directories
        run: |
          rm -rf "${ANALYSIS_ROOT}" "${ARTIFACT_ROOT}"
          mkdir -p \
            "${ANALYSIS_ROOT}/input" \
            "${ANALYSIS_ROOT}/files" \
            "${ANALYSIS_ROOT}/extracted" \
            "${ANALYSIS_ROOT}/work" \
            "${ARTIFACT_ROOT}/reports" \
            "${ARTIFACT_ROOT}/raw" \
            "${ARTIFACT_ROOT}/logs"

      - name: Download ZIP
        run: |
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 3600 \
            --output "${ANALYSIS_ROOT}/input/source.zip" \
            "${ZIP_URL}"

          file "${ANALYSIS_ROOT}/input/source.zip"
          sha256sum "${ANALYSIS_ROOT}/input/source.zip" | tee "${ARTIFACT_ROOT}/logs/source_sha256.txt"

      - name: Create Recursive Analysis Script
        run: |
          cat > /tmp/recursive_analysis.py << 'PYEOF'
          #!/usr/bin/env python3

          import os
          import sys
          import re
          import json
          import math
          import time
          import shutil
          import hashlib
          import signal
          import tarfile
          import zipfile
          import gzip
          import bz2
          import lzma
          import subprocess
          from pathlib import Path
          from collections import Counter, deque

          import r2pipe

          ROOT = Path(os.environ["ANALYSIS_ROOT"])
          ARTIFACT_ROOT = Path(os.environ["ARTIFACT_ROOT"])
          INPUT = ROOT / "input" / "source.zip"
          FILE_ROOT = ROOT / "files"
          EXTRACT_ROOT = ROOT / "extracted"
          WORK_ROOT = ROOT / "work"
          REPORT_ROOT = ARTIFACT_ROOT / "reports"
          RAW_ROOT = ARTIFACT_ROOT / "raw"

          MAX_ARCHIVE_DEPTH = 32
          R2_TIMEOUT = 900
          STRING_MIN_LENGTH = 4
          READ_CHUNK = 1024 * 1024

          FASTBOOT_KEYWORDS = [
              "flash",
              "erase",
              "reboot",
              "getvar",
              "setvar",
              "oem",
              "download",
              "continue",
              "boot",
              "update",
              "unlock",
              "lock",
              "device_state",
              "secure",
              "critical",
              "slot",
              "partition",
              "flag",
              "set",
              "userdata",
              "recovery",
              "system",
              "vendor",
              "product",
              "modem",
              "xbl",
              "abl",
              "sbl",
              "tz",
              "hyp",
              "devcfg"
          ]

          UNLOCK_KEYWORDS = [
              "unlock",
              "lock",
              "oem_unlock",
              "device_locked",
              "device_unlocked",
              "lock_state",
              "secure_boot",
              "unlock_ability",
              "allow_unlock",
              "unlock_code",
              "unlock-go",
              "unlock_go",
              "is_unlocked",
              "is_locked",
              "critical_unlock",
              "flashing_unlock"
          ]

          VENDOR_KEYWORDS = [
              "qualcomm",
              "qcom",
              "snapdragon",
              "littlekernel",
              "lk",
              "abl",
              "xbl",
              "sectools",
              "sahara",
              "firehose",
              "edl",
              "smem",
              "rpm",
              "tz",
              "hyp",
              "devcfg",
              "uefi",
              "fastboot"
          ]

          OEM_COMMAND_PATTERNS = [
              r"oem\s+unlock",
              r"oem\s+lock",
              r"oem\s+device-info",
              r"oem\s+getvar",
              r"oem\s+setvar",
              r"fastboot\s+oem",
              r"androidboot\.unlocked",
              r"androidboot\.verifiedbootstate",
              r"ro\.oem_unlock",
              r"oem\s+unlock-go",
              r"oem\s+set",
              r"oem\s+flag",
              r"unlock-go",
              r"unlock_go",
              r"flashing\s+unlock",
              r"get_unlock_ability",
              r"allow_unlock"
          ]

          FILE_MAGIC_CATEGORIES = (
              "ELF",
              "PE32",
              "MS-DOS",
              "Mach-O",
              "executable",
              "shared object",
              "DLL",
              "relocatable",
              "ARM",
              "AArch64"
          )

          def run_command(command, timeout=300, cwd=None):
              try:
                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=timeout,
                      cwd=cwd
                  )
                  return result.returncode, result.stdout
              except subprocess.TimeoutExpired as exc:
                  output = exc.stdout if isinstance(exc.stdout, str) else ""
                  return 124, output + "\nTIMEOUT\n"
              except Exception as exc:
                  return 125, str(exc)

          def safe_name(value, limit=180):
              value = value.replace("\\", "/")
              value = re.sub(r"[^A-Za-z0-9._/@+-]+", "_", value)
              value = value.strip("/.")
              if not value:
                  value = "file"
              return value[:limit]

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(READ_CHUNK)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          def md5_file(path):
              h = hashlib.md5()
              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(READ_CHUNK)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          def calculate_entropy(path):
              counts = [0] * 256
              total = 0
              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(READ_CHUNK)
                      if not chunk:
                          break
                      total += len(chunk)
                      for b in chunk:
                          counts[b] += 1
              if total == 0:
                  return 0.0
              entropy_value = 0.0
              for count in counts:
                  if count:
                      p = count / total
                      entropy_value -= p * math.log2(p)
              return entropy_value

          def hex_preview(path, size=512):
              with open(path, "rb") as f:
                  data = f.read(size)
              return " ".join(f"{b:02x}" for b in data)

          def is_safe_member(base, member):
              base = os.path.realpath(base)
              target = os.path.realpath(os.path.join(base, member))
              return target == base or target.startswith(base + os.sep)

          def safe_extract_zip(path, destination):
              extracted = []
              with zipfile.ZipFile(path, "r") as zf:
                  for member in zf.infolist():
                      name = member.filename
                      if not is_safe_member(destination, name):
                          continue
                      target = os.path.join(destination, name)
                      if member.is_dir():
                          os.makedirs(target, exist_ok=True)
                          continue
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with zf.open(member, "r") as src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst, length=READ_CHUNK)
                      extracted.append(target)
              return extracted

          def safe_extract_tar(path, destination):
              extracted = []
              with tarfile.open(path, "r:*") as tf:
                  for member in tf.getmembers():
                      if member.issym() or member.islnk() or member.isdev():
                          continue
                      if not is_safe_member(destination, member.name):
                          continue
                      target = os.path.join(destination, member.name)
                      if member.isdir():
                          os.makedirs(target, exist_ok=True)
                          continue
                      src = tf.extractfile(member)
                      if src is None:
                          continue
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst, length=READ_CHUNK)
                      try:
                          os.chmod(target, member.mode & 0o777)
                      except Exception:
                          pass
                      extracted.append(target)
              return extracted

          def extract_single_stream(path, destination):
              magic = b""
              with open(path, "rb") as f:
                  magic = f.read(8)

              out_name = safe_name(Path(path).name) + ".decompressed"
              out_path = os.path.join(destination, out_name)

              if magic.startswith(b"\x1f\x8b"):
                  with gzip.open(path, "rb") as src, open(out_path, "wb") as dst:
                      shutil.copyfileobj(src, dst, length=READ_CHUNK)
                  return [out_path]

              if magic.startswith(b"BZh"):
                  with bz2.open(path, "rb") as src, open(out_path, "wb") as dst:
                      shutil.copyfileobj(src, dst, length=READ_CHUNK)
                  return [out_path]

              if magic.startswith(b"\xfd7zXZ\x00"):
                  with lzma.open(path, "rb") as src, open(out_path, "wb") as dst:
                      shutil.copyfileobj(src, dst, length=READ_CHUNK)
                  return [out_path]

              return []

          def extract_with_7z(path, destination):
              os.makedirs(destination, exist_ok=True)
              command = [
                  "7z",
                  "x",
                  "-y",
                  "-bd",
                  f"-o{destination}",
                  path
              ]
              code, output = run_command(command, timeout=900)
              return {
                  "code": code,
                  "output": output
              }

          def extract_with_binwalk(path, destination):
              os.makedirs(destination, exist_ok=True)
              command = [
                  "binwalk",
                  "-Me",
                  "--run-as=root",
                  "--directory=" + destination,
                  path
              ]
              code, output = run_command(command, timeout=1800)
              return {
                  "code": code,
                  "output": output
              }

          def discover_archive_type(path):
              result = {
                  "zip": False,
                  "tar": False,
                  "stream": False,
                  "7z": False
              }

              try:
                  result["zip"] = zipfile.is_zipfile(path)
              except Exception:
                  pass

              try:
                  result["tar"] = tarfile.is_tarfile(path)
              except Exception:
                  pass

              try:
                  with open(path, "rb") as f:
                      magic = f.read(16)
                  if magic.startswith(b"7z\xbc\xaf'\x1c"):
                      result["7z"] = True
                  if (
                      magic.startswith(b"\x1f\x8b")
                      or magic.startswith(b"BZh")
                      or magic.startswith(b"\xfd7zXZ\x00")
                  ):
                      result["stream"] = True
              except Exception:
                  pass

              return result

          def extract_recursive(current_path, relative_hint, depth, seen_hashes, discovered, extraction_log):
              if depth > MAX_ARCHIVE_DEPTH:
                  return

              try:
                  file_hash = sha256_file(current_path)
              except Exception:
                  return

              if file_hash in seen_hashes:
                  return

              seen_hashes.add(file_hash)

              destination = EXTRACT_ROOT / f"{file_hash[:16]}_{safe_name(relative_hint)}"
              destination.mkdir(parents=True, exist_ok=True)

              archive_info = discover_archive_type(current_path)

              new_files = []

              if archive_info["zip"]:
                  try:
                      new_files.extend(safe_extract_zip(current_path, str(destination / "zip")))
                      extraction_log.append({
                          "source": str(current_path),
                          "method": "python_zip",
                          "depth": depth,
                          "success": True,
                          "output": str(destination / "zip")
                      })
                  except Exception as exc:
                      extraction_log.append({
                          "source": str(current_path),
                          "method": "python_zip",
                          "depth": depth,
                          "success": False,
                          "output": str(exc)
                      })

              if archive_info["tar"]:
                  try:
                      new_files.extend(safe_extract_tar(current_path, str(destination / "tar")))
                      extraction_log.append({
                          "source": str(current_path),
                          "method": "python_tar",
                          "depth": depth,
                          "success": True,
                          "output": str(destination / "tar")
                      })
                  except Exception as exc:
                      extraction_log.append({
                          "source": str(current_path),
                          "method": "python_tar",
                          "depth": depth,
                          "success": False,
                          "output": str(exc)
                      })

              if archive_info["stream"]:
                  try:
                      new_files.extend(extract_single_stream(current_path, str(destination / "stream")))
                      extraction_log.append({
                          "source": str(current_path),
                          "method": "single_stream",
                          "depth": depth,
                          "success": True,
                          "output": str(destination / "stream")
                      })
                  except Exception as exc:
                      extraction_log.append({
                          "source": str(current_path),
                          "method": "single_stream",
                          "depth": depth,
                          "success": False,
                          "output": str(exc)
                      })

              if archive_info["7z"]:
                  result = extract_with_7z(current_path, str(destination / "7z"))
                  extracted_candidates = []
                  for root, dirs, files in os.walk(destination / "7z"):
                      for filename in files:
                          extracted_candidates.append(os.path.join(root, filename))
                  new_files.extend(extracted_candidates)
                  extraction_log.append({
                      "source": str(current_path),
                      "method": "7z",
                      "depth": depth,
                      "success": result["code"] == 0,
                      "output": result["output"][-10000:]
                  })

              binwalk_dir = destination / "binwalk"
              result = extract_with_binwalk(current_path, str(binwalk_dir))
              binwalk_candidates = []
              for root, dirs, files in os.walk(binwalk_dir):
                  for filename in files:
                      binwalk_candidates.append(os.path.join(root, filename))
              new_files.extend(binwalk_candidates)
              extraction_log.append({
                  "source": str(current_path),
                  "method": "binwalk",
                  "depth": depth,
                  "success": result["code"] == 0,
                  "output": result["output"][-10000:]
              })

              unique = set()
              for item in new_files:
                  if not os.path.isfile(item):
                      continue
                  try:
                      item_hash = sha256_file(item)
                  except Exception:
                      continue
                  if item_hash == file_hash:
                      continue
                  if item_hash in unique:
                      continue
                  unique.add(item_hash)
                  discovered.append({
                      "path": item,
                      "parent": str(current_path),
                      "depth": depth + 1,
                      "sha256": item_hash
                  })

                  next_hint = str(Path(relative_hint) / Path(item).name)
                  extract_recursive(
                      item,
                      next_hint,
                      depth + 1,
                      seen_hashes,
                      discovered,
                      extraction_log
                  )

          def strings_command(path, mode):
              if mode == "ascii":
                  command = ["strings", "-a", "-n", str(STRING_MIN_LENGTH), "-t", "x", path]
              else:
                  command = ["strings", "-a", "-el", "-n", str(STRING_MIN_LENGTH), "-t", "x", path]
              return run_command(command, timeout=600)

          def run_file_command(path):
              return run_command(["file", "-b", "--mime", path], timeout=60)

          def run_file_description(path):
              return run_command(["file", "-b", path], timeout=60)

          def r2_open(path):
              return r2pipe.open(
                  path,
                  flags=["-2"],
                  timeout=R2_TIMEOUT
              )

          def extract_r2_json(r2, command):
              try:
                  return r2.cmdj(command)
              except Exception:
                  return None

          def get_r2_analysis(path, base_name):
              result = {
                  "available": False,
                  "info": {},
                  "analysis_info": {},
                  "sections": [],
                  "symbols": [],
                  "imports": [],
                  "exports": [],
                  "strings": [],
                  "functions": [],
                  "function_count": 0,
                  "disassembly_file": None,
                  "command_log": []
              }

              try:
                  r2 = r2_open(path)
              except Exception as exc:
                  result["error"] = str(exc)
                  return result

              result["available"] = True

              try:
                  r2.cmd("e io.cache=true")
                  r2.cmd("e bin.cache=true")
              except Exception:
                  pass

              try:
                  info = extract_r2_json(r2, "ij")
                  if info:
                      result["info"] = info
              except Exception:
                  pass

              try:
                  analysis_info = extract_r2_json(r2, "iIj")
                  if analysis_info:
                      result["analysis_info"] = analysis_info
              except Exception:
                  pass

              try:
                  result["sections"] = extract_r2_json(r2, "iSj") or []
              except Exception:
                  pass

              try:
                  result["symbols"] = extract_r2_json(r2, "isj") or []
              except Exception:
                  pass

              try:
                  result["imports"] = extract_r2_json(r2, "iij") or []
              except Exception:
                  pass

              try:
                  result["exports"] = extract_r2_json(r2, "iEj") or []
              except Exception:
                  pass

              try:
                  result["strings"] = extract_r2_json(r2, "izzj") or []
              except Exception:
                  pass

              analysis_commands = [
                  "aaaa",
                  "aac",
                  "aav",
                  "aaf"
              ]

              for command in analysis_commands:
                  try:
                      output = r2.cmd(command)
                      result["command_log"].append({
                          "command": command,
                          "success": True,
                          "output_tail": output[-5000:]
                      })
                  except Exception as exc:
                      result["command_log"].append({
                          "command": command,
                          "success": False,
                          "error": str(exc)
                      })

              try:
                  functions = extract_r2_json(r2, "aflj") or []
                  result["functions"] = functions
                  result["function_count"] = len(functions)
              except Exception:
                  result["functions"] = []

              disassembly_path = REPORT_ROOT / "disassembly" / f"{base_name}.asm"
              disassembly_path.parent.mkdir(parents=True, exist_ok=True)

              with open(disassembly_path, "w", encoding="utf-8", errors="replace") as asm:
                  entry = None
                  try:
                      entry = extract_r2_json(r2, "iej")
                  except Exception:
                      entry = None

                  if entry:
                      asm.write("===== ENTRY POINTS =====\n")
                      asm.write(json.dumps(entry, indent=2, ensure_ascii=False))
                      asm.write("\n\n")

                  functions = result["functions"]

                  for index, function in enumerate(functions):
                      address = function.get("offset")
                      if address is None:
                          address = function.get("addr")
                      if address is None:
                          continue

                      name = function.get("name", "")
                      asm.write("\n")
                      asm.write("=" * 100)
                      asm.write("\n")
                      asm.write(f"FUNCTION_INDEX={index}\n")
                      asm.write(f"NAME={name}\n")
                      asm.write(f"ADDRESS={address:#x}\n")
                      asm.write("=" * 100)
                      asm.write("\n")

                      try:
                          disasm = r2.cmd(f"pdf @ {address}")
                      except Exception as exc:
                          disasm = f"DISASSEMBLY_ERROR: {exc}\n"

                      asm.write(disasm)
                      asm.write("\n")

              result["disassembly_file"] = str(disassembly_path)

              try:
                  asm_entry = r2.cmd("pd 512 @ entry0")
                  with open(
                      REPORT_ROOT / "disassembly" / f"{base_name}_entry.asm",
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  ) as f:
                      f.write(asm_entry)
              except Exception:
                  pass

              try:
                  r2.quit()
              except Exception:
                  pass

              return result

          def keyword_matches(strings):
              fastboot_matches = []
              unlock_matches = []
              vendor_matches = []
              oem_matches = []

              for entry in strings:
                  text = str(entry.get("string", ""))
                  lower = text.lower()
                  address = entry.get("vaddr", entry.get("paddr", entry.get("addr")))

                  for keyword in FASTBOOT_KEYWORDS:
                      if keyword in lower:
                          fastboot_matches.append({
                              "address": address,
                              "string": text,
                              "keyword": keyword
                          })
                          break

                  for keyword in UNLOCK_KEYWORDS:
                      if keyword in lower:
                          unlock_matches.append({
                              "address": address,
                              "string": text,
                              "keyword": keyword
                          })
                          break

                  for keyword in VENDOR_KEYWORDS:
                      if keyword in lower:
                          vendor_matches.append({
                              "address": address,
                              "string": text,
                              "keyword": keyword
                          })
                          break

                  for pattern in OEM_COMMAND_PATTERNS:
                      try:
                          if re.search(pattern, lower):
                              oem_matches.append({
                                  "address": address,
                                  "string": text,
                                  "pattern": pattern
                              })
                              break
                      except Exception:
                          pass

              return {
                  "fastboot": fastboot_matches,
                  "unlock": unlock_matches,
                  "vendor": vendor_matches,
                  "oem": oem_matches
              }

          def discover_partition_strings(strings):
              candidates = set()
              keywords = [
                  "partition",
                  "xbl",
                  "xbl_config",
                  "abl",
                  "aop",
                  "boot",
                  "vendor_boot",
                  "system",
                  "system_ext",
                  "product",
                  "userdata",
                  "cache",
                  "recovery",
                  "misc",
                  "modem",
                  "modemst1",
                  "modemst2",
                  "fsg",
                  "persist",
                  "metadata",
                  "super",
                  "vbmeta",
                  "vbmeta_system",
                  "vbmeta_vendor",
                  "dtbo",
                  "devcfg",
                  "rpm",
                  "tz",
                  "hyp",
                  "keymaster",
                  "frp"
              ]

              for entry in strings:
                  text = str(entry.get("string", ""))
                  lower = text.lower()
                  if any(k in lower for k in keywords):
                      candidates.add(text)

              return sorted(candidates)

          def entropy_regions(path, block_size=65536, threshold=7.0):
              results = []
              offset = 0

              with open(path, "rb") as f:
                  while True:
                      block = f.read(block_size)
                      if not block:
                          break

                      counts = [0] * 256
                      for b in block:
                          counts[b] += 1

                      e = 0.0
                      n = len(block)

                      if n:
                          for c in counts:
                              if c:
                                  p = c / n
                                  e -= p * math.log2(p)

                      if e >= threshold:
                          results.append({
                              "offset": offset,
                              "size": len(block),
                              "entropy": round(e, 6)
                          })

                      offset += len(block)

              return results

          def analyze_one_file(path, relative_name, sequence):
              file_hash = sha256_file(path)
              base = f"{sequence:06d}_{safe_name(relative_name)}_{file_hash[:16]}"

              report_dir = REPORT_ROOT / "files"
              report_dir.mkdir(parents=True, exist_ok=True)

              raw_dir = RAW_ROOT / base
              raw_dir.mkdir(parents=True, exist_ok=True)

              metadata_result = run_file_description(path)
              mime_result = run_file_command(path)

              description = metadata_result[1].strip()
              mime = mime_result[1].strip()

              size = os.path.getsize(path)
              entropy_value = calculate_entropy(path)
              md5_value = md5_file(path)

              ascii_result = strings_command(path, "ascii")
              utf16_result = strings_command(path, "utf16")

              ascii_strings = ascii_result[1]
              utf16_strings = utf16_result[1]

              with open(raw_dir / "ascii_strings.txt", "w", encoding="utf-8", errors="replace") as f:
                  f.write(ascii_strings)

              with open(raw_dir / "utf16le_strings.txt", "w", encoding="utf-8", errors="replace") as f:
                  f.write(utf16_strings)

              with open(raw_dir / "hex_preview.txt", "w", encoding="utf-8") as f:
                  f.write(hex_preview(path))

              r2_result = get_r2_analysis(path, base)

              r2_strings = r2_result.get("strings", []) or []
              matches = keyword_matches(r2_strings)
              partition_candidates = discover_partition_strings(r2_strings)

              entropy_blocks = entropy_regions(path)

              raw_copy_path = None
              if size <= 64 * 1024 * 1024:
                  raw_copy = raw_dir / "original.bin"
                  shutil.copy2(path, raw_copy)
                  raw_copy_path = str(raw_copy)

              metadata = {
                  "sequence": sequence,
                  "relative_name": relative_name,
                  "path": str(path),
                  "size": size,
                  "sha256": file_hash,
                  "md5": md5_value,
                  "file_description": description,
                  "mime": mime,
                  "entropy": entropy_value,
                  "ascii_strings_command_exit_code": ascii_result[0],
                  "utf16_strings_command_exit_code": utf16_result[0],
                  "ascii_strings_file": str(raw_dir / "ascii_strings.txt"),
                  "utf16le_strings_file": str(raw_dir / "utf16le_strings.txt"),
                  "hex_preview_file": str(raw_dir / "hex_preview.txt"),
                  "original_copy": raw_copy_path,
                  "r2": r2_result,
                  "fastboot_matches": matches["fastboot"],
                  "unlock_matches": matches["unlock"],
                  "vendor_matches": matches["vendor"],
                  "oem_matches": matches["oem"],
                  "partition_candidates": partition_candidates,
                  "high_entropy_blocks": entropy_blocks,
                  "high_entropy_block_count": len(entropy_blocks)
              }

              json_path = report_dir / f"{base}.json"
              md_path = report_dir / f"{base}.md"

              with open(json_path, "w", encoding="utf-8") as f:
                  json.dump(metadata, f, indent=2, ensure_ascii=False)

              with open(md_path, "w", encoding="utf-8") as f:
                  f.write(f"# Recursive Analysis Report\n\n")
                  f.write(f"## File\n\n")
                  f.write(f"`{relative_name}`\n\n")
                  f.write(f"## Metadata\n\n")
                  f.write(f"| Field | Value |\n")
                  f.write(f"|---|---|\n")
                  f.write(f"| Size | {size} bytes |\n")
                  f.write(f"| SHA256 | `{file_hash}` |\n")
                  f.write(f"| MD5 | `{md5_value}` |\n")
                  f.write(f"| File | `{description}` |\n")
                  f.write(f"| MIME | `{mime}` |\n")
                  f.write(f"| Entropy | `{entropy_value:.6f}` |\n")
                  f.write(f"| R2 Available | `{r2_result.get('available')}` |\n")
                  f.write(f"| R2 Function Count | `{r2_result.get('function_count', 0)}` |\n")
                  f.write(f"\n## Fastboot-related Strings\n\n")

                  if matches["fastboot"]:
                      f.write("| Address | Keyword | String |\n")
                      f.write("|---:|---|---|\n")
                      for item in matches["fastboot"]:
                          f.write(
                              f"| `{item['address']}` | `{item['keyword']}` | "
                              f"`{str(item['string']).replace('|', ' ' )}` |\n"
                          )
                  else:
                      f.write("No fastboot-related strings detected.\n")

                  f.write("\n## Unlock/Lock-related Strings\n\n")

                  if matches["unlock"]:
                      f.write("| Address | Keyword | String |\n")
                      f.write("|---:|---|---|\n")
                      for item in matches["unlock"]:
                          f.write(
                              f"| `{item['address']}` | `{item['keyword']}` | "
                              f"`{str(item['string']).replace('|', ' ')}` |\n"
                          )
                  else:
                      f.write("No unlock/lock-related strings detected.\n")

                  f.write("\n## Vendor-related Strings\n\n")

                  if matches["vendor"]:
                      f.write("| Address | Keyword | String |\n")
                      f.write("|---:|---|---|\n")
                      for item in matches["vendor"]:
                          f.write(
                              f"| `{item['address']}` | `{item['keyword']}` | "
                              f"`{str(item['string']).replace('|', ' ')}` |\n"
                          )
                  else:
                      f.write("No vendor-related strings detected.\n")

                  f.write("\n## OEM Command Patterns\n\n")

                  if matches["oem"]:
                      f.write("| Address | Pattern | String |\n")
                      f.write("|---:|---|---|\n")
                      for item in matches["oem"]:
                          f.write(
                              f"| `{item['address']}` | `{item['pattern']}` | "
                              f"`{str(item['string']).replace('|', ' ')}` |\n"
                          )
                  else:
                      f.write("No explicit OEM command patterns detected.\n")

                  f.write("\n## Partition Candidates\n\n")

                  if partition_candidates:
                      for item in partition_candidates:
                          f.write(f"- `{item}`\n")
                  else:
                      f.write("No partition candidates detected.\n")

                  f.write("\n## High Entropy Regions\n\n")

                  if entropy_blocks:
                      f.write("| Offset | Size | Entropy |\n")
                      f.write("|---:|---:|---:|\n")
                      for block in entropy_blocks:
                          f.write(
                              f"| `0x{block['offset']:x}` | `{block['size']}` | "
                              f"`{block['entropy']}` |\n"
                          )
                  else:
                      f.write("No blocks above the high-entropy threshold were detected.\n")

                  f.write("\n## R2 Binary Information\n\n")
