                  f"<td>{html.escape(str(item.get('size', '')))}</td>"
                  f"<td>{html.escape(str(item.get('sha256', '')))}</td>"
                  f"<td>{html.escape(str(item.get('entropy', '')))}</td>"
                  f"<td>{html.escape(str(item.get('function_count', '')))}</td>"
                  f"<td>{html.escape(str(item.get('unlock_match_count', '')))}</td>"
                  f"<td>{html.escape(str(item.get('fastboot_match_count', '')))}</td>"
                  f"<td>{html.escape(str(item.get('oem_match_count', '')))}</td>"
                  "</tr>"
              )

          report_html = artifact_root / "reports" / "index.html"

          with open(report_html, "w", encoding="utf-8") as f:
              f.write(
                  "<!doctype html>"
                  "<html>"
                  "<head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width=device-width,initial-scale=1'>"
                  "<title>QCOM Bootloader Full Recursive Analysis</title>"
                  "<style>"
                  "body{font-family:Arial,Helvetica,sans-serif;margin:32px;background:#f5f5f5;color:#222}"
                  "h1,h2{color:#222}"
                  ".cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}"
                  ".card{background:white;border:1px solid #ddd;border-radius:8px;padding:16px}"
                  ".value{font-size:28px;font-weight:bold}"
                  "table{border-collapse:collapse;width:100%;background:white}"
                  "th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}"
                  "th{background:#333;color:white;position:sticky;top:0}"
                  "tr:nth-child(even){background:#fafafa}"
                  "a{color:#0057b8}"
                  ".danger{color:#c00}"
                  "</style>"
                  "</head>"
                  "<body>"
              )

              f.write(
                  "<h1>QCOM Bootloader Full Recursive Analysis</h1>"
              )

              f.write("<div class='cards'>")
              f.write(
                  f"<div class='card'><div>Discovered</div><div class='value'>"
                  f"{manifest.get('file_count_discovered', 0)}</div></div>"
              )
              f.write(
                  f"<div class='card'><div>Analyzed</div><div class='value'>"
                  f"{manifest.get('file_count_analyzed', 0)}</div></div>"
              )
              f.write(
                  f"<div class='card'><div>Failed</div><div class='value danger'>"
                  f"{manifest.get('file_count_failed', 0)}</div></div>"
              )
              f.write("</div>")

              f.write("<h2>Reports</h2><ul>")
              f.write(
                  "<li><a href='FULL_ANALYSIS_REPORT.md'>FULL_ANALYSIS_REPORT.md</a></li>"
              )
              f.write(
                  "<li><a href='../analysis_manifest.json'>analysis_manifest.json</a></li>"
              )
              f.write(
                  "<li><a href='../analysis_index.csv'>analysis_index.csv</a></li>"
              )
              f.write("</ul>")

              f.write("<h2>Files</h2>")

              f.write(
                  "<table><thead><tr>"
                  "<th>#</th>"
                  "<th>Depth</th>"
                  "<th>File</th>"
                  "<th>Size</th>"
                  "<th>SHA256</th>"
                  "<th>Entropy</th>"
                  "<th>Functions</th>"
                  "<th>Unlock</th>"
                  "<th>Fastboot</th>"
                  "<th>OEM</th>"
                  "</tr></thead><tbody>"
              )

              for row in rows:
                  f.write(row)

              f.write("</tbody></table>")
              f.write("</body></html>")

          print(report_html)
          PYEOF

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_full_recursive_analysis
          path: |
            artifacts/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

