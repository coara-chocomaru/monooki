                  if entropy_blocks:
                      output.write(
                          "| Offset | Size | Entropy |\n"
                      )

                      output.write(
                          "|---:|---:|---:|\n"
                      )

                      for item in entropy_blocks:
                          output.write(
                              f"| `0x{item['offset']:x}` | "
                              f"`{item['size']}` | "
                              f"`{item['entropy']}` |\n"
