          print(
              f"Generated: {report_html}"
          )
          PYEOF

      - name: Collect Failure Diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "${ARTIFACT_ROOT}/logs"

          {
            echo "===== DATE ====="
            date

            echo "===== PWD ====="
            pwd

            echo "===== ENV ====="
            env | sort

            echo "===== ROOT ====="
            ls -lah

            echo "===== ANALYSIS ROOT ====="
            if [ -d "${ANALYSIS_ROOT}" ]; then
              find "${ANALYSIS_ROOT}" \
                -maxdepth 4 \
                -type f \
                -printf '%p %s bytes\n' \
                | sort
            else
              echo "ANALYSIS_ROOT does not exist"
            fi

            echo "===== ARTIFACT ROOT ====="
            if [ -d "${ARTIFACT_ROOT}" ]; then
              find "${ARTIFACT_ROOT}" \
                -maxdepth 5 \
                -type f \
                -printf '%p %s bytes\n' \
                | sort
            else
              echo "ARTIFACT_ROOT does not exist"
            fi
          } > "${ARTIFACT_ROOT}/logs/diagnostics.log"

      - name: Upload All Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_full_recursive_analysis
          path: |
            artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Notify Completion
        if: success()
        shell: bash
        run: |
          echo "::notice title=Bootloader Analysis Complete::ZIP downloaded, recursively extracted, all discovered files analyzed, and reports uploaded as GitHub Artifact."

      - name: Notify Failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=Bootloader Analysis Failed::The recursive analysis failed. Diagnostic logs and any generated artifacts were uploaded."
          exit 1
