                  ),
                  "report_markdown": str(
                      report_markdown
                  ),
                  "report_json": str(
                      report_json
                  ),
                  "raw_directory": str(
                      raw_dir
                  ),
                  "disassembly_file": r2_result.get(
                      "disassembly_file"
                  ),
                  "entry_disassembly_file": r2_result.get(
                      "entry_disassembly_file"
                  )
              }

          def csv_escape(
              value
          ):
              value = str(
                  value
              )

              return (
                  '"'
                  + value.replace(
                      '"',
                      '""'
                  )
                  + '"'
              )

          def main():
              for directory in [
                  FILE_ROOT,
                  EXTRACT_ROOT,
                  WORK_ROOT,
                  REPORT_ROOT,
                  REPORT_FILES_ROOT,
                  REPORT_DISASM_ROOT,
                  RAW_ROOT,
                  LOG_ROOT
              ]:
                  directory.mkdir(
                      parents=True,
                      exist_ok=True
                  )

              if not INPUT.is_file():
                  print(
                      f"INPUT ZIP NOT FOUND: {INPUT}"
                  )
                  return 10

              input_size = INPUT.stat().st_size

              if input_size <= 0:
                  print(
                      "INPUT ZIP IS EMPTY"
                  )
                  return 11

              source_destination = (
                  FILE_ROOT
                  / "source"
              )

              source_destination.mkdir(
                  parents=True,
                  exist_ok=True
              )

              try:
                  initial_files = safe_extract_zip(
                      INPUT,
                      source_destination
                  )
              except Exception as exc:
                  print(
                      f"Initial ZIP extraction failed: {exc}"
                  )
                  return 12

              discovered = []
              global_hashes = set()
              extraction_log = []

              for item in initial_files:
                  if not os.path.isfile(
                      item
                  ):
                      continue

                  try:
                      item_hash = sha256_file(
                          item
                      )
                  except Exception:
                      continue

                  discovered.append(
                      {
                          "path": item,
                          "parent": str(
                              INPUT
                          ),
                          "depth": 1,
                          "sha256": item_hash
                      }
                  )

              queue = deque(
                  discovered
              )

              processed_hashes = set()

              while queue:
                  current = queue.popleft()

                  current_path = current[
                      "path"
                  ]

                  current_hash = current[
                      "sha256"
                  ]

                  if (
                      current_hash
                      in processed_hashes
                  ):
                      continue

                  processed_hashes.add(
                      current_hash
                  )

                  if (
                      len(discovered)
                      >= MAX_FILES
                  ):
                      break

                  relative_name = os.path.relpath(
                      current_path,
                      FILE_ROOT
                  )

                  before = len(
                      discovered
                  )

                  recursive_extract(
                      current_path,
                      relative_name,
                      int(
                          current.get(
                              "depth",
                              1
                          )
                      ),
                      global_hashes,
                      discovered,
                      extraction_log
                  )

                  after = len(
                      discovered
                  )

                  if after > before:
                      for item in discovered[
                          before:after
                      ]:
                          if (
                              item["sha256"]
                              not in processed_hashes
                          ):
                              queue.append(
                                  item
                              )

              unique_files = []
              unique_hashes = set()

              for item in discovered:
                  current_path = item[
                      "path"
                  ]

                  if not os.path.isfile(
                      current_path
                  ):
                      continue

                  try:
                      current_hash = sha256_file(
                          current_path
                      )
                  except Exception:
                      continue

                  if (
                      current_hash
                      in unique_hashes
                  ):
                      continue

                  unique_hashes.add(
                      current_hash
                  )

                  unique_files.append(
                      {
                          "path": current_path,
                          "parent": item.get(
                              "parent"
                          ),
                          "depth": item.get(
                              "depth",
                              1
                          ),
                          "sha256": current_hash
                      }
                  )

                  if (
                      len(unique_files)
                      >= MAX_FILES
                  ):
                      break

              unique_files.sort(
                  key=lambda item: (
                      int(
                          item.get(
                              "depth",
                              0
                          )
                      ),
                      str(
                          item.get(
                              "path",
                              ""
                          )
                      )
                  )
              )

              summaries = []
              failures = []

              total = len(
                  unique_files
              )

              for index, item in enumerate(
                  unique_files,
                  1
              ):
                  current_path = item[
                      "path"
                  ]

                  relative_name = os.path.relpath(
                      current_path,
                      FILE_ROOT
                  )

                  print(
                      f"[{index}/{total}] "
                      f"Analyzing {relative_name}",
                      flush=True
                  )

                  try:
                      summary = analyze_file(
                          current_path,
                          relative_name,
                          index,
                          item.get(
                              "parent"
                          ),
                          int(
                              item.get(
                                  "depth",
                                  0
                              )
                          )
                      )

                      summaries.append(
                          summary
                      )

                  except Exception as exc:
                      failure = {
                          "sequence": index,
                          "relative_name": relative_name,
                          "path": current_path,
                          "parent": item.get(
                              "parent"
                          ),
                          "depth": item.get(
                              "depth",
                              0
                          ),
                          "error": str(exc)
                      }

                      failures.append(
                          failure
                      )

                      with open(
                          LOG_ROOT / "failures.log",
                          "a",
                          encoding="utf-8"
                      ) as output:
                          output.write(
                              json.dumps(
                                  failure,
                                  ensure_ascii=False
                              )
                          )
                          output.write(
                              "\n"
                          )

                      print(
                          f"Analysis failed: "
                          f"{relative_name}: "
                          f"{exc}",
                          flush=True
                      )

              with open(
                  LOG_ROOT / "recursive_extraction.json",
                  "w",
                  encoding="utf-8"
              ) as output:
                  json.dump(
                      extraction_log,
                      output,
                      indent=2,
                      ensure_ascii=False
                  )

              manifest = {
                  "input_zip": str(
                      INPUT
                  ),
                  "input_size": input_size,
                  "input_sha256": sha256_file(
                      INPUT
                  ),
                  "analysis_root": str(
                      ROOT
                  ),
                  "artifact_root": str(
                      ARTIFACT_ROOT
                  ),
                  "max_archive_depth": (
                      MAX_ARCHIVE_DEPTH
                  ),
                  "max_files": MAX_FILES,
                  "max_decompressed_file_size": (
                      MAX_DECOMPRESSED_FILE_SIZE
                  ),
                  "file_count_discovered": len(
                      unique_files
                  ),
                  "file_count_analyzed": len(
                      summaries
                  ),
                  "file_count_failed": len(
                      failures
                  ),
                  "files": summaries,
                  "failures": failures
              }

              manifest_path = (
                  ARTIFACT_ROOT
                  / "analysis_manifest.json"
              )

              manifest_path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with open(
                  manifest_path,
                  "w",
                  encoding="utf-8"
              ) as output:
                  json.dump(
                      manifest,
                      output,
                      indent=2,
                      ensure_ascii=False
                  )

              csv_path = (
                  ARTIFACT_ROOT
                  / "analysis_index.csv"
              )

              with open(
                  csv_path,
                  "w",
                  encoding="utf-8"
              ) as output:
                  output.write(
                      "sequence,"
                      "depth,"
                      "relative_name,"
                      "size,"
                      "sha256,"
                      "md5,"
                      "entropy,"
                      "function_count,"
                      "fastboot_match_count,"
                      "unlock_match_count,"
                      "vendor_match_count,"
                      "oem_match_count,"
                      "partition_candidate_count,"
                      "high_entropy_block_count,"
                      "report_markdown,"
                      "report_json,"
                      "disassembly_file,"
                      "entry_disassembly_file\n"
                  )

                  for item in summaries:
                      output.write(
                          ",".join(
                              [
                                  str(
                                      item.get(
                                          "sequence",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "depth",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "relative_name",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "size",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "sha256",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "md5",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "entropy",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "function_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "fastboot_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "unlock_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "vendor_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "oem_match_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "partition_candidate_count",
                                          ""
                                      )
                                  ),
                                  str(
                                      item.get(
                                          "high_entropy_block_count",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "report_markdown",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "report_json",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "disassembly_file",
                                          ""
                                      )
                                  ),
                                  csv_escape(
                                      item.get(
                                          "entry_disassembly_file",
                                          ""
                                      )
                                  )
                              ]
                          )
                      )

                      output.write(
                          "\n"
                      )

              print(
                  "=============================================="
              )

              print(
                  "Recursive Analysis Complete"
              )

              print(
                  f"Discovered files : {len(unique_files)}"
              )

              print(
                  f"Analyzed files   : {len(summaries)}"
              )

              print(
                  f"Failed files     : {len(failures)}"
              )

              print(
                  f"Manifest         : {manifest_path}"
              )

              print(
                  "=============================================="
              )

              return 0

          if __name__ == "__main__":
              sys.exit(
                  main()
              )
          PYEOF

