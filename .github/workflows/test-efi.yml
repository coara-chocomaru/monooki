name: QCOM Bootloader Full Recursive Disassembly & Analysis

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      zip_url:
        description: ZIP URL to download and recursively analyze
        required: false
        type: string
        default: https://github.com/coara-chocomaru/monooki/raw/refs/heads/main/rakuten_data_dump.zip

jobs:
  full-disassembly:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:22.04
      options: --privileged

    env:
      ZIP_URL: ${{ github.event.inputs.zip_url || 'https://github.com/coara-chocomaru/monooki/raw/refs/heads/main/rakuten_data_dump.zip' }}
      ANALYSIS_ROOT: ${{ github.workspace }}/analysis
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts
      PYTHONUNBUFFERED: "1"
      PATH: /usr/local/bin:/usr/bin:/bin
      LD_LIBRARY_PATH: /usr/local/lib:/usr/lib:/lib

    steps:
      - name: Install Git and Base Tools
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y

          apt-get install -y --no-install-recommends \
            git \
            curl \
            wget \
            ca-certificates

          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Analysis Tools
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y

          apt-get install -y --no-install-recommends \
            unzip \
            zip \
            p7zip-full \
            p7zip-rar \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            zstd \
            lz4 \
            file \
            binutils \
            build-essential \
            python3 \
            python3-pip \
            python3-dev \
            git \
            cmake \
            pkg-config \
            bsdmainutils \
            default-jdk-headless \
            binwalk \
            liblzma-dev \
            libmagic1 \
            gdb-multiarch \
            qemu-user-static \
            ca-certificates

          apt-get clean
          rm -rf /var/lib/apt/lists/*

          rm -rf /tmp/radare2

          git clone \
            --depth 1 \
            https://github.com/radareorg/radare2.git \
            /tmp/radare2

          cd /tmp/radare2

          ./configure \
            --prefix=/usr/local

          make -j"$(nproc)"

          make install

          cd /

          rm -rf /tmp/radare2

          ldconfig

          r2 -v
          python3 --version
          file --version
          7z i >/dev/null 2>&1

      - name: Install Python Libraries
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            r2pipe \
            pefile \
            capstone \
            pyelftools \
            pycryptodome \
            unicorn \
            python-magic

      - name: Prepare Directories
        shell: bash
        run: |
          set -e

          rm -rf "${ANALYSIS_ROOT}"
          rm -rf "${ARTIFACT_ROOT}"

          mkdir -p \
            "${ANALYSIS_ROOT}/input" \
            "${ANALYSIS_ROOT}/files" \
            "${ANALYSIS_ROOT}/extracted" \
            "${ANALYSIS_ROOT}/work" \
            "${ARTIFACT_ROOT}" \
            "${ARTIFACT_ROOT}/logs" \
            "${ARTIFACT_ROOT}/reports" \
            "${ARTIFACT_ROOT}/reports/files" \
            "${ARTIFACT_ROOT}/reports/disassembly" \
            "${ARTIFACT_ROOT}/raw"

      - name: Validate ZIP URL
        shell: bash
        run: |
          set -e

          if [ -z "${ZIP_URL}" ]; then
            echo "ZIP_URL is empty."
            exit 1
          fi

          echo "ZIP_URL=${ZIP_URL}"

      - name: Download ZIP
        shell: bash
        run: |
          set -e

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 3600 \
            --output "${ANALYSIS_ROOT}/input/source.zip" \
            "${ZIP_URL}"

          test -f \
            "${ANALYSIS_ROOT}/input/source.zip"

          SOURCE_SIZE="$(stat -c '%s' "${ANALYSIS_ROOT}/input/source.zip")"

          if [ "${SOURCE_SIZE}" -le 0 ]; then
            echo "Downloaded ZIP is empty."
            exit 1
          fi

          file \
            "${ANALYSIS_ROOT}/input/source.zip"

          sha256sum \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee \
            "${ARTIFACT_ROOT}/logs/source_sha256.txt"

          md5sum \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee \
            "${ARTIFACT_ROOT}/logs/source_md5.txt"

          stat \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee \
            "${ARTIFACT_ROOT}/logs/source_stat.txt"

      - name: Create Recursive Analysis Script
        shell: bash
        run: |
          set -e

          cat > /tmp/recursive_analysis.py <<'PYEOF'
          #!/usr/bin/env python3

          import os
          import sys
          import json
          import math
          import shutil
          import hashlib
          import subprocess
          import zipfile
          import tarfile
          import gzip
          import bz2
          import lzma
          import re

          from pathlib import Path
          from collections import deque

          import r2pipe

          ROOT = Path(os.environ["ANALYSIS_ROOT"])
          ARTIFACT_ROOT = Path(os.environ["ARTIFACT_ROOT"])

          INPUT = ROOT / "input" / "source.zip"

          FILE_ROOT = ROOT / "files"
          EXTRACT_ROOT = ROOT / "extracted"
          WORK_ROOT = ROOT / "work"

          REPORT_ROOT = ARTIFACT_ROOT / "reports"
          REPORT_FILES_ROOT = REPORT_ROOT / "files"
          REPORT_DISASM_ROOT = REPORT_ROOT / "disassembly"

          RAW_ROOT = ARTIFACT_ROOT / "raw"
          LOG_ROOT = ARTIFACT_ROOT / "logs"

          MAX_ARCHIVE_DEPTH = 32
          MAX_FILES = 100000
          MAX_DECOMPRESSED_FILE_SIZE = 1024 * 1024 * 1024
          READ_CHUNK = 1024 * 1024

          FASTBOOT_KEYWORDS = [
              "flash",
              "erase",
              "reboot",
              "getvar",
              "setvar",
              "oem",
              "download",
              "continue",
              "boot",
              "update",
              "unlock",
              "lock",
              "device_state",
              "secure",
              "critical",
              "slot",
              "partition",
              "flag",
              "userdata",
              "recovery",
              "system",
              "vendor",
              "product",
              "modem",
              "xbl",
              "abl",
              "sbl",
              "tz",
              "hyp",
              "devcfg",
              "vbmeta",
              "super"
          ]

          UNLOCK_KEYWORDS = [
              "unlock",
              "lock",
              "oem_unlock",
              "device_locked",
              "device_unlocked",
              "lock_state",
              "secure_boot",
              "unlock_ability",
              "allow_unlock",
              "unlock_code",
              "unlock-go",
              "unlock_go",
              "is_unlocked",
              "is_locked",
              "critical_unlock",
              "flashing_unlock",
              "get_unlock_ability"
          ]

          VENDOR_KEYWORDS = [
              "qualcomm",
              "qcom",
              "snapdragon",
              "littlekernel",
              "fastboot",
              "firehose",
              "sahara",
              "edl",
              "smem",
              "rpm",
              "tz",
              "hyp",
              "devcfg",
              "uefi",
              "xbl",
              "abl"
          ]

          OEM_COMMAND_PATTERNS = [
              r"oem\s+unlock",
              r"oem\s+lock",
              r"oem\s+device-info",
              r"oem\s+getvar",
              r"oem\s+setvar",
              r"fastboot\s+oem",
              r"androidboot\.unlocked",
              r"androidboot\.verifiedbootstate",
              r"ro\.oem_unlock",
              r"oem\s+unlock-go",
              r"oem\s+set",
              r"oem\s+flag",
              r"unlock-go",
              r"unlock_go",
              r"flashing\s+unlock",
              r"get_unlock_ability",
              r"allow_unlock"
          ]

          def run_command(command, timeout=300, cwd=None):
              try:
                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=timeout,
                      cwd=cwd
                  )

                  return (
                      result.returncode,
                      result.stdout
                  )

              except subprocess.TimeoutExpired as exc:
                  output = (
                      exc.stdout
                      if isinstance(
                          exc.stdout,
                          str
                      )
                      else ""
                  )

                  return (
                      124,
                      output + "\nTIMEOUT\n"
                  )

              except Exception as exc:
                  return (
                      125,
                      str(exc)
                  )

          def safe_name(value, limit=180):
              value = str(value)
              value = value.replace(
                  "\\",
                  "_"
              )
              value = value.replace(
                  "/",
                  "_"
              )
              value = re.sub(
                  r"[^A-Za-z0-9._@+-]+",
                  "_",
                  value
              )
              value = value.strip(
                  "._"
              )

              if not value:
                  value = "file"

              return value[:limit]

          def sha256_file(path):
              digest = hashlib.sha256()

              with open(
                  path,
                  "rb"
              ) as f:
                  while True:
                      chunk = f.read(
                          READ_CHUNK
                      )

                      if not chunk:
                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()

          def md5_file(path):
              digest = hashlib.md5()

              with open(
                  path,
                  "rb"
              ) as f:
                  while True:
                      chunk = f.read(
                          READ_CHUNK
                      )

                      if not chunk:
                          break

                      digest.update(
                          chunk
                      )

              return digest.hexdigest()

          def calculate_entropy(path):
              counts = [0] * 256
              total = 0

              with open(
                  path,
                  "rb"
              ) as f:
                  while True:
                      chunk = f.read(
                          READ_CHUNK
                      )

                      if not chunk:
                          break

                      total += len(
                          chunk
                      )

                      for value in chunk:
                          counts[value] += 1

              if total == 0:
                  return 0.0

              result = 0.0

              for count in counts:
                  if count:
                      probability = (
                          count / total
                      )

                      result -= (
                          probability
                          * math.log2(
                              probability
                          )
                      )

              return result

          def block_entropy(data):
              if not data:
                  return 0.0

              counts = [0] * 256

              for value in data:
                  counts[value] += 1

              total = len(
                  data
              )

              result = 0.0

              for count in counts:
                  if count:
                      probability = (
                          count / total
                      )

                      result -= (
                          probability
                          * math.log2(
                              probability
                          )
                      )

              return result

          def entropy_regions(
              path,
              block_size=65536,
              threshold=7.0
          ):
              result = []
              offset = 0

              with open(
                  path,
                  "rb"
              ) as f:
                  while True:
                      block = f.read(
                          block_size
                      )

                      if not block:
                          break

                      entropy_value = block_entropy(
                          block
                      )

                      if (
                          entropy_value
                          >= threshold
                      ):
                          result.append(
                              {
                                  "offset": offset,
                                  "size": len(
                                      block
                                  ),
                                  "entropy": round(
                                      entropy_value,
                                      6
                                  )
                              }
                          )

                      offset += len(
                          block
                      )

              return result

          def hex_preview(path, size=1024):
              with open(
                  path,
                  "rb"
              ) as f:
                  data = f.read(
                      size
                  )

              return " ".join(
                  f"{value:02x}"
                  for value in data
              )

          def safe_extract_path(
              destination,
              member_name
          ):
              destination_real = os.path.realpath(
                  destination
              )

              target_real = os.path.realpath(
                  os.path.join(
                      destination,
                      member_name
                  )
              )

              return (
                  target_real == destination_real
                  or target_real.startswith(
                      destination_real + os.sep
                  )
              )

          def safe_extract_zip(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              result = []

              with zipfile.ZipFile(
                  path,
                  "r"
              ) as archive:
                  for member in archive.infolist():
                      name = member.filename

                      if not safe_extract_path(
                          destination,
                          name
                      ):
                          continue

                      target = os.path.join(
                          destination,
                          name
                      )

                      if member.is_dir():
                          os.makedirs(
                              target,
                              exist_ok=True
                          )
                          continue

                      os.makedirs(
                          os.path.dirname(
                              target
                          ),
                          exist_ok=True
                      )

                      with archive.open(
                          member,
                          "r"
                      ) as source:
                          with open(
                              target,
                              "wb"
                          ) as output:
                              shutil.copyfileobj(
                                  source,
                                  output,
                                  READ_CHUNK
                              )

                      if not os.path.isfile(
                          target
                      ):
                          continue

                      try:
                          size = os.path.getsize(
                              target
                          )
                      except Exception:
                          continue

                      if (
                          size
                          <= MAX_DECOMPRESSED_FILE_SIZE
                      ):
                          result.append(
                              target
                          )

              return result

          def safe_extract_tar(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              result = []

              with tarfile.open(
                  path,
                  "r:*"
              ) as archive:
                  for member in archive.getmembers():
                      if (
                          member.issym()
                          or member.islnk()
                          or member.isdev()
                      ):
                          continue

                      if not safe_extract_path(
                          destination,
                          member.name
                      ):
                          continue

                      target = os.path.join(
                          destination,
                          member.name
                      )

                      if member.isdir():
                          os.makedirs(
                              target,
                              exist_ok=True
                          )
                          continue

                      source = archive.extractfile(
                          member
                      )

                      if source is None:
                          continue

                      os.makedirs(
                          os.path.dirname(
                              target
                          ),
                          exist_ok=True
                      )

                      with source:
                          with open(
                              target,
                              "wb"
                          ) as output:
                              shutil.copyfileobj(
                                  source,
                                  output,
                                  READ_CHUNK
                              )

                      if not os.path.isfile(
                          target
                      ):
                          continue

                      try:
                          size = os.path.getsize(
                              target
                          )
                      except Exception:
                          continue

                      if (
                          size
                          <= MAX_DECOMPRESSED_FILE_SIZE
                      ):
                          result.append(
                              target
                          )

              return result

          def safe_extract_7z(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              code, output = run_command(
                  [
                      "7z",
                      "x",
                      "-y",
                      "-bd",
                      f"-o{destination}",
                      path
                  ],
                  timeout=1800
              )

              result = []

              if code != 0:
                  return (
                      result,
                      code,
                      output
                  )

              for root, directories, files in os.walk(
                  destination
              ):
                  for filename in files:
                      current = os.path.join(
                          root,
                          filename
                      )

                      if not os.path.isfile(
                          current
                      ):
                          continue

                      try:
                          size = os.path.getsize(
                              current
                          )
                      except Exception:
                          continue

                      if (
                          size
                          <= MAX_DECOMPRESSED_FILE_SIZE
                      ):
                          result.append(
                              current
                          )

              return (
                  result,
                  code,
                  output
              )

          def extract_single_stream(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              try:
                  with open(
                      path,
                      "rb"
                  ) as f:
                      magic = f.read(
                          16
                      )
              except Exception:
                  return []

              output = (
                  destination
                  / (
                      safe_name(
                          os.path.basename(
                              path
                          )
                      )
                      + ".decompressed"
                  )
              )

              try:
                  if magic.startswith(
                      b"\x1f\x8b"
                  ):
                      source = gzip.open(
                          path,
                          "rb"
                      )

                  elif magic.startswith(
                      b"BZh"
                  ):
                      source = bz2.open(
                          path,
                          "rb"
                      )

                  elif magic.startswith(
                      b"\xfd7zXZ\x00"
                  ):
                      source = lzma.open(
                          path,
                          "rb"
                      )

                  else:
                      return []

                  with source:
                      with open(
                          output,
                          "wb"
                      ) as destination_file:
                          shutil.copyfileobj(
                              source,
                              destination_file,
                              READ_CHUNK
                          )

                  if not output.is_file():
                      return []

                  size = output.stat().st_size

                  if (
                      size <= 0
                      or size
                      > MAX_DECOMPRESSED_FILE_SIZE
                  ):
                      try:
                          output.unlink()
                      except Exception:
                          pass

                      return []

                  return [
                      str(output)
                  ]

              except Exception:
                  try:
                      if output.exists():
                          output.unlink()
                  except Exception:
                      pass

                  return []

          def extract_with_binwalk(
              path,
              destination
          ):
              os.makedirs(
                  destination,
                  exist_ok=True
              )

              code, output = run_command(
                  [
                      "binwalk",
                      "-Me",
                      "--run-as=root",
                      "--directory=" + destination,
                      path
                  ],
                  timeout=1800
              )

              result = []

              if os.path.isdir(
                  destination
              ):
                  for root, directories, files in os.walk(
                      destination
                  ):
                      for filename in files:
                          current = os.path.join(
                              root,
                              filename
                          )

                          if not os.path.isfile(
                              current
                          ):
                              continue

                          try:
                              size = os.path.getsize(
                                  current
                              )
                          except Exception:
                              continue

                          if (
                              size
                              <= MAX_DECOMPRESSED_FILE_SIZE
                          ):
                              result.append(
                                  current
                              )

              return (
                  result,
                  code,
                  output
              )

          def detect_archive_types(path):
              result = {
                  "zip": False,
                  "tar": False,
                  "7z": False,
                  "compressed": False
              }

              try:
                  result["zip"] = zipfile.is_zipfile(
                      path
                  )
              except Exception:
                  pass

              try:
                  result["tar"] = tarfile.is_tarfile(
                      path
                  )
              except Exception:
                  pass

              try:
                  with open(
                      path,
                      "rb"
                  ) as f:
                      magic = f.read(
                          32
                      )

                  if magic.startswith(
                      b"7z\xbc\xaf'\x1c"
                  ):
                      result["7z"] = True

                  if (
                      magic.startswith(
                          b"\x1f\x8b"
                      )
                      or magic.startswith(
                          b"BZh"
                      )
                      or magic.startswith(
                          b"\xfd7zXZ\x00"
                      )
                  ):
                      result["compressed"] = True

              except Exception:
                  pass

              return result

          def recursive_extract(
              source_path,
              relative_name,
              depth,
              known_hashes,
              discovered,
              extraction_log
          ):
              if (
                  depth
                  > MAX_ARCHIVE_DEPTH
              ):
                  return

              if (
                  len(discovered)
                  >= MAX_FILES
              ):
                  return

              try:
                  source_hash = sha256_file(
                      source_path
                  )
              except Exception as exc:
                  extraction_log.append(
                      {
                          "source": source_path,
                          "depth": depth,
                          "method": "sha256",
                          "success": False,
                          "error": str(exc)
                      }
                  )

                  return

              if source_hash in known_hashes:
                  return

              known_hashes.add(
                  source_hash
              )

              extraction_base = (
                  EXTRACT_ROOT
                  / (
                      source_hash[:16]
                      + "_"
                      + safe_name(
                          relative_name
                      )
                  )
              )

              extraction_base.mkdir(
                  parents=True,
                  exist_ok=True
              )

              archive_types = detect_archive_types(
                  source_path
              )

              generated = []

              if archive_types["zip"]:
                  destination = (
                      extraction_base
                      / "zip"
                  )

                  try:
                      files = safe_extract_zip(
                          source_path,
                          destination
                      )

                      generated.extend(
                          files
                      )

                      extraction_log.append(
                          {
                              "source": source_path,
                              "depth": depth,
                              "method": "zip",
                              "success": True,
                              "count": len(
                                  files
                              ),
                              "destination": str(
                                  destination
                              )
                          }
                      )

                  except Exception as exc:
                      extraction_log.append(
                          {
                              "source": source_path,
                              "depth": depth,
                              "method": "zip",
                              "success": False,
                              "count": 0,
                              "error": str(exc)
                          }
                      )

              if archive_types["tar"]:
                  destination = (
                      extraction_base
                      / "tar"
                  )

                  try:
                      files = safe_extract_tar(
                          source_path,
                          destination
                      )

                      generated.extend(
                          files
                      )

                      extraction_log.append(
                          {
                              "source": source_path,
                              "depth": depth,
                              "method": "tar",
                              "success": True,
                              "count": len(
                                  files
                              ),
                              "destination": str(
                                  destination
                              )
                          }
                      )

                  except Exception as exc:
                      extraction_log.append(
                          {
                              "source": source_path,
                              "depth": depth,
                              "method": "tar",
                              "success": False,
                              "count": 0,
                              "error": str(exc)
                          }
                      )

              if archive_types["7z"]:
                  destination = (
                      extraction_base
                      / "7z"
                  )

                  (
                      files,
                      code,
                      output
                  ) = safe_extract_7z(
                      source_path,
                      destination
                  )

                  generated.extend(
                      files
                  )

                  extraction_log.append(
                      {
                          "source": source_path,
                          "depth": depth,
                          "method": "7z",
                          "success": code == 0,
                          "count": len(files),
                          "output": output[-10000:]
                      }
                  )

              if archive_types["compressed"]:
                  destination = (
                      extraction_base
                      / "stream"
                  )

                  files = extract_single_stream(
                      source_path,
                      destination
                  )

                  generated.extend(
                      files
                  )

                  extraction_log.append(
                      {
                          "source": source_path,
                          "depth": depth,
                          "method": "compressed_stream",
                          "success": bool(files),
                          "count": len(files),
                          "destination": str(
                              destination
                          )
                      }
                  )

              binwalk_destination = (
                  extraction_base
                  / "binwalk"
              )

              (
                  binwalk_files,
                  binwalk_code,
                  binwalk_output
              ) = extract_with_binwalk(
                  source_path,
                  binwalk_destination
              )

              generated.extend(
                  binwalk_files
              )

              extraction_log.append(
                  {
                      "source": source_path,
                      "depth": depth,
                      "method": "binwalk",
                      "success": binwalk_code == 0,
                      "count": len(binwalk_files),
                      "output": binwalk_output[-10000:]
                  }
              )

              unique_generated = set()

              for current in generated:
                  if not os.path.isfile(
                      current
                  ):
                      continue

                  try:
                      current_hash = sha256_file(
                          current
                      )
                  except Exception:
                      continue

                  if (
                      current_hash == source_hash
                  ):
                      continue

                  if (
                      current_hash
                      in unique_generated
                  ):
                      continue

                  if (
                      current_hash
                      in known_hashes
                  ):
                      continue

                  unique_generated.add(
                      current_hash
                  )

                  if (
                      len(discovered)
                      >= MAX_FILES
                  ):
                      break

                  discovered.append(
                      {
                          "path": current,
                          "parent": source_path,
                          "depth": depth + 1,
                          "sha256": current_hash
                      }
                  )

          def file_command(
              path,
              mime=False
          ):
              command = [
                  "file",
                  "-b"
              ]

              if mime:
                  command.append(
                      "--mime"
                  )

              command.append(
                  path
              )

              return run_command(
                  command,
                  timeout=60
              )

          def strings_command(
              path,
              utf16=False
          ):
              if utf16:
                  command = [
                      "strings",
                      "-a",
                      "-el",
                      "-n",
                      "4",
                      "-t",
                      "x",
                      path
                  ]
              else:
                  command = [
                      "strings",
                      "-a",
                      "-n",
                      "4",
                      "-t",
                      "x",
                      path
                  ]

              return run_command(
                  command,
                  timeout=600
              )

          def get_r2_json(
              r2,
              command
          ):
              try:
                  value = r2.cmdj(
                      command
                  )

                  if value is None:
                      return {}

                  return value

              except Exception:
                  return {}

          def analyze_with_r2(
              path,
              base_name
          ):
              result = {
                  "available": False,
                  "error": None,
                  "info": {},
                  "analysis_info": {},
                  "sections": [],
                  "symbols": [],
                  "imports": [],
                  "exports": [],
                  "strings": [],
                  "entrypoints": [],
                  "functions": [],
                  "function_count": 0,
                  "disassembly_file": None,
                  "entry_disassembly_file": None
              }

              try:
                  r2 = r2pipe.open(
                      str(path),
                      flags=[
                          "-2"
                      ]
                  )
              except Exception as exc:
                  result["error"] = str(
                      exc
                  )

                  return result

              result["available"] = True

              try:
                  result["info"] = get_r2_json(
                      r2,
                      "ij"
                  )

                  result["analysis_info"] = get_r2_json(
                      r2,
                      "iIj"
                  )

                  result["sections"] = get_r2_json(
                      r2,
                      "iSj"
                  )

                  result["symbols"] = get_r2_json(
                      r2,
                      "isj"
                  )

                  result["imports"] = get_r2_json(
                      r2,
                      "iij"
                  )

                  result["exports"] = get_r2_json(
                      r2,
                      "iEj"
                  )

                  result["strings"] = get_r2_json(
                      r2,
                      "izzj"
                  )

                  result["entrypoints"] = get_r2_json(
                      r2,
                      "iej"
                  )

                  for command in [
                      "aaa",
                      "aac",
                      "aav",
                      "aaf"
                  ]:
                      try:
                          r2.cmd(
                              command
                          )
                      except Exception:
                          pass

                  result["functions"] = get_r2_json(
                      r2,
                      "aflj"
                  )

                  if not isinstance(
                      result["functions"],
                      list
                  ):
                      result["functions"] = []

                  result["function_count"] = len(
                      result["functions"]
                  )

                  disassembly_path = (
                      REPORT_DISASM_ROOT
                      / f"{base_name}.asm"
                  )

                  disassembly_path.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with open(
                      disassembly_path,
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  ) as output:
                      output.write(
                          "===== FILE INFORMATION =====\n"
                      )

                      output.write(
                          json.dumps(
                              result["info"],
                              indent=2,
                              ensure_ascii=False
                          )
                      )

                      output.write(
                          "\n\n"
                      )

                      for index, function in enumerate(
                          result["functions"]
                      ):
                          address = function.get(
                              "offset",
                              function.get(
                                  "addr"
                              )
                          )

                          if address is None:
                              continue

                          name = str(
                              function.get(
                                  "name",
                                  ""
                              )
                          )

                          output.write(
                              "\n"
                              + "=" * 100
                              + "\n"
                          )

                          output.write(
                              f"FUNCTION_INDEX={index}\n"
                          )

                          output.write(
                              f"NAME={name}\n"
                          )

                          output.write(
                              f"ADDRESS={address:#x}\n"
                          )

                          output.write(
                              "=" * 100
                              + "\n"
                          )

                          try:
                              text = r2.cmd(
                                  f"pdf @ {address}"
                              )
                          except Exception as exc:
                              text = (
                                  "DISASSEMBLY_ERROR: "
                                  + str(exc)
                                  + "\n"
                              )

                          output.write(
                              text
                          )

                          output.write(
                              "\n"
                          )

                  result[
                      "disassembly_file"
                  ] = str(
                      disassembly_path
                  )

                  entry_path = (
                      REPORT_DISASM_ROOT
                      / f"{base_name}_entry.asm"
                  )

                  entry_path.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  try:
                      entry_text = r2.cmd(
                          "pd 512 @ entry0"
                      )
                  except Exception as exc:
                      entry_text = str(
                          exc
                      )

                  with open(
                      entry_path,
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  ) as output:
                      output.write(
                          entry_text
                      )

                  result[
                      "entry_disassembly_file"
                  ] = str(
                      entry_path
                  )

              except Exception as exc:
                  result["error"] = str(
                      exc
                  )

              finally:
                  try:
                      r2.quit()
                  except Exception:
                      pass

              return result

          def keyword_matches(
              strings
          ):
              matches = {
                  "fastboot": [],
                  "unlock": [],
                  "vendor": [],
                  "oem": []
              }

              if not isinstance(
                  strings,
                  list
              ):
                  return matches

              for entry in strings:
                  if not isinstance(
                      entry,
                      dict
                  ):
                      continue

                  text = str(
                      entry.get(
                          "string",
                          ""
                      )
                  )

                  lower = text.lower()

                  address = entry.get(
                      "vaddr",
                      entry.get(
                          "paddr",
                          entry.get(
                              "addr"
                          )
                      )
                  )

                  for keyword in FASTBOOT_KEYWORDS:
                      if keyword in lower:
                          matches[
                              "fastboot"
                          ].append(
                              {
                                  "address": address,
                                  "keyword": keyword,
                                  "string": text
                              }
                          )

                          break

                  for keyword in UNLOCK_KEYWORDS:
                      if keyword in lower:
                          matches[
                              "unlock"
                          ].append(
                              {
                                  "address": address,
                                  "keyword": keyword,
                                  "string": text
                              }
                          )

                          break

                  for keyword in VENDOR_KEYWORDS:
                      if keyword in lower:
                          matches[
                              "vendor"
                          ].append(
                              {
                                  "address": address,
                                  "keyword": keyword,
                                  "string": text
                              }
                          )

                          break

                  for pattern in OEM_COMMAND_PATTERNS:
                      try:
                          if re.search(
                              pattern,
                              lower
                          ):
                              matches[
                                  "oem"
                              ].append(
                                  {
                                      "address": address,
                                      "pattern": pattern,
                                      "string": text
                                  }
                              )

                              break

                      except Exception:
                          pass

              return matches

          def partition_candidates(
              strings
          ):
              values = set()

              keywords = [
                  "partition",
                  "xbl",
                  "xbl_config",
                  "abl",
                  "aop",
                  "boot",
                  "vendor_boot",
                  "system",
                  "system_ext",
                  "product",
                  "userdata",
                  "cache",
                  "recovery",
                  "misc",
                  "modem",
                  "modemst1",
                  "modemst2",
                  "fsg",
                  "persist",
                  "metadata",
                  "super",
                  "vbmeta",
                  "vbmeta_system",
                  "vbmeta_vendor",
                  "dtbo",
                  "devcfg",
                  "rpm",
                  "tz",
                  "hyp",
                  "keymaster",
                  "frp"
              ]

              if not isinstance(
                  strings,
                  list
              ):
                  return []

              for entry in strings:
                  if not isinstance(
                      entry,
                      dict
                  ):
                      continue

                  text = str(
                      entry.get(
                          "string",
                          ""
                      )
                  )

                  lower = text.lower()

                  if any(
                      keyword in lower
                      for keyword in keywords
                  ):
                      values.add(
                          text
                      )

              return sorted(
                  values
              )

          def analyze_file(
              path,
              relative_name,
              sequence,
              parent,
              depth
          ):
              path = str(
                  path
              )

              file_hash = sha256_file(
                  path
              )

              file_md5 = md5_file(
                  path
              )

              size = os.path.getsize(
                  path
              )

              base_name = (
                  f"{sequence:06d}_"
                  f"{safe_name(relative_name)}_"
                  f"{file_hash[:16]}"
              )

              raw_dir = (
                  RAW_ROOT
                  / base_name
              )

              raw_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              report_json = (
                  REPORT_FILES_ROOT
                  / f"{base_name}.json"
              )

              report_markdown = (
                  REPORT_FILES_ROOT
                  / f"{base_name}.md"
              )

              report_json.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              report_markdown.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              file_code, file_output = file_command(
                  path,
                  mime=False
              )

              mime_code, mime_output = file_command(
                  path,
                  mime=True
              )

              ascii_code, ascii_output = strings_command(
                  path,
                  utf16=False
              )

              utf16_code, utf16_output = strings_command(
                  path,
                  utf16=True
              )

              ascii_path = (
                  raw_dir
                  / "ascii_strings.txt"
              )

              utf16_path = (
                  raw_dir
                  / "utf16le_strings.txt"
              )

              hex_path = (
                  raw_dir
                  / "hex_preview.txt"
              )

              with open(
                  ascii_path,
                  "w",
                  encoding="utf-8",
                  errors="replace"
              ) as output:
                  output.write(
                      ascii_output
                  )

              with open(
                  utf16_path,
                  "w",
                  encoding="utf-8",
                  errors="replace"
              ) as output:
                  output.write(
                      utf16_output
                  )

              with open(
                  hex_path,
                  "w",
                  encoding="utf-8"
              ) as output:
                  output.write(
                      hex_preview(
                          path
                      )
                  )

              try:
                  entropy_value = calculate_entropy(
                      path
                  )
              except Exception:
                  entropy_value = 0.0

              try:
                  entropy_blocks = entropy_regions(
                      path
                  )
              except Exception:
                  entropy_blocks = []

              r2_result = analyze_with_r2(
                  path,
                  base_name
              )

              matches = keyword_matches(
                  r2_result.get(
                      "strings",
                      []
                  )
              )

              partitions = partition_candidates(
                  r2_result.get(
                      "strings",
                      []
                  )
              )

              original_copy = None

              if (
                  size
                  <= 64 * 1024 * 1024
              ):
                  original_path = (
                      raw_dir
                      / "original.bin"
                  )

                  try:
                      shutil.copy2(
                          path,
                          original_path
                      )

                      original_copy = str(
                          original_path
                      )
                  except Exception:
                      original_copy = None

              data = {
                  "sequence": sequence,
                  "relative_name": relative_name,
                  "path": path,
                  "parent": parent,
                  "depth": depth,
                  "size": size,
                  "sha256": file_hash,
                  "md5": file_md5,
                  "file_description": file_output.strip(),
                  "mime": mime_output.strip(),
                  "file_command_exit_code": file_code,
                  "mime_command_exit_code": mime_code,
                  "ascii_strings_command_exit_code": ascii_code,
                  "utf16_strings_command_exit_code": utf16_code,
                  "ascii_strings_file": str(
                      ascii_path
                  ),
                  "utf16le_strings_file": str(
                      utf16_path
                  ),
                  "hex_preview_file": str(
                      hex_path
                  ),
                  "original_copy": original_copy,
                  "entropy": entropy_value,
                  "high_entropy_blocks": entropy_blocks,
                  "high_entropy_block_count": len(
                      entropy_blocks
                  ),
                  "fastboot_matches": matches[
                      "fastboot"
                  ],
                  "unlock_matches": matches[
                      "unlock"
                  ],
                  "vendor_matches": matches[
                      "vendor"
                  ],
                  "oem_matches": matches[
                      "oem"
                  ],
                  "partition_candidates": partitions,
                  "r2": r2_result
              }

              with open(
                  report_json,
                  "w",
                  encoding="utf-8"
              ) as output:
                  json.dump(
                      data,
                      output,
                      indent=2,
                      ensure_ascii=False
                  )

              with open(
                  report_markdown,
                  "w",
                  encoding="utf-8"
              ) as output:
                  output.write(
                      "# Recursive File Analysis Report\n\n"
                  )

                  output.write(
                      "## File\n\n"
                  )

                  output.write(
                      f"`{relative_name}`\n\n"
                  )

                  output.write(
                      "## Metadata\n\n"
                  )

                  output.write(
                      "| Field | Value |\n"
                  )

                  output.write(
                      "|---|---|\n"
                  )

                  output.write(
                      f"| Size | `{size}` bytes |\n"
                  )

                  output.write(
                      f"| SHA256 | `{file_hash}` |\n"
                  )

                  output.write(
                      f"| MD5 | `{file_md5}` |\n"
                  )

                  output.write(
                      f"| File | `{file_output.strip()}` |\n"
                  )

                  output.write(
                      f"| MIME | `{mime_output.strip()}` |\n"
                  )

                  output.write(
                      f"| Entropy | `{entropy_value:.6f}` |\n"
                  )

                  output.write(
                      f"| Recursion Depth | `{depth}` |\n"
                  )

                  output.write(
                      f"| R2 Available | `{r2_result.get('available')}` |\n"
                  )

                  output.write(
                      f"| R2 Functions | `{r2_result.get('function_count', 0)}` |\n"
                  )

                  output.write(
                      "\n## Fastboot-related Matches\n\n"
                  )

                  if matches["fastboot"]:
                      output.write(
                          "| Address | Keyword | String |\n"
                      )

                      output.write(
                          "|---|---|---|\n"
                      )

                      for item in matches["fastboot"]:
                          text = str(
                              item["string"]
                          ).replace(
                              "|",
                              " "
                          )

                          output.write(
                              f"| `{item['address']}` | "
                              f"`{item['keyword']}` | "
                              f"`{text}` |\n"
                          )

                  else:
                      output.write(
                          "No fastboot-related matches detected.\n"
                      )

                  output.write(
                      "\n## Unlock-related Matches\n\n"
                  )

                  if matches["unlock"]:
                      output.write(
                          "| Address | Keyword | String |\n"
                      )

                      output.write(
                          "|---|---|---|\n"
                      )

                      for item in matches["unlock"]:
                          text = str(
                              item["string"]
                          ).replace(
                              "|",
                              " "
                          )

                          output.write(
                              f"| `{item['address']}` | "
                              f"`{item['keyword']}` | "
                              f"`{text}` |\n"
                          )

                  else:
                      output.write(
                          "No unlock-related matches detected.\n"
                      )

                  output.write(
                      "\n## Vendor-related Matches\n\n"
                  )

                  if matches["vendor"]:
                      output.write(
                          "| Address | Keyword | String |\n"
                      )

                      output.write(
                          "|---|---|---|\n"
                      )

                      for item in matches["vendor"]:
                          text = str(
                              item["string"]
                          ).replace(
                              "|",
                              " "
                          )

                          output.write(
                              f"| `{item['address']}` | "
                              f"`{item['keyword']}` | "
                              f"`{text}` |\n"
