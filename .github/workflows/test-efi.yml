                      )

                      output.write(
                          "|---|---|---|\n"
                      )

                      for item in matches["oem"]:
                          text = str(
                              item["string"]
                          ).replace(
                              "|",
                              " "
                          )

                          output.write(
                              f"| `{item['address']}` | "
                              f"`{item['pattern']}` | "
                              f"`{text}` |\n"
                          )

                  else:
                      output.write(
                          "No explicit OEM command patterns detected.\n"
                      )

                  output.write(
                      "\n## Partition Candidates\n\n"
                  )

                  if partitions:
                      for item in partitions:
                          output.write(
                              f"- `{item}`\n"
                          )
                  else:
                      output.write(
                          "No partition candidates detected.\n"
