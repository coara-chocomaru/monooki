              output.write(
                  "</body>\n"
              )

              output.write(
                  "</html>\n"
              )

          print(
              f"Markdown report: {markdown_path}"
          )

          print(
              f"HTML report: {html_path}"
          )
          PYEOF

          python3 \
            -m py_compile \
            /tmp/generate_global_report.py

          chmod +x \
            /tmp/generate_global_report.py

      - name: Generate Global Report
        shell: bash
        run: |
          set -e

          python3 \
            /tmp/generate_global_report.py

          test -f \
            "${ARTIFACT_ROOT}/reports/FULL_ANALYSIS_REPORT.md"

          test -f \
            "${ARTIFACT_ROOT}/reports/index.html"

      - name: Validate Manifest
        shell: bash
        run: |
          set -e

          test -d \
            "${ARTIFACT_ROOT}"

          test -f \
            "${ARTIFACT_ROOT}/analysis_manifest.json"

          test -f \
            "${ARTIFACT_ROOT}/analysis_index.csv"

          python3 - <<'PYEOF'
          import json
          import os
          from pathlib import Path

          root = Path(
              os.environ["ARTIFACT_ROOT"]
          )

          manifest_path = (
              root
              / "analysis_manifest.json"
          )

          with open(
              manifest_path,
              "r",
              encoding="utf-8"
          ) as source:
              manifest = json.load(
                  source
              )

          required_keys = [
              "input_zip",
              "input_size",
              "input_sha256",
              "analysis_root",
              "artifact_root",
              "file_count_discovered",
              "file_count_analyzed",
              "file_count_failed",
              "files",
              "failures"
          ]

          for key in required_keys:
              if key not in manifest:
                  raise SystemExit(
                      f"Manifest key missing: {key}"
                  )

          discovered = int(
              manifest[
                  "file_count_discovered"
              ]
          )

          analyzed = int(
              manifest[
                  "file_count_analyzed"
              ]
          )

          failed = int(
              manifest[
                  "file_count_failed"
              ]
          )

          if discovered < 0:
              raise SystemExit(
                  "Invalid discovered count."
              )

          if analyzed < 0:
              raise SystemExit(
                  "Invalid analyzed count."
              )

          if failed < 0:
              raise SystemExit(
                  "Invalid failed count."
              )

          if analyzed > discovered:
              raise SystemExit(
                  "Analyzed count exceeds discovered count."
              )

          if analyzed + failed < discovered:
              raise SystemExit(
                  "Analysis accounting is incomplete."
              )

          if not isinstance(
              manifest[
                  "files"
              ],
              list
          ):
              raise SystemExit(
                  "Manifest files is not a list."
              )

          if not isinstance(
              manifest[
                  "failures"
              ],
              list
          ):
              raise SystemExit(
                  "Manifest failures is not a list."
              )

          print(
              f"Discovered: {discovered}"
          )

          print(
              f"Analyzed: {analyzed}"
          )

          print(
              f"Failed: {failed}"
          )

          print(
              f"Manifest: {manifest_path}"
          )
          PYEOF

      - name: Collect Diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            "${ARTIFACT_ROOT}/logs"

          {
            echo "===== DATE ====="
            date -u

            echo "===== HOST ====="
            uname -a

            echo "===== CPU ====="
            nproc

            echo "===== MEMORY ====="
            free -h

            echo "===== DISK ====="
            df -h

            echo "===== PATH ====="
            echo "${PATH}"

            echo "===== LD_LIBRARY_PATH ====="
            echo "${LD_LIBRARY_PATH}"

            echo "===== COMMANDS ====="
            command -v r2
            command -v rabin2
            command -v rasm2
            command -v ldconfig
            command -v python3
            command -v file
            command -v 7z

            echo "===== VERSIONS ====="
            r2 -v
            rabin2 -v
            python3 --version
            file --version

            echo "===== ANALYSIS FILES ====="

            if [ -d "${ANALYSIS_ROOT}" ]; then
              find \
                "${ANALYSIS_ROOT}" \
                -maxdepth 8 \
                -type f \
                -printf '%p %s bytes\n' \
                | sort
            else
              echo "ANALYSIS_ROOT not found"
            fi

            echo "===== ARTIFACT FILES ====="

            if [ -d "${ARTIFACT_ROOT}" ]; then
              find \
                "${ARTIFACT_ROOT}" \
                -maxdepth 10 \
                -type f \
                -printf '%p %s bytes\n' \
                | sort
            else
              echo "ARTIFACT_ROOT not found"
            fi

          } > \
            "${ARTIFACT_ROOT}/logs/diagnostics.log" \
            2>&1

      - name: Upload All Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_full_recursive_analysis
          path: |
            artifacts/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Final Status
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f "${ARTIFACT_ROOT}/analysis_manifest.json" ]; then
            echo "::notice title=Analysis Manifest Created::analysis_manifest.json was generated successfully."
          else
            echo "::warning title=Analysis Manifest Missing::analysis_manifest.json was not generated. Check artifacts/logs/diagnostics.log."
          fi

          if [ -f "${ARTIFACT_ROOT}/reports/FULL_ANALYSIS_REPORT.md" ]; then
            echo "::notice title=Full Report Created::FULL_ANALYSIS_REPORT.md was generated successfully."
          else
            echo "::warning title=Full Report Missing::FULL_ANALYSIS_REPORT.md was not generated."
          fi

          if [ -f "${ARTIFACT_ROOT}/reports/index.html" ]; then
            echo "::notice title=HTML Report Created::reports/index.html was generated successfully."
          else
            echo "::warning title=HTML Report Missing::reports/index.html was not generated."
          fi

          if [ -f "${ARTIFACT_ROOT}/logs/analysis.log" ]; then
            echo "::notice title=Analysis Log Created::analysis.log was generated successfully."
          fi

      - name: Fail Workflow When Analysis Failed
        if: failure()
        shell: bash
        run: |
          echo "::error title=Bootloader Analysis Failed::The workflow failed. Diagnostic logs and any generated artifacts were uploaded."
          exit 1
