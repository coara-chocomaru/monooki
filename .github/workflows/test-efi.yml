                          ensure_ascii=False
                      )
                  )

                  output.write(
                      "\n```\n"
                  )

                  output.write(
                      "\n"
                      "## Generated Files\n\n"
                  )

                  output.write(
                      f"- `{raw_dir / 'ascii_strings.txt'}`\n"
                  )

                  output.write(
                      f"- `{raw_dir / 'utf16le_strings.txt'}`\n"
                  )

                  output.write(
                      f"- `{raw_dir / 'hex_preview.txt'}`\n"
                  )

                  if original_copy:
                      output.write(
                          f"- `{original_copy}`\n"
                      )

                  if r2.get(
                      "disassembly_file"
                  ):
                      output.write(
                          f"- `{r2['disassembly_file']}`\n"
                      )

                  if r2.get(
                      "entry_disassembly_file"
                  ):
                      output.write(
                          f"- `{r2['entry_disassembly_file']}`\n"
                      )

              return {
                  "sequence": sequence,
                  "relative_name": relative_name,
                  "path": path,
                  "parent": parent,
                  "depth": depth,
                  "size": size,
                  "sha256": file_hash,
                  "md5": file_md5,
                  "file_description": detection[
                      "description"
                  ],
                  "mime": detection[
                      "mime"
                  ],
                  "magic_prefix": detection[
                      "magic_prefix"
                  ],
                  "entropy": entropy,
                  "function_count": int(
                      r2.get(
                          "function_count",
                          0
                      )
                      or 0
                  ),
                  "fastboot_match_count": len(
                      matches[
                          "fastboot"
                      ]
                  ),
                  "unlock_match_count": len(
                      matches[
                          "unlock"
                      ]
                  ),
                  "vendor_match_count": len(
                      matches[
                          "vendor"
                      ]
                  ),
                  "oem_match_count": len(
                      matches[
                          "oem"
                      ]
                  ),
                  "partition_candidate_count": len(
                      partitions
                  ),
                  "high_entropy_block_count": len(
                      entropy_blocks
                  ),
                  "report_markdown": str(
                      report_markdown
                  ),
                  "report_json": str(
                      report_json
                  ),
                  "raw_directory": str(
                      raw_dir
                  ),
                  "disassembly_file": r2.get(
                      "disassembly_file"
                  ),
                  "entry_disassembly_file": r2.get(
                      "entry_disassembly_file"
                  )
              }

          def csv_escape(
              value
          ):
              value = str(
                  value
              )

              return (
                  '"'
                  + value.replace(
                      '"',
                      '""'
                  )
                  + '"'
              )

          def main():
              for directory in [
                  FILE_ROOT,
                  EXTRACT_ROOT,
                  WORK_ROOT,
                  REPORT_ROOT,
                  REPORT_FILES_ROOT,
                  REPORT_DISASM_ROOT,
                  RAW_ROOT,
                  LOG_ROOT
              ]:
                  directory.mkdir(
                      parents=True,
                      exist_ok=True
                  )

              if not INPUT.is_file():
                  print(
                      f"Input ZIP not found: {INPUT}"
                  )

                  return 10

              if INPUT.stat().st_size <= 0:
                  print(
                      "Input ZIP is empty."
                  )

                  return 11

              source_root = (
                  FILE_ROOT
                  / "source"
              )

              source_root.mkdir(
                  parents=True,
                  exist_ok=True
              )

              try:
                  initial_files = extract_zip(
                      str(INPUT),
                      str(source_root)
                  )

              except Exception as exc:
                  print(
                      f"Initial ZIP extraction failed: {exc}"
                  )

                  with open(
                      LOG_ROOT
                      / "initial_extraction_error.txt",
                      "w",
                      encoding="utf-8"
                  ) as output:
                      traceback.print_exc(
                          file=output
                      )

                  return 12

              discovered = []

              for item in initial_files:
                  if not os.path.isfile(
                      item
                  ):
                      continue

                  try:
                      item_hash = sha256_file(
                          item
                      )
                  except Exception:
                      continue

                  discovered.append(
                      {
                          "path": item,
                          "parent": str(
                              INPUT
                          ),
                          "depth": 1,
                          "sha256": item_hash
                      }
                  )

              queue = deque(
                  discovered
              )

              known_hashes = set(
                  item[
                      "sha256"
                  ]
                  for item in discovered
              )

              extraction_records = []

              processed = set()

              while queue:
                  current = queue.popleft()

                  current_path = current[
                      "path"
                  ]

                  current_hash = current[
                      "sha256"
                  ]

                  if current_hash in processed:
                      continue

                  processed.add(
                      current_hash
                  )

                  if len(discovered) >= MAX_FILES:
                      break

                  relative_name = os.path.relpath(
                      current_path,
                      FILE_ROOT
                  )

                  generated = (
                      extract_recursive_layers(
                          current_path,
                          relative_name,
                          int(
                              current.get(
                                  "depth",
                                  1
                              )
                          ),
                          known_hashes,
                          extraction_records
                      )
                  )

                  for item in generated:
                      if (
                          len(discovered)
                          >= MAX_FILES
                      ):
                          break

                      discovered.append(
                          item
                      )

                      queue.append(
                          item
                      )

              unique = []
              unique_hashes = set()

              for item in discovered:
                  path = item[
                      "path"
                  ]

                  if not os.path.isfile(
                      path
                  ):
                      continue

                  current_hash = item[
                      "sha256"
                  ]

                  if current_hash in unique_hashes:
                      continue

                  unique_hashes.add(
                      current_hash
                  )

                  unique.append(
                      item
                  )

              unique.sort(
                  key=lambda item: (
                      int(
                          item.get(
                              "depth",
                              0
                          )
                      ),
                      str(
                          item.get(
                              "path",
                              ""
                          )
                      )
                  )
              )

              extraction_log = (
                  LOG_ROOT
                  / "recursive_extraction.json"
              )

              with open(
                  extraction_log,
                  "w",
                  encoding="utf-8"
              ) as output:
                  json.dump(
                      extraction_records,
                      output,
                      indent=2,
                      ensure_ascii=False
                  )

              summaries = []
              failures = []

              total = len(
                  unique
              )

              for index, item in enumerate(
                  unique,
                  1
              ):
                  path = item[
                      "path"
                  ]

                  relative_name = os.path.relpath(
                      path,
                      FILE_ROOT
                  )

                  print(
                      f"[{index}/{total}] "
                      f"Analyzing {relative_name}",
                      flush=True
                  )

                  try:
                      summary = analyze_file(
                          path,
                          relative_name,
                          index,
                          item.get(
                              "parent"
                          ),
                          int(
                              item.get(
                                  "depth",
                                  0
                              )
                          )
                      )

                      summaries.append(
                          summary
                      )

                  except Exception as exc:
                      failure = {
                          "sequence": index,
                          "relative_name": relative_name,
                          "path": path,
                          "parent": item.get(
                              "parent"
                          ),
                          "depth": item.get(
                              "depth",
                              0
                          ),
                          "error": str(exc)
                      }

                      failures.append(
                          failure
                      )

                      with open(
                          LOG_ROOT
                          / "failures.log",
                          "a",
                          encoding="utf-8"
                      ) as output:
                          output.write(
                              json.dumps(
                                  failure,
                                  ensure_ascii=False
                              )
                          )

                          output.write(
                              "\n"
                          )

                      print(
                          f"Analysis failed: "
                          f"{relative_name}: "
                          f"{exc}",
                          flush=True
                      )

              manifest = {
                  "input_zip": str(
                      INPUT
                  ),
                  "input_size": INPUT.stat().st_size,
                  "input_sha256": sha256_file(
                      INPUT
                  ),
                  "analysis_root": str(
                      ROOT
                  ),
                  "artifact_root": str(
                      ARTIFACT_ROOT
                  ),
                  "max_archive_depth": MAX_ARCHIVE_DEPTH,
                  "max_files": MAX_FILES,
                  "max_decompressed_file_size": MAX_DECOMPRESSED_FILE_SIZE,
                  "file_count_discovered": len(
                      unique
                  ),
                  "file_count_analyzed": len(
                      summaries
                  ),
                  "file_count_failed": len(
                      failures
                  ),
                  "files": summaries,
                  "failures": failures
              }

              manifest_path = (
                  ARTIFACT_ROOT
                  / "analysis_manifest.json"
              )

              with open(
                  manifest_path,
                  "w",
                  encoding="utf-8"
              ) as output:
                  json.dump(
                      manifest,
                      output,
                      indent=2,
                      ensure_ascii=False
                  )

              csv_path = (
                  ARTIFACT_ROOT
                  / "analysis_index.csv"
              )

              with open(
                  csv_path,
                  "w",
                  encoding="utf-8"
              ) as output:

                  output.write(
                      "sequence,"
                      "depth,"
                      "relative_name,"
                      "size,"
                      "sha256,"
                      "md5,"
                      "entropy,"
                      "function_count,"
                      "fastboot_match_count,"
                      "unlock_match_count,"
                      "vendor_match_count,"
                      "oem_match_count,"
                      "partition_candidate_count,"
                      "high_entropy_block_count,"
                      "report_markdown,"
                      "report_json,"
                      "disassembly_file,"
                      "entry_disassembly_file\n"
                  )

                  for item in summaries:
                      row = [
                          item.get(
                              "sequence",
                              ""
                          ),
                          item.get(
                              "depth",
                              ""
                          ),
                          csv_escape(
                              item.get(
                                  "relative_name",
                                  ""
                              )
                          ),
                          item.get(
                              "size",
                              ""
                          ),
                          csv_escape(
                              item.get(
                                  "sha256",
                                  ""
                              )
                          ),
                          csv_escape(
                              item.get(
                                  "md5",
                                  ""
                              )
                          ),
                          item.get(
                              "entropy",
                              ""
                          ),
                          item.get(
                              "function_count",
                              ""
                          ),
                          item.get(
                              "fastboot_match_count",
                              ""
                          ),
                          item.get(
                              "unlock_match_count",
                              ""
                          ),
                          item.get(
                              "vendor_match_count",
                              ""
                          ),
                          item.get(
                              "oem_match_count",
                              ""
                          ),
                          item.get(
                              "partition_candidate_count",
                              ""
                          ),
                          item.get(
                              "high_entropy_block_count",
                              ""
                          ),
                          csv_escape(
                              item.get(
                                  "report_markdown",
                                  ""
                              )
                          ),
                          csv_escape(
                              item.get(
                                  "report_json",
                                  ""
                              )
                          ),
                          csv_escape(
                              item.get(
                                  "disassembly_file",
                                  ""
                              )
                          ),
                          csv_escape(
                              item.get(
                                  "entry_disassembly_file",
                                  ""
                              )
                          )
                      ]

                      output.write(
                          ",".join(
                              map(
                                  str,
                                  row
                              )
                          )
                      )

                      output.write(
                          "\n"
                      )

              print(
                  "=============================================="
              )

              print(
                  "Recursive Analysis Complete"
              )

              print(
                  f"Discovered files : {len(unique)}"
              )

              print(
                  f"Analyzed files   : {len(summaries)}"
              )

              print(
                  f"Failed files     : {len(failures)}"
              )

              print(
                  f"Manifest         : {manifest_path}"
              )

              print(
                  "=============================================="
              )

              return 0

          if __name__ == "__main__":
              sys.exit(
                  main()
              )
