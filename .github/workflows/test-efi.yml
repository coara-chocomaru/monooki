                  "unlock_match_count": len(matches["unlock"]),
                  "vendor_match_count": len(matches["vendor"]),
                  "oem_match_count": len(matches["oem"]),
                  "partition_candidate_count": len(partition_candidates),
                  "high_entropy_block_count": len(entropy_blocks),
                  "report_markdown": str(md_path),
                  "report_json": str(json_path),
                  "raw_directory": str(raw_dir)
              }

          def main():
              FILE_ROOT.mkdir(parents=True, exist_ok=True)
              EXTRACT_ROOT.mkdir(parents=True, exist_ok=True)
              WORK_ROOT.mkdir(parents=True, exist_ok=True)
              REPORT_ROOT.mkdir(parents=True, exist_ok=True)
              RAW_ROOT.mkdir(parents=True, exist_ok=True)

              initial_extract = FILE_ROOT / "source"
              initial_extract.mkdir(parents=True, exist_ok=True)

              initial_files = []

              try:
                  initial_files.extend(
                      safe_extract_zip(
                          str(INPUT),
                          str(initial_extract)
                      )
                  )
              except Exception as exc:
                  print(f"Initial ZIP extraction failed: {exc}")
                  sys.exit(1)

              extraction_log = []
              discovered = []
              seen_hashes = set()

              source_manifest = []

              for item in initial_files:
                  if os.path.isfile(item):
                      try:
                          item_hash = sha256_file(item)
                      except Exception:
                          continue
                      discovered.append({
                          "path": item,
                          "parent": str(INPUT),
                          "depth": 1,
                          "sha256": item_hash
                      })

              queue = deque(discovered)

              all_discovered_by_hash = {}
              while queue:
                  current = queue.popleft()
                  current_path = current["path"]
                  current_hash = current["sha256"]

                  if current_hash in all_discovered_by_hash:
                      continue

                  all_discovered_by_hash[current_hash] = current

                  before = len(discovered)

                  extract_recursive(
                      current_path,
                      str(
                          Path(current.get("parent", "root")).name
                          / Path(current_path).name
                      ),
                      int(current.get("depth", 1)),
                      seen_hashes,
                      discovered,
                      extraction_log
                  )

                  if len(discovered) > before:
                      for item in discovered[before:]:
                          queue.append(item)

              files_to_analyze = []
              unique_file_hashes = set()

              for item in discovered:
                  path = item["path"]
                  if not os.path.isfile(path):
                      continue

                  try:
                      item_hash = sha256_file(path)
                  except Exception:
                      continue

                  if item_hash in unique_file_hashes:
                      continue

                  unique_file_hashes.add(item_hash)
                  files_to_analyze.append({
                      "path": path,
                      "parent": item.get("parent"),
                      "depth": item.get("depth", 0),
                      "sha256": item_hash
                  })

              files_to_analyze.sort(
                  key=lambda x: (
                      int(x.get("depth", 0)),
                      str(x.get("path", ""))
                  )
              )

              summaries = []
              failures = []

              for index, item in enumerate(files_to_analyze, 1):
                  path = item["path"]
                  relative_name = os.path.relpath(path, str(FILE_ROOT))

                  print(
                      f"[{index}/{len(files_to_analyze)}] "
                      f"Analyzing {relative_name}"
                  )

                  try:
                      summary = analyze_one_file(
                          path,
                          relative_name,
                          index
                      )

                      summary["parent"] = item.get("parent")
                      summary["depth"] = item.get("depth", 0)

                      summaries.append(summary)

                  except Exception as exc:
                      failure = {
                          "sequence": index,
                          "path": path,
                          "relative_name": relative_name,
                          "error": str(exc)
                      }
                      failures.append(failure)

                      with open(
                          REPORT_ROOT / "failures.log",
                          "a",
                          encoding="utf-8"
                      ) as f:
                          f.write(json.dumps(failure, ensure_ascii=False))
                          f.write("\n")

              archive_log_path = ARTIFACT_ROOT / "logs" / "recursive_extraction.json"
              with open(
                  archive_log_path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      extraction_log,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              manifest = {
                  "input_zip": str(INPUT),
                  "input_sha256": sha256_file(INPUT),
                  "analysis_root": str(ROOT),
                  "artifact_root": str(ARTIFACT_ROOT),
                  "max_archive_depth": MAX_ARCHIVE_DEPTH,
                  "file_count_discovered": len(files_to_analyze),
                  "file_count_analyzed": len(summaries),
                  "file_count_failed": len(failures),
                  "files": summaries,
                  "failures": failures
              }

              manifest_path = ARTIFACT_ROOT / "analysis_manifest.json"
              with open(
                  manifest_path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      manifest,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              csv_path = ARTIFACT_ROOT / "analysis_index.csv"
              with open(
                  csv_path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      "sequence,depth,relative_name,size,sha256,"
                      "entropy,function_count,fastboot_match_count,"
                      "unlock_match_count,vendor_match_count,"
                      "oem_match_count,partition_candidate_count,"
                      "high_entropy_block_count,report_markdown,report_json\n"
                  )

                  for item in summaries:
                      def csv_escape(value):
                          value = str(value)
                          return '"' + value.replace('"', '""') + '"'

                      f.write(
                          ",".join([
                              str(item.get("sequence", "")),
                              str(item.get("depth", "")),
                              csv_escape(item.get("relative_name", "")),
                              str(item.get("size", "")),
                              csv_escape(item.get("sha256", "")),
                              str(item.get("entropy", "")),
                              str(item.get("function_count", "")),
                              str(item.get("fastboot_match_count", "")),
                              str(item.get("unlock_match_count", "")),
                              str(item.get("vendor_match_count", "")),
                              str(item.get("oem_match_count", "")),
                              str(item.get("partition_candidate_count", "")),
                              str(item.get("high_entropy_block_count", "")),
                              csv_escape(item.get("report_markdown", "")),
                              csv_escape(item.get("report_json", ""))
                          ])
                      )
                      f.write("\n")

              print("")
              print("==============================================")
              print("Recursive Analysis Complete")
              print("Discovered files :", len(files_to_analyze))
              print("Analyzed files   :", len(summaries))
              print("Failed files     :", len(failures))
              print("Reports          :", REPORT_ROOT)
              print("==============================================")

              if not summaries:
                  sys.exit(2)

          if __name__ == "__main__":
              main()
          PYEOF

