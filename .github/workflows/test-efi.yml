name: QCOM Bootloader Full Recursive Disassembly & Analysis

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Analysis ZIP URL"
        required: true
        type: string

jobs:
  full-disassembly:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:22.04
      options: --privileged

    env:
      ZIP_URL: ${{ inputs.zip_url || vars.ANALYSIS_ZIP_URL || secrets.ANALYSIS_ZIP_URL }}
      ANALYSIS_ROOT: ${{ github.workspace }}/analysis
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts

    steps:
      - name: Install Git
        shell: bash
        run: |
          set -e
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git \
            ca-certificates \
            curl
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ZIP URL
        shell: bash
        run: |
          set -e

          if [ -z "${ZIP_URL}" ]; then
            echo "ZIP_URL is empty."
            echo "Set workflow_dispatch input zip_url, repository variable ANALYSIS_ZIP_URL, or secret ANALYSIS_ZIP_URL."
            exit 1
          fi

          echo "ZIP_URL is configured."

      - name: Install Analysis Tools
        shell: bash
        run: |
          set -e

          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y

          apt-get install -y --no-install-recommends \
            wget \
            curl \
            unzip \
            zip \
            p7zip-full \
            p7zip-rar \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            zstd \
            lz4 \
            file \
            binutils \
            build-essential \
            python3 \
            python3-pip \
            python3-dev \
            git \
            cmake \
            pkg-config \
            bsdmainutils \
            default-jdk-headless \
            binwalk \
            liblzma-dev \
            libmagic1 \
            gdb-multiarch \
            qemu-user-static \
            ca-certificates

          apt-get clean
          rm -rf /var/lib/apt/lists/*

          if ! command -v r2 >/dev/null 2>&1; then
            rm -rf /tmp/radare2
            git clone --depth 1 https://github.com/radareorg/radare2.git /tmp/radare2
            cd /tmp/radare2
            ./configure --prefix=/usr/local
            make -j"$(nproc)"
            make install
            cd /
            rm -rf /tmp/radare2
          fi

          ldconfig

          echo "/usr/local/bin" >> "${GITHUB_PATH}"

          export PATH="/usr/local/bin:${PATH}"

          r2 -v
          file --version
          7z i >/dev/null 2>&1
          python3 --version

      - name: Install Python Libraries
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            r2pipe \
            pefile \
            capstone \
            pyelftools \
            pycryptodome \
            unicorn \
            python-magic

      - name: Prepare Analysis Directories
        shell: bash
        run: |
          set -e

          rm -rf "${ANALYSIS_ROOT}"
          rm -rf "${ARTIFACT_ROOT}"

          mkdir -p \
            "${ANALYSIS_ROOT}/input" \
            "${ANALYSIS_ROOT}/files" \
            "${ANALYSIS_ROOT}/extracted" \
            "${ANALYSIS_ROOT}/work" \
            "${ARTIFACT_ROOT}/reports" \
            "${ARTIFACT_ROOT}/reports/files" \
            "${ARTIFACT_ROOT}/reports/disassembly" \
            "${ARTIFACT_ROOT}/raw" \
            "${ARTIFACT_ROOT}/logs"

      - name: Download ZIP
        shell: bash
        run: |
          set -e

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 3600 \
            --output "${ANALYSIS_ROOT}/input/source.zip" \
            "${ZIP_URL}"

          test -f "${ANALYSIS_ROOT}/input/source.zip"

          FILE_SIZE="$(stat -c '%s' "${ANALYSIS_ROOT}/input/source.zip")"

          if [ "${FILE_SIZE}" -le 0 ]; then
            echo "Downloaded ZIP is empty."
            exit 1
          fi

          file "${ANALYSIS_ROOT}/input/source.zip"

          sha256sum \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee "${ARTIFACT_ROOT}/logs/source_sha256.txt"

          stat \
            "${ANALYSIS_ROOT}/input/source.zip" \
            | tee "${ARTIFACT_ROOT}/logs/source_stat.txt"

      - name: Create Recursive Analysis Script
        shell: bash
        run: |
          set -e

          cat > /tmp/recursive_analysis.py <<'PYEOF'
          #!/usr/bin/env python3

          import os
          import sys
          import json
          import math
          import shutil
          import hashlib
          import subprocess
          import tarfile
          import zipfile
          import gzip
          import bz2
          import lzma
          import re

          from pathlib import Path
          from collections import deque

          import r2pipe

          ROOT = Path(os.environ["ANALYSIS_ROOT"])
          ARTIFACT_ROOT = Path(os.environ["ARTIFACT_ROOT"])

          INPUT = ROOT / "input" / "source.zip"

          FILE_ROOT = ROOT / "files"
          EXTRACT_ROOT = ROOT / "extracted"
          WORK_ROOT = ROOT / "work"

          REPORT_ROOT = ARTIFACT_ROOT / "reports"
          REPORT_FILES_ROOT = REPORT_ROOT / "files"
          REPORT_DISASM_ROOT = REPORT_ROOT / "disassembly"
          RAW_ROOT = ARTIFACT_ROOT / "raw"
          LOG_ROOT = ARTIFACT_ROOT / "logs"

          MAX_ARCHIVE_DEPTH = 32
          R2_TIMEOUT = 900
          READ_CHUNK = 1024 * 1024
          STRING_MIN_LENGTH = 4
          MAX_DECOMPRESSED_FILE_SIZE = 1024 * 1024 * 1024
          MAX_FILES = 100000

          FASTBOOT_KEYWORDS = [
              "flash",
              "erase",
              "reboot",
              "getvar",
              "setvar",
              "oem",
              "download",
              "continue",
              "boot",
              "update",
              "unlock",
              "lock",
              "device_state",
              "secure",
              "critical",
              "slot",
              "partition",
              "flag",
              "set",
              "userdata",
              "recovery",
              "system",
              "vendor",
              "product",
              "modem",
              "xbl",
              "abl",
              "sbl",
              "tz",
              "hyp",
              "devcfg"
          ]

          UNLOCK_KEYWORDS = [
              "unlock",
              "lock",
              "oem_unlock",
              "device_locked",
              "device_unlocked",
              "lock_state",
              "secure_boot",
              "unlock_ability",
              "allow_unlock",
              "unlock_code",
              "unlock-go",
              "unlock_go",
              "is_unlocked",
              "is_locked",
              "critical_unlock",
              "flashing_unlock",
              "get_unlock_ability"
          ]

          VENDOR_KEYWORDS = [
              "qualcomm",
              "qcom",
              "snapdragon",
              "littlekernel",
              "lk",
              "abl",
              "xbl",
              "sectools",
              "sahara",
              "firehose",
              "edl",
              "smem",
              "rpm",
              "tz",
              "hyp",
              "devcfg",
              "uefi",
              "fastboot"
          ]

          OEM_COMMAND_PATTERNS = [
              r"oem\s+unlock",
              r"oem\s+lock",
              r"oem\s+device-info",
              r"oem\s+getvar",
              r"oem\s+setvar",
              r"fastboot\s+oem",
              r"androidboot\.unlocked",
              r"androidboot\.verifiedbootstate",
              r"ro\.oem_unlock",
              r"oem\s+unlock-go",
              r"oem\s+set",
              r"oem\s+flag",
              r"unlock-go",
              r"unlock_go",
              r"flashing\s+unlock",
              r"get_unlock_ability",
              r"allow_unlock"
          ]

          def run_command(command, timeout=300, cwd=None):
              try:
                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      errors="replace",
                      timeout=timeout,
                      cwd=cwd
                  )

                  return result.returncode, result.stdout

              except subprocess.TimeoutExpired as exc:
                  output = exc.stdout if isinstance(exc.stdout, str) else ""
                  return 124, output + "\nTIMEOUT\n"

              except Exception as exc:
                  return 125, str(exc)

          def safe_name(value, limit=180):
              value = str(value)
              value = value.replace("\\", "/")
              value = re.sub(r"[^A-Za-z0-9._/@+-]+", "_", value)
              value = value.strip("/.")

              if not value:
                  value = "file"

              return value[:limit]

          def sha256_file(path):
              digest = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(READ_CHUNK)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          def md5_file(path):
              digest = hashlib.md5()

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(READ_CHUNK)

                      if not chunk:
                          break

                      digest.update(chunk)

              return digest.hexdigest()

          def calculate_entropy(path):
              counts = [0] * 256
              total = 0

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(READ_CHUNK)

                      if not chunk:
                          break

                      total += len(chunk)

                      for value in chunk:
                          counts[value] += 1

              if total == 0:
                  return 0.0

              entropy_value = 0.0

              for count in counts:
                  if count:
                      probability = count / total
                      entropy_value -= probability * math.log2(probability)

              return entropy_value

          def block_entropy(data):
              if not data:
                  return 0.0

              counts = [0] * 256

              for value in data:
                  counts[value] += 1

              total = len(data)
              entropy_value = 0.0

              for count in counts:
                  if count:
                      probability = count / total
                      entropy_value -= probability * math.log2(probability)

              return entropy_value

          def entropy_regions(path, block_size=65536, threshold=7.0):
              regions = []
              offset = 0

              with open(path, "rb") as f:
                  while True:
                      block = f.read(block_size)

                      if not block:
                          break

                      entropy_value = block_entropy(block)

                      if entropy_value >= threshold:
                          regions.append(
                              {
                                  "offset": offset,
                                  "size": len(block),
                                  "entropy": round(entropy_value, 6)
                              }
                          )

                      offset += len(block)

              return regions

          def hex_preview(path, size=512):
              with open(path, "rb") as f:
                  data = f.read(size)

              return " ".join(f"{value:02x}" for value in data)

          def safe_extract_path(destination, member_name):
              destination_real = os.path.realpath(destination)
              target_real = os.path.realpath(
                  os.path.join(destination, member_name)
              )

              if target_real == destination_real:
                  return True

              return target_real.startswith(destination_real + os.sep)

          def safe_extract_zip(path, destination):
              destination = str(destination)

              os.makedirs(destination, exist_ok=True)

              extracted = []

              with zipfile.ZipFile(path, "r") as archive:
                  for member in archive.infolist():
                      name = member.filename

                      if not safe_extract_path(destination, name):
                          continue

                      target = os.path.join(destination, name)

                      if member.is_dir():
                          os.makedirs(target, exist_ok=True)
                          continue

                      os.makedirs(
                          os.path.dirname(target),
                          exist_ok=True
                      )

                      with archive.open(member, "r") as src:
                          with open(target, "wb") as dst:
                              shutil.copyfileobj(
                                  src,
                                  dst,
                                  length=READ_CHUNK
                              )

                      if os.path.isfile(target):
                          if os.path.getsize(target) <= MAX_DECOMPRESSED_FILE_SIZE:
                              extracted.append(target)

              return extracted

          def safe_extract_tar(path, destination):
              destination = str(destination)

              os.makedirs(destination, exist_ok=True)

              extracted = []

              with tarfile.open(path, "r:*") as archive:
                  for member in archive.getmembers():
                      if member.issym() or member.islnk() or member.isdev():
                          continue

                      if not safe_extract_path(
                          destination,
                          member.name
                      ):
                          continue

                      target = os.path.join(
                          destination,
                          member.name
                      )

                      if member.isdir():
                          os.makedirs(target, exist_ok=True)
                          continue

                      extracted_file = archive.extractfile(member)

                      if extracted_file is None:
                          continue

                      os.makedirs(
                          os.path.dirname(target),
                          exist_ok=True
                      )

                      with extracted_file:
                          with open(target, "wb") as dst:
                              shutil.copyfileobj(
                                  extracted_file,
                                  dst,
                                  length=READ_CHUNK
                              )

                      if os.path.isfile(target):
                          if os.path.getsize(target) <= MAX_DECOMPRESSED_FILE_SIZE:
                              extracted.append(target)

              return extracted

          def safe_extract_7z(path, destination):
              destination = str(destination)

              os.makedirs(destination, exist_ok=True)

              command = [
                  "7z",
                  "x",
                  "-y",
                  "-bd",
                  f"-o{destination}",
                  path
              ]

              code, output = run_command(
                  command,
                  timeout=1800
              )

              extracted = []

              if code != 0:
                  return extracted, code, output

              for root, dirs, files in os.walk(destination):
                  for filename in files:
                      current = os.path.join(root, filename)

                      if not os.path.isfile(current):
                          continue

                      try:
                          if os.path.getsize(current) > MAX_DECOMPRESSED_FILE_SIZE:
                              continue
                      except Exception:
                          continue

                      extracted.append(current)

              return extracted, code, output

          def extract_single_stream(path, destination):
              destination = str(destination)

              os.makedirs(destination, exist_ok=True)

              try:
                  with open(path, "rb") as f:
                      magic = f.read(16)
              except Exception:
                  return []

              output = os.path.join(
                  destination,
                  safe_name(os.path.basename(path)) + ".decompressed"
              )

              try:
                  if magic.startswith(b"\x1f\x8b"):
                      with gzip.open(path, "rb") as src:
                          with open(output, "wb") as dst:
                              shutil.copyfileobj(
                                  src,
                                  dst,
                                  length=READ_CHUNK
                              )

                  elif magic.startswith(b"BZh"):
                      with bz2.open(path, "rb") as src:
                          with open(output, "wb") as dst:
                              shutil.copyfileobj(
                                  src,
                                  dst,
                                  length=READ_CHUNK
                              )

                  elif magic.startswith(b"\xfd7zXZ\x00"):
                      with lzma.open(path, "rb") as src:
                          with open(output, "wb") as dst:
                              shutil.copyfileobj(
                                  src,
                                  dst,
                                  length=READ_CHUNK
                              )

                  else:
                      return []

                  if not os.path.isfile(output):
                      return []

                  if os.path.getsize(output) <= 0:
                      return []

                  if os.path.getsize(output) > MAX_DECOMPRESSED_FILE_SIZE:
                      try:
                          os.remove(output)
                      except Exception:
                          pass
                      return []

                  return [output]

              except Exception:
                  try:
                      if os.path.exists(output):
                          os.remove(output)
                  except Exception:
                      pass

                  return []

          def extract_with_binwalk(path, destination):
              destination = str(destination)

              os.makedirs(destination, exist_ok=True)

              command = [
                  "binwalk",
                  "-Me",
                  "--run-as=root",
                  "--directory=" + destination,
                  path
              ]

              code, output = run_command(
                  command,
                  timeout=1800
              )

              extracted = []

              if os.path.isdir(destination):
                  for root, dirs, files in os.walk(destination):
                      for filename in files:
                          current = os.path.join(
                              root,
                              filename
                          )

                          if not os.path.isfile(current):
                              continue

                          try:
                              if os.path.getsize(current) > MAX_DECOMPRESSED_FILE_SIZE:
                                  continue
                          except Exception:
                              continue

                          extracted.append(current)

              return extracted, code, output

          def discover_archive_type(path):
              result = {
                  "zip": False,
                  "tar": False,
                  "7z": False,
                  "compressed_stream": False
              }

              try:
                  result["zip"] = zipfile.is_zipfile(path)
              except Exception:
                  pass

              try:
                  result["tar"] = tarfile.is_tarfile(path)
              except Exception:
                  pass

              try:
                  with open(path, "rb") as f:
                      magic = f.read(32)

                  if magic.startswith(b"7z\xbc\xaf'\x1c"):
                      result["7z"] = True

                  if magic.startswith(b"\x1f\x8b"):
                      result["compressed_stream"] = True

                  if magic.startswith(b"BZh"):
                      result["compressed_stream"] = True

                  if magic.startswith(b"\xfd7zXZ\x00"):
                      result["compressed_stream"] = True

              except Exception:
                  pass

              return result

          def append_extracted(
              discovered,
              source_path,
              extracted_files,
              depth
          ):
              for item in extracted_files:
                  if not os.path.isfile(item):
                      continue

                  try:
                      item_size = os.path.getsize(item)

                      if item_size > MAX_DECOMPRESSED_FILE_SIZE:
                          continue

                      item_hash = sha256_file(item)

                  except Exception:
                      continue

                  discovered.append(
                      {
                          "path": item,
                          "parent": source_path,
                          "depth": depth,
                          "sha256": item_hash
                      }
                  )

          def recursive_extract(
              source_path,
              relative_name,
              depth,
              global_hashes,
              discovered,
              extraction_log
          ):
              if depth > MAX_ARCHIVE_DEPTH:
                  return

              if len(discovered) >= MAX_FILES:
                  return

              try:
                  source_hash = sha256_file(source_path)
              except Exception as exc:
                  extraction_log.append(
                      {
                          "source": source_path,
                          "method": "sha256",
                          "depth": depth,
                          "success": False,
                          "output": str(exc)
                      }
                  )
                  return

              if source_hash in global_hashes:
                  return

              global_hashes.add(source_hash)

              base_name = (
                  source_hash[:16]
                  + "_"
                  + safe_name(relative_name)
              )

              destination = EXTRACT_ROOT / base_name

              try:
                  destination.mkdir(
                      parents=True,
                      exist_ok=True
                  )
              except Exception:
                  return

              archive_info = discover_archive_type(
                  source_path
              )

              local_files = []

              if archive_info["zip"]:
                  zip_destination = destination / "zip"

                  try:
                      extracted = safe_extract_zip(
                          source_path,
                          zip_destination
                      )

                      local_files.extend(extracted)

                      extraction_log.append(
                          {
                              "source": source_path,
                              "method": "python_zip",
                              "depth": depth,
                              "success": True,
                              "count": len(extracted),
                              "output": str(zip_destination)
                          }
                      )

                  except Exception as exc:
                      extraction_log.append(
                          {
                              "source": source_path,
                              "method": "python_zip",
                              "depth": depth,
                              "success": False,
                              "count": 0,
                              "output": str(exc)
                          }
                      )

              if archive_info["tar"]:
                  tar_destination = destination / "tar"

                  try:
                      extracted = safe_extract_tar(
                          source_path,
                          tar_destination
                      )

                      local_files.extend(extracted)

                      extraction_log.append(
                          {
                              "source": source_path,
                              "method": "python_tar",
                              "depth": depth,
                              "success": True,
                              "count": len(extracted),
                              "output": str(tar_destination)
                          }
                      )

                  except Exception as exc:
                      extraction_log.append(
                          {
                              "source": source_path,
                              "method": "python_tar",
                              "depth": depth,
                              "success": False,
                              "count": 0,
                              "output": str(exc)
                          }
                      )

              if archive_info["7z"]:
                  seven_zip_destination = destination / "7z"

                  extracted, code, output = safe_extract_7z(
                      source_path,
                      seven_zip_destination
                  )

                  local_files.extend(extracted)

                  extraction_log.append(
                      {
                          "source": source_path,
                          "method": "7z",
                          "depth": depth,
                          "success": code == 0,
                          "count": len(extracted),
                          "output": output[-10000:]
                      }
                  )

              if archive_info["compressed_stream"]:
                  stream_destination = destination / "stream"

                  extracted = extract_single_stream(
                      source_path,
                      stream_destination
                  )

                  local_files.extend(extracted)

                  extraction_log.append(
                      {
                          "source": source_path,
                          "method": "single_stream",
                          "depth": depth,
                          "success": bool(extracted),
                          "count": len(extracted),
                          "output": str(stream_destination)
                      }
                  )

              binwalk_destination = destination / "binwalk"

              extracted, code, output = extract_with_binwalk(
                  source_path,
                  binwalk_destination
              )

              local_files.extend(extracted)

              extraction_log.append(
                  {
                      "source": source_path,
                      "method": "binwalk",
                      "depth": depth,
                      "success": code == 0,
                      "count": len(extracted),
                      "output": output[-10000:]
                  }
              )

              unique_local = set()

              for item in local_files:
                  if not os.path.isfile(item):
                      continue

                  try:
                      item_hash = sha256_file(item)
                  except Exception:
                      continue

                  if item_hash == source_hash:
                      continue

                  if item_hash in unique_local:
                      continue

                  unique_local.add(item_hash)

                  if item_hash in global_hashes:
                      continue

                  discovered.append(
                      {
                          "path": item,
                          "parent": source_path,
                          "depth": depth + 1,
                          "sha256": item_hash
                      }
                  )

          def strings_command(path, mode):
              if mode == "ascii":
                  command = [
                      "strings",
                      "-a",
                      "-n",
                      str(STRING_MIN_LENGTH),
                      "-t",
                      "x",
                      path
                  ]
              else:
                  command = [
                      "strings",
                      "-a",
                      "-el",
                      "-n",
                      str(STRING_MIN_LENGTH),
                      "-t",
                      "x",
                      path
                  ]

              return run_command(
                  command,
                  timeout=600
              )

          def file_description(path):
              return run_command(
                  [
                      "file",
                      "-b",
                      path
                  ],
                  timeout=60
              )

          def mime_description(path):
              return run_command(
                  [
                      "file",
                      "-b",
                      "--mime",
                      path
                  ],
                  timeout=60
              )

          def extract_r2_json(r2, command):
              try:
                  return r2.cmdj(command)
              except Exception:
                  return None

          def r2_open(path):
              return r2pipe.open(
                  str(path),
                  flags=["-2"],
                  timeout=R2_TIMEOUT
              )

          def get_r2_analysis(path, base_name):
              result = {
                  "available": False,
                  "error": None,
                  "info": {},
                  "analysis_info": {},
                  "sections": [],
                  "symbols": [],
                  "imports": [],
                  "exports": [],
                  "strings": [],
                  "entrypoints": [],
                  "functions": [],
                  "function_count": 0,
                  "disassembly_file": None,
                  "entry_disassembly_file": None,
                  "command_log": []
              }

              try:
                  r2 = r2_open(path)

              except Exception as exc:
                  result["error"] = str(exc)
                  return result

              result["available"] = True

              try:
                  r2.cmd("e io.cache=true")
              except Exception:
                  pass

              try:
                  r2.cmd("e bin.cache=true")
              except Exception:
                  pass

              result["info"] = (
                  extract_r2_json(r2, "ij") or {}
              )

              result["analysis_info"] = (
                  extract_r2_json(r2, "iIj") or {}
              )

              result["sections"] = (
                  extract_r2_json(r2, "iSj") or []
              )

              result["symbols"] = (
                  extract_r2_json(r2, "isj") or []
              )

              result["imports"] = (
                  extract_r2_json(r2, "iij") or []
              )

              result["exports"] = (
                  extract_r2_json(r2, "iEj") or []
              )

              result["strings"] = (
                  extract_r2_json(r2, "izzj") or []
              )

              result["entrypoints"] = (
                  extract_r2_json(r2, "iej") or []
              )

              for command in [
                  "aaa",
                  "aac",
                  "aav",
                  "aaf"
              ]:
                  try:
                      output = r2.cmd(command)

                      result["command_log"].append(
                          {
                              "command": command,
                              "success": True,
                              "output_tail": output[-5000:]
                          }
                      )

                  except Exception as exc:
                      result["command_log"].append(
                          {
                              "command": command,
                              "success": False,
                              "error": str(exc)
                          }
                      )

              result["functions"] = (
                  extract_r2_json(r2, "aflj") or []
              )

              result["function_count"] = len(
                  result["functions"]
              )

              disassembly_path = (
                  REPORT_DISASM_ROOT
                  / f"{base_name}.asm"
              )

              try:
                  with open(
                      disassembly_path,
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  ) as asm:

                      asm.write(
                          "===== FILE INFORMATION =====\n"
                      )

                      asm.write(
                          json.dumps(
                              result["info"],
                              indent=2,
                              ensure_ascii=False
                          )
                      )

                      asm.write("\n\n")
                      asm.write(
                          "===== ENTRYPOINTS =====\n"
                      )

                      asm.write(
                          json.dumps(
                              result["entrypoints"],
                              indent=2,
                              ensure_ascii=False
                          )
                      )

                      asm.write("\n")

                      for index, function in enumerate(
                          result["functions"]
                      ):
                          address = function.get(
                              "offset",
                              function.get(
                                  "addr"
                              )
                          )

                          if address is None:
                              continue

                          name = function.get(
                              "name",
                              ""
                          )

                          asm.write("\n")
                          asm.write(
                              "=" * 100
                          )
                          asm.write("\n")
                          asm.write(
                              f"FUNCTION_INDEX={index}\n"
                          )
                          asm.write(
                              f"NAME={name}\n"
                          )
                          asm.write(
                              f"ADDRESS={address:#x}\n"
                          )
                          asm.write(
                              "=" * 100
                          )
                          asm.write("\n")

                          try:
                              disassembly = r2.cmd(
                                  f"pdf @ {address}"
                              )
                          except Exception as exc:
                              disassembly = (
                                  "DISASSEMBLY_ERROR: "
                                  + str(exc)
                                  + "\n"
                              )

                          asm.write(
                              disassembly
                          )

                          asm.write("\n")

                  result["disassembly_file"] = str(
                      disassembly_path
                  )

              except Exception as exc:
                  result["disassembly_file"] = None
                  result["disassembly_error"] = str(
                      exc
                  )

              entry_disassembly_path = (
                  REPORT_DISASM_ROOT
                  / f"{base_name}_entry.asm"
              )

              try:
                  entry_disassembly = r2.cmd(
                      "pd 512 @ entry0"
                  )

                  with open(
                      entry_disassembly_path,
                      "w",
                      encoding="utf-8",
                      errors="replace"
                  ) as f:
                      f.write(
                          entry_disassembly
                      )

                  result["entry_disassembly_file"] = (
                      str(
                          entry_disassembly_path
                      )
                  )

              except Exception:
                  result["entry_disassembly_file"] = None

              try:
                  r2.quit()
              except Exception:
                  pass

              return result

          def keyword_matches(strings):
              fastboot_matches = []
              unlock_matches = []
              vendor_matches = []
              oem_matches = []

              for entry in strings:
                  text = str(
                      entry.get(
                          "string",
                          ""
                      )
                  )

                  lower = text.lower()

                  address = entry.get(
                      "vaddr",
                      entry.get(
                          "paddr",
                          entry.get(
                              "addr"
                          )
                      )
                  )

                  for keyword in FASTBOOT_KEYWORDS:
                      if keyword in lower:
                          fastboot_matches.append(
                              {
                                  "address": address,
                                  "string": text,
                                  "keyword": keyword
                              }
                          )
                          break

                  for keyword in UNLOCK_KEYWORDS:
                      if keyword in lower:
                          unlock_matches.append(
                              {
                                  "address": address,
                                  "string": text,
                                  "keyword": keyword
                              }
                          )
                          break

                  for keyword in VENDOR_KEYWORDS:
                      if keyword in lower:
                          vendor_matches.append(
                              {
                                  "address": address,
                                  "string": text,
                                  "keyword": keyword
                              }
                          )
                          break

                  for pattern in OEM_COMMAND_PATTERNS:
                      try:
                          if re.search(
                              pattern,
                              lower
                          ):
                              oem_matches.append(
                                  {
                                      "address": address,
                                      "string": text,
                                      "pattern": pattern
                                  }
                              )
                              break
                      except Exception:
                          pass

              return {
                  "fastboot": fastboot_matches,
                  "unlock": unlock_matches,
                  "vendor": vendor_matches,
                  "oem": oem_matches
              }

          def discover_partition_strings(strings):
              candidates = set()

              keywords = [
                  "partition",
                  "xbl",
                  "xbl_config",
                  "abl",
                  "aop",
                  "boot",
                  "vendor_boot",
                  "system",
                  "system_ext",
                  "product",
                  "userdata",
                  "cache",
                  "recovery",
                  "misc",
                  "modem",
                  "modemst1",
                  "modemst2",
                  "fsg",
                  "persist",
                  "metadata",
                  "super",
                  "vbmeta",
                  "vbmeta_system",
                  "vbmeta_vendor",
                  "dtbo",
                  "devcfg",
                  "rpm",
                  "tz",
                  "hyp",
                  "keymaster",
                  "frp"
              ]

              for entry in strings:
                  text = str(
                      entry.get(
                          "string",
                          ""
                      )
                  )

                  lower = text.lower()

                  if any(
                      keyword in lower
                      for keyword in keywords
                  ):
                      candidates.add(text)

              return sorted(candidates)

          def analyze_file(
              path,
              relative_name,
              sequence
          ):
              sha256 = sha256_file(path)
              md5 = md5_file(path)
              size = os.path.getsize(path)

              base_name = (
                  f"{sequence:06d}_"
                  f"{safe_name(relative_name)}_"
                  f"{sha256[:16]}"
              )

              raw_dir = RAW_ROOT / base_name
              raw_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              description_code, description_output = (
                  file_description(path)
              )

              mime_code, mime_output = (
                  mime_description(path)
              )

              description = (
                  description_output.strip()
              )

              mime = mime_output.strip()

              entropy_value = calculate_entropy(
                  path
              )

              ascii_code, ascii_output = (
                  strings_command(
                      path,
                      "ascii"
                  )
              )

              utf16_code, utf16_output = (
                  strings_command(
                      path,
                      "utf16"
                  )
              )

              ascii_path = (
                  raw_dir
                  / "ascii_strings.txt"
              )

              utf16_path = (
                  raw_dir
                  / "utf16le_strings.txt"
              )

              hex_path = (
                  raw_dir
                  / "hex_preview.txt"
              )

              with open(
                  ascii_path,
                  "w",
                  encoding="utf-8",
                  errors="replace"
              ) as f:
                  f.write(
                      ascii_output
                  )

              with open(
                  utf16_path,
                  "w",
                  encoding="utf-8",
                  errors="replace"
              ) as f:
                  f.write(
                      utf16_output
                  )

              with open(
                  hex_path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      hex_preview(path)
                  )

              try:
                  entropy_blocks = (
                      entropy_regions(path)
                  )

              except Exception:
                  entropy_blocks = []

              r2_result = get_r2_analysis(
                  path,
                  base_name
              )

              r2_strings = (
                  r2_result.get(
                      "strings",
                      []
                  )
                  or []
              )

              matches = keyword_matches(
                  r2_strings
              )

              partition_candidates = (
                  discover_partition_strings(
                      r2_strings
                  )
              )

              original_copy = None

              if size <= 64 * 1024 * 1024:
                  original_copy_path = (
                      raw_dir
                      / "original.bin"
                  )

                  try:
                      shutil.copy2(
                          path,
                          original_copy_path
                      )

                      original_copy = str(
                          original_copy_path
                      )

                  except Exception:
                      original_copy = None

              metadata = {
                  "sequence": sequence,
                  "relative_name": relative_name,
                  "path": str(path),
                  "size": size,
                  "sha256": sha256,
                  "md5": md5,
                  "file_description": description,
                  "mime": mime,
                  "entropy": entropy_value,
                  "file_command_exit_code": description_code,
                  "mime_command_exit_code": mime_code,
                  "ascii_strings_command_exit_code": ascii_code,
                  "utf16_strings_command_exit_code": utf16_code,
                  "ascii_strings_file": str(ascii_path),
                  "utf16le_strings_file": str(utf16_path),
                  "hex_preview_file": str(hex_path),
                  "original_copy": original_copy,
                  "r2": r2_result,
                  "fastboot_matches": matches["fastboot"],
                  "unlock_matches": matches["unlock"],
                  "vendor_matches": matches["vendor"],
                  "oem_matches": matches["oem"],
                  "partition_candidates": partition_candidates,
                  "high_entropy_blocks": entropy_blocks,
                  "high_entropy_block_count": len(
                      entropy_blocks
                  )
              }

              json_path = (
                  REPORT_FILES_ROOT
                  / f"{base_name}.json"
              )

              markdown_path = (
