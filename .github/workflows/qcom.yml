name: Build CVE-2021-1961 (tamirzb)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exploit repository
        uses: actions/checkout@v4
        with:
          repository: tamirzb/CVE-2021-1961
          path: exploit

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c

      - name: Build with ndk-build
        run: |
          cd exploit
          # The repository has jni/Android.mk and jni/Application.mk
          # ndk-build automatically looks for jni/ folder
          ndk-build NDK_PROJECT_PATH=. APP_ABI=arm64-v8a armeabi-v7a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qseecom_exploit
          path: |
            exploit/libs/arm64-v8a/qseecom_exploit
            exploit/libs/armeabi-v7a/qseecom_exploit
