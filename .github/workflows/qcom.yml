name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exploit repository
        uses: actions/checkout@v4
        with:
          repository: tamirzb/CVE-2021-1961
          path: exploit

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c

      - name: Build with ndk-build
        run: |
          cd exploit
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload artifact (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: qseecom_exploit_v7a
          path: exploit/libs/armeabi-v7a/qseecom_exploit

      - name: Upload artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: qseecom_exploit_v8a
          path: exploit/libs/arm64-v8a/qseecom_exploit
