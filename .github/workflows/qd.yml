name: Vbmeta Public Key Extraction and EFI Key Presence Check

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'ZIP URL to download and analyze'
        required: true
        default: 'https://github.com/coara-chocomaru/monooki/raw/refs/heads/test/n.zip'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file curl unzip python3

      - name: Download and extract ZIP
        run: |
          mkdir -p input output
          curl -L "${{ github.event.inputs.url }}" -o input/firmware.zip
          unzip -o input/firmware.zip -d input/files || true

      - name: Locate vbmeta and LinuxLoader.efi
        id: locate
        run: |
          VBMETA=$(find input/files -type f \( -iname "*vbmeta*" -o -iname "vbmeta.img" \) | head -n 1)
          if [ -z "$VBMETA" ]; then
            echo "ERROR: vbmeta file not found." | tee output/error.txt
            exit 1
          fi
          EFI=$(find input/files -type f -iname "LinuxLoader.efi" | head -n 1)
          if [ -z "$EFI" ]; then
            echo "ERROR: LinuxLoader.efi not found." | tee -a output/error.txt
            exit 1
          fi
          echo "VBMETA=$VBMETA" >> $GITHUB_ENV
          echo "EFI=$EFI" >> $GITHUB_ENV

      - name: Extract public key and check against EFI (using user's script)
        run: |
          cat > avb_key_extract.py <<'EOF'
          #!/usr/bin/env python3
          import hashlib
          import struct
          import sys
          from pathlib import Path

          HEADER_SIZE = 256

          def be32(data, off):
              return struct.unpack_from(">I", data, off)[0]

          def be64(data, off):
              return struct.unpack_from(">Q", data, off)[0]

          def extract_public_key(vbmeta_file):
              data = Path(vbmeta_file).read_bytes()
              if data[:4] != b"AVB0":
                  raise RuntimeError("Not a vbmeta image.")
              auth_size = be64(data, 12)
              aux_size = be64(data, 20)
              public_key_offset = be64(data, 64)
              public_key_size = be64(data, 72)
              start = HEADER_SIZE + auth_size + public_key_offset
              end = start + public_key_size
              public_key = data[start:end]
              Path("public_key4096.bin").write_bytes(public_key)
              print("Authentication Block :", auth_size)
              print("Auxiliary Block      :", aux_size)
              print("Public Key Offset    :", hex(public_key_offset))
              print("Public Key Size      :", public_key_size)
              print("Saved : public_key4096.bin")
              print("SHA1  :", hashlib.sha1(public_key).hexdigest())
              print("SHA256:", hashlib.sha256(public_key).hexdigest())
              return public_key

          def search_abl(public_key, abl_file):
              abl = Path(abl_file).read_bytes()
              off = abl.find(public_key)
              if off < 0:
                  print("Public key NOT found.")
                  return False
              print("Public key FOUND at offset", hex(off))
              blob = abl[off:off + len(public_key)]
              print("SHA1  :", hashlib.sha1(blob).hexdigest())
              print("SHA256:", hashlib.sha256(blob).hexdigest())
              if blob == public_key:
                  print("MATCH")
                  return True
              else:
                  print("NOT MATCH")
                  return False

          def main():
              if len(sys.argv) != 3:
                  print("Usage: python avb_key_extract.py vbmeta.img LinuxLoader.efi")
                  sys.exit(1)
              public_key = extract_public_key(sys.argv[1])
              result = search_abl(public_key, sys.argv[2])
              sys.exit(0 if result else 1)

          if __name__ == "__main__":
              main()
          EOF

          python3 avb_key_extract.py "$VBMETA" "$EFI" 2>&1 | tee output/result.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Script exit code: $EXIT_CODE" | tee -a output/result.txt
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Verification SUCCESS (key found and matches)" | tee -a output/result.txt
          else
            echo "❌ Verification FAILED (key not found or mismatch)" | tee -a output/result.txt
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-result-${{ github.run_id }}
          path: output/
