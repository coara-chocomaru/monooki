name: Vbmeta Public Key Extraction and EFI Signature Verification

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'ZIP URL to download and analyze'
        required: true
        default: 'https://github.com/coara-chocomaru/monooki/raw/refs/heads/main/wish_b.zip'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssl file curl unzip binutils \
            sbsigntool python3-pip
          pip3 install cryptography

      - name: Download and extract ZIP
        run: |
          mkdir -p input output
          curl -L "${{ github.event.inputs.url }}" -o input/firmware.zip
          unzip -o input/firmware.zip -d input/files || true

      - name: Locate vbmeta and LinuxLoader.efi
        id: locate
        run: |
          VBMETA=$(find input/files -type f \( -iname "*vbmeta*" -o -iname "vbmeta.img" \) | head -n 1)
          if [ -z "$VBMETA" ]; then
            echo "ERROR: vbmeta file not found." | tee output/error.txt
            exit 1
          fi
          EFI=$(find input/files -type f -iname "LinuxLoader.efi" | head -n 1)
          if [ -z "$EFI" ]; then
            echo "ERROR: LinuxLoader.efi not found." | tee -a output/error.txt
            exit 1
          fi
          echo "VBMETA=$VBMETA" >> $GITHUB_ENV
          echo "EFI=$EFI" >> $GITHUB_ENV

      - name: Extract public key from vbmeta (custom script)
        run: |
          cat > extract_key.py <<'EOF'
          #!/usr/bin/env python3
          import hashlib
          import struct
          import sys
          from pathlib import Path

          HEADER_SIZE = 256

          def be32(data, off):
              return struct.unpack_from(">I", data, off)[0]

          def be64(data, off):
              return struct.unpack_from(">Q", data, off)[0]

          def extract_public_key(vbmeta_file):
              data = Path(vbmeta_file).read_bytes()
              if data[:4] != b"AVB0":
                  raise RuntimeError("Not a vbmeta image.")
              auth_size = be64(data, 12)
              aux_size = be64(data, 20)
              public_key_offset = be64(data, 64)
              public_key_size = be64(data, 72)
              start = HEADER_SIZE + auth_size + public_key_offset
              end = start + public_key_size
              public_key = data[start:end]
              Path("public_key4096.bin").write_bytes(public_key)
              print("Public key extracted to public_key4096.bin")
              return public_key

          if __name__ == "__main__":
              if len(sys.argv) != 2:
                  print("Usage: extract_key.py <vbmeta_file>")
                  sys.exit(1)
              extract_public_key(sys.argv[1])
          EOF
          python3 extract_key.py "$VBMETA"
          if [ ! -f public_key4096.bin ]; then
            echo "ERROR: public_key4096.bin not created." | tee output/error.txt
            exit 1
          fi

      - name: Convert binary public key to PEM
        run: |
          # Try to interpret as DER-encoded SubjectPublicKeyInfo
          openssl pkey -pubin -inform DER -in public_key4096.bin -outform PEM -out output/key.pem 2>/dev/null || \
          # If that fails, try to treat as raw RSA public key (PKCS#1)
          openssl rsa -pubin -inform DER -RSAPublicKey_in -in public_key4096.bin -outform PEM -out output/key.pem 2>/dev/null || \
          # Fallback: use Python to create PEM from raw key
          python3 <<'EOF'
          import sys
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.backends import default_backend
          import struct

          # Attempt to parse as DER SEQUENCE (SubjectPublicKeyInfo)
          data = open('public_key4096.bin', 'rb').read()
          try:
              # Try to load as SubjectPublicKeyInfo
              public_key = serialization.load_der_public_key(data)
          except Exception:
              # Try to load as PKCS#1 RSAPublicKey
              try:
                  from cryptography.hazmat.primitives.asymmetric.rsa import RSAPublicNumbers
                  # DER-encoded RSAPublicKey: SEQUENCE { INTEGER n, INTEGER e }
                  # We'll use pyasn1 or manual parsing, but for simplicity we fallback to openssl
                  sys.exit(1)
              except Exception:
                  sys.exit(1)
          pem = public_key.public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo
          )
          with open('output/key.pem', 'wb') as f:
              f.write(pem)
          print("Converted to PEM using Python")
          EOF
          if [ ! -f output/key.pem ]; then
            echo "ERROR: Failed to convert public key to PEM." | tee output/error.txt
            exit 1
          fi
          echo "PEM public key saved to output/key.pem"

      - name: Create certificate from public key (Python)
        run: |
          python3 <<'EOF'
          import os
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.x509.oid import NameOID
          import datetime

          with open('output/key.pem', 'rb') as f:
              public_key = serialization.load_pem_public_key(f.read())

          private_key = rsa.generate_private_key(public_exponent=65537, key_size=2048)

          subject = issuer = x509.Name([
              x509.NameAttribute(NameOID.COMMON_NAME, u"Temp Cert")
          ])

          cert = (x509.CertificateBuilder()
                  .subject_name(subject)
                  .issuer_name(issuer)
                  .public_key(public_key)
                  .serial_number(x509.random_serial_number())
                  .not_valid_before(datetime.datetime.utcnow())
                  .not_valid_after(datetime.datetime.utcnow() + datetime.timedelta(days=1))
                  .sign(private_key, hashes.SHA256()))

          with open('output/cert.pem', 'wb') as f:
              f.write(cert.public_bytes(serialization.Encoding.PEM))

          print("Certificate created: output/cert.pem")
          EOF

      - name: Verify LinuxLoader.efi signature
        run: |
          set +e
          echo "Verifying $EFI with output/cert.pem" | tee output/result.txt
          sbverify --cert output/cert.pem "$EFI" > output/verify_output.txt 2>&1
          STATUS=$?
          set -e
          
          echo "Exit code: $STATUS" | tee -a output/result.txt
          if [ $STATUS -eq 0 ]; then
            echo "✅ Verification SUCCESS" | tee -a output/result.txt
          else
            echo "❌ Verification FAILED" | tee -a output/result.txt
          fi
          echo "---- Detailed output ----" >> output/result.txt
          cat output/verify_output.txt >> output/result.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-result-${{ github.run_id }}
          path: output/
