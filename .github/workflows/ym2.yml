name: Extract vmlinux and kallsyms

on:
  workflow_dispatch:
    inputs:
      kaslr_base:
        description: 'Runtime KASLR base address (e.g. 0xffffffe1c6800000)'
        required: true
        default: '0xffffffe1c6800000'
      selinux_state_va:
        description: 'Runtime VA of selinux_state (e.g. 0xffffffe1c8b25000)'
        required: true
        default: '0xffffffe1c8b25000'

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download vmlinux
        run: |
          set -euo pipefail
          curl -fsSL -o vmlinux.raw \
            "https://github.com/coara-chocomaru/monooki/releases/download/%E3%81%A6%E3%81%99%E3%81%A899/vmlinux"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            binutils-aarch64-linux-gnu \
            file \
            gzip xz-utils bzip2 lzma lzop lz4 zstd \
            python3-pip python3-venv gcc g++

      - name: Setup Python virtual environment
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies in venv
        run: |
          set -euo pipefail
          source /tmp/venv/bin/activate
          pip install lz4 zstandard git+https://github.com/clubby789/python-lzo@b4e39df
          pip install git+https://github.com/marin-m/vmlinux-to-elf
          pip install miasm
          git clone https://github.com/nforest/droidimg.git /tmp/droidimg

      - name: Write kallsyms extractor
        run: |
          set -euo pipefail
          cat > /tmp/extract_kallsyms.py << 'PYEOF'
          from __future__ import annotations

          import argparse
          import json
          import re
          import shutil
          import struct
          import subprocess
          import sys
          from pathlib import Path

          from vmlinux_to_elf.core.auto_unpack import VmlinuzDecompressor
          from vmlinux_to_elf.core.kallsyms import KallsymsFinder

          KERNEL_VA_MIN = 0xffffff8000000000
          KERNEL_VA_MAX = 0xffffffffffffffff

          def is_kernel_va(addr: int) -> bool:
              return KERNEL_VA_MIN <= addr <= KERNEL_VA_MAX

          def parse_symbol_line(line: str) -> tuple[int, str, str] | None:
              parts = line.strip().split()
              if len(parts) < 3:
                  return None
              try:
                  addr = int(parts[0], 16)
              except ValueError:
                  return None
              sym_type = parts[1][0]
              name = parts[2]
              return addr, sym_type, name

          def run_cmd(cmd: list[str]) -> tuple[int, str, str]:
              proc = subprocess.run(cmd, capture_output=True, text=True)
              return proc.returncode, proc.stdout, proc.stderr

          def load_elf_symbols(elf_path: str) -> list[tuple[int, str, str]]:
              tools = []
              for tool in ("aarch64-linux-gnu-nm", "nm"):
                  if shutil.which(tool):
                      tools.append(tool)
              for tool in tools:
                  rc, out, err = run_cmd([tool, "-n", "--defined-only", elf_path])
                  if rc != 0 or not out.strip():
                      continue
                  symbols: list[tuple[int, str, str]] = []
                  for line in out.splitlines():
                      parsed = parse_symbol_line(line)
                      if parsed is None:
                          continue
                      addr, sym_type, name = parsed
                      if addr == 0 or not is_kernel_va(addr):
                          continue
                      symbols.append((addr, sym_type, name))
                  if symbols:
                      return symbols
              return []

          def load_droidimg_symbols(raw_path: str) -> list[tuple[int, str, str]]:
              droidimg = Path("/tmp/droidimg/vmlinux.py")
              if not droidimg.exists():
                  return []
              tools = [
                  [sys.executable, str(droidimg), "-m", "--json", raw_path],
                  [sys.executable, str(droidimg), "--json", raw_path],
              ]
              for cmd in tools:
                  proc = subprocess.run(cmd, capture_output=True, text=True)
                  content = (proc.stdout or "") + (proc.stderr or "")
                  if not content.strip():
                      continue
                  try:
                      data = json.loads(content)
                  except Exception:
                      data = None
                  symbols: list[tuple[int, str, str]] = []
                  if isinstance(data, dict):
                      for sym in data.get("sym", []):
                          if not isinstance(sym, dict):
                              continue
                          addr_raw = sym.get("addr")
                          name = sym.get("name")
                          if name is None or addr_raw is None:
                              continue
                          try:
                              addr = int(addr_raw, 16) if isinstance(addr_raw, str) else int(addr_raw)
                          except (TypeError, ValueError):
                              continue
                          if addr == 0 or not is_kernel_va(addr):
                              continue
                          sym_type = "T" if "text" in str(sym.get("type", "")).lower() else "D"
                          symbols.append((addr, sym_type, str(name)))
                  elif content.strip().startswith("{"):
                      try:
                          data = json.loads(content)
                      except Exception:
                          data = None
                  if symbols:
                      return symbols
                  for line in content.splitlines():
                      m = re.search(r"(0x[0-9a-fA-F]+|[0-9a-fA-F]{8,16})\s+(\w)\s+(\S+)", line)
                      if not m:
                          continue
                      try:
                          addr = int(m.group(1), 16)
                      except ValueError:
                          continue
                      if addr == 0 or not is_kernel_va(addr):
                          continue
                      symbols.append((addr, m.group(2), m.group(3)))
                  if symbols:
                      return symbols
              return []

          def load_kallsyms_finder(raw_path: str) -> list[tuple[int, str, str]]:
              raw = Path(raw_path).read_bytes()
              candidates: list[tuple[str, bytes]] = []
              candidates.append(("raw", raw))
              if len(raw) > 20:
                  candidates.append(("raw_skip20", raw[20:]))
              try:
                  decompressed = VmlinuzDecompressor(raw).decompressed
                  if decompressed:
                      candidates.insert(0, ("decompressed", decompressed))
              except Exception as e:
                  print(f"[kallsyms] decompression skipped: {e}", file=sys.stderr)

              best: list[tuple[int, str, str]] = []
              best_score = -1.0

              for label, blob in candidates:
                  try:
                      finder = KallsymsFinder(blob, bit_size=64, override_relative_base=False)
                  except Exception as e:
                      print(f"[kallsyms] {label}: {e}", file=sys.stderr)
                      continue

                  pairs: list[tuple[int, str, str]] = []
                  kernel_ok = 0
                  non_zero = 0
                  for addr, raw_name in zip(finder.kernel_addresses, finder.symbol_names):
                      if not raw_name:
                          continue
                      sym_type = raw_name[0]
                      name = raw_name[1:]
                      if addr != 0:
                          non_zero += 1
                      if is_kernel_va(addr):
                          kernel_ok += 1
                      pairs.append((addr, sym_type, name))

                  if not pairs:
                      continue

                  valid_ratio = kernel_ok / len(pairs)
                  non_zero_ratio = non_zero / len(pairs)
                  score = valid_ratio + (0.05 if non_zero_ratio > 0.95 else 0.0)
                  print(
                      f"[kallsyms] {label}: version={finder.version_number} "
                      f"valid_ratio={valid_ratio:.4f} non_zero={non_zero_ratio:.4f}",
                      file=sys.stderr,
                  )

                  if valid_ratio >= 0.98 and score > best_score:
                      best = [(addr, t, name) for addr, t, name in pairs if addr != 0 and is_kernel_va(addr)]
                      best_score = score

              return best

          def choose_primary_sources(raw_path: str, elf_path: str) -> list[tuple[str, list[tuple[int, str, str]]]]:
              sources: list[tuple[str, list[tuple[int, str, str]]]] = []

              elf_symbols = load_elf_symbols(elf_path)
              if elf_symbols:
                  sources.append(("elf_nm", elf_symbols))
                  print(f"[source] elf_nm: {len(elf_symbols)} symbols", file=sys.stderr)
              else:
                  print("[source] elf_nm: no usable symbols", file=sys.stderr)

              kallsyms_symbols = load_kallsyms_finder(raw_path)
              if kallsyms_symbols:
                  sources.append(("kallsyms_finder", kallsyms_symbols))
                  print(f"[source] kallsyms_finder: {len(kallsyms_symbols)} symbols", file=sys.stderr)
              else:
                  print("[source] kallsyms_finder: no usable symbols", file=sys.stderr)

              droidimg_symbols = load_droidimg_symbols(raw_path)
              if droidimg_symbols:
                  sources.append(("droidimg", droidimg_symbols))
                  print(f"[source] droidimg: {len(droidimg_symbols)} symbols", file=sys.stderr)
              else:
                  print("[source] droidimg: no usable symbols", file=sys.stderr)

              return sources

          def merge_sources(sources: list[tuple[str, list[tuple[int, str, str]]]]) -> tuple[list[tuple[int, str, str]], dict[str, str]]:
              merged: dict[str, tuple[int, str, str, str]] = {}
              provenance: dict[str, str] = {}

              for source_name, symbols in sources:
                  for addr, sym_type, name in symbols:
                      if not name:
                          continue
                      if addr == 0 or not is_kernel_va(addr):
                          continue
                      cur = merged.get(name)
                      if cur is None:
                          merged[name] = (addr, sym_type, name, source_name)
                          continue

                      cur_addr, cur_type, _, cur_source = cur
                      if cur_addr == 0 or not is_kernel_va(cur_addr):
                          merged[name] = (addr, sym_type, name, source_name)
                          continue

                      # Prefer the first source in the list unless the current entry is invalid.
                      if cur_source == source_name:
                          continue

                  # preserve provenance for the whole source if it wins
              final_items = sorted(
                  ((addr, sym_type, name) for addr, sym_type, name, _ in merged.values()),
                  key=lambda x: (x[0], x[2]),
              )

              for addr, sym_type, name, source_name in merged.values():
                  provenance[name] = source_name

              return final_items, provenance

          def write_symbol_file(path: Path, symbols: list[tuple[int, str, str]]) -> None:
              with path.open("w", encoding="utf-8") as f:
                  for addr, sym_type, name in symbols:
                      print(f"{addr:016x} {sym_type} {name}", file=f)

          def get_symbol_map(symbols: list[tuple[int, str, str]]) -> dict[str, tuple[int, str]]:
              return {name: (addr, sym_type) for addr, sym_type, name in symbols}

          def compute_slide(symbols: list[tuple[int, str, str]], kaslr_base: int, selinux_state_va: int) -> tuple[int | None, str]:
              sym = get_symbol_map(symbols)
              if "_text" in sym:
                  text_addr, _ = sym["_text"]
                  slide = kaslr_base - text_addr
                  return slide, "_text"
              if "_stext" in sym:
                  text_addr, _ = sym["_stext"]
                  slide = kaslr_base - text_addr
                  return slide, "_stext"
              if "selinux_state" in sym:
                  sel_addr, _ = sym["selinux_state"]
                  slide = selinux_state_va - sel_addr
                  return slide, "selinux_state"
              return None, ""

          def quality_report(symbols: list[tuple[int, str, str]], kaslr_base: int, selinux_state_va: int) -> str:
              sym = get_symbol_map(symbols)
              total = len(symbols)
              kernel_ok = sum(1 for addr, _, _ in symbols if is_kernel_va(addr))
              zero = sum(1 for addr, _, _ in symbols if addr == 0)
              text_addr = sym.get("_text", sym.get("_stext", (None, "")))[0]
              sel_addr = sym.get("selinux_state", (None, ""))[0]
              lines = [
                  f"total_symbols={total}",
                  f"kernel_va_symbols={kernel_ok}",
                  f"zero_symbols={zero}",
              ]
              if text_addr is not None:
                  lines.append(f"text_link_time={text_addr:016x}")
                  lines.append(f"text_runtime={kaslr_base:016x}")
              if sel_addr is not None:
                  lines.append(f"selinux_link_time={sel_addr:016x}")
                  lines.append(f"selinux_runtime={selinux_state_va:016x}")
              return "\n".join(lines) + "\n"

          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("raw_path")
              parser.add_argument("elf_path")
              parser.add_argument("kaslr_base")
              parser.add_argument("selinux_state_va")
              args = parser.parse_args()

              raw_path = args.raw_path
              elf_path = args.elf_path
              kaslr_base = int(args.kaslr_base, 16)
              selinux_state_va = int(args.selinux_state_va, 16)

              sources = choose_primary_sources(raw_path, elf_path)
              if not sources:
                  print("ERROR: no usable symbol sources found", file=sys.stderr)
                  return 1

              merged, provenance = merge_sources(sources)
              if not merged:
                  print("ERROR: merged symbol table is empty", file=sys.stderr)
                  return 1

              sym_map = get_symbol_map(merged)
              if "_text" not in sym_map and "_stext" not in sym_map and "selinux_state" not in sym_map:
                  print("ERROR: no anchor symbols were found", file=sys.stderr)
                  return 1

              slide, anchor_name = compute_slide(merged, kaslr_base, selinux_state_va)
              if slide is None:
                  print("WARNING: no anchor symbol available for runtime conversion", file=sys.stderr)
              else:
                  print(f"[slide] derived from {anchor_name}: {slide:#018x}", file=sys.stderr)

              out_link = Path("kallsyms.txt")
              out_base = Path("kallsyms_base.txt")
              out_runtime = Path("kallsyms_base_runtime.txt")
              out_quality = Path("kallsyms_quality.txt")

              write_symbol_file(out_link, merged)
              write_symbol_file(out_base, merged)

              if slide is not None:
                  runtime_symbols = [(addr + slide, sym_type, name) for addr, sym_type, name in merged]
                  write_symbol_file(out_runtime, runtime_symbols)
              else:
                  out_runtime.write_text("", encoding="utf-8")

              out_quality.write_text(quality_report(merged, kaslr_base, selinux_state_va), encoding="utf-8")

              print(f"[output] {len(merged)} symbols written", file=sys.stderr)
              print(f"[output] provenance entries: {len(provenance)}", file=sys.stderr)
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PYEOF
          python3 -m py_compile /tmp/extract_kallsyms.py

      - name: Convert raw vmlinux to ELF
        run: |
          set -euo pipefail
          source /tmp/venv/bin/activate

          if file vmlinux.raw | grep -qi 'ELF'; then
            cp vmlinux.raw vmlinux.elf
          else
            vmlinux-to-elf vmlinux.raw vmlinux.elf 2>&1 \
              || { dd if=vmlinux.raw of=vmlinux.strip bs=20 skip=1 2>/dev/null \
                   && vmlinux-to-elf vmlinux.strip vmlinux.elf 2>&1; } \
              || { echo "WARNING: vmlinux-to-elf failed" >&2; cp vmlinux.raw vmlinux.elf; }
          fi

          file vmlinux.elf || true

      - name: Extract kallsyms
        env:
          KASLR_BASE: ${{ github.event.inputs.kaslr_base }}
          SELINUX_STATE_VA: ${{ github.event.inputs.selinux_state_va }}
        run: |
          set -euo pipefail
          source /tmp/venv/bin/activate

          echo "=== Input anchors ==="
          echo "KASLR base      : ${KASLR_BASE}"
          echo "selinux_state VA: ${SELINUX_STATE_VA}"

          python3 /tmp/extract_kallsyms.py \
            vmlinux.raw \
            vmlinux.elf \
            "${KASLR_BASE}" \
            "${SELINUX_STATE_VA}" \
            2>&1 | tee extract_kallsyms.log

          echo "=== kallsyms.txt count ==="
          wc -l kallsyms.txt

          echo "=== kallsyms_quality.txt ==="
          cat kallsyms_quality.txt

          if [ -f kallsyms_base_runtime.txt ] && [ -s kallsyms_base_runtime.txt ]; then
            echo "=== Runtime kallsyms count ==="
            wc -l kallsyms_base_runtime.txt
            echo "=== Verifying selinux_state VA ==="
            grep "selinux_state$" kallsyms_base_runtime.txt | head -3 || true
          fi

          echo "=== Sample symbols ==="
          head -20 kallsyms.txt

      - name: Validate KASLR slide consistency
        env:
          KASLR_BASE: ${{ github.event.inputs.kaslr_base }}
          SELINUX_STATE_VA: ${{ github.event.inputs.selinux_state_va }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os

          kaslr_base = int(os.environ["KASLR_BASE"], 16)
          selinux_runtime = int(os.environ["SELINUX_STATE_VA"], 16)

          try:
              with open("kallsyms_base_runtime.txt", encoding="utf-8") as f:
                  lines = [line.strip().split() for line in f if line.strip()]
          except FileNotFoundError:
              print("kallsyms_base_runtime.txt not found")
              raise SystemExit(0)

          for parts in lines:
              if len(parts) >= 3 and parts[2] == "selinux_state":
                  runtime_addr = int(parts[0], 16)
                  print(f"selinux_state runtime: {runtime_addr:#018x}")
                  print(f"selinux_state expected: {selinux_runtime:#018x}")
                  break

          for parts in lines:
              if len(parts) >= 3 and parts[2] in ("_text", "_stext"):
                  text_runtime = int(parts[0], 16)
                  print(f"{parts[2]} runtime: {text_runtime:#018x}")
                  print(f"KASLR base   : {kaslr_base:#018x}")
                  break
          PYEOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kallsyms
          path: |
            kallsyms.txt
            kallsyms_base.txt
            kallsyms_base_runtime.txt
            kallsyms_quality.txt
            vmlinux.elf
          retention-days: 30
