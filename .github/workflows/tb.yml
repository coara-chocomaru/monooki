# .github/workflows/build-preload.yml
name: Build preload.so (offsets.h → target.h with fixes)

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android APIレベル（デフォルト: 28 = Android 9）'
        required: false
        type: number
        default: 28

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 自分のリポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: PoCリポジトリをクローン
        uses: actions/checkout@v4
        with:
          repository: x-spy/CVE-2026-43499-popsicle
          ref: main
          path: exploit

      - name: 依存パッケージをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y make wget unzip python3 python3-pip
          pip3 install pyelftools

      - name: Android NDK r29 をダウンロード
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip -d $HOME
          if [ -d "$HOME/android-ndk-r29" ]; then
            mv $HOME/android-ndk-r29 $HOME/android-ndk-r29-linux
          fi
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r29-linux" >> $GITHUB_ENV
          echo "NDK_ROOT=$HOME/android-ndk-r29-linux" >> $GITHUB_ENV
          echo "$HOME/android-ndk-r29-linux/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: NDK ツールチェーンに実行権限を付与
        run: |
          NDK_BIN="$HOME/android-ndk-r29-linux/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -d "$NDK_BIN" ]; then
            chmod -R +x "$NDK_BIN"
          else
            ALT_NDK_BIN="$HOME/android-ndk-r29-linux/toolchains/llvm/prebuilt/linux-x86/bin"
            if [ -d "$ALT_NDK_BIN" ]; then
              chmod -R +x "$ALT_NDK_BIN"
            else
              echo "エラー: NDK ツールチェーンが見つかりません。"
              exit 1
            fi
          fi

      # ★★★ offsets.h を target.h に変換 ★★★
      - name: offsets.h → target.h 変換
        run: |
          if [ ! -f offsets.h ]; then
            echo "エラー: offsets.h がリポジトリのルートにありません。"
            exit 1
          fi

          # コピー
          cp offsets.h target.h

          # 1. インクルードガードを変更
          sed -i 's/#ifndef OFFSET_H/#ifndef TARGET_H/' target.h
          sed -i 's/#define OFFSET_H/#define TARGET_H/' target.h

          # 2. SLIDE_*_IMAGE マクロを追加（SLIDE_*_OFF を参照）
          #    - SLIDE_NFULNL_LOGGER_IMAGE
          #    - SLIDE_LOGGERS_0_1_IMAGE
          #    - SLIDE_RANDOM_BOOT_ID_DATA_IMAGE
          #    - SLIDE_SYSCTL_BOOTID_IMAGE
          #    - SLIDE_INIT_TASK_IMAGE
          #    - SLIDE_ROOT_TASK_GROUP_IMAGE
          #    これらは既に OFFSET_H 内で定義済みの SLIDE_*_OFF を使う
          cat << 'EOF' >> target.h

          /* Additional IMAGE aliases required by PoC */
          #define SLIDE_NFULNL_LOGGER_IMAGE SLIDE_NFULNL_LOGGER_OFF
          #define SLIDE_LOGGERS_0_1_IMAGE SLIDE_LOGGERS_0_1_OFF
          #define SLIDE_RANDOM_BOOT_ID_DATA_IMAGE SLIDE_RANDOM_BOOT_ID_DATA_OFF
          #define SLIDE_SYSCTL_BOOTID_IMAGE SLIDE_SYSCTL_BOOTID_OFF
          #define SLIDE_INIT_TASK_IMAGE SLIDE_INIT_TASK_OFF
          #define SLIDE_ROOT_TASK_GROUP_IMAGE SLIDE_ROOT_TASK_GROUP_OFF

          #endif /* TARGET_H */
          EOF

          # 3. 念のため TARGET_CONFIG_H が定義されているか確認
          if ! grep -q "#define TARGET_CONFIG_H" target.h; then
            echo "エラー: TARGET_CONFIG_H が定義されていません"
            exit 1
          fi

          # 4. 生成された target.h の内容を確認
          echo "===== target.h の先頭30行 ====="
          head -30 target.h
          echo "===== 追加した IMAGE 定義 ====="
          grep -E "SLIDE.*IMAGE" target.h

          # 5. 配置
          cp target.h exploit/source/src/target.h

      - name: preload.so をコンパイル
        run: |
          cd exploit
          export ANDROID_API="${{ github.event.inputs.api_level }}"
          make -C source clean preload

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: preload-so
          path: exploit/source/build/bin/preload.so
          if-no-files-found: error
