name: QCOM Bootloader Full Disassembly & Analysis2 (XBL & ABL)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  full-disassembly:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    steps:
      - name: Install Git
        run: |
          apt-get update -y
          apt-get install -y git

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Radare2 and Tools
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            wget unzip build-essential \
            python3 python3-pip python3-dev \
            git cmake \
            bsdmainutils \
            default-jdk-headless \
            binwalk xz-utils p7zip-full file \
            liblzma-dev
          apt-get clean

          git clone --depth 1 https://github.com/radareorg/radare2
          cd radare2
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          cd ..
          rm -rf radare2

          ldconfig
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> $GITHUB_PATH
          r2 -v

      - name: Install Python libraries
        run: |
          pip3 install --upgrade pip
          pip3 install r2pipe pefile capstone pyelftools binwalk

      - name: Create Advanced Analysis Script (with Full XZ/LZMA Carving & XOR/Entropy/OEM-table analysis)
        run: |
          cat > /tmp/analyze_bootloader.py << 'EOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          import os, sys, json, re, subprocess, tempfile, struct, math, binascii
          import r2pipe
          from collections import defaultdict
          import binwalk
          import lzma  # Python標準モジュール（ビルド不要）

          FASTBOOT_KEYWORDS = [
              'flash', 'erase', 'reboot', 'getvar', 'setvar', 'oem',
              'download', 'continue', 'boot', 'update', 'unlock', 'lock',
              'device_state', 'secure', 'critical', 'slot', 'partition',
              'flag', 'set'
          ]
          UNLOCK_KEYWORDS = ['unlock', 'lock', 'oem_unlock', 'device_locked',
                             'device_unlocked', 'lock_state', 'secure_boot',
                             'unlock_ability', 'allow_unlock', 'unlock_code',
                             'go', 'flag']
          VENDOR_KEYWORDS = ['tinno', 'gcom', 'rakuten', 'hand5g', 'rakuten_hand',
                             'p780', 'oem', 'qcom', 'qualcomm', 'sectools']
          OEM_COMMAND_PATTERNS = [
              r'oem\s+unlock', r'oem\s+lock', r'oem\s+device-info',
              r'oem\s+getvar', r'oem\s+setvar', r'fastboot\s+oem',
              r'androidboot\.unlocked', r'ro\.oem_unlock',
              r'oem\s+unlock-go', r'oem\s+set', r'oem\s+flag',
              r'unlock-go', r'oem\s+.*-go'
          ]

          # ---------- 再帰的XZ/LZMA抽出（エラー無視） ----------
          def find_xz_magic_offsets(filepath):
              magic = b'\xFD\x37\x7A\x58\x5A\x00'
              offsets = []
              with open(filepath, 'rb') as f:
                  data = f.read()
              start = 0
              while True:
                  pos = data.find(magic, start)
                  if pos == -1:
                      break
                  offsets.append(pos)
                  start = pos + 1
              return offsets

          def carve_xz_streams(filepath, outdir):
              carved_files = []
              offsets = find_xz_magic_offsets(filepath)
              if not offsets:
                  return carved_files
              print(f"[*] Found {len(offsets)} XZ magic occurrences in {filepath}")
              for idx, off in enumerate(offsets):
                  carved_raw = os.path.join(outdir, f"xz_carved_{idx}_{off:x}.xz")
                  with open(filepath, 'rb') as fin:
                      fin.seek(off)
                      data = fin.read()
                  with open(carved_raw, 'wb') as fout:
                      fout.write(data)
                  decompressed = carved_raw + '.decomp'
                  try:
                      subprocess.check_call(
                          ['xz', '-d', '-k', '-c', carved_raw],
                          stdout=open(decompressed, 'wb'),
                          stderr=subprocess.DEVNULL
                      )
                      if os.path.exists(decompressed) and os.path.getsize(decompressed) > 0:
                          carved_files.append(decompressed)
                          print(f"[+] Successfully decompressed carved stream at offset 0x{off:x}")
                      else:
                          os.unlink(decompressed) if os.path.exists(decompressed) else None
                  except Exception as e:
                      try:
                          with open(carved_raw, 'rb') as f:
                              compressed = f.read()
                          decomp_data = lzma.decompress(compressed)
                          with open(decompressed, 'wb') as f:
                              f.write(decomp_data)
                          if os.path.getsize(decompressed) > 0:
                              carved_files.append(decompressed)
                              print(f"[+] lzma module decompressed carved stream at offset 0x{off:x}")
                      except Exception as e2:
                          print(f"[-] Failed to decompress carved stream at 0x{off:x} (xz: {e}, lzma: {e2})")
                  finally:
                      if os.path.exists(carved_raw):
                          os.unlink(carved_raw)
              return carved_files

          def is_xz_compressed(filepath):
              with open(filepath, 'rb') as f:
                  return f.read(6) == b'\xFD\x37\x7A\x58\x5A\x00'

          def decompress_xz(filepath):
              outpath = filepath + '.decompressed'
              try:
                  subprocess.check_call(['xz', '-d', '-k', '-c', filepath], stdout=open(outpath, 'wb'))
              except:
                  with open(filepath, 'rb') as f:
                      compressed = f.read()
                  decomp_data = lzma.decompress(compressed)
                  with open(outpath, 'wb') as f:
                      f.write(decomp_data)
              return outpath

          def extract_with_binwalk(filepath, outdir):
              try:
                  subprocess.check_call(
                      ['binwalk', '-Me', '--directory='+outdir, filepath],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  return []
              extracted_files = []
              for root, dirs, files in os.walk(outdir):
                  for f in files:
                      full = os.path.join(root, f)
                      if os.path.isfile(full) and not os.path.islink(full):
                          extracted_files.append(full)
              return extracted_files

          def prepare_files(filepath):
              results = []
              temp_dir = tempfile.mkdtemp(prefix='bootloader_')
              to_process = [filepath]
              processed = set()
              while to_process:
                  current = to_process.pop()
                  if current in processed:
                      continue
                  processed.add(current)
                  if is_xz_compressed(current):
                      decomp = decompress_xz(current)
                      to_process.append(decomp)
                      sub_files = extract_with_binwalk(decomp, temp_dir)
                      for sf in sub_files:
                          if sf not in processed:
                              to_process.append(sf)
                      carved = carve_xz_streams(decomp, temp_dir)
                      for cf in carved:
                          if cf not in processed:
                              to_process.append(cf)
                      results.append(decomp)
                  else:
                      sub_files = extract_with_binwalk(current, temp_dir)
                      for sf in sub_files:
                          if sf not in processed:
                              to_process.append(sf)
                      carved = carve_xz_streams(current, temp_dir)
                      for cf in carved:
                          if cf not in processed:
                              to_process.append(cf)
                      results.append(current)
              seen = set()
              unique_results = []
              for f in results:
                  if f not in seen:
                      seen.add(f)
                      unique_results.append(f)
              return unique_results

          # ---------- 高度なエントロピー & XOR解析 ----------
          def entropy(data):
              if not data:
                  return 0
              e = 0
              for x in range(256):
                  p_x = float(data.count(x)) / len(data)
                  if p_x > 0:
                      e += - p_x * math.log(p_x, 2)
              return e

          def find_high_entropy_regions(r2, threshold=6.0):
              regions = []
              sections = r2.cmdj('iSj') or []
              for sec in sections:
                  if sec.get('size', 0) > 64:
                      addr = sec.get('vaddr', 0)
                      size = sec.get('size', 0)
                      if addr and size:
                          data = r2.cmd(f'px {size} @ {addr}')
                          try:
                              raw = bytes.fromhex(''.join(data.split()))
                          except:
                              continue
                          e = entropy(raw)
                          if e > threshold:
                              regions.append({'addr': addr, 'size': size, 'entropy': e, 'section': sec.get('name', '')})
              return regions

          # シングルバイトXOR復号
          def decode_with_xor_keys(data, keys):
              results = []
              for key in keys:
                  dec = bytes([b ^ key for b in data])
                  try:
                      dec_str = dec.decode('ascii', errors='ignore')
                  except:
                      continue
                  if any(kw in dec_str.lower() for kw in UNLOCK_KEYWORDS + ['oem', 'fastboot', 'unlock', 'lock', 'go', 'flag', 'set']):
                      results.append({'key': key, 'decoded': dec_str})
              return results

          # マルチバイトXOR復号 (2/4バイト)
          def decode_with_multi_byte_xor(data, key_bytes):
              if len(key_bytes) not in (2, 4):
                  return []
              key_len = len(key_bytes)
              key_int = int.from_bytes(key_bytes, 'little')
              results = []
              chunk_size = key_len
              decoded_bytes = bytearray()
              for i in range(0, len(data) - chunk_size + 1, chunk_size):
                  chunk = int.from_bytes(data[i:i+chunk_size], 'little')
                  decoded = chunk ^ key_int
                  decoded_bytes += decoded.to_bytes(chunk_size, 'little')
              try:
                  dec_str = decoded_bytes.decode('ascii', errors='ignore')
              except:
                  return []
              if any(kw in dec_str.lower() for kw in UNLOCK_KEYWORDS + ['oem', 'fastboot', 'unlock', 'lock', 'go', 'flag', 'set']):
                  results.append({'key': key_int, 'key_hex': key_bytes.hex(), 'decoded': dec_str})
              return results

          # ---------- 特定キーによる強制XORデコード (XBL解析結果から抽出) ----------
          def decode_with_specific_xbl_keys(raw_data):
              results = []
              # xbl.img の Emulation Results および fcn.0c249094 から特定したキー
              specific_keys = [
                  (0x044B5134, 4, '0x044B5134 (32bit)'),
                  (0x5134, 2, '0x5134 (16bit)'),
                  (0x044B, 2, '0x044B (16bit)'),
                  (0x34, 1, '0x34 (8bit)'),
                  (0x51, 1, '0x51 (8bit)'),
                  (0x4B, 1, '0x4B (8bit)'),
                  (0x04, 1, '0x04 (8bit)'),
              ]
              for key, size, label in specific_keys:
                  decoded_bytes = bytearray()
                  if size == 1:
                      decoded_bytes = bytes([b ^ key for b in raw_data])
                  elif size == 2:
                      for i in range(0, len(raw_data) - 1, 2):
                          val = int.from_bytes(raw_data[i:i+2], 'little') ^ key
                          decoded_bytes += val.to_bytes(2, 'little')
                  elif size == 4:
                      for i in range(0, len(raw_data) - 3, 4):
                          val = int.from_bytes(raw_data[i:i+4], 'little') ^ key
                          decoded_bytes += val.to_bytes(4, 'little')
                  try:
                      dec_str = decoded_bytes.decode('ascii', errors='ignore')
                      if any(kw in dec_str.lower() for kw in UNLOCK_KEYWORDS + ['oem', 'fastboot', 'unlock', 'lock', 'go']):
                          results.append({
                              'key_label': label,
                              'key_hex': hex(key),
                              'size': size,
                              'decoded': dec_str[:200]
                          })
                  except:
                      pass
              return results

          # ---------- 全セクションXOR探索 (総当たり) ----------
          def search_all_xor_keys_on_all_regions(r2):
              decoded_entries = []
              sections = r2.cmdj('iSj') or []
              keys_single = list(range(0x100)) + [0xAA, 0x55, 0xFF, 0x01, 0x02, 0x5A, 0xA5, 0x3C]
              multi_keys = []
              for k in [0xAA55, 0x5AA5, 0xFFFF, 0x0000, 0x0101, 0x0202, 0x5555, 0xAAAA]:
                  multi_keys.append(k.to_bytes(2, 'little'))
              for k in [0xAA55AA55, 0x5AA55AA5, 0xFFFFFFFF, 0x00000000, 0x01010101, 0x02020202]:
                  multi_keys.append(k.to_bytes(4, 'little'))

              for sec in sections:
                  addr = sec.get('vaddr', 0)
                  size = sec.get('size', 0)
                  if not addr or size < 64:
                      continue
                  data = r2.cmd(f'px {size} @ {addr}')
                  try:
                      raw = bytes.fromhex(''.join(data.split()))
                  except:
                      continue
                  # シングル
                  matches = decode_with_xor_keys(raw, keys_single)
                  for m in matches:
                      decoded_entries.append({
                          'addr': addr,
                          'size': size,
                          'type': 'single-byte',
                          'key': m['key'],
                          'decoded_string': m['decoded'][:200],
                          'section': sec.get('name', '')
                      })
                  # マルチ
                  for kb in multi_keys:
                      matches_multi = decode_with_multi_byte_xor(raw, kb)
                      for m in matches_multi:
                          decoded_entries.append({
                              'addr': addr,
                              'size': size,
                              'type': f'{len(kb)}-byte',
                              'key': m['key'],
                              'key_hex': m['key_hex'],
                              'decoded_string': m['decoded'][:200],
                              'section': sec.get('name', '')
                          })
              return decoded_entries

          # OEMコマンドテーブル候補（強化）
          def find_oem_command_table(r2):
              strings = r2.cmdj('izzj') or []
              string_addrs = {}
              for s in strings:
                  if 'string' in s:
                      addr = s.get('addr')
                      if addr is not None:
                          if isinstance(addr, str):
                              addr = int(addr, 0) if addr.startswith('0x') else int(addr)
                          string_addrs[addr] = s['string']
              tables = []
              for addr, s in string_addrs.items():
                  refs = r2.cmdj(f'axtj {addr:#x}') or []
                  if not refs:
                      continue
                  start = addr - 0x100
                  end = addr + 0x100
                  data = r2.cmd(f'px {end-start} @ {start}')
                  try:
                      raw = bytes.fromhex(''.join(data.split()))
                  except:
                      continue
                  ptr_size = 8 if r2.cmd('iB') == '64' else 4
                  for i in range(0, len(raw)-ptr_size, ptr_size):
                      ptr = struct.unpack('<Q' if ptr_size==8 else '<I', raw[i:i+ptr_size])[0]
                      if r2.cmd(f'iS @ {ptr:#x}') and 'CODE' in r2.cmd(f'iS. @ {ptr:#x}'):
                          if abs((start+i) - addr) < 0x80:
                              tables.append({
                                  'string': s,
                                  'string_addr': addr,
                                  'ptr_addr': start+i,
                                  'ptr_value': ptr,
                                  'section': r2.cmd(f'iS. @ {ptr:#x}').strip()
                              })
              return tables

          def emulate_xor_loop(r2, func_addr):
              try:
                  r2.cmd(f's {func_addr}')
                  r2.cmd('aae')
                  r2.cmd('aec')
                  regs = r2.cmd('dr')
                  return {'function': func_addr, 'registers': regs, 'note': 'Emulation attempted, check disassembly for XOR pattern.'}
              except:
                  return None

          def find_unlock_variables(r2):
              symbols = r2.cmdj('isj') or []
              unlock_vars = []
              for sym in symbols:
                  name = sym.get('name', '')
                  if any(kw in name.lower() for kw in ['unlock', 'lock', 'oem', 'device_state', 'secure_boot', 'go', 'flag', 'set']):
                      unlock_vars.append({'name': name, 'addr': sym.get('vaddr'), 'type': sym.get('type')})
              strings = r2.cmdj('izzj') or []
              for s in strings:
                  s_str = s.get('string', '')
                  if any(kw in s_str.lower() for kw in ['unlock', 'lock', 'unlock-go', 'oem', 'flag']):
                      addr = s.get('addr')
                      if addr is not None:
                          refs = r2.cmdj(f'axtj {addr}') or []
                          for ref in refs:
                              if ref.get('type') == 'data':
                                  unlock_vars.append({'name': f'data_ref_{s_str}', 'addr': ref.get('from'), 'type': 'data reference'})
              return unlock_vars

          def extract_all_strings(r2):
              strings = []
              try:
                  data = r2.cmdj('izzj')
                  if data:
                      for entry in data:
                          if 'string' in entry:
                              strings.append(entry)
              except:
                  raw = r2.cmd('izz')
                  for line in raw.splitlines():
                      if line.strip() and '=' in line:
                          parts = line.split('=', 1)
                          if len(parts)==2:
                              strings.append({'addr': parts[0].strip(), 'string': parts[1].strip()})
              return strings

          def get_functions(r2):
              funcs = []
              try:
                  data = r2.cmdj('aflj')
                  if data:
                      for f in data:
                          funcs.append(f)
              except:
                  raw = r2.cmd('afl')
                  for line in raw.splitlines():
                      if line.strip().startswith('0x'):
                          parts = line.split()
                          if len(parts)>=3:
                              funcs.append({'addr': parts[0], 'name': parts[1], 'size': parts[2]})
              return funcs

          def find_xor_loops_enhanced(r2):
              xors = []
              for f in get_functions(r2):
                  addr = f.get('addr')
                  if not addr:
                      continue
                  r2.cmd(f's {addr}')
                  disasm = r2.cmd('pdf')
                  if 'eor' in disasm.lower() and ('str' in disasm.lower() or 'stm' in disasm.lower()):
                      key = None
                      for line in disasm.splitlines():
                          if 'mov' in line and '#' in line:
                              parts = line.split('#')
                              if len(parts) > 1:
                                  try:
                                      val = int(parts[1].split()[0], 0)
                                      if val < 0x100:
                                          key = val
                                          break
                                  except:
                                      pass
                      xors.append({
                          'function': f.get('name', addr),
                          'addr': addr,
                          'key': key,
                          'disasm': disasm[:800]
                      })
              return xors

          # ---------- メイン解析 ----------
          def analyze_file(img_path, label):
              print(f"[+] Analyzing {label} : {img_path}")
              out_dir = "/tmp/artifacts"
              os.makedirs(out_dir, exist_ok=True)

              r2 = r2pipe.open(img_path, flags=['-e', 'bin.relocs.apply=true'])
              r2.cmd('aaaa')

              strings = extract_all_strings(r2)
              funcs = get_functions(r2)
              xors = find_xor_loops_enhanced(r2)
              high_entropy_regions = find_high_entropy_regions(r2)
              decoded_from_xor_all = search_all_xor_keys_on_all_regions(r2)

              # ---- 特定XBLキーによる強制デコード ----
              specific_decoded_entries = []
              # エミュレーション結果のアドレス（例: 0x0c22dc4a）や、xorsから特定できるアドレスを抽出
              target_addrs = []
              if label == "xbl":
                  # xbl の emulation_results からアドレスを拾う（実際のJSONに依存）
                  # 簡易的に、strings から "OEM" 関連のアドレスや、データセクションの先頭を試す
                  for s in strings:
                      if 'oem' in s.get('string', '').lower():
                          addr = s.get('addr')
                          if addr and isinstance(addr, int):
                              target_addrs.append(addr)
                  # さらに、xors で見つかった関数の参照先アドレスを追加
                  for x in xors:
                      addr = x.get('addr')
                      if addr:
                          # 関数の前後のデータを読むため、-0x100 ~ +0x100 をスキャン
                          for off in range(-0x80, 0x80, 0x10):
                              target_addrs.append(addr + off)

              for base_addr in target_addrs[:30]:  # 負荷軽減のため上限
                  try:
                      data = r2.cmd(f'px 256 @ {base_addr:#x}')
                      raw = bytes.fromhex(''.join(data.split()))
                      decs = decode_with_specific_xbl_keys(raw)
                      for d in decs:
                          specific_decoded_entries.append({
                              'addr': base_addr,
                              'key_label': d['key_label'],
                              'key_hex': d['key_hex'],
                              'size': d['size'],
                              'decoded_string': d['decoded']
                          })
                  except:
                      pass

              oem_tables = find_oem_command_table(r2)
              unlock_vars = find_unlock_variables(r2)
              emu_results = []
              for x in xors[:10]:
                  res = emulate_xor_loop(r2, x['addr'])
                  if res:
                      emu_results.append(res)

              fastboot_matches = []
              unlock_matches = []
              vendor_matches = []
              oem_cmd_matches = []
              partition_candidates = set()

              for entry in strings:
                  s = entry.get('string', '')
                  addr = entry.get('addr', '')
                  lower_s = s.lower()
                  for kw in FASTBOOT_KEYWORDS:
                      if kw in lower_s:
                          fastboot_matches.append({'addr': addr, 'string': s, 'keyword': kw})
                          break
                  for ukw in UNLOCK_KEYWORDS:
                      if ukw in lower_s:
                          unlock_matches.append({'addr': addr, 'string': s, 'keyword': ukw})
                          break
                  for vkw in VENDOR_KEYWORDS:
                      if vkw in lower_s:
                          vendor_matches.append({'addr': addr, 'string': s, 'keyword': vkw})
                          break
                  for pat in OEM_COMMAND_PATTERNS:
                      if re.search(pat, lower_s):
                          oem_cmd_matches.append({'addr': addr, 'string': s, 'pattern': pat})
                          break
                  if 'partition' in lower_s or any(p in lower_s for p in ['aboot','misc','persist','frp','userdata','boot','xbl','abl']):
                      partition_candidates.add(s)

              unlock_functions = []
              for f in funcs:
                  addr = f.get('addr')
                  name = f.get('name', '')
                  if not addr:
                      continue
                  if any(kw in name.lower() for kw in UNLOCK_KEYWORDS):
                      r2.cmd(f's {addr}')
                      pdf = r2.cmd('pdf')
                      unlock_functions.append({'addr': addr, 'name': name, 'disasm': pdf})
                  else:
                      refs = r2.cmdj(f'axtj {addr}') if hasattr(r2, 'cmdj') else []
                      if refs:
                          for ref in refs:
                              ref_str = ref.get('string', '')
                              if any(kw in ref_str.lower() for kw in UNLOCK_KEYWORDS):
                                  r2.cmd(f's {addr}')
                                  pdf = r2.cmd('pdf')
                                  unlock_functions.append({'addr': addr, 'name': name, 'disasm': pdf, 'reason': f'References string: {ref_str}'})
                                  break

              safe_label = re.sub(r'[^a-zA-Z0-9_]', '_', label)
              report_path = f"{out_dir}/{safe_label}_detailed_report.md"
              with open(report_path, 'w') as f:
                  f.write(f"# Bootloader Analysis Report for {label}\n\n")
                  f.write("## File Info\n")
                  info = r2.cmd('iI')
                  f.write(f"```\n{info}\n```\n\n")

                  f.write("## Fastboot Commands/Keywords\n")
                  if fastboot_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in fastboot_matches[:200]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No fastboot-related strings found.\n")

                  f.write("\n## Unlock/Lock Related Strings\n")
                  if unlock_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in unlock_matches[:100]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No unlock-related strings found.\n")

                  f.write("\n## Vendor-specific Strings\n")
                  if vendor_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in vendor_matches[:100]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No vendor-specific strings found.\n")

                  f.write("\n## OEM Command Patterns\n")
                  if oem_cmd_matches:
                      f.write("| Address | String | Pattern |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in oem_cmd_matches[:100]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['pattern']} |\n")
                  else:
                      f.write("No explicit OEM command patterns found.\n")

                  f.write("\n## Suspected Functions Handling Unlock\n")
                  if unlock_functions:
                      for uf in unlock_functions[:30]:
                          f.write(f"### Function {uf['name']} at {uf['addr']}\n")
                          if 'reason' in uf:
                              f.write(f"Reason: {uf['reason']}\n")
                          f.write("```asm\n")
                          f.write(uf['disasm'][:3000])
                          f.write("\n```\n\n")
                  else:
                      f.write("No unlock-related functions identified.\n")

                  f.write("\n## Partition Names Mentioned\n")
                  if partition_candidates:
                      for p in sorted(partition_candidates):
                          f.write(f"- {p}\n")
                  else:
                      f.write("No explicit partition names found.\n")

                  f.write("\n## High-Entropy Regions (Possible Encoded Data)\n")
                  if high_entropy_regions:
                      f.write("| Address | Size | Entropy | Section |\n")
                      f.write("|---------|------|---------|---------|\n")
                      for r in high_entropy_regions[:50]:
                          f.write(f"| {r['addr']:#x} | {r['size']} | {r['entropy']:.2f} | {r['section']} |\n")
                  else:
                      f.write("No high-entropy data regions found.\n")

                  f.write("\n## XOR Decoded Strings (Brute-force from All Sections)\n")
                  if decoded_from_xor_all:
                      f.write("| Address | Section | Type | Key | Decoded Preview |\n")
                      f.write("|---------|---------|------|-----|-----------------|\n")
                      for d in decoded_from_xor_all[:100]:
                          if d.get('type') == 'single-byte':
                              key_str = f"0x{d['key']:02X}"
                          else:
                              key_str = f"0x{d['key']:X} (hex: {d.get('key_hex','')})"
                          f.write(f"| {d['addr']:#x} | {d.get('section','')} | {d['type']} | {key_str} | {d['decoded_string'][:80]} |\n")
                  else:
                      f.write("No decodable strings found via brute-force XOR.\n")

                  f.write("\n## XOR Decoded Strings (Specific XBL Keys: 0x044B5134, 0x5134, etc.)\n")
                  if specific_decoded_entries:
                      f.write("| Address | Key Label | Size | Decoded Preview |\n")
                      f.write("|---------|-----------|------|-----------------|\n")
                      for d in specific_decoded_entries[:50]:
                          f.write(f"| {d['addr']:#x} | {d['key_label']} | {d['size']}-byte | {d['decoded_string'][:80]} |\n")
                  else:
                      f.write("No decodable strings found with specific XBL keys.\n")

                  f.write("\n## OEM Command Table Candidates\n")
                  if oem_tables:
                      f.write("| String | String Addr | Ptr Addr | Ptr Value | Section |\n")
                      f.write("|--------|-------------|----------|-----------|---------|\n")
                      for t in oem_tables[:30]:
                          f.write(f"| {t['string']} | {t['string_addr']:#x} | {t['ptr_addr']:#x} | {t['ptr_value']:#x} | {t['section']} |\n")
                  else:
                      f.write("No OEM command table candidates found.\n")

                  f.write("\n## Unlock-related Global Variables\n")
                  if unlock_vars:
                      f.write("| Name | Address | Type |\n")
                      f.write("|------|---------|------|\n")
                      for v in unlock_vars[:50]:
                          f.write(f"| {v['name']} | {v['addr']:#x} | {v['type']} |\n")
                  else:
                      f.write("No unlock-related variables found.\n")

                  f.write("\n## Functions with XOR loops (potential decryption)\n")
                  if xors:
                      for x in xors[:20]:
                          f.write(f"### {x['function']} (addr: {x['addr']}, key: {x['key'] if x['key'] else 'unknown'})\n")
                          f.write("```asm\n")
                          f.write(x['disasm'][:1500])
                          f.write("\n```\n")
                  else:
                      f.write("No XOR loops detected.\n")

                  f.write("\n## Emulation Results for XOR Functions (Experimental)\n")
                  if emu_results:
                      for e in emu_results:
                          f.write(f"- {e}\n")
                  else:
                      f.write("No emulation results.\n")

                  f.write("\n## XZ/LZMA Compression Streams Discovered\n")
                  f.write("The input file was scanned for embedded XZ magic bytes. Any successfully decompressed streams have been analyzed as separate 'parts'.\n")
                  f.write("Check the JSON output for detailed carving offsets.\n")

              with open(f"{out_dir}/{safe_label}_fastboot_data.json", 'w') as f:
                  json.dump({
                      'fastboot_matches': fastboot_matches,
                      'unlock_matches': unlock_matches,
                      'vendor_matches': vendor_matches,
                      'oem_cmd_matches': oem_cmd_matches,
                      'unlock_functions': [{'addr': uf['addr'], 'name': uf['name']} for uf in unlock_functions],
                      'partition_candidates': list(partition_candidates),
                      'xor_functions': xors,
                      'high_entropy_regions': high_entropy_regions,
                      'xor_decoded_strings': decoded_from_xor_all,
                      'specific_xor_decoded_strings': specific_decoded_entries,
                      'oem_command_tables': oem_tables,
                      'unlock_variables': unlock_vars,
                      'emulation_results': emu_results
                  }, f, indent=2)

              r2.quit()
              print(f"[+] Report for {label} generated.")

          def main():
              if len(sys.argv) < 3:
                  print("Usage: python3 analyze_bootloader.py <xbl.img> <abl.img>")
                  sys.exit(1)

              all_files = []
              for idx, img in enumerate(sys.argv[1:3]):
                  label = "xbl" if idx == 0 else "abl"
                  files = prepare_files(img)
                  for f in files:
                      base_label = label
                      if len(files) > 1:
                          part_idx = files.index(f)
                          base_label = f"{label}_part{part_idx}"
                      if 'xz_carved' in f or '.decomp' in f:
                          base_label += "_decompressed"
                      all_files.append((f, base_label))

              seen = set()
              for f, lbl in all_files:
                  if f in seen:
                      continue
                  seen.add(f)
                  analyze_file(f, lbl)

              print("[+] All analysis complete. Reports are in /tmp/artifacts/")
              print("[+] Extracted files remain in temporary directories for debugging")

          if __name__ == "__main__":
              main()
          EOF
          chmod +x /tmp/analyze_bootloader.py

      - name: Run Advanced Analysis
        run: |
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          python3 /tmp/analyze_bootloader.py ./xbl.img ./abl.img

      - name: Generate HTML Summary
        run: |
          cd /tmp/artifacts
          cat > summary.html << 'HTML'
          <html><head><title>Bootloader Analysis Summary</title>
          <style>body{font-family:sans-serif;margin:40px;background:#f0f0f0;}
          h1{color:#333;}table{border-collapse:collapse;width:100%;background:#fff;}
          th,td{border:1px solid #ddd;padding:8px;text-align:left;}
          th{background:#4CAF50;color:#fff;}
          tr:nth-child(even){background:#f2f2f2;}
          .warning{color:#d9534f;}
          </style></head>
          <body>
          <h1>QCOM Bootloader Analysis</h1>
          <h2>Generated Artifacts</h2>
          <ul>
          <li><a href="xbl_detailed_report.md">XBL Detailed Report</a></li>
          <li><a href="abl_detailed_report.md">ABL Detailed Report</a></li>
          <li><a href="xbl_fastboot_data.json">XBL JSON Data</a></li>
          <li><a href="abl_fastboot_data.json">ABL JSON Data</a></li>
          </ul>
          <h2>Quick Summary</h2>
          <p>Check the detailed reports above for full analysis including strings, functions, and potential unlock commands.</p>
          <p class="warning">If unlock-related strings are not found, check for XOR-encoded strings or analyze function disassembly.</p>
          <p>Embedded XZ/LZMA streams were automatically carved, decompressed, and analyzed as separate parts.</p>
          </body></html>
          HTML

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_analysis
          path: |
            /tmp/artifacts/*.txt
            /tmp/artifacts/*.md
            /tmp/artifacts/*.json
            /tmp/artifacts/*.html
          retention-days: 30
          compression-level: 0

      - name: Notify Completion
        if: success()
        run: |
          echo "::notice title=Bootloader Analysis Complete::Reports and disassembly artifacts uploaded."
