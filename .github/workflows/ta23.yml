name: QCOM Bootloader Full Disassembly & Analysis2 (XBL & ABL)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  full-disassembly:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    steps:
      - name: Install Git
        run: |
          apt-get update -y
          apt-get install -y git

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Radare2 and Tools
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            wget unzip build-essential \
            python3 python3-pip \
            git cmake \
            bsdmainutils \
            default-jdk-headless \
            binwalk xz-utils p7zip-full file \
            liblzma-dev
          apt-get clean

          git clone --depth 1 https://github.com/radareorg/radare2
          cd radare2
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          cd ..
          rm -rf radare2

          ldconfig
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> $GITHUB_PATH
          r2 -v

      - name: Install Python libraries
        run: |
          pip3 install --upgrade pip
          pip3 install r2pipe pefile capstone pyelftools binwalk

      - name: Create Advanced Analysis Script (with Dispatch Table & Multi-layer XOR)
        run: |
          cat > /tmp/analyze_bootloader.py << 'EOF'
          #!/usr/bin/env python3
          import os, sys, json, re, subprocess, tempfile, struct, math
          import r2pipe
          from collections import defaultdict

          FASTBOOT_KEYWORDS = [
              'flash', 'erase', 'reboot', 'getvar', 'setvar', 'oem',
              'download', 'continue', 'boot', 'update', 'unlock', 'lock',
              'device_state', 'secure', 'critical', 'slot', 'partition'
          ]
          UNLOCK_KEYWORDS = ['unlock', 'lock', 'oem_unlock', 'device_locked',
                             'device_unlocked', 'lock_state', 'secure_boot',
                             'unlock_ability', 'allow_unlock', 'unlock_code']
          VENDOR_KEYWORDS = ['tinno', 'gcom', 'rakuten', 'hand5g', 'rakuten_hand',
                             'p780', 'oem', 'qcom', 'qualcomm', 'sectools']
          OEM_COMMAND_PATTERNS = [
              r'oem\s+unlock', r'oem\s+lock', r'oem\s+device-info',
              r'oem\s+getvar', r'oem\s+setvar', r'fastboot\s+oem',
              r'androidboot\.unlocked', r'ro\.oem_unlock'
          ]

          # ---------- XZ CARVING (unchanged) ----------
          def find_xz_magic_offsets(filepath):
              magic = b'\xFD\x37\x7A\x58\x5A\x00'
              offsets = []
              with open(filepath, 'rb') as f:
                  data = f.read()
              start = 0
              while True:
                  pos = data.find(magic, start)
                  if pos == -1:
                      break
                  offsets.append(pos)
                  start = pos + 1
              return offsets

          def carve_xz_streams(filepath, outdir):
              carved_files = []
              offsets = find_xz_magic_offsets(filepath)
              if not offsets:
                  return carved_files
              print(f"[*] Found {len(offsets)} XZ magic occurrences in {filepath}")
              for idx, off in enumerate(offsets):
                  carved_raw = os.path.join(outdir, f"xz_carved_{idx}_{off:x}.xz")
                  with open(filepath, 'rb') as fin:
                      fin.seek(off)
                      data = fin.read()
                  with open(carved_raw, 'wb') as fout:
                      fout.write(data)
                  decompressed = carved_raw + '.decomp'
                  try:
                      subprocess.check_call(
                          ['xz', '-d', '-k', '-c', carved_raw],
                          stdout=open(decompressed, 'wb'),
                          stderr=subprocess.DEVNULL
                      )
                      if os.path.exists(decompressed) and os.path.getsize(decompressed) > 0:
                          carved_files.append(decompressed)
                          print(f"[+] Successfully decompressed carved stream at offset 0x{off:x}")
                      else:
                          os.unlink(decompressed) if os.path.exists(decompressed) else None
                  except Exception as e:
                      print(f"[-] Failed to decompress carved stream at 0x{off:x}: {e}")
                  finally:
                      if os.path.exists(carved_raw):
                          os.unlink(carved_raw)
              return carved_files

          def is_xz_compressed(filepath):
              with open(filepath, 'rb') as f:
                  return f.read(6) == b'\xFD\x37\x7A\x58\x5A\x00'

          def decompress_xz(filepath):
              outpath = filepath + '.decompressed'
              subprocess.check_call(['xz', '-d', '-k', '-c', filepath], stdout=open(outpath, 'wb'))
              return outpath

          def extract_with_binwalk(filepath, outdir):
              try:
                  subprocess.check_call(
                      ['binwalk', '-Me', '--directory='+outdir, filepath],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  return []
              extracted_files = []
              for root, dirs, files in os.walk(outdir):
                  for f in files:
                      full = os.path.join(root, f)
                      if os.path.isfile(full) and not os.path.islink(full):
                          extracted_files.append(full)
              return extracted_files

          def prepare_files(filepath):
              results = []
              temp_dir = tempfile.mkdtemp(prefix='bootloader_')
              decomp = None
              if is_xz_compressed(filepath):
                  decomp = decompress_xz(filepath)
                  sub_files = extract_with_binwalk(decomp, temp_dir)
                  if sub_files:
                      results.extend(sub_files)
                  else:
                      results.append(decomp)
              else:
                  sub_files = extract_with_binwalk(filepath, temp_dir)
                  if sub_files:
                      results.extend(sub_files)
                  else:
                      results.append(filepath)
              carve_sources = [filepath]
              if decomp and os.path.exists(decomp):
                  carve_sources.append(decomp)
              for src in carve_sources:
                  carved = carve_xz_streams(src, temp_dir)
                  if carved:
                      results.extend(carved)
              if not results and decomp:
                  results.append(decomp)
              if not results:
                  results.append(filepath)
              return list(set(results))

          # ---------- ENHANCED DISPATCH TABLE FINDER ----------
          def find_strcmp_dispatch_functions(r2):
              """Find functions that call strcmp/strncmp and extract the compared strings."""
              results = []
              # Find all functions
              funcs = r2.cmdj('aflj') or []
              for f in funcs:
                  addr = f.get('addr')
                  if not addr:
                      continue
                  r2.cmd(f's {addr}')
                  # Disassemble
                  disasm = r2.cmd('pdf')
                  if 'strcmp' not in disasm and 'strncmp' not in disasm and 'memcmp' not in disasm:
                      continue
                  
                  # Look for load of string addresses (adrp/add or ldr) followed by branch/call to strcmp
                  # We'll extract all string references in this function
                  refs = r2.cmdj(f'axtj {addr}') or []
                  strings_found = []
                  for ref in refs:
                      if ref.get('type') == 'data':
                          # Try to read the string at the ref address
                          str_addr = ref.get('addr')
                          if str_addr:
                              s = r2.cmd(f'ps @ {str_addr}')
                              if len(s) > 2 and s.isprintable():
                                  strings_found.append(s)
                  
                  # Also directly grep for ADRP + ADD patterns that point to strings
                  # Use r2's search for references
                  for line in disasm.splitlines():
                      if 'adrp' in line and 'add' in line and ('x0' in line or 'x1' in line):
                          # Try to find the string address
                          match = re.search(r'#0x([0-9a-f]+)', line)
                          if match:
                              try:
                                  val = int(match.group(1), 16)
                                  s = r2.cmd(f'ps @ {val}')
                                  if len(s) > 2 and s.isprintable():
                                      strings_found.append(s)
                              except:
                                  pass
                  
                  if strings_found:
                      results.append({
                          'function_addr': addr,
                          'function_name': f.get('name', ''),
                          'strings': list(set(strings_found))
                      })
              
              # Sort by number of strings (most likely dispatch table)
              results.sort(key=lambda x: len(x['strings']), reverse=True)
              return results

          # ---------- MULTI-LAYER XOR DECODER ----------
          def multi_layer_decode(data, keys):
              """Apply multiple XOR keys sequentially and look for readable text."""
              results = []
              for k1 in range(0x100):
                  for k2 in range(0x100):
                      if k1 == 0 and k2 == 0:
                          continue
                      try:
                          dec = bytes([((b ^ k1) ^ k2) for b in data])
                          dec_str = dec.decode('ascii', errors='ignore')
                          # Check if it contains OEM or unlock keywords
                          if any(kw in dec_str.lower() for kw in ['oem', 'unlock', 'lock', 'fastboot', 'go', 'flash']):
                              results.append({
                                  'key1': k1,
                                  'key2': k2,
                                  'decoded': dec_str[:100]
                              })
                      except:
                          pass
              return results

          def decode_rodata_regions(r2):
              """Extract .rodata sections and attempt multi-layer XOR decode."""
              sections = r2.cmdj('iSj') or []
              results = []
              for sec in sections:
                  name = sec.get('name', '')
                  if '.rodata' in name or '.data' in name:
                      addr = sec.get('vaddr', 0)
                      size = sec.get('size', 0)
                      if addr and size > 0x20:
                          data = r2.cmd(f'px {min(size, 0x1000)} @ {addr}')
                          try:
                              raw = bytes.fromhex(''.join(data.split()))
                          except:
                              continue
                          decoded = multi_layer_decode(raw[:0x100], range(0x100))
                          if decoded:
                              results.append({
                                  'section': name,
                                  'addr': addr,
                                  'decoded_candidates': decoded[:10]
                              })
              return results

          # ---------- FASTBOOT HANDLER DETECTION ----------
          def find_fastboot_handlers(r2):
              """Search for functions that handle fastboot commands."""
              # Look for strings like "getvar", "oem", "flash" in functions
              strings = r2.cmdj('izzj') or []
              cmd_strings = []
              for s in strings:
                  if 'addr' not in s:
                      continue
                  val = s.get('string', '')
                  if any(kw in val.lower() for kw in ['getvar', 'oem', 'flash', 'erase', 'boot', 'continue', 'download']):
                      cmd_strings.append({'addr': s['addr'], 'string': val})
              
              # Find cross-references to these strings
              handlers = []
              for cs in cmd_strings:
                  refs = r2.cmdj(f'axtj {cs["addr"]}') or []
                  for ref in refs:
                      if ref.get('type') == 'code':
                          handlers.append({
                              'string': cs['string'],
                              'string_addr': cs['addr'],
                              'handler_addr': ref.get('from'),
                              'handler_name': r2.cmd(f's {ref["from"]}; afl').splitlines()[0] if ref.get('from') else ''
                          })
              return handlers

          # ---------- MAIN ANALYSIS (bug fixed) ----------
          def extract_all_strings(r2):
              strings = []
              try:
                  data = r2.cmdj('izzj')
                  if data:
                      for entry in data:
                          if 'string' in entry and 'addr' in entry:
                              strings.append(entry)
              except:
                  raw = r2.cmd('izz')
                  for line in raw.splitlines():
                      if line.strip() and '=' in line:
                          parts = line.split('=', 1)
                          if len(parts)==2:
                              strings.append({'addr': parts[0].strip(), 'string': parts[1].strip()})
              return strings

          def get_functions(r2):
              funcs = []
              try:
                  data = r2.cmdj('aflj')
                  if data:
                      for f in data:
                          funcs.append(f)
              except:
                  raw = r2.cmd('afl')
                  for line in raw.splitlines():
                      if line.strip().startswith('0x'):
                          parts = line.split()
                          if len(parts)>=3:
                              funcs.append({'addr': parts[0], 'name': parts[1], 'size': parts[2]})
              return funcs

          def analyze_file(img_path, label):
              print(f"[+] Analyzing {label} : {img_path}")
              out_dir = "/tmp/artifacts"
              os.makedirs(out_dir, exist_ok=True)

              r2 = r2pipe.open(img_path, flags=['-e', 'bin.relocs.apply=true'])
              r2.cmd('aaaa')

              strings = extract_all_strings(r2)
              funcs = get_functions(r2)
              
              # --- NEW ANALYSES ---
              dispatch_funcs = find_strcmp_dispatch_functions(r2)
              decoded_rodata = decode_rodata_regions(r2)
              fastboot_handlers = find_fastboot_handlers(r2)

              fastboot_matches = []
              unlock_matches = []
              vendor_matches = []
              oem_cmd_matches = []
              partition_candidates = set()

              # Special unlock detection: look for "go" strings in ABL (which are likely obfuscated commands)
              for entry in strings:
                  if 'addr' not in entry:
                      continue
                  s = entry.get('string', '')
                  addr = entry.get('addr', '')
                  lower_s = s.lower()
                  
                  for kw in FASTBOOT_KEYWORDS:
                      if kw in lower_s:
                          fastboot_matches.append({'addr': addr, 'string': s, 'keyword': kw})
                          break
                  
                  # Check for unlock related
                  if any(kw in lower_s for kw in UNLOCK_KEYWORDS):
                      unlock_matches.append({'addr': addr, 'string': s, 'keyword': 'unlock'})
                  elif 'go' in lower_s or 'go' in s:
                      # This captures the weird "go" strings that might be obfuscated oem commands
                      unlock_matches.append({'addr': addr, 'string': s, 'keyword': 'go'})
                  
                  for vkw in VENDOR_KEYWORDS:
                      if vkw in lower_s:
                          vendor_matches.append({'addr': addr, 'string': s, 'keyword': vkw})
                          break
                  for pat in OEM_COMMAND_PATTERNS:
                      if re.search(pat, lower_s):
                          oem_cmd_matches.append({'addr': addr, 'string': s, 'pattern': pat})
                          break
                  if 'partition' in lower_s or any(p in lower_s for p in ['aboot','misc','persist','frp','userdata','boot','xbl','abl']):
                      partition_candidates.add(s)

              safe_label = re.sub(r'[^a-zA-Z0-9_]', '_', label)
              report_path = f"{out_dir}/{safe_label}_detailed_report.md"
              with open(report_path, 'w') as f:
                  f.write(f"# Bootloader Analysis Report for {label}\n\n")
                  f.write("## File Info\n")
                  info = r2.cmd('iI')
                  f.write(f"```\n{info}\n```\n\n")

                  f.write("## Fastboot Commands/Keywords\n")
                  if fastboot_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in fastboot_matches[:200]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No fastboot-related strings found.\n")

                  f.write("\n## Unlock/Lock Related Strings\n")
                  if unlock_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in unlock_matches[:200]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No unlock-related strings found.\n")

                  f.write("\n## Vendor-specific Strings\n")
                  if vendor_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in vendor_matches[:100]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No vendor-specific strings found.\n")

                  f.write("\n## OEM Command Patterns\n")
                  if oem_cmd_matches:
                      f.write("| Address | String | Pattern |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in oem_cmd_matches[:100]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['pattern']} |\n")
                  else:
                      f.write("No explicit OEM command patterns found.\n")

                  f.write("\n## FASTBOOT Command Handlers (strcmp/strncmp based)\n")
                  if dispatch_funcs:
                      for df in dispatch_funcs[:10]:
                          f.write(f"### Function {df['function_name']} at {df['function_addr']}\n")
                          f.write("Strings compared in this function:\n")
                          for s in df['strings'][:20]:
                              f.write(f"- {s}\n")
                          f.write("\n")
                  else:
                      f.write("No strcmp-based dispatch functions found.\n")

                  f.write("\n## Fastboot Handler Cross-references\n")
                  if fastboot_handlers:
                      f.write("| String | Handler Address | Handler Name |\n")
                      f.write("|--------|-----------------|--------------|\n")
                      for h in fastboot_handlers[:30]:
                          f.write(f"| {h['string']} | {h['handler_addr']} | {h['handler_name'][:50]} |\n")
                  else:
                      f.write("No fastboot handlers found.\n")

                  f.write("\n## Partition Names Mentioned\n")
                  if partition_candidates:
                      for p in sorted(partition_candidates):
                          f.write(f"- {p}\n")
                  else:
                      f.write("No explicit partition names found.\n")

                  f.write("\n## Multi-Layer XOR Decoded .rodata Candidates\n")
                  if decoded_rodata:
                      for sec in decoded_rodata:
                          f.write(f"### Section: {sec['section']} at 0x{sec['addr']:x}\n")
                          for d in sec['decoded_candidates']:
                              f.write(f"- Keys: 0x{d['key1']:02X}, 0x{d['key2']:02X} -> {d['decoded'][:80]}\n")
                          f.write("\n")
                  else:
                      f.write("No decodable multi-layer XOR data found.\n")

              with open(f"{out_dir}/{safe_label}_fastboot_data.json", 'w') as f:
                  json.dump({
                      'fastboot_matches': fastboot_matches,
                      'unlock_matches': unlock_matches,
                      'vendor_matches': vendor_matches,
                      'oem_cmd_matches': oem_cmd_matches,
                      'partition_candidates': list(partition_candidates),
                      'dispatch_functions': dispatch_funcs,
                      'fastboot_handlers': fastboot_handlers,
                      'decoded_rodata': decoded_rodata
                  }, f, indent=2)

              r2.quit()
              print(f"[+] Report for {label} generated.")

          def main():
              if len(sys.argv) < 3:
                  print("Usage: python3 analyze_bootloader.py <xbl.img> <abl.img>")
                  sys.exit(1)

              all_files = []
              for idx, img in enumerate(sys.argv[1:3]):
                  label = "xbl" if idx == 0 else "abl"
                  files = prepare_files(img)
                  for f in files:
                      base_label = label
                      if len(files) > 1:
                          part_idx = files.index(f)
                          base_label = f"{label}_part{part_idx}"
                      if 'xz_carved' in f or '.decomp' in f:
                          base_label += "_decompressed"
                      all_files.append((f, base_label))

              seen = set()
              for f, lbl in all_files:
                  if f in seen:
                      continue
                  seen.add(f)
                  analyze_file(f, lbl)

              print("[+] All analysis complete. Reports are in /tmp/artifacts/")
              print("[+] Extracted files remain in temporary directories for debugging")

          if __name__ == "__main__":
              main()
          EOF
          chmod +x /tmp/analyze_bootloader.py

      - name: Run Advanced Analysis
        run: |
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          python3 /tmp/analyze_bootloader.py ./xbl.img ./abl.img

      - name: Generate HTML Summary
        run: |
          cd /tmp/artifacts
          cat > summary.html << 'HTML'
          <html><head><title>Bootloader Analysis Summary</title>
          <style>body{font-family:sans-serif;margin:40px;background:#f0f0f0;}
          h1{color:#333;}table{border-collapse:collapse;width:100%;background:#fff;}
          th,td{border:1px solid #ddd;padding:8px;text-align:left;}
          th{background:#4CAF50;color:#fff;}
          tr:nth-child(even){background:#f2f2f2;}
          .warning{color:#d9534f;}
          </style></head>
          <body>
          <h1>QCOM Bootloader Analysis</h1>
          <h2>Generated Artifacts</h2>
          <ul>
          <li><a href="xbl_detailed_report.md">XBL Detailed Report</a></li>
          <li><a href="abl_detailed_report.md">ABL Detailed Report</a></li>
          <li><a href="xbl_fastboot_data.json">XBL JSON Data</a></li>
          <li><a href="abl_fastboot_data.json">ABL JSON Data</a></li>
          </ul>
          <h2>Quick Summary</h2>
          <p>Check the detailed reports above for full analysis including strings, functions, and potential unlock commands.</p>
          <p class="warning">If unlock-related strings are not found, check for XOR-encoded strings or analyze function disassembly.</p>
          <p>Embedded XZ/LZMA streams were automatically carved, decompressed, and analyzed as separate parts.</p>
          </body></html>
          HTML

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_analysis
          path: |
            /tmp/artifacts/*.txt
            /tmp/artifacts/*.md
            /tmp/artifacts/*.json
            /tmp/artifacts/*.html
          retention-days: 30
          compression-level: 0

      - name: Notify Completion
        if: success()
        run: |
          echo "::notice title=Bootloader Analysis Complete::Reports and disassembly artifacts uploaded."
