name: nvram-parse-rewrite
on:
  workflow_dispatch:
    inputs:
      mac_addr:
        description: 'Custom MAC (xx:xx:xx:xx:xx:xx, empty=random)'
        required: false
        default: ''
jobs:
  nvram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: process
        run: |
          python3 << 'PYEOF'
          import os, sys, random, struct, hashlib, datetime

          def simple_sum(buf):
            return sum(buf) & 0xFFFF

          def crc16_ffff(buf):
            c = 0xFFFF
            for b in buf:
              c ^= b << 8
              for _ in range(8):
                c = ((c << 1) ^ 0x1021 if c & 0x8000 else c << 1) & 0xFFFF
            return c

          def crc16_0000(buf):
            c = 0x0000
            for b in buf:
              c ^= b << 8
              for _ in range(8):
                c = ((c << 1) ^ 0x1021 if c & 0x8000 else c << 1) & 0xFFFF
            return c

          ALGO_TABLE = [
            ('simple_sum',       lambda b: simple_sum(b)),
            ('crc16_ccitt_ffff', lambda b: crc16_ffff(b)),
            ('crc16_ccitt_0000', lambda b: crc16_0000(b)),
            ('xor16',            lambda b: (sum(b[i] ^ b[i+1] for i in range(0, len(b)-1, 2)) + (b[-1] if len(b)%2 else 0)) & 0xFFFF),
            ('neg_sum',          lambda b: (0x10000 - (sum(b) & 0xFFFF)) & 0xFFFF),
          ]

          def detect_algo(data, block_start, block_size):
            crc_off = block_start + block_size - 2
            stored = struct.unpack_from('<H', data, crc_off)[0]
            payload = bytes(data[block_start : crc_off])
            for name, fn in ALGO_TABLE:
              if fn(payload) == stored:
                return name, fn, stored
            return None, None, stored

          def recompute_crc(data, block_start, block_size, fn):
            crc_off = block_start + block_size - 2
            payload = bytes(data[block_start : crc_off])
            new_crc = fn(payload) & 0xFFFF
            struct.pack_into('<H', data, crc_off, new_crc)
            return new_crc

          def valid_mac(b):
            b = bytes(b[:6])
            return b != b'\x00'*6 and b != b'\xff'*6 and not (b[0] & 0x01)

          def rand_mac():
            m = bytearray(os.urandom(6))
            m[0] = (m[0] & 0xFC) | 0x02
            return bytes(m)

          def ms(b):
            return ':'.join(f'{x:02X}' for x in bytes(b[:6]))

          def hd(data, base, n=80):
            out = []
            for i in range(0, min(n, len(data)), 16):
              c = data[i:i+16]
              out.append(f'0x{base+i:08X}: {" ".join(f"{x:02X}" for x in c):<47}  {"".join(chr(x) if 0x20<=x<0x7F else "." for x in c)}')
            return '\n'.join(out)

          def find_ents(data, pb):
            r, p = [], 0
            while True:
              i = data.find(pb, p)
              if i == -1:
                break
              if i >= 12 and struct.unpack_from('<I', data, i-12)[0] == 7:
                r.append((i, struct.unpack_from('<I', data, i-8)[0], struct.unpack_from('<I', data, i-4)[0]))
              p = i + 1
            return r

          def find_db(data, wr):
            for c in range(0x10000, len(data)-10, 0x10000):
              if 0 < struct.unpack_from('<H', data, c)[0] < 0x8000 and valid_mac(data[c+wr+4:c+wr+10]):
                return c
            return None

          WP = b'/mnt/vendor/nvdata/APCFG/APRDEB/WIFI\x00'
          WCP = b'/mnt/vendor/nvdata/APCFG/APRDEB/WIFI_CUSTOM\x00'
          BP = b'/mnt/vendor/nvdata/APCFG/APRDEB/BT_Addr\x00'

          with open('nvram.img', 'rb') as f:
            orig = f.read()
          data = bytearray(orig)
          total = len(data)

          we = find_ents(data, WP)
          be = find_ents(data, BP)
          wce = find_ents(data, WCP)

          if not we or not be:
            print('ERROR: required path entries not found')
            sys.exit(1)

          pwp, wr, wsz = we[0]
          pbp, br, bsz = be[0]
          pwcp = wce[0] if wce else None

          db = find_db(data, wr)
          if db is None:
            print('ERROR: data_base not found')
            sys.exit(1)

          wbs = db + wr
          bbs = db + br
          wcbs = (db + pwcp[1]) if pwcp else None

          wmo = wbs + 4
          bmo = bbs + 0
          wcmo = wcbs + 0 if wcbs is not None else None

          wcro = wbs + wsz - 2
          bcro = bbs + bsz - 2

          old_w = bytes(data[wmo:wmo+6])
          old_b = bytes(data[bmo:bmo+6])

          w_algo_name, w_algo_fn, w_orig_crc = detect_algo(data, wbs, wsz)
          b_algo_name, b_algo_fn, b_orig_crc = detect_algo(data, bbs, bsz)

          um = '${{ github.event.inputs.mac_addr }}'.strip()
          if um:
            pts = um.split(':')
            if len(pts) != 6 or any(len(p) != 2 for p in pts):
              print('ERROR: invalid MAC format')
              sys.exit(1)
            nw = bytes(int(p, 16) for p in pts)
          else:
            nw = rand_mac()

          nb = bytearray(nw)
          nb[5] = (nb[5] + 1) & 0xFF
          nb = bytes(nb)

          log = []

          def upd_wifi(bs, bsz_, mo, nm, cro, algo_name, algo_fn, tag):
            if mo + 6 > total or cro + 2 > total:
              return
            old_mac = bytes(data[mo:mo+6])
            data[mo:mo+6] = nm
            old_ver = struct.unpack_from('<H', data, bs)[0]
            new_ver = (old_ver + 1) & 0xFFFF
            struct.pack_into('<H', data, bs, new_ver)
            if algo_fn is not None:
              nc = recompute_crc(data, bs, bsz_, algo_fn)
              crc_info = f'algo={algo_name} crc=0x{nc:04X}'
            else:
              nc = None
              crc_info = f'algo=UNKNOWN(stored=0x{struct.unpack_from("<H",data,cro)[0]:04X}) NO UPDATE'
            log.extend([
              tag,
              f'  block=0x{bs:08X} size=0x{bsz_:X}',
              f'  mac_off=0x{mo:08X}  {ms(old_mac)} -> {ms(nm)}',
              f'  version 0x{old_ver:04X} -> 0x{new_ver:04X}',
              f'  crc_off=0x{cro:08X}  {crc_info}',
              hd(data[bs:bs+min(bsz_,80)], bs),
            ])

          def upd_bt(bs, bsz_, mo, nm, cro, algo_name, algo_fn, tag):
            if mo + 6 > total or cro + 2 > total:
              return
            old_mac = bytes(data[mo:mo+6])
            data[mo:mo+6] = nm
            if algo_fn is not None:
              nc = recompute_crc(data, bs, bsz_, algo_fn)
              crc_info = f'algo={algo_name} crc=0x{nc:04X}'
            else:
              nc = None
              crc_info = f'algo=UNKNOWN(stored=0x{struct.unpack_from("<H",data,cro)[0]:04X}) NO UPDATE'
            log.extend([
              tag,
              f'  block=0x{bs:08X} size=0x{bsz_:X}',
              f'  mac_off=0x{mo:08X}  {ms(old_mac)} -> {ms(nm)}',
              f'  crc_off=0x{cro:08X}  {crc_info}',
              hd(data[bs:bs+min(bsz_,80)], bs),
            ])

          def upd_raw(mo, nm, tag):
            if mo + 6 > total:
              return
            old_mac = bytes(data[mo:mo+6])
            data[mo:mo+6] = nm
            log.append(f'{tag}  mac_off=0x{mo:08X}  {ms(old_mac)} -> {ms(nm)}')

          upd_wifi(wbs, wsz, wmo, nw, wcro, w_algo_name, w_algo_fn, 'WiFi [primary]')
          if wcmo is not None:
            upd_raw(wcmo, nw, 'WIFI_CUSTOM [primary]')
          upd_bt(bbs, bsz, bmo, nb, bcro, b_algo_name, b_algo_fn, 'BT_Addr [primary]')

          for cp, cr, cs in we[1:]:
            cdb = cp - pwp + db
            cb = cdb + cr
            cm = cb + 4
            cc = cb + cs - 2
            if cc + 2 <= total:
              ca_name, ca_fn, _ = detect_algo(bytearray(orig), cb, cs)
              upd_wifi(cb, cs, cm, nw, cc, ca_name, ca_fn, f'WiFi [copy db=0x{cdb:08X}]')

          for cp, cr, cs in be[1:]:
            cdb = cp - pbp + db
            cb = cdb + cr
            cm = cb + 0
            cc = cb + cs - 2
            if cc + 2 <= total:
              ca_name, ca_fn, _ = detect_algo(bytearray(orig), cb, cs)
              upd_bt(cb, cs, cm, nb, cc, ca_name, ca_fn, f'BT_Addr [copy db=0x{cdb:08X}]')

          for cp, cr, cs in wce[1:]:
            cdb = cp - pwcp[0] + db
            cm = cdb + cr
            if cm + 6 <= total:
              upd_raw(cm, nw, f'WIFI_CUSTOM [copy db=0x{cdb:08X}]')

          with open('nvram_modified.img', 'wb') as f:
            f.write(data)

          with open('nvram_analysis.log', 'w') as f:
            f.write(f'timestamp    : {datetime.datetime.now().isoformat()}\n')
            f.write(f'source       : nvram.img ({total} bytes)\n')
            f.write(f'data_base    : 0x{db:08X}\n')
            f.write(f'\n[WiFi block]\n')
            f.write(f'  block      : 0x{wbs:08X}  size=0x{wsz:X}\n')
            f.write(f'  mac_off    : 0x{wmo:08X}  (block+4: skip version+subver)\n')
            f.write(f'  crc_off    : 0x{wcro:08X}  (block+size-2)\n')
            f.write(f'  crc_algo   : {w_algo_name}  orig_crc=0x{w_orig_crc:04X}\n')
            f.write(f'\n[BT_Addr block]\n')
            f.write(f'  block      : 0x{bbs:08X}  size=0x{bsz:X}\n')
            f.write(f'  mac_off    : 0x{bmo:08X}  (block+0: BD_ADDR direct)\n')
            f.write(f'  crc_off    : 0x{bcro:08X}  (block+size-2)\n')
            f.write(f'  crc_algo   : {b_algo_name}  orig_crc=0x{b_orig_crc:04X}\n')
            f.write(f'\nold_wifi_mac : {ms(old_w)}\n')
            f.write(f'old_bt_mac   : {ms(old_b)}\n')
            f.write(f'new_wifi_mac : {ms(nw)}\n')
            f.write(f'new_bt_mac   : {ms(nb)}\n')
            f.write(f'sha256       : {hashlib.sha256(data).hexdigest()}\n')
            f.write(f'\n[directory entries]\n')
            for i, (p, r, s) in enumerate(we):
              f.write(f'  WIFI[{i}]        path=0x{p:08X} rel=0x{r:X} size=0x{s:X}\n')
            for i, (p, r, s) in enumerate(be):
              f.write(f'  BT_Addr[{i}]    path=0x{p:08X} rel=0x{r:X} size=0x{s:X}\n')
            for i, (p, r, s) in enumerate(wce):
              f.write(f'  WIFI_CUSTOM[{i}] path=0x{p:08X} rel=0x{r:X} size=0x{s:X}\n')
            f.write(f'\n[updates]\n')
            for l in log:
              f.write(l + '\n')

          if w_algo_name is None:
            print('WARNING: WiFi CRC algorithm could not be detected. CRC was NOT updated.')
            print('         Check nvram_analysis.log for orig_crc value and verify manually.')

          print(f'data_base    : 0x{db:08X}')
          print(f'wifi_mac_off : 0x{wmo:08X}  {ms(old_w)} -> {ms(nw)}')
          print(f'wifi_crc_off : 0x{wcro:08X}  algo={w_algo_name}  orig=0x{w_orig_crc:04X}')
          print(f'bt_mac_off   : 0x{bmo:08X}  {ms(old_b)} -> {ms(nb)}')
          print(f'bt_crc_off   : 0x{bcro:08X}  algo={b_algo_name}  orig=0x{b_orig_crc:04X}')
          print('Done')
          PYEOF
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: nvram-artifacts
          path: |
            nvram_modified.img
            nvram_analysis.log
