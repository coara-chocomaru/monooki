name: Randomize MAC in NVRAM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  randomize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MAC randomizer
        run: python randomize_mac.py
      - name: Upload modified NVRAM image
        uses: actions/upload-artifact@v4
        with:
          name: nvram_modified
          path: nvram.img
      - name: Upload analysis log
        uses: actions/upload-artifact@v4
        with:
          name: nvram_analysis_log
          path: nvram_analysis.log
