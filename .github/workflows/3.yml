name: Randomize MAC in NVRAM

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      wifi_offset:
        description: 'Manual WiFi offset (hex)'
        required: false
      bt_offset:
        description: 'Manual Bluetooth offset (hex)'
        required: false

jobs:
  randomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MAC randomizer
        run: |
          python randomize_mac.py \
            --wifi-offset "${{ github.event.inputs.wifi_offset }}" \
            --bt-offset "${{ github.event.inputs.bt_offset }}"
      - name: Upload modified image
        uses: actions/upload-artifact@v4
        with:
          name: nvram_modified
          path: nvram.img
      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: nvram_analysis_log
          path: nvram_analysis.log
