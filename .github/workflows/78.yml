name: Extract vmlinux and kallsyms

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extract-vmlinux
        run: |
          curl -fsSL -o extract-vmlinux \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux"
          chmod +x extract-vmlinux

      - name: Download kernel.img (zImage)
        run: |
          curl -fsSL -o kernel.img \
            "https://github.com/coara-chocomaru/monooki/releases/download/%E3%81%A7%E3%83%BC%E3%81%9F2/2026"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu gzip xz-utils bzip2 lzma lzop lz4 zstd python3-pip python3-venv gcc g++

      - name: Setup Python virtual environment
        run: |
          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies in venv
        run: |
          source /tmp/venv/bin/activate
          pip install lz4 zstandard git+https://github.com/clubby789/python-lzo@b4e39df
          pip install git+https://github.com/marin-m/vmlinux-to-elf
          pip install miasm
          git clone https://github.com/nforest/droidimg.git /tmp/droidimg

      - name: Decompress zImage to raw vmlinux
        run: |
          ./extract-vmlinux kernel.img 2>/dev/null > vmlinux.raw
          if [ ! -s vmlinux.raw ]; then
            echo "ERROR: extract-vmlinux failed or produced empty output"
            exit 1
          fi

      - name: Convert raw vmlinux to ELF with vmlinux-to-elf
        run: |
          source /tmp/venv/bin/activate
          vmlinux-to-elf --use-absolute --base-address 0xffffffe1c6801000 vmlinux.raw vmlinux.elf || {
            echo "vmlinux-to-elf failed, trying alternative approach..."
            dd if=vmlinux.raw of=vmlinux.strip bs=20 skip=1 2>/dev/null
            vmlinux-to-elf --use-absolute --base-address 0xffffffe1c6801000 vmlinux.strip vmlinux.elf
          }

      - name: Extract base kallsyms with kallsyms-finder
        run: |
          source /tmp/venv/bin/activate
          kallsyms-finder vmlinux.elf > kallsyms_base.txt
          echo "=== Base kallsyms count ==="
          wc -l kallsyms_base.txt

      - name: Run droidimg with miasm to enhance symbols
        run: |
          source /tmp/venv/bin/activate
          echo "=== Trying droidimg with KASLR offset or direct extraction ==="
          
          # 1. まずはベースアドレス/KASLR指定を試みる (--kaslr オプションを使用)
          python3 /tmp/droidimg/vmlinux.py -m --kaslr 0xffffffe1c6801000 --json vmlinux.raw > droidimg_kallsyms.json 2>droidimg_err.log || {
            echo "Miasm with --kaslr failed, trying without Miasm..."
            python3 /tmp/droidimg/vmlinux.py --kaslr 0xffffffe1c6801000 --json vmlinux.raw > droidimg_kallsyms.json 2>droidimg_err.log || {
              
              # 2. オプションエラー等で落ちる場合、標準の自動解析で抽出を試みる
              echo "KASLR option failed, falling back to standard extraction..."
              python3 /tmp/droidimg/vmlinux.py -m --json vmlinux.raw > droidimg_kallsyms.json 2>droidimg_err.log || \
              python3 /tmp/droidimg/vmlinux.py --json vmlinux.raw > droidimg_kallsyms.json 2>droidimg_err.log || {
                echo "WARNING: droidimg completely failed. Error log below:"
                cat droidimg_err.log
                echo "{}" > droidimg_kallsyms.json
              }
            }
          }
          echo "=== Droidimg task completed ==="

      - name: Merge kallsyms from both sources
        run: |
          source /tmp/venv/bin/activate
          python3 << 'EOF'
          import json
          import re

          base_syms = set()
          enhanced_syms = {}
          TARGET_BASE = 0xffffffe1c6801000

          # 1. kallsyms_base.txtの読み込み
          try:
              with open('kallsyms_base.txt', 'r') as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#'):
                          parts = line.split()
                          if len(parts) >= 3:
                              addr = parts[0]
                              sym_type = parts[1]
                              name = parts[2]
                              base_syms.add((addr, sym_type, name))
          except FileNotFoundError:
              print("Warning: kallsyms_base.txt not found.")

          # 2. droidimg_kallsyms.jsonの読み込みとアドレス調整
          try:
              with open('droidimg_kallsyms.json', 'r') as f:
                  content = f.read().strip()
                  if content and content.startswith('{'):
                      data = json.loads(content)
                      if 'sym' in data:
                          for sym in data['sym']:
                              if 'addr' in sym and 'name' in sym:
                                  addr_val = int(sym['addr'], 16) if sym['addr'].startswith('0x') else int(sym['addr'], 16)
                                  
                                  # もしベースアドレスがずれて出力されていた場合、0xffffffe1c6801000ベースに補正
                                  # (典型的なデフォルトベース 0xffffffc010080000 からのオフセット計算)
                                  if addr_val < 0xffffffe000000000 and addr_val >= 0xffffffc010080000:
                                      offset = addr_val - 0xffffffc010080000
                                      addr_val = TARGET_BASE + offset
                                  
                                  addr_str = f"0x{addr_val:x}"
                                  sym_type = 'T' if 'text' in sym.get('type', '') else 'D'
                                  enhanced_syms[addr_str] = (sym_type, sym['name'])
          except (json.JSONDecodeError, FileNotFoundError, ValueError) as e:
              print(f"Notice: Could not parse droidimg JSON natively ({e}), trying regex fallback...")
              try:
                  with open('droidimg_kallsyms.json', 'r') as f:
                      for line in f:
                          match = re.search(r'([0-9a-fA-Fx]+)\s+(\w+)\s+(\S+)', line)
                          if match:
                              addr = match.group(1)
                              sym_type = match.group(2)
                              name = match.group(3)
                              enhanced_syms[addr] = (sym_type, name)
              except Exception:
                  pass

          # 3. 双方のシンボルを結合
          all_syms = {}
          for addr, sym_type, name in base_syms:
              # 一貫性のためにプレフィックスや数値を正規化
              val = int(addr, 16)
              all_syms[val] = (sym_type, name)

          for addr_str, (sym_type, name) in enhanced_syms.items():
              val = int(addr_str, 16)
              if val not in all_syms:
                  all_syms[val] = (sym_type, name)

          # 4. 固定ベースアドレスにソートして出力
          with open('kallsyms.txt', 'w') as f:
              for addr_val in sorted(all_syms.keys()):
                  sym_type, name = all_syms[addr_val]
                  f.write(f"0x{addr_val:016x} {sym_type} {name}\n")

          print(f"Total merged symbols: {len(all_syms)}")
          EOF

      - name: Fix KASLR if needed
        run: |
          curl -fsSL -o fix_kaslr_arm64.c \
            "https://raw.githubusercontent.com/nforest/droidimg/master/fix_kaslr_arm64.c"
          gcc -o fix_kaslr_arm64 fix_kaslr_arm64.c
          ./fix_kaslr_arm64 vmlinux.raw vmlinux_fixed.raw 2>/dev/null || echo "KASLR fix not applicable"

      - name: Verify kallsyms quality
        run: |
          echo "=== Final kallsyms summary ==="
          wc -l kallsyms.txt
          echo ""
          echo "=== Sample symbols ==="
          head -20 kallsyms.txt
          echo ""
          echo "=== Checking for kernel version string ==="
          grep -i "linux version" kallsyms.txt || echo "No kernel version symbol found (may be okay)"

      - name: Upload final kallsyms artifact
        uses: actions/upload-artifact@v4
        with:
          name: kallsyms
          path: |
            kallsyms.txt
            vmlinux.elf
          retention-days: 30
