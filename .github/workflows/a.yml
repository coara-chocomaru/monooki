name: Patch Audio HAL (MT8167)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'audio.primary.mt8167.so URL'
        required: true
        type: string

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils file

      - name: Download file
        run: |
          curl -L -o audio.primary.mt8167.so "${{ inputs.download_url }}"
          file audio.primary.mt8167.so

      - name: Find symbol offset
        id: find
        run: |
          SYM="_ZN7android26AudioALSACaptureDataClient21ConfigBesRecordParamsEv"
          OFFSET=$(readelf -s audio.primary.mt8167.so | grep "$SYM" | awk '{print $2}' | head -1)
          if [ -n "$OFFSET" ]; then
            echo "offset_hex=$OFFSET" >> $GITHUB_OUTPUT
            echo "offset_dec=$((0x$OFFSET))" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Patch both offsets
        run: |
          if [ "${{ steps.find.outputs.found }}" = "true" ]; then
            OFFSET=${{ steps.find.outputs.offset_dec }}
            printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167.so bs=1 seek=$OFFSET count=4 conv=notrunc
          fi
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167.so bs=1 seek=624612 count=4 conv=notrunc
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167.so bs=1 seek=622868 count=4 conv=notrunc
          sync
          dd if=audio.primary.mt8167.so bs=1 skip=624612 count=4 2>/dev/null | od -An -tx1
          dd if=audio.primary.mt8167.so bs=1 skip=622868 count=4 2>/dev/null | od -An -tx1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio.primary.mt8167_patched
          path: audio.primary.mt8167.so
          retention-days: 7
