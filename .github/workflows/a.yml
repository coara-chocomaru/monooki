name: Generate SEPolicy UNION list from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Download URL of the ZIP file containing .te files'
        required: true
        type: string
      base_path:
        description: 'Base path inside ZIP to search .te files (optional)'
        required: false
        default: '.'
        type: string

jobs:
  generate-union-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download and extract ZIP
        run: |
          echo "Downloading ZIP from: ${{ inputs.zip_url }}"
          wget -q -O sepolicy.zip "${{ inputs.zip_url }}"
          
          echo "Extracting ZIP..."
          unzip -q sepolicy.zip -d extracted_zip
          
          echo "ZIP contents:"
          ls -R extracted_zip | head -n 50

      - name: Generate BOARD_SEPOLICY_UNION list
        run: |
          BASE_PATH="${{ inputs.base_path }}"
          SEARCH_DIR="extracted_zip/${BASE_PATH}"
          
          echo "Searching .te files in: $SEARCH_DIR"
          
          # .teファイルを再帰的に取得し、パスを相対化してソート
          mapfile -t te_files < <(find "$SEARCH_DIR" -type f -name "*.te" | \
            sed "s|^$SEARCH_DIR/||" | sort)
          
          if [ ${#te_files[@]} -eq 0 ]; then
            echo "Error: No .te files found!"
            exit 1
          fi
          
          echo "Found ${#te_files[@]} .te files"
          
          # 出力ファイル作成
          {
            echo "BOARD_SEPOLICY_UNION += \\"
            
            count=${#te_files[@]}
            for i in "${!te_files[@]}"; do
              if [ $i -eq $((count - 1)) ]; then
                # 最後の行は \ なし
                echo "    ${te_files[i]}"
              else
                echo "    ${te_files[i]} \\"
              fi
            done
          } > sepolicy_union_list.txt
          
          # 確認表示
          echo "=== Generated BOARD_SEPOLICY_UNION ==="
          cat sepolicy_union_list.txt
          echo "===================================="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepolicy_union_list
          path: sepolicy_union_list.txt
          retention-days: 7

      - name: Show final result
        run: |
          echo "✅ Generation completed successfully!"
          echo "Total .te files: $(wc -l < sepolicy_union_list.txt | awk '{print $1-1}')"
