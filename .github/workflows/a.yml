name: Patch Audio HAL (MT8167) - Manual Offset

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'audio.primary.mt8167.so のダウンロードURL'
        required: true
        type: string
        default: 'https://example.com/path/to/audio.primary.mt8167.so'
      function_offset:
        description: 'ConfigBesRecordParams のファイルオフセット（16進数、例: 0x987e4）'
        required: false
        type: string
        default: '0x987e4'

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: 依存パッケージのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file

      - name: ファイルをダウンロード
        run: |
          echo ">>> ${{ inputs.download_url }} からダウンロード中..."
          curl -L -o audio.primary.mt8167.so "${{ inputs.download_url }}"
          if [ ! -f audio.primary.mt8167.so ]; then
            echo "エラー: ダウンロードに失敗しました"
            exit 1
          fi
          file audio.primary.mt8167.so

      - name: 自動シンボル検索（念のため）
        id: find_sym_auto
        run: |
          SYM="_ZN7android26AudioALSACaptureDataClient21ConfigBesRecordParamsEv"
          SYM_LINE=$(readelf -s audio.primary.mt8167.so | grep "$SYM" | head -1 || true)
          if [ -n "$SYM_LINE" ]; then
            OFFSET_HEX=$(echo "$SYM_LINE" | awk '{print $2}')
            echo "offset_hex=$OFFSET_HEX" >> $GITHUB_OUTPUT
            echo "offset_dec=$((0x$OFFSET_HEX))" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo ">>> 自動検索で見つかりませんでした。手動入力を使用します。"
          fi

      - name: オフセットを決定（自動 or 手動）
        id: decide_offset
        run: |
          if [ "${{ steps.find_sym_auto.outputs.found }}" = "true" ]; then
            echo "offset_dec=${{ steps.find_sym_auto.outputs.offset_dec }}" >> $GITHUB_OUTPUT
            echo "offset_hex=${{ steps.find_sym_auto.outputs.offset_hex }}" >> $GITHUB_OUTPUT
            echo ">>> 自動検出オフセット: 0x${{ steps.find_sym_auto.outputs.offset_hex }}"
          else
            OFFSET_HEX="${{ inputs.function_offset }}"
            # 先頭の 0x を除去
            OFFSET_HEX=${OFFSET_HEX#0x}
            echo "offset_hex=$OFFSET_HEX" >> $GITHUB_OUTPUT
            echo "offset_dec=$((0x$OFFSET_HEX))" >> $GITHUB_OUTPUT
            echo ">>> 手動指定オフセット: 0x$OFFSET_HEX"
          fi

      - name: バイナリパッチを適用（BX LR）
        run: |
          OFFSET=${{ steps.decide_offset.outputs.offset_dec }}
          echo ">>> オフセット $OFFSET (0x${{ steps.decide_offset.outputs.offset_hex }}) にパッチを適用"
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167.so bs=1 seek="$OFFSET" count=4 conv=notrunc
          echo ">>> パッチ完了"
          echo ">>> パッチ後のバイトを確認:"
          dd if=audio.primary.mt8167.so bs=1 skip="$OFFSET" count=4 2>/dev/null | od -An -tx1

      - name: パッチ済みファイルをアーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: audio.primary.mt8167_patched
          path: audio.primary.mt8167.so
          retention-days: 7
