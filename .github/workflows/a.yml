name: Patch Audio HAL (MT8167)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'audio.primary.mt8167.so URL (32bit)'
        required: true
        type: string
      download_url64:
        description: 'audio.primary.mt8167.so URL (64bit)'
        required: false
        type: string
        default: ''

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils file

      - name: Download 32bit
        run: |
          curl -L -o audio.primary.mt8167.so "${{ inputs.download_url }}"
          file audio.primary.mt8167.so

      - name: Download 64bit
        if: inputs.download_url64 != ''
        run: |
          curl -L -o audio.primary.mt8167_64.so "${{ inputs.download_url64 }}"
          file audio.primary.mt8167_64.so

      - name: Patch 32bit
        run: |
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167.so bs=1 seek=$((0x987e4)) count=4 conv=notrunc
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167.so bs=1 seek=$((0x99050)) count=4 conv=notrunc
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167.so bs=1 seek=$((0x97f14)) count=4 conv=notrunc
          sync
          dd if=audio.primary.mt8167.so bs=1 skip=$((0x987e4)) count=4 2>/dev/null | od -An -tx1
          dd if=audio.primary.mt8167.so bs=1 skip=$((0x99050)) count=4 2>/dev/null | od -An -tx1
          dd if=audio.primary.mt8167.so bs=1 skip=$((0x97f14)) count=4 2>/dev/null | od -An -tx1

      - name: Patch 64bit
        if: inputs.download_url64 != ''
        run: |
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167_64.so bs=1 seek=$((0x987e4)) count=4 conv=notrunc
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167_64.so bs=1 seek=$((0x99050)) count=4 conv=notrunc
          printf "\x1e\xff\x2f\xe1" | dd of=audio.primary.mt8167_64.so bs=1 seek=$((0x97f14)) count=4 conv=notrunc
          sync
          dd if=audio.primary.mt8167_64.so bs=1 skip=$((0x987e4)) count=4 2>/dev/null | od -An -tx1
          dd if=audio.primary.mt8167_64.so bs=1 skip=$((0x99050)) count=4 2>/dev/null | od -An -tx1
          dd if=audio.primary.mt8167_64.so bs=1 skip=$((0x97f14)) count=4 2>/dev/null | od -An -tx1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio_hal_patched
          path: |
            audio.primary.mt8167.so
            audio.primary.mt8167_64.so
          retention-days: 7
