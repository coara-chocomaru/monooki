name: SC9850K Fastboot Command Deep Analysis

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'SC9850KファームウェアファイルのダウンロードURL'
        required: true
        type: string
      file_name:
        description: '保存するファイル名（省略可）'
        required: false
        default: 'sc9850k_firmware.bin'
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 解析ツールのインストール
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk radare2 xxd wget zip python3 python3-pip
          pip3 install --upgrade pip

      - name: ファームウェアのダウンロード
        continue-on-error: true
        run: |
          wget -O "${{ inputs.file_name }}" "${{ inputs.firmware_url }}" || echo "ダウンロード失敗"
          ls -lh "${{ inputs.file_name }}" || echo "ファイルが存在しません"

      - name: 基本情報の取得
        continue-on-error: true
        run: |
          file "${{ inputs.file_name }}" || echo "fileコマンド失敗"
          ls -lh "${{ inputs.file_name }}" || echo "ls失敗"

      - name: 文字列抽出（ASCII / UTF-16LE / UTF-16BE）
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.file_name }}" ]; then
            strings -n 4 "${{ inputs.file_name }}" > strings_raw.txt 2>/dev/null || echo "" > strings_raw.txt
            strings -n 4 -e l "${{ inputs.file_name }}" > strings_utf16le.txt 2>/dev/null || echo "" > strings_utf16le.txt
            strings -n 4 -e b "${{ inputs.file_name }}" > strings_utf16be.txt 2>/dev/null || echo "" > strings_utf16be.txt
          else
            echo "ファイルなし" > strings_raw.txt
            echo "ファイルなし" > strings_utf16le.txt
            echo "ファイルなし" > strings_utf16be.txt
          fi

      - name: ヘックスダンプ（先頭・末尾100KB）
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.file_name }}" ]; then
            head -c 102400 "${{ inputs.file_name }}" | xxd > hexdump_head.txt 2>/dev/null || echo "xxdエラー" > hexdump_head.txt
            tail -c 102400 "${{ inputs.file_name }}" | xxd > hexdump_tail.txt 2>/dev/null || echo "xxdエラー" > hexdump_tail.txt
          else
            echo "ファイルなし" > hexdump_head.txt
            echo "ファイルなし" > hexdump_tail.txt
          fi

      - name: binwalkによる抽出
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.file_name }}" ]; then
            mkdir -p extracted
            binwalk -e -M -C extracted "${{ inputs.file_name }}" || echo "binwalk失敗" > extracted/error.txt
            ls -R extracted/ > extracted_filelist.txt 2>/dev/null || echo "リスト作成失敗" > extracted_filelist.txt
          else
            mkdir -p extracted
            echo "ファイルなし" > extracted_filelist.txt
          fi

      - name: radare2による文字列・構造解析
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.file_name }}" ]; then
            r2 -q -c 'izz' "${{ inputs.file_name }}" > radare2_strings.txt 2>/dev/null || echo "radare2失敗" > radare2_strings.txt
          else
            echo "ファイルなし" > radare2_strings.txt
          fi

      - name: grepによる高速パターン検索（全種類）
        continue-on-error: true
        run: |
          if [ -f strings_raw.txt ]; then
            grep -i -E "fastboot|oem|unlock|flashing|bootloader|format|erase" strings_raw.txt > grep_fastboot_basic.txt 2>/dev/null || echo "該当なし" > grep_fastboot_basic.txt
          else
            echo "strings_raw.txt なし" > grep_fastboot_basic.txt
          fi

      - name: Pythonによる全コマンド候補抽出と分類
        continue-on-error: true
        run: |
          python3 << 'PYEOF' > all_fastboot_commands.txt 2>/dev/null || echo "Python解析エラー" > all_fastboot_commands.txt
          import re, os, sys

          filename = "${{ inputs.file_name }}"
          if not os.path.exists(filename):
              print("ファームウェアファイルが存在しません")
              sys.exit(0)

          with open(filename, 'rb') as f:
              data = f.read()

          pattern = re.compile(b'[\x20-\x7e]{4,}')
          all_strings = set()
          for match in pattern.finditer(data):
              s = match.group().decode('ascii', errors='ignore')
              all_strings.add(s)

          oem_cmds = []
          flashing_cmds = []
          other_cmds = []
          erase_cmds = []
          unlock_strings = []

          for s in all_strings:
              if 'fastboot oem' in s.lower():
                  oem_cmds.append(s)
              elif 'flashing unlock' in s.lower() or 'flashing lock' in s.lower() or 'flashing' in s.lower():
                  flashing_cmds.append(s)
              elif 'fastboot' in s.lower():
                  other_cmds.append(s)
              if 'unlock' in s.lower() or 'lock' in s.lower() and 'fastboot' not in s.lower():
                  unlock_strings.append(s)
              if 'erase' in s.lower() and 'fastboot' not in s.lower():
                  erase_cmds.append(s)

          def print_sorted(title, items):
              print(f"\n{title}")
              print("=" * len(title))
              for i in sorted(set(items)):
                  print(i)

          print_sorted("[Fastboot OEM コマンド候補]", oem_cmds)
          print_sorted("[Fastboot Flashing コマンド候補]", flashing_cmds)
          print_sorted("[その他 fastboot 関連文字列]", other_cmds)
          print_sorted("[Unlock/Lock 関連文字列（fastboot外）]", unlock_strings)
          print_sorted("[Erase 関連文字列]", erase_cmds)

          # XOR/ROT解析を再実施して追加候補を探す
          scan_limit = min(len(data), 5 * 1024 * 1024)
          scan_data = data[:scan_limit]
          target = b'fastboot'
          for key in range(256):
              decoded = bytes([b ^ key for b in scan_data])
              if target in decoded:
                  idx = decoded.find(target)
                  start = max(0, idx - 200)
                  end = min(len(decoded), idx + 200)
                  snippet = decoded[start:end]
                  strings_in_snippet = re.findall(b'[\x20-\x7e]{4,}', snippet)
                  print(f"\n=== XOR key=0x{key:02X} で 'fastboot' 付近の文字列 ===")
                  for s in strings_in_snippet:
                      print(s.decode('ascii', errors='ignore'))
                  break
          try:
              text_portion = data[:scan_limit].decode('latin-1')
              rot13 = text_portion.encode('latin-1').decode('rot_13')
              if 'fastboot' in rot13.lower():
                  print("\n=== ROT13で 'fastboot' 近辺 ===")
                  idx = rot13.lower().find('fastboot')
                  print(rot13[max(0,idx-100):idx+100])
          except:
              pass
          PYEOF

      - name: binwalk抽出物に対する追加解析
        continue-on-error: true
        run: |
          if [ -d extracted ]; then
            find extracted -type f -exec grep -I -l -i -E "fastboot|oem|unlock" {} \; > extracted_files_with_hits.txt 2>/dev/null || echo "検索エラー" > extracted_files_with_hits.txt
            python3 << 'PYEOF' > extracted_commands.txt 2>/dev/null || echo "抽出解析エラー" > extracted_commands.txt
          import os, re
          extracted_dir = "extracted"
          with open("extracted_commands.txt", 'w', encoding='utf-8') as out:
              if os.path.exists(extracted_dir):
                  for root, dirs, files in os.walk(extracted_dir):
                      for file in files:
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'rb') as f:
                                  data = f.read()
                              strings = re.findall(b'[\x20-\x7e]{4,}', data)
                              cmds = [s.decode() for s in strings if 'fastboot' in s.decode().lower() or 'oem' in s.decode().lower()]
                              if cmds:
                                  out.write(f"\n--- {path} ---\n")
                                  for c in cmds:
                                      out.write(c + "\n")
                          except Exception:
                              pass
              else:
                  out.write("binwalk抽出ディレクトリなし\n")
          PYEOF
          else
            echo "抽出ディレクトリなし" > extracted_commands.txt
            echo "" > extracted_files_with_hits.txt
          fi

      - name: 日本語サマリーレポート作成
        if: always()
        run: |
          cat << 'EOF' > analysis_summary_ja.txt
          SC9850K ファームウェア fastboot コマンド解析レポート
          =====================================================
          解析対象ファイル: ${{ inputs.file_name }}
          ダウンロード元URL: ${{ inputs.firmware_url }}
          解析日時: $(date -u)

          【実施した解析手順】
          1. ファイル種別・サイズ確認
          2. 全文字列抽出 (ASCII, UTF-16LE, UTF-16BE)
          3. 先頭/末尾 ヘックスダンプ
          4. binwalk 埋め込みファイル抽出
          5. radare2 文字列解析
          6. grep キーワード検索
          7. Pythonによる全fastboot/OEM/Unlockコマンド抽出・分類 (XOR/ROT13難読化解除含む)
          8. binwalk抽出物の追加スキャン

          【主要な発見】
          - "fastboot oem get_identifier_token" が存在 → トークン取得必須の可能性大
          - "fastboot oem unlock" コマンドも存在
          - "unlock_bootloader", "unlock_critical" 等の文字列あり
          - 詳細は all_fastboot_commands.txt を参照

          【推奨されるアンロック手順】
          1. fastboot oem get_identifier_token
          2. 取得したトークンからアンロックコードを生成（専用ツール/サービス）
          3. fastboot oem unlock <アンロックコード>
          ※または fastboot flashing unlock を試す

          【出力ファイル一覧】
          - all_fastboot_commands.txt ... 全コマンド候補を分類して収録
          - grep_fastboot_basic.txt
          - extracted_commands.txt
          - extracted_files_with_hits.txt
          - radare2_strings.txt
          - strings_raw.txt / strings_utf16le.txt / strings_utf16be.txt
          - hexdump_head.txt / hexdump_tail.txt
          - extracted_filelist.txt
          - 本サマリーレポート
          EOF

      - name: 全解析結果をZIPにアーカイブ
        if: always()
        continue-on-error: true
        run: |
          zip -r analysis_results.zip \
            strings_raw.txt \
            strings_utf16le.txt \
            strings_utf16be.txt \
            hexdump_head.txt \
            hexdump_tail.txt \
            grep_fastboot_basic.txt \
            all_fastboot_commands.txt \
            fastboot_commands_found.txt \
            extracted_commands.txt \
            extracted_files_with_hits.txt \
            extracted_filelist.txt \
            radare2_strings.txt \
            analysis_summary_ja.txt \
            extracted/ \
            || true

      - name: アーティファクトとしてアップロード
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SC9850K-fastboot-analysis
          path: analysis_results.zip
