name: AOSP 5.1.1_r28 Sepolicy Deduplicator (Type/Attribute Aware)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'カスタム sepolicy ZIP ファイルの直接URL (.te と *contexts を含む)'
        required: true
        type: string

jobs:
  sepolicy-clean:
    runs-on: ubuntu-latest
    steps:
      # 1. AOSP sepolicy の取得
      - name: Download AOSP android-5.1.1_r28 sepolicy (external/sepolicy)
        run: |
          mkdir -p aosp_sepolicy
          echo "Downloading AOSP sepolicy..."
          wget --quiet https://android.googlesource.com/platform/external/sepolicy/+archive/android-5.1.1_r28.tar.gz -O aosp_sepolicy.tar.gz
          tar -xzf aosp_sepolicy.tar.gz -C aosp_sepolicy
          echo "AOSP files: $(find aosp_sepolicy -type f | wc -l)"

      # 2. カスタム ZIP の取得
      - name: Download and extract custom sepolicy ZIP
        run: |
          mkdir -p custom_sepolicy
          echo "Downloading custom ZIP..."
          wget --quiet "${{ github.event.inputs.zip_url }}" -O custom_sepolicy.zip
          unzip -q custom_sepolicy.zip -d custom_sepolicy
          echo "Custom files: $(find custom_sepolicy -type f | wc -l)"

      # 3. 重複削除（タイプ/属性宣言 + 完全一致行）
      - name: Remove duplicates (type/attribute + exact lines)
        run: |
          set -e
          AOSP_DIR="$(pwd)/aosp_sepolicy"
          CUSTOM_DIR="$(pwd)/custom_sepolicy"

          # ---- (A) AOSP から type / attribute 宣言名を抽出 ----
          echo "Extracting AOSP type/attribute names..."
          find "$AOSP_DIR" -type f -name "*.te" -exec cat {} \; \
            | grep -E '^(type|attribute)\s+' \
            | awk '{print $2}' \
            | sed 's/,.*//' \
            | sort -u > "$AOSP_DIR/aosp_declared_names.txt"
          echo "Found $(wc -l < "$AOSP_DIR/aosp_declared_names.txt") unique type/attribute names in AOSP."

          # ---- (B) 各 .te ファイルを処理 ----
          clean_te_file() {
            local te_file="$1"
            local rel_path="${te_file#$CUSTOM_DIR/}"
            local aosp_file="$AOSP_DIR/$rel_path"
            local tmp_file="${te_file}.tmp"

            echo "Processing: $rel_path"

            # 1) AOSP に同名ファイルがなければ何もしない（独自ファイル）
            if [ ! -f "$aosp_file" ]; then
              echo "  -> No AOSP counterpart, keeping all lines."
              return 0
            fi

            # 2) 完全一致行の削除（従来の処理）
            grep -v -x -F -f "$aosp_file" "$te_file" > "$tmp_file" || true

            # 3) タイプ/属性宣言の重複削除（AOSP で宣言済みの名前を持つ行を削除）
            #    - type 宣言行（例: type adbd, domain; ）の2番目のトークン（カンマ前）を取得し、
            #      AOSP宣言名リストにあればその行を削除
            #    - attribute 宣言行も同様
            if [ -s "$tmp_file" ]; then
              # 一度に処理するため、awk で宣言名がリストに含まれる行を除外
              awk -v list="$AOSP_DIR/aosp_declared_names.txt" '
                BEGIN {
                  # 宣言名のリストを連想配列に格納
                  while ((getline name < list) > 0) aosp[name]=1
                  close(list)
                }
                {
                  # 行が type または attribute で始まる場合のみチェック
                  if ($1 == "type" || $1 == "attribute") {
                    # 宣言名は $2 からカンマまでの部分（例: "adbd," → "adbd"）
                    split($2, arr, ",")
                    decl_name = arr[1]
                    if (decl_name in aosp) {
                      # AOSP に存在する宣言 → この行をスキップ（削除）
                      next
                    }
                  }
                  # その他の行は出力
                  print
                }
              ' "$tmp_file" > "${te_file}.final" && mv "${te_file}.final" "$tmp_file"
            fi

            # 4) 上書き保存
            mv "$tmp_file" "$te_file"
            echo "  -> Cleaned (removed exact matches + duplicate type/attribute declarations)."
          }

          export -f clean_te_file
          export AOSP_DIR CUSTOM_DIR

          # .te ファイルのみ処理（contexts は従来の完全一致で十分）
          find "$CUSTOM_DIR" -type f -name "*.te" -exec bash -c 'clean_te_file "$0"' {} \;

          # ---- (C) contexts ファイルは従来の完全一致削除のみ ----
          echo "Processing contexts files (exact line match only)..."
          for ctx_file in $(find "$CUSTOM_DIR" -type f -name "*contexts"); do
            rel_path="${ctx_file#$CUSTOM_DIR/}"
            aosp_file="$AOSP_DIR/$rel_path"
            if [ -f "$aosp_file" ]; then
              grep -v -x -F -f "$aosp_file" "$ctx_file" > "${ctx_file}.tmp" || true
              mv "${ctx_file}.tmp" "$ctx_file"
              echo "  Cleaned $rel_path"
            else
              echo "  $rel_path has no AOSP counterpart, kept as is."
            fi
          done

          echo "Deduplication finished."

      # 4. クリーンアップと ZIP 化
      - name: Package cleaned sepolicy into ZIP
        run: |
          cd custom_sepolicy
          find . -type f -name "*.tmp" -delete
          zip -r ../cleaned_sepolicy.zip .
          cd ..
          echo "Final ZIP size: $(du -sh cleaned_sepolicy.zip | cut -f1)"

      # 5. アーティファクトアップロード
      - name: Upload cleaned sepolicy artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-aosp-5.1.1_sepolicy
          path: cleaned_sepolicy.zip
          retention-days: 7
