name: AOSP 5.1.1_r28 Sepolicy Deduplicator (Type/Attribute only, no exact match)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'sepolicy バイナリとカスタム .te を含む ZIP ファイルの直接URL'
        required: true
        type: string

jobs:
  sepolicy-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Install checkpolicy
        run: |
          sudo apt-get update
          sudo apt-get install -y checkpolicy

      - name: Download and extract sepolicy ZIP
        run: |
          mkdir -p workspace
          cd workspace
          wget --quiet "${{ github.event.inputs.zip_url }}" -O sepolicy.zip
          unzip -q sepolicy.zip
          echo "Extracted files:"
          find . -type f | head -30

      - name: Convert sepolicy binary to policy.conf
        run: |
          cd workspace
          SEPOLICY_BIN=$(find . -type f -name "sepolicy" ! -name "*.te" ! -name "*.conf" | head -n 1)
          if [ -z "$SEPOLICY_BIN" ]; then
            echo "ERROR: sepolicy binary not found!"
            exit 1
          fi
          echo "Found sepolicy at: $SEPOLICY_BIN"
          checkpolicy -b -M -o policy.conf "$SEPOLICY_BIN"
          echo "Generated policy.conf"
          echo "POLICY_CONF=$(pwd)/policy.conf" >> $GITHUB_ENV

      - name: Extract AOSP type/attribute names
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          grep -E '^(type|attribute) ' "$POLICY_CONF" \
            | awk '{print $2}' \
            | sed 's/[,;].*//' \
            | sort -u > aosp_names.txt
          echo "Extracted $(wc -l < aosp_names.txt) unique type/attribute names."

      - name: Remove duplicate type/attribute declarations only (keep all others)
        run: |
          cd workspace
          NAMES_FILE="aosp_names.txt"

          clean_te_file() {
            local te_file="$1"
            echo "Processing: $te_file"
            local orig=$(wc -l < "$te_file")

            # type/attribute 宣言行だけをチェックし、AOSP に同名があればその行を削除
            # それ以外の行（allow, neverallow, comments, empty lines, etc.）は絶対に保持
            awk -v list="$NAMES_FILE" '
              BEGIN {
                while ((getline name < list) > 0) aosp_names[name] = 1
                close(list)
              }
              {
                # 行が "type" または "attribute" で始まる場合のみチェック
                if ($1 == "type" || $1 == "attribute") {
                  # 2番目のトークンからカンマ/セミコロンを除去して型名を取得
                  name = $2
                  gsub(/[,;].*/, "", name)
                  # AOSP のリストに含まれていればこの行をスキップ（削除）
                  if (name in aosp_names) {
                    next
                  }
                }
                # それ以外の行は全て出力（保持）
                print
              }
            ' "$te_file" > "${te_file}.cleaned"

            mv "${te_file}.cleaned" "$te_file"
            local new=$(wc -l < "$te_file")
            echo "  Lines: $orig -> $new (removed $((orig - new)) type/attribute declarations)"
          }

          export -f clean_te_file

          find . -type f -name "*.te" ! -path "*/policy.conf" ! -path "*/sepolicy" \
            -exec bash -c 'clean_te_file "$0"' {} \;

          echo "Deduplication finished."

      - name: Package cleaned sepolicy into ZIP
        run: |
          cd workspace
          zip -r ../cleaned_sepolicy.zip .
          cd ..
          echo "Final ZIP size: $(du -sh cleaned_sepolicy.zip | cut -f1)"

      - name: Upload cleaned sepolicy artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-aosp-5.1.1_sepolicy
          path: cleaned_sepolicy.zip
          retention-days: 7
