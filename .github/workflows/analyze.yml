name: AOSP 5.1.1_r28 Sepolicy Deduplicator (Type/Attribute only, no checkpolicy)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'カスタム sepolicy ZIP ファイルの直接URL (.te と *contexts を含む)'
        required: true
        type: string

jobs:
  sepolicy-clean:
    runs-on: ubuntu-latest
    steps:
      # 1. AOSP ソースから type/attribute 名を抽出
      - name: Download AOSP android-5.1.1_r28 sepolicy (external/sepolicy)
        run: |
          mkdir -p aosp_sepolicy
          echo "Downloading AOSP sepolicy from android.googlesource.com..."
          wget --quiet https://android.googlesource.com/platform/external/sepolicy/+archive/android-5.1.1_r28.tar.gz -O aosp_sepolicy.tar.gz
          tar -xzf aosp_sepolicy.tar.gz -C aosp_sepolicy
          echo "AOSP files: $(find aosp_sepolicy -type f | wc -l)"

      - name: Extract AOSP type/attribute names from .te files
        run: |
          cd aosp_sepolicy
          # 全 .te ファイルから type / attribute 宣言名を抽出
          find . -type f -name "*.te" -exec cat {} \; \
            | grep -E '^(type|attribute)\s+' \
            | awk '{print $2}' \
            | sed 's/[,;].*//' \
            | sort -u > ../aosp_names.txt
          echo "Extracted $(wc -l < ../aosp_names.txt) unique type/attribute names from AOSP."

      # 2. カスタム ZIP をダウンロードして展開
      - name: Download and extract custom sepolicy ZIP
        run: |
          mkdir -p custom_sepolicy
          echo "Downloading custom ZIP from input URL..."
          wget --quiet "${{ github.event.inputs.zip_url }}" -O custom_sepolicy.zip
          unzip -q custom_sepolicy.zip -d custom_sepolicy
          echo "Custom files: $(find custom_sepolicy -type f | wc -l)"

      # 3. 重複する type/attribute 宣言を削除（完全一致行は削除しない）
      - name: Remove duplicate type/attribute declarations from .te files
        run: |
          cd custom_sepolicy
          NAMES_FILE="../aosp_names.txt"

          # リストファイルが存在し、かつ空でないことを確認
          if [ ! -s "$NAMES_FILE" ]; then
            echo "ERROR: aosp_names.txt is empty or missing!"
            exit 1
          fi

          clean_te_file() {
            local te_file="$1"
            echo "Processing: $te_file"
            local orig=$(wc -l < "$te_file")

            # type/attribute 宣言行のみチェックし、AOSPに同名があれば削除
            awk -v list="$NAMES_FILE" '
              BEGIN {
                while ((getline name < list) > 0) aosp_names[name] = 1
                close(list)
              }
              {
                if ($1 == "type" || $1 == "attribute") {
                  name = $2
                  gsub(/[,;].*/, "", name)
                  if (name in aosp_names) {
                    next   # この宣言行を削除
                  }
                }
                print
              }
            ' "$te_file" > "${te_file}.cleaned"

            mv "${te_file}.cleaned" "$te_file"
            local new=$(wc -l < "$te_file")
            echo "  Lines: $orig -> $new (removed $((orig - new)) type/attribute declarations)"
          }

          export -f clean_te_file
          export NAMES_FILE

          find . -type f -name "*.te" -exec bash -c 'clean_te_file "$0"' {} \;

          echo "Deduplication finished."

      # 4. contexts ファイルは手を加えずそのまま保持（エラー原因ではないため）
      #    （必要なら AOSP の contexts と完全一致削除も可能だが、今回はスキップ）

      # 5. クリーンアップと ZIP 化
      - name: Package cleaned sepolicy into ZIP
        run: |
          cd custom_sepolicy
          find . -type f -name "*.cleaned" -delete
          zip -r ../cleaned_sepolicy.zip .
          cd ..
          echo "Final ZIP size: $(du -sh cleaned_sepolicy.zip | cut -f1)"

      # 6. アーティファクトアップロード
      - name: Upload cleaned sepolicy artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-aosp-5.1.1_sepolicy
          path: cleaned_sepolicy.zip
          retention-days: 7
