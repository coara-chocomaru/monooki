name: AOSP 5.1.1_r28 Sepolicy Deduplicator (with checkpolicy)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'sepolicy バイナリとカスタム .te を含む ZIP ファイルの直接URL'
        required: true
        type: string

jobs:
  sepolicy-clean:
    runs-on: ubuntu-latest
    steps:
      # 1. checkpolicy のインストール（Ubuntu パッケージ）
      - name: Install checkpolicy
        run: |
          sudo apt-get update
          sudo apt-get install -y checkpolicy

      # 2. ユーザー指定の ZIP をダウンロードして展開
      - name: Download and extract sepolicy ZIP
        run: |
          mkdir -p workspace
          cd workspace
          echo "Downloading ZIP from input URL..."
          wget --quiet "${{ github.event.inputs.zip_url }}" -O sepolicy.zip
          unzip -q sepolicy.zip
          echo "Extracted files:"
          find . -type f | head -30

      # 3. sepolicy バイナリを探して policy.conf に変換
      - name: Convert sepolicy binary to policy.conf
        id: convert
        run: |
          cd workspace
          # sepolicy バイナリを再帰的に探す（ファイル名は 'sepolicy' と仮定）
          SEPOLICY_BIN=$(find . -type f -name "sepolicy" ! -name "*.te" ! -name "*.conf" | head -n 1)
          if [ -z "$SEPOLICY_BIN" ]; then
            echo "ERROR: sepolicy binary not found in the ZIP!"
            exit 1
          fi
          echo "Found sepolicy binary at: $SEPOLICY_BIN"
          # checkpolicy で policy.conf を生成
          checkpolicy -b -F -M -o policy.conf "$SEPOLICY_BIN"
          echo "Generated policy.conf"
          echo "POLICY_CONF=$(pwd)/policy.conf" >> $GITHUB_ENV

      # 4. policy.conf から AOSP の type/attribute 名を抽出
      - name: Extract AOSP type/attribute names from policy.conf
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          grep -E '^(type|attribute) ' "$POLICY_CONF" \
            | awk '{print $2}' \
            | sed 's/[,;].*//' \
            | sort -u > aosp_names.txt
          echo "Extracted $(wc -l < aosp_names.txt) unique type/attribute names from AOSP."

      # 5. .te ファイルの重複クリーニング（policy.conf をベース）
      - name: Remove duplicates from .te files using policy.conf
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          NAMES_FILE="aosp_names.txt"

          clean_te_file() {
            local te_file="$1"
            local tmp_file="${te_file}.tmp"
            echo "Processing: $te_file"

            # ① policy.conf と完全一致する行を削除
            grep -v -x -F -f "$POLICY_CONF" "$te_file" > "$tmp_file" || true

            # ② AOSP に存在する type / attribute 宣言行を削除
            awk -v list="$NAMES_FILE" '
              BEGIN {
                while ((getline name < list) > 0) aosp_names[name] = 1
                close(list)
              }
              {
                if ($1 == "type" || $1 == "attribute") {
                  name = $2
                  gsub(/[,;].*/, "", name)
                  if (name in aosp_names) {
                    next
                  }
                }
                print
              }
            ' "$tmp_file" > "${te_file}.cleaned"

            mv "${te_file}.cleaned" "$te_file"
            rm -f "$tmp_file"
            echo "  -> Cleaned successfully."
          }

          export -f clean_te_file
          export POLICY_CONF

          # すべての .te ファイルを処理（policy.conf や sepolicy バイナリは除外）
          find . -type f -name "*.te" ! -path "*/policy.conf" ! -path "*/sepolicy" \
            -exec bash -c 'clean_te_file "$0"' {} \;

          echo "Deduplication finished for all .te files."

      # 6. contexts ファイルも必要に応じて完全一致削除（任意）
      - name: (Optional) Clean contexts files
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          for ctx in $(find . -type f -name "*contexts"); do
            grep -v -x -F -f "$POLICY_CONF" "$ctx" > "${ctx}.tmp" || true
            mv "${ctx}.tmp" "$ctx"
            echo "Cleaned $ctx"
          done

      # 7. クリーンアップと ZIP 化
      - name: Package cleaned sepolicy into ZIP
        run: |
          cd workspace
          find . -type f -name "*.tmp" -delete
          find . -type f -name "*.cleaned" -delete
          # 生成した policy.conf も含めておく（必要に応じて削除可能）
          zip -r ../cleaned_sepolicy.zip .
          cd ..
          echo "Final ZIP size: $(du -sh cleaned_sepolicy.zip | cut -f1)"

      # 8. アーティファクトアップロード
      - name: Upload cleaned sepolicy artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-aosp-5.1.1_sepolicy
          path: cleaned_sepolicy.zip
          retention-days: 7
