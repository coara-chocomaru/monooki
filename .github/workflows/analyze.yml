name: AOSP 5.1.1_r28 Sepolicy Deduplicator (with debug)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'sepolicy バイナリとカスタム .te を含む ZIP ファイルの直接URL'
        required: true
        type: string

jobs:
  sepolicy-clean:
    runs-on: ubuntu-latest
    steps:
      # 1. checkpolicy のインストール
      - name: Install checkpolicy
        run: |
          sudo apt-get update
          sudo apt-get install -y checkpolicy

      # 2. ZIP ダウンロード＆展開
      - name: Download and extract sepolicy ZIP
        run: |
          mkdir -p workspace
          cd workspace
          echo "Downloading ZIP..."
          wget --quiet "${{ github.event.inputs.zip_url }}" -O sepolicy.zip
          unzip -q sepolicy.zip
          echo "Extracted files:"
          find . -type f | head -30

      # 3. sepolicy バイナリを policy.conf に変換（-b -o のみ使用）
      - name: Convert sepolicy binary to policy.conf
        id: convert
        run: |
          cd workspace
          SEPOLICY_BIN=$(find . -type f -name "sepolicy" ! -name "*.te" ! -name "*.conf" | head -n 1)
          if [ -z "$SEPOLICY_BIN" ]; then
            echo "ERROR: sepolicy binary not found!"
            exit 1
          fi
          echo "Found sepolicy at: $SEPOLICY_BIN"
          # 変換（-F は file_contexts 出力のため除外）
          # 修正箇所（checkpolicy 実行行）
          checkpolicy -b -M -o policy.conf "$SEPOLICY_BIN"
          echo "Generated policy.conf"
          echo "POLICY_CONF=$(pwd)/policy.conf" >> $GITHUB_ENV

      # 4. policy.conf の内容をデバッグ表示（行数・先頭10行）
      - name: Debug policy.conf
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          echo "=== policy.conf line count ==="
          wc -l "$POLICY_CONF"
          echo "=== First 10 lines of policy.conf ==="
          head -n 10 "$POLICY_CONF"
          echo "=== Sample type/attribute declarations ==="
          grep -E '^(type|attribute) ' "$POLICY_CONF" | head -n 5

      # 5. AOSP の type/attribute 名を抽出
      - name: Extract AOSP type/attribute names
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          grep -E '^(type|attribute) ' "$POLICY_CONF" \
            | awk '{print $2}' \
            | sed 's/[,;].*//' \
            | sort -u > aosp_names.txt
          echo "Extracted $(wc -l < aosp_names.txt) unique names."

      # 6. .te ファイルのクリーニング（デバッグ付き）
      - name: Remove duplicates from .te files (with debug)
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          NAMES_FILE="aosp_names.txt"

          clean_te_file() {
            local te_file="$1"
            echo "========================================"
            echo "Processing: $te_file"
            echo "Original lines: $(wc -l < "$te_file")"

            # ① 完全一致行を削除（一時ファイルに保存）
            grep -v -x -F -f "$POLICY_CONF" "$te_file" > "${te_file}.step1" || true
            echo "After exact-match removal: $(wc -l < "${te_file}.step1")"

            # ② type/attribute 宣言の重複を削除
            awk -v list="$NAMES_FILE" '
              BEGIN {
                while ((getline name < list) > 0) aosp_names[name] = 1
                close(list)
              }
              {
                if ($1 == "type" || $1 == "attribute") {
                  name = $2
                  gsub(/[,;].*/, "", name)
                  if (name in aosp_names) {
                    next
                  }
                }
                print
              }
            ' "${te_file}.step1" > "${te_file}.step2"

            echo "After type/attribute removal: $(wc -l < "${te_file}.step2")"

            # もし完全に空になった場合は警告を出し、元のファイルをバックアップ
            if [ ! -s "${te_file}.step2" ]; then
              echo "WARNING: $te_file became empty! Keeping original as backup."
              cp "$te_file" "${te_file}.bak"
              # ただし、本当に空で良い場合もあるので、空のまま上書きするかはユーザー判断
              # 今回は空のまま上書き（必要ならバックアップを参照）
            fi

            mv "${te_file}.step2" "$te_file"
            rm -f "${te_file}.step1"
            echo "Final lines: $(wc -l < "$te_file")"
          }

          export -f clean_te_file
          export POLICY_CONF

          find . -type f -name "*.te" ! -path "*/policy.conf" ! -path "*/sepolicy" \
            -exec bash -c 'clean_te_file "$0"' {} \;

          echo "Deduplication finished."

      # 7. contexts も同様に処理（ただし完全一致のみ）
      - name: Clean contexts files (exact match only)
        run: |
          cd workspace
          POLICY_CONF="${{ env.POLICY_CONF }}"
          for ctx in $(find . -type f -name "*contexts"); do
            echo "Cleaning $ctx"
            orig=$(wc -l < "$ctx")
            grep -v -x -F -f "$POLICY_CONF" "$ctx" > "${ctx}.tmp" || true
            mv "${ctx}.tmp" "$ctx"
            new=$(wc -l < "$ctx")
            echo "  $orig -> $new lines"
          done

      # 8. 最終パッケージング
      - name: Package cleaned sepolicy into ZIP
        run: |
          cd workspace
          find . -type f -name "*.tmp" -delete
          find . -type f -name "*.step1" -delete
          find . -type f -name "*.step2" -delete
          # policy.conf も同梱（デバッグ用）
          zip -r ../cleaned_sepolicy.zip .
          cd ..
          echo "Final ZIP size: $(du -sh cleaned_sepolicy.zip | cut -f1)"

      # 9. アーティファクトアップロード
      - name: Upload cleaned sepolicy artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-aosp-5.1.1_sepolicy
          path: cleaned_sepolicy.zip
          retention-days: 7
