name: SEPolicy Dedup Against AOSP android5.1.1_r28

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "整理対象の.te/contextsを含むzipのURL"
        required: true
        type: string
      aosp_repo:
        description: "比較対象AOSPリポジトリURL"
        required: false
        type: string
        default: "https://android.googlesource.com/platform/external/sepolicy"
      aosp_ref:
        description: "比較対象AOSPタグ/ブランチ"
        required: false
        type: string
        default: "android-5.1.1_r28"
      output_zip_name:
        description: "出力zipのベース名(拡張子なし)"
        required: false
        type: string
        default: "cleaned_sepolicy"

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: AOSP sepolicyをclone
        run: |
          git clone --depth 1 --branch "${{ inputs.aosp_ref }}" "${{ inputs.aosp_repo }}" aosp_sepolicy

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 入力zipをダウンロード
        run: |
          curl -L --fail -o input.zip "${{ inputs.zip_url }}"

      - name: 入力zipを展開
        run: |
          mkdir -p input_extracted
          unzip -o input.zip -d input_extracted

      - name: 重複行削除スクリプトを配置
        run: |
          cat << 'PYEOF' > dedupe_sepolicy.py
          import argparse
          import glob
          import os
          import re
          import sys


          def normalize_line(line):
              return re.sub(r"\s+", " ", line.strip())


          def is_comment_or_blank(line):
              stripped = line.strip()
              return stripped == "" or stripped.startswith("#")


          def collect_te_corpus(aosp_dir):
              corpus = set()
              for filepath in glob.glob(os.path.join(aosp_dir, "**", "*.te"), recursive=True):
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      for line in f:
                          if is_comment_or_blank(line):
                              continue
                          norm = normalize_line(line)
                          if norm:
                              corpus.add(norm)
              return corpus


          def collect_contexts_corpus(aosp_dir, basename):
              corpus = set()
              for filepath in glob.glob(os.path.join(aosp_dir, "**", basename), recursive=True):
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      for line in f:
                          if is_comment_or_blank(line):
                              continue
                          norm = normalize_line(line)
                          if norm:
                              corpus.add(norm)
              return corpus


          def clean_file(filepath, corpus):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  original_lines = f.readlines()

              kept_lines = []
              removed_lines = []

              for line in original_lines:
                  if is_comment_or_blank(line):
                      kept_lines.append(line)
                      continue
                  norm = normalize_line(line)
                  if norm in corpus:
                      removed_lines.append(line.rstrip("\n"))
                      continue
                  kept_lines.append(line)

              with open(filepath, "w", encoding="utf-8") as f:
                  f.writelines(kept_lines)

              return len(original_lines), len(removed_lines), removed_lines


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--aosp-dir", required=True)
              parser.add_argument("--target-dir", required=True)
              parser.add_argument("--report", default="dedupe_report.md")
              args = parser.parse_args()

              te_corpus = collect_te_corpus(args.aosp_dir)

              contexts_names = [
                  "file_contexts",
                  "seapp_contexts",
                  "property_contexts",
                  "service_contexts",
              ]

              contexts_corpus_map = {}
              for name in contexts_names:
                  contexts_corpus_map[name] = collect_contexts_corpus(args.aosp_dir, name)

              if not te_corpus:
                  print("警告: AOSP側の.teコーパスが空です。cloneの結果を確認してください。", file=sys.stderr)

              report_rows = []

              te_files = glob.glob(os.path.join(args.target_dir, "**", "*.te"), recursive=True)
              for filepath in sorted(te_files):
                  total, removed, removed_lines = clean_file(filepath, te_corpus)
                  report_rows.append((filepath, "te", total, removed, removed_lines))

              for name, corpus in contexts_corpus_map.items():
                  matched_files = glob.glob(os.path.join(args.target_dir, "**", name), recursive=True)
                  for filepath in sorted(matched_files):
                      total, removed, removed_lines = clean_file(filepath, corpus)
                      report_rows.append((filepath, name, total, removed, removed_lines))

              with open(args.report, "w", encoding="utf-8") as f:
                  f.write("# SEPolicy 重複行削除レポート\n\n")
                  f.write("比較元: android5.1.1_r28 external/sepolicy\n\n")
                  f.write("| ファイル | 種別 | 元の行数 | 削除行数 | 残行数 |\n")
                  f.write("|---|---|---|---|---|\n")
                  for row in report_rows:
                      filepath, kind, total, removed = row[0], row[1], row[2], row[3]
                      kept = total - removed
                      f.write("| {} | {} | {} | {} | {} |\n".format(filepath, kind, total, removed, kept))
                  f.write("\n## 削除された行の詳細\n\n")
                  for row in report_rows:
                      filepath, kind, total, removed, removed_lines = row
                      if removed == 0:
                          continue
                      f.write("### {}\n\n".format(filepath))
                      f.write("```\n")
                      for line in removed_lines:
                          f.write(line + "\n")
                      f.write("```\n\n")

              total_removed = sum(row[3] for row in report_rows)
              total_files = len(report_rows)
              print("処理ファイル数: {}".format(total_files))
              print("削除行数合計: {}".format(total_removed))


          if __name__ == "__main__":
              main()
          PYEOF
          sed -i 's/^          //' dedupe_sepolicy.py

      - name: 重複行削除を実行
        run: |
          python3 dedupe_sepolicy.py --aosp-dir aosp_sepolicy --target-dir input_extracted --report dedupe_report.md

      - name: レポートをジョブサマリーに反映
        run: |
          cat dedupe_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 出力zipを作成
        run: |
          cd input_extracted
          zip -r "../${{ inputs.output_zip_name }}.zip" .
          cd ..

      - name: 整理済みzipをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_zip_name }}
          path: ${{ inputs.output_zip_name }}.zip

      - name: レポートをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: dedupe_report
          path: dedupe_report.md
