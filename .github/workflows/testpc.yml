name: QCOM Bootloader Full Disassembly & Analysis (XBL & ABL)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  full-disassembly:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    steps:
      - name: Install Git
        run: |
          apt-get update -y
          apt-get install -y git

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Radare2 and Tools
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            wget unzip build-essential \
            python3 python3-pip \
            git cmake \
            bsdmainutils \
            default-jdk-headless
          apt-get clean

          git clone --depth 1 https://github.com/radareorg/radare2
          cd radare2
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          cd ..
          rm -rf radare2

          ldconfig
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> $GITHUB_PATH
          r2 -v

      - name: Install Python libraries
        run: |
          pip3 install --upgrade pip
          pip3 install r2pipe pefile

      - name: Create Advanced Analysis Script
        run: |
          cat > /tmp/analyze_bootloader.py << 'EOF'
          #!/usr/bin/env python3
          import os, sys, json, re
          import r2pipe

          FASTBOOT_KEYWORDS = [
              'flash', 'erase', 'reboot', 'getvar', 'setvar', 'oem',
              'download', 'continue', 'boot', 'update', 'unlock', 'lock',
              'device_state', 'secure', 'critical', 'slot', 'partition'
          ]
          UNLOCK_KEYWORDS = ['unlock', 'lock', 'oem_unlock', 'device_locked',
                             'device_unlocked', 'lock_state', 'secure_boot',
                             'unlock_ability', 'allow_unlock']
          VENDOR_KEYWORDS = ['tinno', 'gcom', 'rakuten', 'hand5g', 'rakuten_hand',
                             'p780', 'oem', 'qcom', 'qualcomm']
          OEM_COMMAND_PATTERNS = [
              r'oem\s+unlock', r'oem\s+lock', r'oem\s+device-info',
              r'oem\s+getvar', r'oem\s+setvar', r'fastboot\s+oem',
              r'androidboot\.unlocked', r'ro\.oem_unlock'
          ]

          def analyze_fastboot(img_path, name):
              print(f"[+] Analyzing {name}")
              out_dir = "/tmp/artifacts"
              os.makedirs(out_dir, exist_ok=True)

              r2 = r2pipe.open(img_path, flags=['-e', 'bin.relocs.apply=true'])
              r2.cmd('aaaa')

              strings_json = r2.cmdj('izzj') if hasattr(r2, 'cmdj') else []
              if not strings_json:
                  strings_raw = r2.cmd('izz')
                  strings_json = []
                  for line in strings_raw.splitlines():
                      if line.strip() and '=' in line:
                          parts = line.split('=', 1)
                          if len(parts)==2:
                              addr = parts[0].strip()
                              s = parts[1].strip()
                              strings_json.append({'addr': addr, 'string': s})

              fastboot_matches = []
              unlock_matches = []
              vendor_matches = []
              oem_cmd_matches = []

              for entry in strings_json:
                  s = entry.get('string', '')
                  addr = entry.get('addr', '')
                  lower_s = s.lower()
                  for kw in FASTBOOT_KEYWORDS:
                      if kw in lower_s:
                          fastboot_matches.append({'addr': addr, 'string': s, 'keyword': kw})
                          break
                  for ukw in UNLOCK_KEYWORDS:
                      if ukw in lower_s:
                          unlock_matches.append({'addr': addr, 'string': s, 'keyword': ukw})
                          break
                  for vkw in VENDOR_KEYWORDS:
                      if vkw in lower_s:
                          vendor_matches.append({'addr': addr, 'string': s, 'keyword': vkw})
                          break
                  for pat in OEM_COMMAND_PATTERNS:
                      if re.search(pat, lower_s):
                          oem_cmd_matches.append({'addr': addr, 'string': s, 'pattern': pat})
                          break

              funcs_json = r2.cmdj('aflj')
              if not funcs_json:
                  funcs_raw = r2.cmd('afl')
                  funcs_json = []
                  for line in funcs_raw.splitlines():
                      if line.strip() and line.strip().startswith('0x'):
                          parts = line.split()
                          if len(parts) >= 2:
                              funcs_json.append({
                                  'addr': parts[0],
                                  'name': parts[1] if len(parts)>1 else '',
                                  'size': parts[2] if len(parts)>2 else ''
                              })

              unlock_functions = []
              for f in funcs_json:
                  addr = f.get('addr')
                  name = f.get('name', '')
                  if not addr:
                      continue
                  if any(kw in name.lower() for kw in UNLOCK_KEYWORDS):
                      r2.cmd(f's {addr}')
                      pdf = r2.cmd('pdf')
                      unlock_functions.append({
                          'addr': addr,
                          'name': name,
                          'disasm': pdf
                      })
                  else:
                      refs = r2.cmdj(f'axtj {addr}') if hasattr(r2, 'cmdj') else []
                      if refs:
                          for ref in refs:
                              ref_str = ref.get('string', '')
                              if any(kw in ref_str.lower() for kw in UNLOCK_KEYWORDS):
                                  r2.cmd(f's {addr}')
                                  pdf = r2.cmd('pdf')
                                  unlock_functions.append({
                                      'addr': addr,
                                      'name': name,
                                      'disasm': pdf,
                                      'reason': f'References string: {ref_str}'
                                  })
                                  break

              partition_candidates = []
              for s in strings_json:
                  if 'partition' in s['string'].lower():
                      partition_candidates.append(s['string'])
                  for p in ['aboot', 'misc', 'persist', 'frp', 'userdata', 'boot', 'xbl', 'abl']:
                      if p in s['string'].lower():
                          partition_candidates.append(s['string'])

              report_path = f"{out_dir}/{name}_fastboot_report.md"
              with open(report_path, 'w') as f:
                  f.write(f"# Bootloader Analysis Report for {name}\n\n")
                  f.write("## Fastboot Commands/Keywords\n")
                  if fastboot_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in fastboot_matches[:100]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No fastboot-related strings found.\n")

                  f.write("\n## Unlock/Lock Related Strings\n")
                  if unlock_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in unlock_matches[:50]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No unlock-related strings found.\n")

                  f.write("\n## Vendor-specific Strings (Tinno, GCOM, Rakuten, etc.)\n")
                  if vendor_matches:
                      f.write("| Address | String | Keyword |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in vendor_matches[:50]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['keyword']} |\n")
                  else:
                      f.write("No vendor-specific strings found.\n")

                  f.write("\n## OEM Command Patterns\n")
                  if oem_cmd_matches:
                      f.write("| Address | String | Pattern |\n")
                      f.write("|---------|--------|---------|\n")
                      for m in oem_cmd_matches[:50]:
                          f.write(f"| {m['addr']} | {m['string']} | {m['pattern']} |\n")
                  else:
                      f.write("No explicit OEM command patterns found.\n")

                  f.write("\n## Suspected Functions Handling Unlock\n")
                  if unlock_functions:
                      for uf in unlock_functions[:20]:
                          f.write(f"### Function {uf['name']} at {uf['addr']}\n")
                          if 'reason' in uf:
                              f.write(f"Reason: {uf['reason']}\n")
                          f.write("```asm\n")
                          f.write(uf['disasm'][:2000])
                          f.write("\n```\n\n")
                  else:
                      f.write("No unlock-related functions identified.\n")

                  f.write("\n## Partition Names Mentioned\n")
                  if partition_candidates:
                      for p in set(partition_candidates):
                          f.write(f"- {p}\n")
                  else:
                      f.write("No explicit partition names found.\n")

              with open(f"{out_dir}/{name}_fastboot_data.json", 'w') as f:
                  json.dump({
                      'fastboot_matches': fastboot_matches,
                      'unlock_matches': unlock_matches,
                      'vendor_matches': vendor_matches,
                      'oem_cmd_matches': oem_cmd_matches,
                      'unlock_functions': [{'addr': uf['addr'], 'name': uf['name']} for uf in unlock_functions],
                      'partition_candidates': list(set(partition_candidates))
                  }, f, indent=2)

              r2.quit()
              print(f"[+] Report for {name} generated.")

          if __name__ == "__main__":
              if len(sys.argv) < 3:
                  print("Usage: python3 analyze_bootloader.py <xbl.img> <abl.img>")
                  sys.exit(1)
              analyze_fastboot(sys.argv[1], "xbl")
              analyze_fastboot(sys.argv[2], "abl")
              print("[+] All analysis complete. Reports are in /tmp/artifacts/")
          EOF
          chmod +x /tmp/analyze_bootloader.py

      - name: Run Advanced Analysis
        run: |
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          python3 /tmp/analyze_bootloader.py ./xbl.img ./abl.img

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcom_bootloader_analysis
          path: |
            /tmp/artifacts/*.txt
            /tmp/artifacts/*.md
            /tmp/artifacts/*.json
            /tmp/artifacts/*.html
          retention-days: 30
          compression-level: 0

      - name: Notify Completion
        if: success()
        run: |
          echo "::notice title=Bootloader Analysis Complete::Reports and disassembly artifacts uploaded."
