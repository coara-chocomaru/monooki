name: QCOM Bootloader Full Disassembly (XBL & ABL)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  full-disassembly:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    steps:
      - name: Install Git (for checkout)
        run: |
          apt-get update -y
          apt-get install -y git

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 1. Radare2 と必要なツールのインストール
      # ============================================================
      - name: Install Radare2 and Tools
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            wget unzip build-essential \
            python3 python3-pip \
            git cmake \
            bsdmainutils \
            default-jdk-headless
          apt-get clean

          # Radare2 をソースからビルド（最新安定版）
          git clone --depth 1 https://github.com/radareorg/radare2
          cd radare2
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          cd ..
          rm -rf radare2

          ldconfig
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> $GITHUB_PATH
          r2 -v

      - name: Install Python libraries
        run: |
          pip3 install --upgrade pip
          pip3 install r2pipe pefile

      # ============================================================
      # 2. フル逆アセンブルを生成する Python スクリプト
      # ============================================================
      - name: Create Disassembly Script
        run: |
          cat > /tmp/full_disasm.py << 'EOF'
          #!/usr/bin/env python3
          import os, sys, subprocess, json
          import r2pipe

          def disassemble_full(img_path, name):
              print(f"[+] Disassembling {name}...")
              # r2 を開く（アーキテクチャは自動判定）
              r2 = r2pipe.open(img_path, flags=['-e', 'bin.relocs.apply=true', '-e', 'bin.cache=true'])
              r2.cmd('aaaa')  # フル解析
              # プログラム全体の逆アセンブル（pdr: 全関数＋コード）
              disasm = r2.cmd('pdr')
              # データを含めた完全逆アセンブル（pD: アドレス指定なしで全範囲）
              disasm_full = r2.cmd('pD')
              # 全関数一覧
              funcs = r2.cmd('afl')
              # 文字列一覧
              strings = r2.cmd('iz')
              r2.quit()

              # ファイルに保存
              out_dir = "/tmp/artifacts"
              os.makedirs(out_dir, exist_ok=True)
              with open(f"{out_dir}/{name}_full_disasm_pdr.txt", "w") as f:
                  f.write(disasm)
              with open(f"{out_dir}/{name}_full_disasm_pD.txt", "w") as f:
                  f.write(disasm_full)
              with open(f"{out_dir}/{name}_functions.txt", "w") as f:
                  f.write(funcs)
              with open(f"{out_dir}/{name}_strings.txt", "w") as f:
                  f.write(strings)

              # 各関数の逆アセンブルも個別に取得（オプション）
              func_addrs = []
              for line in funcs.splitlines():
                  if 'sym.' in line or 'fcn.' in line:
                      parts = line.split()
                      if parts and parts[0].startswith('0x'):
                          func_addrs.append(parts[0])
              # 最初の20個だけ取得（全関数だと多すぎるため）
              for addr in func_addrs[:50]:
                  r2 = r2pipe.open(img_path, flags=['-e', 'bin.relocs.apply=true'])
                  r2.cmd(f's {addr}')
                  pdf = r2.cmd('pdf')
                  r2.quit()
                  with open(f"{out_dir}/{name}_func_{addr}.txt", "w") as f:
                      f.write(pdf)

              print(f"[+] {name} disassembly complete.")
              return

          if __name__ == "__main__":
              if len(sys.argv) < 3:
                  print("Usage: python3 full_disasm.py <xbl.img> <abl.img>")
                  sys.exit(1)
              disassemble_full(sys.argv[1], "xbl")
              disassemble_full(sys.argv[2], "abl")
              print("All disassembly files saved to /tmp/artifacts/")
          EOF
          chmod +x /tmp/full_disasm.py

      # ============================================================
      # 3. 実行（フル逆アセンブル）
      # ============================================================
      - name: Execute Full Disassembly
        run: |
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          python3 /tmp/full_disasm.py ./xbl.img ./abl.img

      # ============================================================
      # 4. 成果物のアップロード（逆アセンブルがメイン）
      # ============================================================
      - name: Upload Disassembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcom_full_disassembly
          path: |
            /tmp/artifacts/xbl_full_disasm_pdr.txt
            /tmp/artifacts/xbl_full_disasm_pD.txt
            /tmp/artifacts/xbl_functions.txt
            /tmp/artifacts/xbl_strings.txt
            /tmp/artifacts/xbl_func_*.txt
            /tmp/artifacts/abl_full_disasm_pdr.txt
            /tmp/artifacts/abl_full_disasm_pD.txt
            /tmp/artifacts/abl_functions.txt
            /tmp/artifacts/abl_strings.txt
            /tmp/artifacts/abl_func_*.txt
          retention-days: 30
          compression-level: 0

      - name: Notify Completion
        if: success()
        run: |
          echo "::notice title=Full Disassembly Complete::All disassembly files uploaded. Check the artifacts."
